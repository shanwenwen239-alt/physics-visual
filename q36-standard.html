<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第36题｜竖直弹簧抛球</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 345px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input,.range{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第36题｜竖直弹簧压缩后抛球</div><div class="desc">小球放在弹簧顶端但不粘连。接触阶段不能忽略重力：弹簧压缩量围绕 xₑ=mg/k 变化；只有弹簧恢复自然长 x=0 时才能脱离。脱离后弹簧力立即为0，小球只受重力继续上升到最高点。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 600"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#fbfdff"/><line x1="80" y1="530" x2="920" y2="530" stroke="#94a3b8" stroke-width="3"/><line x1="350" y1="360" x2="650" y2="360" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="665" y="365" fill="#64748b">弹簧自然长顶端</text><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><circle id="ball" r="28" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Fs" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="v" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><g id="labels" font-size="14" font-weight="800"></g></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>m：<span id="mv" class="value"></span><input id="m" type="range" min=".5" max="1.5" step=".1" value="1"></label><label>k：<span id="kv" class="value"></span><input id="k" type="range" min="80" max="180" step="5" value="120"></label><label>初始压缩 x₀：<span id="x0v" class="value"></span><input id="x0" type="range" min=".15" max=".6" step=".01" value=".3"></label></div><div class="box">为保持“能够抛离弹簧”的题设，程序自动要求 x₀ &gt; 2mg/k。若 m、k 改变导致条件不满足，会自动把 x₀ 调到可脱离的最小值。</div></div><div class="card"><h3>实时量</h3><div class="data"><span>阶段</span><b id="stage"></b><span>压缩量 x</span><b id="xv"></b><span>平衡压缩 xₑ</span><b id="xe"></b><span>弹簧力 Fs</span><b id="Fsv"></b><span>速度 v</span><b id="vv"></b><span>动能 Ek</span><b id="Ek"></b><span>弹性势能 Ep</span><b id="Ep"></b></div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8,yNat=360,baseY=530,scaleY=360;let u=0,run=false,speed=1,last=performance.now();function enforce(){const m=+$('m').value,k=+$('k').value,min=2.05*m*g/k;if(+$('x0').value<min)$('x0').value=Math.min(.6,min)}function P(){enforce();return{m:+$('m').value,k:+$('k').value,x0:+$('x0').value}}function springPath(top){let d=`M500 ${baseY}`,n=11;for(let i=1;i<2*n;i++){const y=baseY+(top-baseY)*i/(2*n),x=500+(i%2?-17:17);d+=` L${x} ${y}`}return d+` L500 ${top}`}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function model(p){const w=Math.sqrt(p.k/p.m),xe=p.m*g/p.k,A=p.x0-xe,phi=Math.acos(-xe/A),td=phi/w,vd=A*w*Math.sin(phi),tf=vd/g,total=td+tf;return{w,xe,A,phi,td,vd,tf,total}}function state(p,M){const t=u*M.total;if(t<=M.td){const x=M.xe+M.A*Math.cos(M.w*t),v=M.A*M.w*Math.sin(M.w*t);return{phase:'与弹簧接触',t,x,v,h:-x,Fs:p.k*x}}const tau=t-M.td,v=Math.max(0,M.vd-g*tau),h=M.vd*tau-.5*g*tau*tau;return{phase:tau>=M.tf?'最高点：v=0':'脱离后自由上升',t,x:0,v,h,Fs:0}}function draw(){const p=P(),M=model(p),s=state(p,M),springTop=s.phase==='与弹簧接触'?yNat+s.x*scaleY:yNat,cy=s.phase==='与弹簧接触'?springTop-28:yNat-28-s.h*scaleY;$('spring').setAttribute('d',springPath(springTop));$('ball').setAttribute('cx',500);$('ball').setAttribute('cy',cy);const gL=55,fsL=Math.min(120,s.Fs*3.2),vL=Math.min(110,s.v*22);ln('G',500,cy,500,cy+gL);ln('Fs',500,cy,500,cy-fsL);$('Fs').style.opacity=s.Fs>.01?1:0;ln('v',545,cy,545,cy-vL);$('v').style.opacity=s.v>.01?1:0;$('labels').innerHTML=`<text x="510" y="${cy+50}" fill="#b91c1c">G</text>${s.Fs>.01?`<text x="510" y="${cy-fsL+5}" fill="#047857">Fs</text>`:''}${s.v>.01?`<text x="555" y="${cy-vL+4}" fill="#1d4ed8">v</text>`:''}`;$('mv').textContent=p.m.toFixed(1);$('kv').textContent=p.k.toFixed(0);$('x0v').textContent=p.x0.toFixed(3);$('stage').textContent=s.phase;$('xv').textContent=s.x.toFixed(3);$('xe').textContent=M.xe.toFixed(3);$('Fsv').textContent=s.Fs.toFixed(2);$('vv').textContent=s.v.toFixed(2);$('Ek').textContent=(.5*p.m*s.v*s.v).toFixed(2);$('Ep').textContent=(.5*p.k*s.x*s.x).toFixed(2);$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('m').value=1;$('k').value=120;$('x0').value=.3;draw()};$('progress').oninput=e=>{run=false;u=+e.target.value;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','k','x0'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){const p=P(),M=model(p);u+=dt*speed/M.total;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
