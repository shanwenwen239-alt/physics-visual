<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第36题｜竖直弹簧抛球</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第36题｜竖直弹簧压缩后抛球</div><div class="desc">球放在竖直轻弹簧顶端且不粘连。弹簧压缩后释放，球经历“弹簧接触阶段 → 刚脱离 → 自由上升阶段”。模型同时显示G、弹簧弹力、速度和能量变化。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="80" y1="500" x2="920" y2="500" stroke="#a9b7c6" stroke-width="3"/><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><circle id="ball" cx="500" cy="260" r="28" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><line id="Fs" stroke="#059669" stroke-width="3" marker-end="url(#g)"/><line id="v" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#b)"/><text id="Gt" class="badge" fill="#b91c1c">G</text><text id="Fst" class="badge" fill="#047857">Fₛ</text><text id="vt" class="badge" fill="#1d4ed8">v</text><text x="60" y="55" fill="#64748b">弹簧下端固定；球与弹簧不粘连</text></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>质量 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>劲度系数 k：<span id="kv" class="value"></span><input id="k" type="range" min="40" max="160" step="5" value="100"></label><label>初始压缩量 x₀：<span id="xv" class="value"></span><input id="x0" type="range" min="0.15" max="0.5" step="0.01" value="0.3"></label></div></section><section class="card"><h3 class="title">实时物理量</h3><div class="data"><span>阶段</span><b id="stage">接触</b><span>弹簧弹力</span><b id="Fsv">0</b><span>速度 v</span><b id="vv">0</b><span>动能 Ek</span><b id="Ek">0</b><span>弹性势能 Ep</span><b id="Ep">0</b></div><div class="box theory">接触阶段：合力F合=Fₛ−mg，球的动能可能先增大后减小；刚脱离弹簧后Fₛ=0，仅受重力，继续向上减速。脱离弹簧时弹簧已恢复自然长，弹性势能为0。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,last=performance.now(),t=0;const g=9.8;function P(){return{m:+$('m').value,k:+$('k').value,x0:+$('x0').value}}function springPath(top){let x=500,y0=500,n=10,d=`M${x} ${y0}`;for(let i=1;i<2*n;i++){let y=y0+(top-y0)*i/(2*n),xx=x+(i%2?-17:17);d+=` L${xx} ${y}`}return d+` L${x} ${top}`}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function state(){let p=P(),w=Math.sqrt(p.k/p.m),tn=Math.PI/(2*w),x=Math.max(0,p.x0*Math.cos(w*Math.min(t,tn))),v=p.x0*w*Math.sin(w*Math.min(t,tn));if(t<=tn)return{contact:true,x,v,y:390-p.x0*300+x*300};let tau=t-tn,vy=v-g*tau,y=390-p.x0*300-v*tau*70+.5*g*tau*tau*70;return{contact:false,x:0,v:Math.max(-10,vy),y}}function draw(){let p=P(),s=state(),y=Math.max(80,Math.min(440,s.y));$('ball').setAttribute('cy',y);$('spring').setAttribute('d',springPath(s.contact?y+28:390));let Fs=s.contact?p.k*s.x:0;line('G',500,y,500,y+Math.min(90,p.m*g*5));line('Fs',500,y,500,y-Math.min(120,Fs*2));$('Fs').style.opacity=s.contact&&Fs>.1?1:0;$('Fst').style.opacity=s.contact&&Fs>.1?1:0;line('v',540,y,540,y-Math.max(-110,Math.min(110,s.v*15)));[['Gt',510,y+55],['Fst',510,y-55],['vt',550,y-20]].forEach(a=>{$(a[0]).setAttribute('x',a[1]);$(a[0]).setAttribute('y',a[2])});$('mv').textContent=p.m.toFixed(1);$('kv').textContent=p.k.toFixed(0);$('xv').textContent=p.x0.toFixed(2);$('stage').textContent=s.contact?'与弹簧接触':'脱离弹簧';$('Fsv').textContent=Fs.toFixed(2);$('vv').textContent=s.v.toFixed(2);$('Ek').textContent=(.5*p.m*s.v*s.v).toFixed(2);$('Ep').textContent=(.5*p.k*s.x*s.x).toFixed(2)}function label(){$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}function reset(){run=false;t=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','k','x0'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.02,(n-last)/1000);last=n;if(run){t+=dt*speed;if(t>2.5)t=0;draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
