<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第22题｜小车骤停</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1420px;margin:auto;padding:16px}.hero{font-size:27px;font-weight:900;color:#173b70}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:11px 15px;margin:8px 0 14px;line-height:1.65}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:9px}.params input{width:100%}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.6;font-size:13px}.analysis{display:none;margin-top:12px}.analysis.open{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meter{height:16px;background:#e5edf6;border-radius:9px;overflow:hidden}.fill{height:100%}.a1{background:#7c3aed}.a2{background:#8b5cf6}.force{background:#d97706}.mini{width:100%;height:auto;border:1px solid #e2e8f0;border-radius:10px}.key{padding:8px 10px;border-radius:10px;background:#fff7e8;margin-top:8px;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.analysis.open{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第22题｜小车骤停：主体看运动，加速度看“合力→a”</div><div class="desc">主动画只负责直接可见的量：小车是否运动、两滑块位置、速度箭头、间距。加速度不再靠“看起来减速”判断，而放到可展开分析层，用摩擦力、a=F合/m 和 a-t 图表达。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1040 560"><defs><marker id="o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1040" height="560" fill="#fbfdff"/><line x1="20" y1="490" x2="1020" y2="490" stroke="#94a3b8" stroke-width="3"/><g id="cart"><rect x="0" y="350" width="760" height="80" rx="12" fill="#ffe59a" stroke="#6d5620" stroke-width="3"/><circle cx="170" cy="452" r="18" fill="#334155"/><circle cx="590" cy="452" r="18" fill="#334155"/></g><g id="m2"><rect x="-47" y="-35" width="94" height="70" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="-19" y="9" font-size="25">m₂</text></g><g id="m1"><rect x="-60" y="-45" width="120" height="90" rx="10" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><text x="-19" y="10" font-size="27">m₁</text></g><g id="arrows"></g><line id="gap" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><text id="gapT" fill="#6d28d9" font-weight="800">间距恒定</text><text id="eventT" x="700" y="70" font-size="18" font-weight="900" fill="#173b70"></text></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><button id="toggle" class="btn">展开加速度分析</button></div><div id="analysis" class="analysis"><div><div class="box"><b>为什么质量不同，加速度却相同？</b><br>滑动时：f₁=μm₁g，f₂=μm₂g。<br>a₁=f₁/m₁=μg；a₂=f₂/m₂=μg。</div><div class="key" id="key"></div><div style="margin-top:8px">|a₁|</div><div class="meter"><div id="a1bar" class="fill a1"></div></div><div style="margin-top:8px">|a₂|</div><div class="meter"><div id="a2bar" class="fill a2"></div></div></div><div><svg class="mini" viewBox="0 0 560 260"><line x1="50" y1="205" x2="525" y2="205" stroke="#64748b"/><line x1="50" y1="35" x2="50" y2="220" stroke="#64748b"/><text x="510" y="225">t</text><text x="20" y="38">a</text><line id="stopMark" y1="35" y2="205" stroke="#94a3b8" stroke-dasharray="5 4"/><path id="at" fill="none" stroke="#7c3aed" stroke-width="4"/><circle id="atdot" r="6" fill="#2563eb"/><text x="70" y="55" fill="#475569">骤停前 a=0；滑动阶段 a=−μg；停止后 a=0</text></svg></div></div></div></section><aside><div class="card"><b>参数</b><div class="params"><label>m₂=<span id="m2v"></span> kg<input id="m2p" type="range" min=".5" max="2" step=".1" value="1"></label><label>m₁/m₂=<span id="rv"></span><input id="ratio" type="range" min="1.1" max="3" step=".1" value="1.5"></label><label>μ=<span id="muv"></span><input id="mu" type="range" min=".1" max=".6" step=".01" value=".25"></label><label>v₀=<span id="v0v"></span> m/s<input id="v0" type="range" min="1" max="4" step=".2" value="4"></label><label>骤停时刻=<span id="tsv"></span> s<input id="tstop" type="range" min=".5" max="1.5" step=".1" value="1"></label></div></div><div class="card"><b>主动画实时量</b><div class="data"><span>阶段</span><b id="stage"></b><span>v₁</span><b id="vv1"></b><span>v₂</span><b id="vv2"></b><span>两块间距</span><b id="dist"></b></div></div><div class="card"><div class="box">主体动画不再把“加速度数值”当主信息。真正需要理解的结论是：骤停后两块速度始终相同，因此相对间距不变。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8,S=18;let t=0,run=false,speed=1,last=performance.now();function P(){const m2=+$('m2p').value;return{m2,m1:m2*+$('ratio').value,mu:+$('mu').value,v0:+$('v0').value,ts:+$('tstop').value}}function state(p){const xCart=p.v0*Math.min(t,p.ts),tau=Math.max(0,t-p.ts),tSlide=p.v0/(p.mu*g),u=Math.min(tau,tSlide),v=t<p.ts?p.v0:Math.max(0,p.v0-p.mu*g*u),slide=p.v0*u-.5*p.mu*g*u*u;return{xCart,v,slide,tSlide,tau,stage:t<p.ts?'共同匀速':tau<tSlide?'小车已骤停：两块相对车面滑动':'两块相对车面停止'}}function arrow(x,y,dx,stroke,marker,label){if(Math.abs(dx)<1e-6)return'';const L=Math.min(100,Math.abs(dx));const ex=x+Math.sign(dx)*L;return `<line x1="${x}" y1="${y}" x2="${ex}" y2="${y}" stroke="${stroke}" stroke-width="3" marker-end="url(#${marker})"/><text x="${ex+6}" y="${y-8}" font-size="13" font-weight="800" fill="${stroke}">${label}</text>`}function drawAT(p,q){const x0=50,x1=525,y0=205,ys=95,tt=p.ts+q.tSlide,maxT=Math.max(2,tt+.3),map=t0=>x0+(x1-x0)*t0/maxT;const xs=map(p.ts),xe=map(tt);$('stopMark').setAttribute('x1',xs);$('stopMark').setAttribute('x2',xs);$('at').setAttribute('d',`M${x0} ${y0} L${xs} ${y0} L${xs} ${ys} L${xe} ${ys} L${xe} ${y0} L${x1} ${y0}`);let cy=t<p.ts?y0:(t<tt?ys:y0);$('atdot').setAttribute('cx',map(Math.min(t,maxT)));$('atdot').setAttribute('cy',cy)}function draw(){const p=P(),q=state(p),cartX=55+q.xCart*S,local2=210+q.slide*S,local1=455+q.slide*S;$('cart').setAttribute('transform',`translate(${cartX} 0)`);const x2=cartX+local2,x1=cartX+local1;$('m2').setAttribute('transform',`translate(${x2} 315)`);$('m1').setAttribute('transform',`translate(${x1} 305)`);const sliding=t>=p.ts&&q.v>0;let h='';if(sliding){h+=arrow(x2,360,-p.mu*p.m2*g*7,'#d97706','o','f₂');h+=arrow(x1,360,-p.mu*p.m1*g*7,'#d97706','o','f₁')}if(q.v>0){h+=arrow(x2,250,q.v*20,'#2563eb','b','v₂');h+=arrow(x1,225,q.v*20,'#2563eb','b','v₁')}$('arrows').innerHTML=h;$('gap').setAttribute('x1',x2+50);$('gap').setAttribute('x2',x1-65);$('gap').setAttribute('y1',185);$('gap').setAttribute('y2',185);$('gapT').setAttribute('x',(x1+x2)/2-35);$('gapT').setAttribute('y',172);$('eventT').textContent=t<p.ts?'小车与两块共同匀速':sliding?'骤停事件已发生':'滑动结束';$('m2v').textContent=p.m2.toFixed(1);$('rv').textContent=(p.m1/p.m2).toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('v0v').textContent=p.v0.toFixed(1);$('tsv').textContent=p.ts.toFixed(1);$('stage').textContent=q.stage;$('vv1').textContent=q.v.toFixed(2)+' m/s';$('vv2').textContent=q.v.toFixed(2)+' m/s';$('dist').textContent='恒定';const aval=sliding?p.mu*g:0,maxA=.6*g;$('a1bar').style.width=(100*aval/maxA)+'%';$('a2bar').style.width=(100*aval/maxA)+'%';$('key').innerHTML=sliding?`滑动阶段：|a₁|=|a₂|=μg=${aval.toFixed(2)} m/s²`:(t<p.ts?'骤停前：合力为0，a₁=a₂=0':'停止后：摩擦消失，a₁=a₂=0');drawAT(p,q);$('play').textContent=run?'Ⅱ 暂停':t>=p.ts+q.tSlide?'↻ 重新开始':t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{let p=P(),q=state(p);if(t>=p.ts+q.tSlide)t=0;run=!run;draw()};$('reset').onclick=()=>{run=false;t=0;draw()};$('toggle').onclick=()=>{$('analysis').classList.toggle('open');$('toggle').textContent=$('analysis').classList.contains('open')?'收起加速度分析':'展开加速度分析';draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m2p','ratio','mu','v0','tstop'].forEach(id=>$(id).oninput=()=>{run=false;t=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
