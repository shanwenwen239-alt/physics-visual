<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第20题｜弹簧耦合</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:#fff;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.75fr .8fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第20题｜弹簧—物块—木板耦合运动</div><div class="layout"><div><section class="card"><svg class="scene" viewBox="0 0 920 520"><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#dc2626"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#2563eb"/></marker></defs><rect width="920" height="520" rx="12" fill="#fbfdff"/><line x1="35" y1="440" x2="885" y2="440" stroke="#aab7c5" stroke-width="2.5"/><g id="M"><rect x="190" y="335" width="550" height="85" rx="10" fill="#ffe8a3" stroke="#6d5620" stroke-width="2.5"/><line x1="350" y1="205" x2="350" y2="335" stroke="#334155" stroke-width="9"/><text x="610" y="390" font-size="34">M</text></g><path id="spring" fill="none" stroke="#53657b" stroke-width="5"/><g id="m"><rect width="110" height="72" rx="10" fill="#c9e0ff" stroke="#245a91" stroke-width="3"/><text x="44" y="46" font-size="30">m</text></g><line id="F1" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="F2" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="FsM" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="Fsm" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="vm" stroke="#2563eb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="vM" stroke="#2563eb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#blue)"/><text id="F1t" class="badge" fill="#b93431">F</text><text id="F2t" class="badge" fill="#b93431">F</text><text id="FsMt" class="badge" fill="#9a6200">Fs</text><text id="Fsmt" class="badge" fill="#9a6200">Fs</text><text id="vmt" class="badge" fill="#1d4ed8">速度 vₘ</text><text id="vMt" class="badge" fill="#1d4ed8">速度 vM</text><text x="655" y="72" fill="#64748b" font-size="13">实线箭头＝力　蓝色虚线＝速度</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><label><input id="forces" type="checkbox" checked> 显示受力</label></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside class="card"><h3>实时物理量</h3><div class="data"><span>弹簧力 Fs/F</span><b id="fsV">0.00</b><span>弹簧形变</span><b id="phaseV">0%</b><span>m速度方向</span><b id="vmV">—</b><span>M速度方向</span><b id="vMV">—</b></div><div class="box note"><b>几何约束：</b>物块m始终完整位于木板M上表面；弹簧也位于上表面上方，并始终连接木板固定竖板与物块，不与木板实体重叠。</div><div class="box theory"><b>物理模型：</b>x=(F/k)(1−cosωt)，Fs=F(1−cosωt)。两个外力F恒定等大反向；弹簧力随伸长量变化。</div><div class="box answer"><b>观察：</b>Fs从0增大到2F再减小到0；蓝色虚线只表示速度，不是力。木板和物块速度方向相反，系统质心保持静止。</div></aside></div><script>(()=>{const $=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const m0=1,M0=2,baseM=190,baseWall=350,baseBlock=590,SURF=335,BH=72,sy=305;function spring(x1,x2,y){let d=`M${x1} ${y}`,n=9;for(let i=1;i<n*2;i++){let x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-14:14);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){let ph=2*Math.PI*p,xf=1-Math.cos(ph),sn=Math.sin(ph),xm=75*(M0/(m0+M0))*xf,xM=-75*(m0/(m0+M0))*xf,wall=baseWall+xM,block=baseBlock+xm,Fs=xf,by=SURF-BH;$('M').setAttribute('transform',`translate(${xM} 0)`);$('m').setAttribute('transform',`translate(${block} ${by})`);$('spring').setAttribute('d',spring(wall,block,sy));line('F1',block+110,sy,block+175,sy);$('F1t').setAttribute('x',block+140);$('F1t').setAttribute('y',sy-12);line('F2',baseM+xM,377,baseM+xM-65,377);$('F2t').setAttribute('x',baseM+xM-50);$('F2t').setAttribute('y',359);let L=42*Fs;line('FsM',wall,sy,wall+L,sy);line('Fsm',block,sy,block-L,sy);$('FsMt').setAttribute('x',wall+Math.max(5,L*.55));$('FsMt').setAttribute('y',sy-12);$('Fsmt').setAttribute('x',block-Math.max(25,L*.55));$('Fsmt').setAttribute('y',sy-12);let vs=58*Math.abs(sn),sg=Math.sign(sn);line('vm',block+55,by-18,block+55+sg*vs,by-18);line('vM',baseM+xM+95,315,baseM+xM+95-sg*vs*.5,315);$('vmt').setAttribute('x',block+55+sg*vs+6);$('vmt').setAttribute('y',by-25);$('vMt').setAttribute('x',baseM+xM+95-sg*vs*.5+6);$('vMt').setAttribute('y',307);['FsM','Fsm','FsMt','Fsmt'].forEach(id=>$(id).style.opacity=Fs<.03?0:1);['vm','vM','vmt','vMt'].forEach(id=>$(id).style.opacity=Math.abs(sn)<.03?0:1);$('fsV').textContent=Fs.toFixed(2);$('phaseV').textContent=Math.round(Fs/2*100)+'%';$('vmV').textContent=Math.abs(sn)<.03?'0':sn>0?'向右':'向左';$('vMV').textContent=Math.abs(sn)<.03?'0':sn>0?'向左':'向右';$('t').value=p;let vis=$('forces').checked?'':'none';['F1','F2','FsM','Fsm','F1t','F2t','FsMt','Fsmt'].forEach(id=>$(id).style.display=vis)}$('play').onclick=()=>{if(p>=1)p=0;run=true};$('pause').onclick=()=>run=false;$('reset').onclick=()=>{run=false;p=0;draw()};$('forces').onchange=draw;$('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.12;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
