<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第20题 动态演示</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:#f4f7fb;color:#172033;margin:0}.w{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 10px 30px #0f172a0d}.grid{display:grid;grid-template-columns:1fr 260px;gap:16px}svg{width:100%;background:linear-gradient(#fff,#f1f5f9);border-radius:16px}.btn{padding:10px 14px;border:1px solid #d7dde7;border-radius:11px;background:#fff;margin:8px 6px 0 0}.primary{background:#111827;color:#fff}input[type=range]{width:100%}.muted{color:#64748b}.big{font-size:22px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><p><a href="index.html">← 返回题库</a></p><h1>第20题｜弹簧—物块—长木板</h1><p class="muted">示意观察外力作用后，木板、小物块和弹簧的相对运动。</p><div class="grid"><section class="card"><svg viewBox="0 0 700 430"><line x1="55" y1="350" x2="650" y2="350" stroke="#94a3b8" stroke-width="2"/><g id="plank"><rect x="150" y="260" width="390" height="75" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/><line x1="190" y1="170" x2="190" y2="335" stroke="#334155" stroke-width="5"/><text x="345" y="315" font-size="20">M</text></g><path id="spring" d="M190 235 L220 235 L230 220 L242 250 L254 220 L266 250 L278 220 L290 250 L305 235 L330 235" fill="none" stroke="#475569" stroke-width="3"/><g id="block"><rect x="330" y="215" width="70" height="45" rx="7" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><text x="358" y="244">m</text></g><line x1="400" y1="235" x2="485" y2="235" stroke="#2563eb" stroke-width="4"/><text x="435" y="220" fill="#2563eb">F₁</text><line x1="150" y1="300" x2="70" y2="300" stroke="#ef4444" stroke-width="4"/><text x="95" y="285" fill="#ef4444">F₂</text></svg><input id="t" type="range" min="0" max="1000" value="0"><div><button class="btn primary" id="play">播放</button><button class="btn" id="reset">重置</button><button class="btn" id="mid">关键时刻</button></div></section><aside class="card"><div class="big">观察重点</div><p id="hint">初始 m、M 均静止，弹簧处于题设初态。</p><p class="muted">课堂中可在任意时刻暂停，讨论系统动量、机械能以及 m 相对 M 的位移。</p><p class="muted">MVP 当前主要验证教学表达，正式版需要根据完整选项进一步校准动力学参数。</p></aside></div></main><script>let p=0,run=false,last=performance.now();const q=x=>document.getElementById(x);function draw(){let ps=35*p,rel=45*Math.sin(p*Math.PI*2),bs=ps+rel;q('plank').setAttribute('transform',`translate(${ps} 0)`);q('block').setAttribute('transform',`translate(${bs} 0)`);q('spring').setAttribute('transform',`translate(${ps} 0) scale(${1+rel/500} 1)`);q('t').value=p*1000;q('play').textContent=run?'暂停':'播放';q('hint').textContent=p<.3?'外力开始作用：木板与物块出现不同的加速度。':p<.7?'弹簧形变量变化：观察 m 相对 M 的运动。':'后段：暂停检查系统动量、外力冲量和能量关系。'}q('play').onclick=()=>run=!run;q('reset').onclick=()=>{p=0;run=false;draw()};q('mid').onclick=()=>{p=.5;run=false;draw()};q('t').oninput=e=>{p=e.target.value/1000;run=false;draw()};function loop(n){let d=Math.min(.04,(n-last)/1000);last=n;if(run){p+=d*.16;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)</script></body></html>
