<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第20题｜弹簧耦合</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:#17324d}.w{max-width:1080px;margin:auto;padding:18px}.title{font-size:24px;font-weight:800;margin-bottom:10px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:12px;box-shadow:0 6px 20px #315f9610}.scene{width:100%;display:block}.bar{display:flex;justify-content:center;margin-top:12px}.btn{border:0;background:#315f96;color:#fff;border-radius:10px;padding:10px 24px;font-size:16px;font-weight:700}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}</style></head><body><main class="w"><div class="title">第20题｜弹簧—物块—木板</div><section class="card"><svg class="scene" viewBox="0 0 920 520"><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d94a45"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#c78a24"/></marker></defs><rect width="920" height="520" rx="12" fill="#fbfdff"/><line x1="35" y1="430" x2="885" y2="430" stroke="#aab7c5" stroke-width="2.5"/><g id="M"><rect x="190" y="315" width="550" height="95" rx="12" fill="#ffe8a3" stroke="#6d5620" stroke-width="2.5"/><line x1="350" y1="185" x2="350" y2="410" stroke="#334155" stroke-width="9"/><text x="600" y="375" font-size="34">M</text></g><path id="spring" fill="none" stroke="#53657b" stroke-width="5"/><g id="m"><rect width="110" height="82" rx="12" fill="#c9e0ff" stroke="#245a91" stroke-width="3"/><text x="44" y="52" font-size="32">m</text></g><line id="F1" stroke="#d94a45" stroke-width="3" marker-end="url(#red)"/><line id="F2" stroke="#d94a45" stroke-width="3" marker-end="url(#red)"/><line id="FsM" stroke="#c78a24" stroke-width="3" marker-end="url(#gold)"/><line id="Fsm" stroke="#c78a24" stroke-width="3" marker-end="url(#gold)"/><text id="F1t" class="badge" fill="#b93431">F</text><text id="F2t" class="badge" fill="#b93431">F</text><text id="FsMt" class="badge" fill="#9b6818">Fs</text><text id="Fsmt" class="badge" fill="#9b6818">Fs</text><g transform="translate(690 70)"><rect width="180" height="104" rx="12" fill="#fff" stroke="#dbe5ef"/><text x="16" y="28" font-weight="800">实时量</text><text id="fsV" x="16" y="56">Fs/F = 0.00</text><text id="phaseV" x="16" y="80">伸长 0%</text></g></svg><div class="bar"><button id="toggle" class="btn">开始</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const m0=1,M0=2,baseM=190,baseWall=350,baseBlock=590;function spring(x1,x2,y){let d=`M${x1} ${y}`,n=9;for(let i=1;i<n*2;i++){let x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-17:17);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){let ph=2*Math.PI*p,xf=1-Math.cos(ph),xm=75*(M0/(m0+M0))*xf,xM=-75*(m0/(m0+M0))*xf,wall=baseWall+xM,block=baseBlock+xm,Fs=xf;$('M').setAttribute('transform',`translate(${xM} 0)`);$('m').setAttribute('transform',`translate(${block} 275)`);$('spring').setAttribute('d',spring(wall,block,316));line('F1',block+110,316,block+175,316);$('F1t').setAttribute('x',block+140);$('F1t').setAttribute('y',298);line('F2',baseM+xM,362,baseM+xM-65,362);$('F2t').setAttribute('x',baseM+xM-50);$('F2t').setAttribute('y',344);let L=42*Fs;line('FsM',wall,316,wall+L,316);line('Fsm',block,316,block-L,316);$('FsMt').setAttribute('x',wall+Math.max(5,L*.55));$('FsMt').setAttribute('y',298);$('Fsmt').setAttribute('x',block-Math.max(25,L*.55));$('Fsmt').setAttribute('y',298);['FsM','Fsm','FsMt','Fsmt'].forEach(id=>$(id).style.opacity=Fs<.03?0:1);$('fsV').textContent='Fs/F = '+Fs.toFixed(2);$('phaseV').textContent='伸长 '+Math.round(Fs/2*100)+'%'}$('toggle').onclick=()=>{if(p>=1)p=0;run=!run;$('toggle').textContent=run?'暂停':'开始'};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.12;if(p>=1){p=1;run=false;$('toggle').textContent='重新开始'}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
