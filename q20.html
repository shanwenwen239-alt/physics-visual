<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第20题｜弹簧耦合参数实验</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:#fff;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.72fr .82fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:10px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}.params{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.params label{font-size:13px}.params input{width:100%}@media(max-width:900px){.layout{grid-template-columns:1fr}.params{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第20题｜弹簧—物块—木板参数实验</div><div class="layout"><div><section class="card"><svg class="scene" viewBox="0 0 920 520"><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#dc2626"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#2563eb"/></marker></defs><rect width="920" height="520" rx="12" fill="#fbfdff"/><line x1="35" y1="440" x2="885" y2="440" stroke="#aab7c5" stroke-width="2.5"/><g id="M"><rect x="190" y="335" width="550" height="85" rx="10" fill="#ffe8a3" stroke="#6d5620" stroke-width="2.5"/><line x1="350" y1="205" x2="350" y2="335" stroke="#334155" stroke-width="9"/><text x="610" y="390" font-size="34">M</text></g><path id="spring" fill="none" stroke="#53657b" stroke-width="5"/><g id="m"><rect width="110" height="72" rx="10" fill="#c9e0ff" stroke="#245a91" stroke-width="3"/><text x="44" y="46" font-size="30">m</text></g><line id="F1" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="F2" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="FsM" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="Fsm" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="vm" stroke="#2563eb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="vM" stroke="#2563eb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#blue)"/><text id="F1t" class="badge" fill="#b93431">F</text><text id="F2t" class="badge" fill="#b93431">F</text><text id="FsMt" class="badge" fill="#9a6200">Fs</text><text id="Fsmt" class="badge" fill="#9a6200">Fs</text><text id="vmt" class="badge" fill="#1d4ed8">速度 vₘ</text><text id="vMt" class="badge" fill="#1d4ed8">速度 vM</text><text x="655" y="72" fill="#64748b" font-size="13">实线＝力　蓝色虚线＝速度</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><label><input id="forces" type="checkbox" checked> 显示受力</label></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside><section class="card"><h3>参数</h3><div class="params"><label>物块 m：<b id="mv">1.0</b><input id="mPar" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>木板 M：<b id="Mv">2.0</b><input id="MPar" type="range" min="1" max="4" step="0.1" value="2"></label><label>外力 F：<b id="Fv">1.0</b><input id="FPar" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>劲度 k：<b id="kv">1.0</b><input id="kPar" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><div class="box note">拖动参数后，弹簧最大伸长、运动周期、m/M位移比例、F与Fs箭头长度都会联动。参数改变会自动回到初始状态，避免把两套状态混在一起。</div></section><section class="card" style="margin-top:10px"><h3>实时物理量</h3><div class="data"><span>Fs/F</span><b id="fsV">0.00</b><span>相对伸长 x</span><b id="xV">0.00</b><span>角频率 ω</span><b id="wV">—</b><span>周期 T</span><b id="TV">—</b><span>m速度</span><b id="vmV">0</b><span>M速度</span><b id="vMV">0</b></div><div class="box theory"><b>模型：</b>ω=√[k(1/m+1/M)]；x=(F/k)(1−cosωt)；Fs=kx。系统质心不动，因此m与M位移方向相反，幅度按质量反比分配。</div><div class="box answer"><b>试试看：</b>增大F→最大伸长变大；增大k→最大伸长变小且振动更快；增大某一物体质量→它自身位移幅度变小。</div></section></aside></div><script>(()=>{const $=id=>document.getElementById(id);let phase=0,run=false,last=performance.now();const baseM=190,baseWall=350,baseBlock=590,SURF=335,BH=72,sy=305;function spring(x1,x2,y){let d=`M${x1} ${y}`,n=9;for(let i=1;i<n*2;i++){let x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-14:14);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function pars(){return{m:+$('mPar').value,M:+$('MPar').value,F:+$('FPar').value,k:+$('kPar').value}}function reset(){run=false;phase=0;$('t').value=0;draw()}function draw(){const P=pars(),w=Math.sqrt(P.k*(1/P.m+1/P.M)),rel=P.F/P.k*(1-Math.cos(phase)),relV=P.F/P.k*w*Math.sin(phase),scale=78,dx=scale*rel,xm=dx*P.M/(P.m+P.M),xM=-dx*P.m/(P.m+P.M),wall=baseWall+xM,block=baseBlock+xm,Fs=P.k*rel,by=SURF-BH;$('M').setAttribute('transform',`translate(${xM} 0)`);$('m').setAttribute('transform',`translate(${block} ${by})`);$('spring').setAttribute('d',spring(wall,block,sy));let fLen=50*P.F;line('F1',block+110,sy,block+110+fLen,sy);line('F2',baseM+xM,377,baseM+xM-fLen,377);$('F1t').setAttribute('x',block+125+fLen*.45);$('F1t').setAttribute('y',sy-12);$('F2t').setAttribute('x',baseM+xM-fLen*.65);$('F2t').setAttribute('y',359);let sLen=50*Fs;line('FsM',wall,sy,wall+sLen,sy);line('Fsm',block,sy,block-sLen,sy);$('FsMt').setAttribute('x',wall+Math.max(6,sLen*.55));$('FsMt').setAttribute('y',sy-12);$('Fsmt').setAttribute('x',block-Math.max(25,sLen*.55));$('Fsmt').setAttribute('y',sy-12);let vm=relV*P.M/(P.m+P.M),vM=-relV*P.m/(P.m+P.M),sv=34;line('vm',block+55,by-18,block+55+sv*vm,by-18);line('vM',baseM+xM+95,315,baseM+xM+95+sv*vM,315);$('vmt').setAttribute('x',block+55+sv*vm+6);$('vmt').setAttribute('y',by-25);$('vMt').setAttribute('x',baseM+xM+95+sv*vM+6);$('vMt').setAttribute('y',307);['FsM','Fsm','FsMt','Fsmt'].forEach(id=>$(id).style.opacity=Fs<.02?0:1);['vm','vM','vmt','vMt'].forEach(id=>$(id).style.opacity=Math.abs(relV)<.02?0:1);$('fsV').textContent=(Fs/P.F).toFixed(2);$('xV').textContent=rel.toFixed(2);$('wV').textContent=w.toFixed(2);$('TV').textContent=(2*Math.PI/w).toFixed(2);$('vmV').textContent=vm.toFixed(2);$('vMV').textContent=vM.toFixed(2);$('mv').textContent=P.m.toFixed(1);$('Mv').textContent=P.M.toFixed(1);$('Fv').textContent=P.F.toFixed(1);$('kv').textContent=P.k.toFixed(1);$('t').value=(phase%(2*Math.PI))/(2*Math.PI);let vis=$('forces').checked?'':'none';['F1','F2','FsM','Fsm','F1t','F2t','FsMt','Fsmt'].forEach(id=>$(id).style.display=vis)}$('play').onclick=()=>run=true;$('pause').onclick=()=>run=false;$('reset').onclick=reset;$('forces').onchange=draw;['mPar','MPar','FPar','kPar'].forEach(id=>$(id).oninput=reset);$('t').oninput=e=>{run=false;phase=+e.target.value*2*Math.PI;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){const P=pars(),w=Math.sqrt(P.k*(1/P.m+1/P.M));phase=(phase+dt*w)%(2*Math.PI);draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
