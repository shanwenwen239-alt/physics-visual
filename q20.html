<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第20题｜弹簧—物块—木板</title><style>:root{--bg:#f5f7fb;--text:#172033;--muted:#667085;--line:#e3e8ef;--blue:#2563eb;--orange:#f59e0b;--red:#dc2626;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.back{text-decoration:none;color:#64748b}.title{font-size:26px;font-weight:750;margin:6px 0 3px}.sub{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px rgba(15,23,42,.07)}.stage{padding:16px}.side{padding:18px}.scene{width:100%;display:block;border-radius:18px;background:linear-gradient(#fff,#f8fafc)}.timeline{width:100%;margin:14px 0 3px}.controls{display:flex;flex-wrap:wrap;gap:8px}.btn,.chip{border:1px solid #d8dee9;background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}.chip.on{background:#111827;color:#fff;border-color:#111827}.section{padding:14px 0;border-top:1px solid #edf1f5}.section:first-child{border-top:0;padding-top:0}.label{font-size:12px;color:var(--muted)}.big{font-size:24px;font-weight:750}.hint{font-size:13px;line-height:1.7;color:#475569}.metric{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric div{background:#f8fafc;border:1px solid #edf1f5;border-radius:12px;padding:10px;font-size:13px}.status{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;font-size:12px}.note{font-size:12px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:9px 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:9px 0}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="index.html">← 返回题库</a><div class="title">第20题｜弹簧—小物块—长木板</div><div class="sub">观察外力 F₁、F₂ 同时作用后，木板 M、小物块 m 与弹簧之间的相对运动。</div></div><div class="status" id="status">已暂停 · t = 0.00</div></div><div class="grid"><section class="card stage"><svg id="scene" class="scene" viewBox="0 0 780 500"><defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><line x1="55" y1="385" x2="720" y2="385" stroke="#cbd5e1" stroke-width="2"/><g id="plank"><rect x="145" y="285" width="430" height="80" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/><line x1="195" y1="190" x2="195" y2="365" stroke="#334155" stroke-width="6"/><text x="350" y="340" font-size="21">M</text></g><path id="spring" d="M195 250 L225 250 L237 233 L251 267 L265 233 L279 267 L293 233 L307 267 L321 250 L350 250" fill="none" stroke="#475569" stroke-width="4"/><g id="block"><rect x="350" y="222" width="78" height="63" rx="9" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/><text x="382" y="261" font-size="18">m</text></g><line id="f1" x1="428" y1="252" x2="520" y2="252" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/><text id="f1t" x="465" y="234" fill="#2563eb">F₁</text><line id="f2" x1="145" y1="325" x2="60" y2="325" stroke="#dc2626" stroke-width="4" marker-end="url(#arrR)"/><text id="f2t" x="90" y="307" fill="#dc2626">F₂</text><line id="relArrow" x1="0" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="4"/><text id="relText" x="0" y="0" fill="#16a34a" font-size="14">相对位移</text></svg><input id="timeline" class="timeline" type="range" min="0" max="1" step="0.001" value="0"><div class="controls"><button class="btn primary" id="play">播放</button><button class="btn" id="back">← 单步</button><button class="btn" id="next">单步 →</button><button class="btn" id="speed">速度 1×</button><button class="btn" id="reset">重置</button></div><div class="controls" style="margin-top:10px"><button class="chip on" data-p="0">初始</button><button class="chip" data-p="0.25">阶段1</button><button class="chip" data-p="0.5">阶段2</button><button class="chip" data-p="0.75">阶段3</button><button class="chip" data-p="1">结束</button></div></section><aside class="card side"><div class="section"><div class="label">当前过程</div><div class="big" id="phase">初始</div><p class="hint" id="hint">m、M 均静止，弹簧处于题设初始状态。</p></div><div class="section"><div class="label">示意量</div><div class="metric"><div>木板位移<br><b id="Xp">0.0</b></div><div>物块位移<br><b id="Xm">0.0</b></div><div>相对位移<br><b id="Rel">0.0</b></div><div>弹簧状态<br><b id="Spring">原长</b></div></div></div><div class="section"><div class="label">讲解图层</div><div class="row"><span><span class="dot" style="background:var(--blue)"></span>外力 F₁</span><input id="showF1" type="checkbox" checked></div><div class="row"><span><span class="dot" style="background:var(--red)"></span>外力 F₂</span><input id="showF2" type="checkbox" checked></div><div class="row"><span><span class="dot" style="background:var(--green)"></span>相对位移</span><input id="showRel" type="checkbox" checked></div></div><div class="note">这道题的原图没有完整选项和数值，因此本页先做“结构与相对运动”教学演示，不把示意运动当作唯一真实解。正式题库系统应在识别完整题干和选项后，再根据受力关系生成精确动力学轨迹。</div></aside></div></main><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now(),speed=1;const speeds=[1,.5,.25];let si=0;function render(){p=Math.max(0,Math.min(1,p));const plankShift=42*p;const rel=58*Math.sin(Math.PI*p);const blockShift=plankShift+rel;const springScale=1+rel/170;q('plank').setAttribute('transform',`translate(${plankShift} 0)`);q('block').setAttribute('transform',`translate(${blockShift} 0)`);q('spring').setAttribute('transform',`translate(${plankShift} 0) scale(${springScale} 1)`);q('f1').setAttribute('transform',`translate(${blockShift} 0)`);q('f1t').setAttribute('transform',`translate(${blockShift} 0)`);q('f2').setAttribute('transform',`translate(${plankShift} 0)`);q('f2t').setAttribute('transform',`translate(${plankShift} 0)`);q('f1').style.display=q('showF1').checked?'':'none';q('f1t').style.display=q('showF1').checked?'':'none';q('f2').style.display=q('showF2').checked?'':'none';q('f2t').style.display=q('showF2').checked?'':'none';const x1=350+plankShift,x2=350+blockShift,y=205;q('relArrow').setAttribute('x1',Math.min(x1,x2));q('relArrow').setAttribute('x2',Math.max(x1,x2));q('relArrow').setAttribute('y1',y);q('relArrow').setAttribute('y2',y);q('relText').setAttribute('x',(x1+x2)/2-28);q('relText').setAttribute('y',y-9);q('relArrow').style.display=q('showRel').checked?'':'none';q('relText').style.display=q('showRel').checked?'':'none';q('timeline').value=p;q('status').textContent=(run?'播放中':'已暂停')+' · t = '+p.toFixed(2);q('play').textContent=run?'暂停':'播放';q('Xp').textContent=plankShift.toFixed(1);q('Xm').textContent=blockShift.toFixed(1);q('Rel').textContent=rel.toFixed(1);q('Spring').textContent=rel>4?'伸长':rel<-4?'压缩':'近原长';if(p<.15){q('phase').textContent='初始';q('hint').textContent='外力刚施加，观察 m 与 M 的加速度是否相同。'}else if(p<.5){q('phase').textContent='相对运动增强';q('hint').textContent='物块相对木板向右移动，弹簧伸长，弹簧力逐渐增大。'}else if(p<.85){q('phase').textContent='弹簧回拉增强';q('hint').textContent='随着弹簧力增大，m 与 M 的相对运动趋势发生变化。'}else{q('phase').textContent='后段';q('hint').textContent='暂停比较系统外力冲量、整体动量以及弹簧势能的变化。'}document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',Math.abs(+c.dataset.p-p)<.01))}q('play').onclick=()=>{if(p>=1)p=0;run=!run;render()};q('reset').onclick=()=>{p=0;run=false;render()};q('back').onclick=()=>{p-=.02;run=false;render()};q('next').onclick=()=>{p+=.02;run=false;render()};q('speed').onclick=()=>{si=(si+1)%speeds.length;speed=speeds[si];q('speed').textContent='速度 '+speed+'×'};q('timeline').oninput=e=>{p=+e.target.value;run=false;render()};['showF1','showF2','showRel'].forEach(id=>q(id).onchange=render);document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{p=+c.dataset.p;run=false;render()});function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.2*speed;if(p>=1){p=1;run=false}render()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
