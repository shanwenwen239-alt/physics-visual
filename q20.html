<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第20题｜弹簧耦合</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--g:#059669;--v:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:white;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.75fr .8fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第20题｜弹簧—物块—木板耦合</div><div class="layout"><div><section class="card"><svg class="scene" viewBox="0 0 920 500"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker></defs><rect width="920" height="500" rx="12" fill="#fbfdff"/><line x1="35" y1="410" x2="885" y2="410" stroke="#aab7c5" stroke-width="2.5"/><g id="M"><rect x="190" y="305" width="550" height="95" rx="12" fill="#ffe8a3" stroke="#6d5620" stroke-width="2.5"/><line x1="350" y1="175" x2="350" y2="400" stroke="#334155" stroke-width="9"/><text x="600" y="365" font-size="34">M</text></g><path id="spring" fill="none" stroke="#53657b" stroke-width="5"/><g id="m"><rect width="110" height="82" rx="12" fill="#c9e0ff" stroke="#245a91" stroke-width="3"/><text x="44" y="52" font-size="32">m</text></g><line id="F1" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)" stroke-linecap="round"/><line id="F2" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)" stroke-linecap="round"/><line id="FsM" stroke="#d97706" stroke-width="3" marker-end="url(#mo)" stroke-linecap="round"/><line id="Fsm" stroke="#d97706" stroke-width="3" marker-end="url(#mo)" stroke-linecap="round"/><text id="F1t" fill="#991b1b" font-size="15" font-weight="700">F</text><text id="F2t" fill="#991b1b" font-size="15" font-weight="700">F</text><text id="FsMt" fill="#9a6200" font-size="15" font-weight="700">Fs</text><text id="Fsmt" fill="#9a6200" font-size="15" font-weight="700">Fs</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放一周期</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="prev" class="btn">◀ 单步</button><button id="next" class="btn">单步 ▶</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside class="card"><h3>实时力数据</h3><div class="data"><span>外力 F₁</span><b style="color:#dc2626">F，恒定</b><span>外力 F₂</span><b style="color:#dc2626">F，恒定</b><span>弹簧力 Fs/F</span><b id="fs" style="color:#d97706">0</b><span>m合力/F</span><b id="fm">+1</b><span>M合力/F</span><b id="fM">−1</b></div><div class="box note"><b>矢量规则：</b>外力箭头始终从真实施力对象边缘附近出发，方向固定；弹簧力沿弹簧方向，长度随Fs变化。Fs=0时箭头消失，最大时箭头明显增长。</div><div class="box theory"><b>模型：</b>maₘ=F−kx；MaM=kx−F。令相对伸长x，则x=(F/k)(1−cosωt)，所以Fs/F=1−cosωt，范围0～2。</div><div class="box answer"><b>验收：</b>弹簧左端始终固定在挡板；物块端始终连接物块。箭头、标签与物体同步移动，不悬空。</div></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const m0=1,M0=2,baseM=190,baseWall=350,baseBlock=590;function spring(x1,x2,y){let d=`M${x1} ${y}`,n=9;for(let i=1;i<n*2;i++){let x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-17:17);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){p=Math.max(0,Math.min(1,p));let ph=2*Math.PI*p,xf=1-Math.cos(ph),xm=75*(M0/(m0+M0))*xf,xM=-75*(m0/(m0+M0))*xf,wall=baseWall+xM,block=baseBlock+xm,Fs=xf;q('M').setAttribute('transform',`translate(${xM} 0)`);q('m').setAttribute('transform',`translate(${block} 265)`);q('spring').setAttribute('d',spring(wall,block,306));line('F1',block+110,306,block+175,306);q('F1t').setAttribute('x',block+140);q('F1t').setAttribute('y',288);line('F2',baseM+xM,352,baseM+xM-65,352);q('F2t').setAttribute('x',baseM+xM-50);q('F2t').setAttribute('y',334);let L=42*Fs;line('FsM',wall,306,wall+L,306);line('Fsm',block,306,block-L,306);q('FsMt').setAttribute('x',wall+Math.max(5,L*.55));q('FsMt').setAttribute('y',288);q('Fsmt').setAttribute('x',block-Math.max(25,L*.55));q('Fsmt').setAttribute('y',288);['FsM','Fsm','FsMt','Fsmt'].forEach(id=>q(id).style.opacity=Fs<.03?0:1);q('fs').textContent=Fs.toFixed(2);q('fm').textContent=(1-Fs).toFixed(2);q('fM').textContent=(Fs-1).toFixed(2);q('t').value=p}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;draw()};q('prev').onclick=()=>{run=false;p-=.02;draw()};q('next').onclick=()=>{run=false;p+=.02;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.12;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
