<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第33题｜两相干波源干涉</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第33题｜同相相干波源 M、N 的干涉</div><div class="desc">固定几何参照：M、N 与中垂线不移动、不缩放。a、b、c 的几何位置也不随“瞬时位移”移动；旁边的小竖条只表示该点当前振动位移。这样不会把振动位移误认为路程差变化。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#fbfdff"/><line x1="250" y1="190" x2="750" y2="190" stroke="#94a3b8" stroke-dasharray="7 6" stroke-width="2"/><line x1="500" y1="75" x2="500" y2="500" stroke="#94a3b8" stroke-dasharray="7 6" stroke-width="2"/><g id="ringsM" fill="none" stroke="#60a5fa" opacity=".35"></g><g id="ringsN" fill="none" stroke="#60a5fa" opacity=".35"></g><circle cx="250" cy="190" r="14" fill="#2563eb"/><circle cx="750" cy="190" r="14" fill="#2563eb"/><text x="225" y="165" font-size="24" font-weight="800">M</text><text x="760" y="165" font-size="24" font-weight="800">N</text><g id="points"></g><text x="640" y="520" fill="#64748b">中垂线：rM=rN → Δr=0</text></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>波长 λ：<span id="lv" class="value"></span><input id="lam" type="range" min="40" max="120" step="5" value="80"></label><label>单源振幅 A：<span id="av" class="value"></span><input id="amp" type="range" min="10" max="40" step="2" value="25"></label><label>频率 f：<span id="fv" class="value"></span><input id="freq" type="range" min=".5" max="2" step=".1" value="1"></label></div></div><div class="card"><h3>实时核查</h3><div class="data"><span>Δr(a)</span><b>0</b><span>Δr(b)</span><b>0</b><span>Δr(c)</span><b>0</b><span>合振幅</span><b id="ampSum"></b><span>波速 v=λf</span><b id="waveV"></b></div></div><div class="card"><div class="box">在当前已有题意“两个波源同相且振动情况完全相同”下，a、b、c 都在中垂线上，所以 Δr=0，始终属于干涉加强点。某一时刻合位移为正、负或0，只是瞬时振动状态。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let t=0,run=false,speed=1,last=performance.now();const ys=[250,330,410],names=['a','b','c'],cols=['#ef4444','#f59e0b','#10b981'];function P(){return{lam:+$('lam').value,A:+$('amp').value,f:+$('freq').value}}function disp(y,p){const r=Math.hypot(250,y-190),w=2*Math.PI*p.f,k=2*Math.PI/p.lam;return 2*p.A*Math.sin(w*t-k*r)}function rings(id,cx,p){const phase=(p.lam*p.f*t)%p.lam;let h='';for(let n=0;n<8;n++){const r=phase+n*p.lam;if(r>10&&r<460)h+=`<circle cx="${cx}" cy="190" r="${r}" stroke-width="2"/>`}$(id).innerHTML=h}function draw(){const p=P();rings('ringsM',250,p);rings('ringsN',750,p);let h='';ys.forEach((y,i)=>{const d=disp(y,p),bar=-d*.65;h+=`<circle cx="500" cy="${y}" r="9" fill="white" stroke="${cols[i]}" stroke-width="3"/><text x="518" y="${y+6}" font-size="20" font-weight="800">${names[i]}</text><line x1="548" y1="${y}" x2="548" y2="${y+bar}" stroke="${cols[i]}" stroke-width="4"/><circle cx="548" cy="${y+bar}" r="5" fill="${cols[i]}"/><text x="565" y="${y+5}" fill="${cols[i]}" font-size="13">y=${d.toFixed(1)}</text>`});$('points').innerHTML=h;$('lv').textContent=p.lam.toFixed(0);$('av').textContent=p.A.toFixed(0);$('fv').textContent=p.f.toFixed(1);$('ampSum').textContent=(2*p.A).toFixed(0);$('waveV').textContent=(p.lam*p.f).toFixed(1);$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{run=!run;draw()};$('reset').onclick=()=>{run=false;t=0;$('lam').value=80;$('amp').value=25;$('freq').value=1;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['lam','amp','freq'].forEach(id=>$(id).oninput=()=>{run=false;t=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
