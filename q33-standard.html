<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第33题｜波的干涉</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第33题｜两相干波源的干涉</div><div class="desc">M、N为振动情况完全相同的相干波源，a、b、c位于MN中垂线上。模型把“路程差”和“瞬时位移”分开显示，避免把某一时刻的波峰/波谷误认为加强点或减弱点。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="250" y1="190" x2="750" y2="190" stroke="#94a3b8" stroke-dasharray="7 6" stroke-width="2"/><line x1="500" y1="90" x2="500" y2="500" stroke="#94a3b8" stroke-dasharray="7 6" stroke-width="2"/><circle cx="250" cy="190" r="14" fill="#2563eb"/><circle cx="750" cy="190" r="14" fill="#2563eb"/><text x="225" y="165" font-size="24" font-weight="700">M</text><text x="760" y="165" font-size="24" font-weight="700">N</text><g id="ringsM" fill="none" stroke="#60a5fa" opacity=".42"></g><g id="ringsN" fill="none" stroke="#60a5fa" opacity=".42"></g><circle id="a" cx="500" cy="250" r="11" fill="#ef4444"/><circle id="bpt" cx="500" cy="330" r="11" fill="#f59e0b"/><circle id="c" cx="500" cy="410" r="11" fill="#10b981"/><text x="520" y="257" font-size="22">a</text><text x="520" y="337" font-size="22">b</text><text x="520" y="417" font-size="22">c</text><text x="650" y="505" fill="#64748b">MN中垂线：到M、N路程始终相等</text></svg></section><section class="card" style="margin-top:10px"><div class="graphGrid"><div><b>a点合位移</b><div id="ya" style="font-size:28px;color:#ef4444;margin-top:8px">0</div></div><div><b>b点合位移</b><div id="yb" style="font-size:28px;color:#f59e0b;margin-top:8px">0</div></div><div><b>c点合位移</b><div id="yc" style="font-size:28px;color:#10b981;margin-top:8px">0</div></div></div></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>波长 λ：<span id="lv" class="value"></span><input id="lam" type="range" min="40" max="120" step="5" value="80"></label><label>振幅 A：<span id="av" class="value"></span><input id="amp" type="range" min="10" max="40" step="2" value="25"></label><label>频率 f：<span id="fv" class="value"></span><input id="freq" type="range" min="0.5" max="2" step="0.1" value="1"></label></div></section><section class="card"><h3 class="title">实时物理核查</h3><div class="data"><span>Δr(a)</span><b>0</b><span>Δr(b)</span><b>0</b><span>Δr(c)</span><b>0</b></div><div class="box theory">三点都在中垂线上，因此rM=rN，路程差Δr=0。两波源同相，所以三点始终是干涉加强点。某一时刻位移为峰、谷或0，只是瞬时状态，不改变“加强点”的性质。</div><div class="box ok"><b>结论：a、b、c三点均为振动加强点。</b></div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,t=0,last=performance.now();function P(){return{lam:+$('lam').value,A:+$('amp').value,f:+$('freq').value}}function rings(id,cx){let p=P(),html='';for(let r=20;r<430;r+=p.lam)html+=`<circle cx="${cx}" cy="190" r="${r+(t*p.f*35)%p.lam}" stroke-width="2"/>`;$(id).innerHTML=html}function disp(y){let p=P(),r=Math.hypot(250,y-190),phase=2*Math.PI*(p.f*t-r/p.lam);return 2*p.A*Math.sin(phase)}function draw(){let p=P();rings('ringsM',250);rings('ringsN',750);let ya=disp(250),yb=disp(330),yc=disp(410);$('a').setAttribute('transform',`translate(0 ${-ya*.35})`);$('bpt').setAttribute('transform',`translate(0 ${-yb*.35})`);$('c').setAttribute('transform',`translate(0 ${-yc*.35})`);$('ya').textContent=ya.toFixed(1);$('yb').textContent=yb.toFixed(1);$('yc').textContent=yc.toFixed(1);$('lv').textContent=p.lam.toFixed(0);$('av').textContent=p.A.toFixed(0);$('fv').textContent=p.f.toFixed(1)}function label(){$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}function reset(){run=false;t=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['lam','amp','freq'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
