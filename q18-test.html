<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18题测试页</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;margin:0;background:#f5f7fb;color:#172033}.w{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px}.ok{display:inline-block;padding:6px 10px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:13px}canvas{width:100%;height:auto;background:#f8fafc;border-radius:16px;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 14px;border:1px solid #d1d5db;border-radius:10px;background:white}button.primary{background:#111827;color:#fff}.muted{color:#64748b}input{width:100%;margin-top:12px}</style></head><body><main class="w"><div class="card"><div class="ok" id="js">页面已加载</div><h1>第18题｜基础播放测试</h1><p class="muted">这个页面只测试三件事：网页能否打开、按钮能否响应、动画能否播放。</p><canvas id="c" width="760" height="440"></canvas><input id="range" type="range" min="30" max="90" value="30"><div class="controls"><button id="play" class="primary">播放</button><button id="reset">重置</button><button id="jump">跳到60°</button></div><p id="status">当前 α = 30°，已暂停</p></div></main><script>(function(){var c=document.getElementById('c'),x=c.getContext('2d'),play=document.getElementById('play'),range=document.getElementById('range'),status=document.getElementById('status');var a=30,run=false,timer=null;document.getElementById('js').textContent='JavaScript 正常';function draw(){var rad=a*Math.PI/180,O={x:180,y:380},r=42,L=320,bx=O.x+r,by=O.y-r*(1+Math.cos(rad))/Math.sin(rad),ex=O.x+L*Math.sin(rad),ey=O.y-L*Math.cos(rad);x.clearRect(0,0,c.width,c.height);x.strokeStyle='#334155';x.lineWidth=8;x.beginPath();x.moveTo(O.x,40);x.lineTo(O.x,400);x.stroke();x.lineWidth=10;x.beginPath();x.moveTo(O.x,O.y);x.lineTo(ex,ey);x.stroke();x.fillStyle='#93c5fd';x.strokeStyle='#1e3a8a';x.lineWidth=3;x.beginPath();x.arc(bx,by,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#111827';x.font='18px sans-serif';x.fillText('α = '+a.toFixed(0)+'°',230,355);range.value=a;status.textContent='当前 α = '+a.toFixed(0)+'°，'+(run?'播放中':'已暂停');play.textContent=run?'暂停':'播放'}function start(){if(timer)clearInterval(timer);timer=setInterval(function(){if(!run)return;a+=0.5;if(a>=90){a=90;run=false}draw()},60)}play.onclick=function(){if(a>=90)a=30;run=!run;draw()};document.getElementById('reset').onclick=function(){a=30;run=false;draw()};document.getElementById('jump').onclick=function(){a=60;run=false;draw()};range.oninput=function(){a=parseFloat(this.value)||30;run=false;draw()};draw();start()})();</script></body></html>
