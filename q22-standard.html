<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第22题｜小车骤停</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 345px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第22题｜小车骤停后的两滑块</div><div class="desc">固定地面参照系：小车先与 m₁、m₂ 一起向右匀速；到设定时刻小车瞬间停止。两滑块随后相对车面向右滑动，受滑动摩擦力向左。参数范围保证极值情况下两滑块仍完整留在车面和画面内。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1040 580"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1040" height="580" fill="#fbfdff"/><line x1="20" y1="500" x2="1020" y2="500" stroke="#94a3b8" stroke-width="3"/><g id="cart"><rect x="0" y="360" width="760" height="80" rx="12" fill="#ffe59a" stroke="#6d5620" stroke-width="3"/><circle cx="170" cy="462" r="18" fill="#334155"/><circle cx="590" cy="462" r="18" fill="#334155"/></g><g id="m2"><rect width="95" height="70" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="30" y="45" font-size="26">m₂</text></g><g id="m1"><rect width="120" height="90" rx="10" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><text x="42" y="55" font-size="28">m₁</text></g><g id="arrows"></g><line id="gap" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><text id="gapT" fill="#6d28d9" font-weight="800">间距</text></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>m₂：<span id="m2v" class="value"></span><input id="m2p" type="range" min=".5" max="2" step=".1" value="1"></label><label>m₁/m₂：<span id="rv" class="value"></span><input id="ratio" type="range" min="1.1" max="3" step=".1" value="1.5"></label><label>μ：<span id="muv" class="value"></span><input id="mu" type="range" min=".1" max=".6" step=".01" value=".25"></label><label>v₀：<span id="v0v" class="value"></span><input id="v0" type="range" min="1" max="4" step=".2" value="4"></label><label>骤停时刻：<span id="tsv" class="value"></span><input id="tstop" type="range" min=".5" max="1.5" step=".1" value="1"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>阶段</span><b id="stage"></b><span>v₁</span><b id="vv1"></b><span>v₂</span><b id="vv2"></b><span>f₁</span><b id="ff1"></b><span>f₂</span><b id="ff2"></b><span>两块间距</span><b id="dist"></b></div></div><div class="card"><div class="box">骤停后：a₁=f₁/m₁=μg，a₂=f₂/m₂=μg。因此若初速度相同，两块速度始终相同，相对间距保持不变。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8,S=18;let t=0,run=false,speed=1,last=performance.now();function P(){const m2=+$('m2p').value;return{m2,m1:m2*+$('ratio').value,mu:+$('mu').value,v0:+$('v0').value,ts:+$('tstop').value}}function state(p){const xCart=p.v0*Math.min(t,p.ts),tau=Math.max(0,t-p.ts),tStop=p.v0/(p.mu*g),u=Math.min(tau,tStop),v=t<p.ts?p.v0:Math.max(0,p.v0-p.mu*g*u),slide=p.v0*u-.5*p.mu*g*u*u;return{xCart,v,slide,tStop,stage:t<p.ts?'共同匀速':tau<tStop?'小车骤停：滑动减速':'两块相对车面停止'}}function draw(){const p=P(),q=state(p),cartX=55+q.xCart*S,local2=210+q.slide*S,local1=455+q.slide*S;$('cart').setAttribute('transform',`translate(${cartX} 0)`);const x2=cartX+local2,x1=cartX+local1;$('m2').setAttribute('transform',`translate(${x2-47} 290)`);$('m1').setAttribute('transform',`translate(${x1-60} 270)`);const sliding=t>=p.ts&&q.v>0;function arr(x,y,dx,dy,col,label){const mag=Math.hypot(dx,dy),L=Math.min(95,mag);if(mag<.1)return'';const ex=x+L*dx/mag,ey=y-L*dy/mag,marker=col,stroke=col==='red'?'#dc2626':col==='green'?'#059669':col==='orange'?'#d97706':'#2563eb';return `<line x1="${x}" y1="${y}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="3" marker-end="url(#${marker})"/><text x="${ex+6}" y="${ey-5}" fill="#334155" font-size="13" font-weight="800">${label}</text>`}let h='',l2=32*p.m2,l1=32*p.m1;h+=arr(x2,325,0,-l2,'red','G₂')+arr(x2,325,0,l2,'green','N₂')+arr(x1,315,0,-l1,'red','G₁')+arr(x1,315,0,l1,'green','N₁');if(sliding)h+=arr(x2,345,-p.mu*p.m2*g*7,0,'orange','f₂')+arr(x1,345,-p.mu*p.m1*g*7,0,'orange','f₁');if(q.v>0)h+=arr(x2,250,q.v*18,0,'blue','v₂')+arr(x1,230,q.v*18,0,'blue','v₁');$('arrows').innerHTML=h;$('gap').setAttribute('x1',x2+50);$('gap').setAttribute('x2',x1-65);$('gap').setAttribute('y1',190);$('gap').setAttribute('y2',190);$('gapT').setAttribute('x',(x1+x2)/2-20);$('gapT').setAttribute('y',178);$('m2v').textContent=p.m2.toFixed(1);$('rv').textContent=(p.m1/p.m2).toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('v0v').textContent=p.v0.toFixed(1);$('tsv').textContent=p.ts.toFixed(1)+' s';$('stage').textContent=q.stage;$('vv1').textContent=q.v.toFixed(2);$('vv2').textContent=q.v.toFixed(2);$('ff1').textContent=(sliding?p.mu*p.m1*g:0).toFixed(2);$('ff2').textContent=(sliding?p.mu*p.m2*g:0).toFixed(2);$('dist').textContent='恒定';$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始';if(t>=p.ts+q.tStop){run=false;$('play').textContent='↻ 重新开始'}}$('play').onclick=()=>{const p=P(),q=state(p);if(t>=p.ts+q.tStop)t=0;run=!run;draw()};$('reset').onclick=()=>{run=false;t=0;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m2p','ratio','mu','v0','tstop'].forEach(id=>$(id).oninput=()=>{run=false;t=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
