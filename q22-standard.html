<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第22题｜小车骤停</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第22题｜小车突然停止后的两滑块运动</div><div class="desc">m₁&gt;m₂，两滑块与车面动摩擦因数相同。小车先与两滑块一起匀速运动，在指定时刻骤停；随后两滑块在摩擦力作用下相对车面滑动。动画直接显示G、N、f和速度。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="gold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="20" y1="470" x2="980" y2="470" stroke="#a9b7c6" stroke-width="3"/><g id="cart"><rect x="80" y="350" width="840" height="80" rx="12" fill="#ffe59a" stroke="#6d5620" stroke-width="3"/><circle cx="245" cy="450" r="18" fill="#334155"/><circle cx="760" cy="450" r="18" fill="#334155"/></g><g id="m2"><rect width="95" height="70" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="30" y="45" font-size="26">m₂</text></g><g id="m1"><rect width="120" height="90" rx="10" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><text x="42" y="55" font-size="28">m₁</text></g><g id="forces"><line id="g2" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="n2" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="f2" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="g1" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="n1" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="f1" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><text id="g2t" class="badge" fill="#b91c1c">G₂</text><text id="n2t" class="badge" fill="#047857">N₂</text><text id="f2t" class="badge" fill="#a16207">f₂</text><text id="g1t" class="badge" fill="#b91c1c">G₁</text><text id="n1t" class="badge" fill="#047857">N₁</text><text id="f1t" class="badge" fill="#a16207">f₁</text></g><line id="v2" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="v1" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><text id="v2t" class="badge" fill="#1d4ed8">v₂</text><text id="v1t" class="badge" fill="#1d4ed8">v₁</text><line id="gap" stroke="#059669" stroke-width="2.5"/><text id="gapT" fill="#047857" font-weight="700">间距</text><text x="690" y="55" fill="#64748b" font-size="14">实线=力｜蓝色虚线=速度</text></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>m₂：<span id="m2v" class="value"></span><input id="m2p" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>质量比 m₁/m₂：<span id="rv" class="value"></span><input id="ratio" type="range" min="1.1" max="3" step="0.1" value="1.5"></label><label>摩擦因数 μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max="0.6" step="0.02" value="0.25"></label><label>初速度 v₀：<span id="v0v" class="value"></span><input id="v0" type="range" min="1" max="6" step="0.2" value="4"></label><label>小车骤停时刻：<span id="tsv" class="value"></span><input id="tstop" type="range" min="0.5" max="2" step="0.1" value="1"></label></div></section><section class="card"><h3 class="title">实时物理量</h3><div class="data"><span>阶段</span><b id="stage">共同匀速</b><span>v₁</span><b id="vv1">0</b><span>v₂</span><b id="vv2">0</b><span>f₁</span><b id="ff1">0</b><span>f₂</span><b id="ff2">0</b><span>两块间距</span><b id="dist">0</b></div><div class="box theory">两块滑动时：fᵢ=μmᵢg，因此减速度aᵢ=fᵢ/mᵢ=μg，与质量无关。初速度又相同，所以两块速度始终相同、相对位移不变。</div><div class="box ok">因此μ=0时不相碰；μ≠0时也不相碰。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,last=performance.now(),t=0;const g=9.8,base2=285,base1=565;function P(){let m2=+$('m2p').value;return{m2,m1:m2*+$('ratio').value,mu:+$('mu').value,v0:+$('v0').value,ts:+$('tstop').value}}function state(){let p=P();if(t<p.ts)return{v:p.v0,dx:p.v0*t,fr:0,stage:'共同匀速'};let tau=t-p.ts;if(p.mu===0)return{v:p.v0,dx:p.v0*t,fr:0,stage:'车停后：无摩擦匀速'};let stopT=p.v0/(p.mu*g),u=Math.min(tau,stopT),v=Math.max(0,p.v0-p.mu*g*u),dx=p.v0*p.ts+p.v0*u-.5*p.mu*g*u*u;return{v,dx,fr:v>0?1:0,stage:v>0?'车停后：滑动摩擦减速':'已相对车面静止'}}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function pos(id,x,y){$(id).setAttribute('x',x);$(id).setAttribute('y',y)}function draw(){let p=P(),s=state(),common=Math.min(170,s.dx*18),x2=base2+common,x1=base1+common;if(x1>820){let shift=x1-820;x1-=shift;x2-=shift} $('m2').setAttribute('transform',`translate(${x2-47} 280)`);$('m1').setAttribute('transform',`translate(${x1-60} 260)`);let l2=45*p.m2,l1=45*p.m1,fl2=s.fr*p.mu*p.m2*g,fl1=s.fr*p.mu*p.m1*g;line('g2',x2,315,x2,315+l2);line('n2',x2,315,x2,315-l2);line('g1',x1,305,x1,305+l1);line('n1',x1,305,x1,305-l1);line('f2',x2,340,x2-Math.min(90,fl2*8),340);line('f1',x1,340,x1-Math.min(100,fl1*8),340);['f2','f2t'].forEach(i=>$(i).style.opacity=s.fr?1:0);['f1','f1t'].forEach(i=>$(i).style.opacity=s.fr?1:0);line('v2',x2,245,x2+Math.min(120,s.v*22),245);line('v1',x1,220,x1+Math.min(120,s.v*22),220);pos('g2t',x2+8,315+l2-8);pos('n2t',x2+8,315-l2+12);pos('g1t',x1+8,305+l1-8);pos('n1t',x1+8,305-l1+12);pos('f2t',x2-50,330);pos('f1t',x1-55,330);pos('v2t',x2+25,235);pos('v1t',x1+25,210);line('gap',x2+48,175,x1-60,175);pos('gapT',(x2+x1)/2-20,160);$('m2v').textContent=p.m2.toFixed(1);$('rv').textContent=(p.m1/p.m2).toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('v0v').textContent=p.v0.toFixed(1);$('tsv').textContent=p.ts.toFixed(1)+' s';$('stage').textContent=s.stage;$('vv1').textContent=s.v.toFixed(2);$('vv2').textContent=s.v.toFixed(2);$('ff1').textContent=fl1.toFixed(2);$('ff2').textContent=fl2.toFixed(2);$('dist').textContent=(base1-base2).toFixed(0)+' px'}function label(){$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}function reset(){run=false;t=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m2p','ratio','mu','v0','tstop'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;if(t>8)t=0;draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
