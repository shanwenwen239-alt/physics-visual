<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第32题｜斜面系统</title><style>body{margin:0;font-family:system-ui,'Microsoft YaHei';background:#f5f8fc;color:#10233f}.w{max-width:1350px;margin:auto;padding:18px}.hero{background:linear-gradient(90deg,#376eae,#24558f);color:#fff;padding:13px 22px;border-radius:12px;font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:2fr .8fr;gap:14px}.card{background:#fff;border:1px solid #d7e3f1;border-radius:15px;padding:14px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%}.btn{padding:9px 15px;border:1px solid #ccd9e8;border-radius:9px;background:#fff}.primary{background:#1672ee;color:#fff}.data{display:grid;grid-template-columns:1fr auto;gap:10px}.note{background:#fff8d9;padding:11px;border-radius:10px;line-height:1.7;margin-top:10px}.ok{background:#eafaf2;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第32题　物块沿静止斜面匀速下滑</div><p>物块 m 在沿斜面向上的拉力 F 作用下匀速下滑，斜面 M 相对地面保持静止。重点观察系统的水平外力与竖直支持力。</p><div class="grid"><div><section class="card"><svg class="scene" viewBox="0 0 900 430"><defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef2b27"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1672ee"/></marker></defs><line x1="80" y1="350" x2="820" y2="350" stroke="#9fb0c3" stroke-width="4"/><polygon points="210,350 690,350 690,120" fill="#ffe17d" stroke="#263b55" stroke-width="4"/><text x="520" y="315" font-size="38">M</text><g id="blk"><rect x="0" y="0" width="90" height="70" rx="10" fill="#b9d7ff" stroke="#163f8c" stroke-width="4"/><text x="34" y="45" font-size="30">m</text></g><line x1="430" y1="245" x2="520" y2="202" stroke="#1672ee" stroke-width="6" marker-end="url(#b)"/><text x="500" y="180" fill="#1672ee" font-size="24">F</text><line x1="210" y1="370" x2="120" y2="370" stroke="#ef2b27" stroke-width="6" marker-end="url(#r)"/><text x="125" y="400" fill="#ef2b27">地面对斜面摩擦力 ←</text><line x1="690" y1="350" x2="690" y2="260" stroke="#12a85a" stroke-width="6" marker-end="url(#b)"/></svg></section><section class="card" style="margin-top:10px"><button id="play" class="btn primary">▶ 播放</button><button id="reset" class="btn">↻ 重置</button><input id="t" type="range" min="0" max="1" step=".001" value="0" style="width:70%;vertical-align:middle"></section></div><aside class="card"><h3>实时数据 / 观察</h3><div class="data"><span>物块速度</span><b style="color:#1672ee">沿斜面向下，大小不变</b><span>物块加速度</span><b>0</b><span>地面对斜面摩擦</span><b style="color:#ef2b27">水平向左</b><span>地面支持力</span><b style="color:#12a85a">小于 (M+m)g</b></div><div class="note"><b>物理基础核实</b><br>把 m+M 看成整体：整体水平、竖直加速度均为0。外力 F 有向右的水平分量，因此地面对斜面的摩擦力必须向左平衡；F 有向上的竖直分量，因此地面支持力 N=(M+m)g−F sinθ。</div><div class="ok"><b>结论：A、D。</b><br>这题的可视化重点不是“物块滑了多远”，而是把内力隐藏后观察整个系统的外力平衡。</div></aside></div><script>let p=0,run=false,last=0;const blk=document.getElementById('blk'),sl=document.getElementById('t');function draw(){const x=510-180*p,y=145+86*p;blk.setAttribute('transform',`translate(${x} ${y}) rotate(-25)`);sl.value=p}document.getElementById('play').onclick=()=>run=true;document.getElementById('reset').onclick=()=>{run=false;p=0;draw()};sl.oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){if(!last)last=n;if(run){p+=Math.min(.01,(n-last)/5000);if(p>=1){p=1;run=false}draw()}last=n;requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)</script></main></body></html>
