<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第19题｜平抛与光滑斜面</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--v:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:#fff;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.desc{margin:9px 4px 12px;color:#526579;line-height:1.7}.layout{display:grid;grid-template-columns:1.8fr .78fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第19题｜平抛 vs 光滑斜面内运动</div><div class="desc"><b>视觉修正：</b>右侧直接用一条明显的粗斜线作为“斜面主边界”，再辅以浅色面。先让学生一眼看见“这是斜面”，再看B在斜面内的二维运动。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 960 540"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker></defs><rect width="960" height="540" rx="12" fill="#fbfdff"/><text x="48" y="38" font-size="18" font-weight="800">A：竖直平面内平抛</text><line x1="78" y1="455" x2="425" y2="455" stroke="#b9c4d0" stroke-width="2"/><path d="M82 92 Q250 125 392 430" fill="none" stroke="#93b9ea" stroke-width="2.4" stroke-dasharray="7 6"/><circle id="A" r="15" fill="#b9d7ff" stroke="#245a91" stroke-width="2.5"/><line id="mgA" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><text id="mgAt" fill="#991b1b" font-size="15" font-weight="700">G</text><text x="505" y="38" font-size="18" font-weight="800">B：光滑斜面内运动</text><polygon points="530,105 855,105 795,430 470,430" fill="#fff4dc" stroke="#d0ae7d" stroke-width="2"/><line x1="530" y1="105" x2="470" y2="430" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/><text x="474" y="300" transform="rotate(-79 474 300)" fill="#334155" font-size="17" font-weight="900">光滑斜面</text><line x1="855" y1="105" x2="795" y2="430" stroke="#9b7446" stroke-width="3"/><line x1="530" y1="105" x2="855" y2="105" stroke="#9b7446" stroke-width="3"/><line x1="470" y1="430" x2="795" y2="430" stroke="#9b7446" stroke-width="3"/><g opacity=".22" stroke="#b89567"><line x1="520" y1="170" x2="843" y2="170"/><line x1="508" y1="235" x2="831" y2="235"/><line x1="496" y1="300" x2="819" y2="300"/><line x1="484" y1="365" x2="807" y2="365"/></g><line x1="545" y1="126" x2="820" y2="126" stroke="#334155" stroke-width="2.4" marker-end="url(#mo)"/><text x="650" y="118" fill="#334155" font-size="14">x方向 v₀</text><path d="M545 135 Q705 165 780 405" fill="none" stroke="#e7a84a" stroke-width="3" stroke-dasharray="7 6"/><circle id="B" r="15" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line id="mgB" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="NB" stroke="#d97706" stroke-width="3" marker-end="url(#mo)"/><text id="mgBt" fill="#991b1b" font-size="15" font-weight="700">G</text><text id="NBt" fill="#9a6200" font-size="15" font-weight="700">N</text><g transform="translate(660 445)"><line x1="0" y1="48" x2="170" y2="48" stroke="#64748b" stroke-width="2"/><line x1="0" y1="48" x2="125" y2="6" stroke="#4b5563" stroke-width="5"/><path d="M40 48 A40 40 0 0 0 37 34" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="44" y="40" fill="#7c3aed" font-size="14">θ</text><text x="5" y="68" fill="#64748b" font-size="12">侧视：斜面与水平面夹角</text></g></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="prev" class="btn">◀ 单步</button><button id="next" class="btn">单步 ▶</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside class="card"><h3>实时物理核查</h3><div class="data"><span>A：重力 G</span><b style="color:#dc2626">mg</b><span>B：重力 G</span><b style="color:#dc2626">mg</b><span>B：支持力 N</span><b style="color:#d97706">mg cosθ</b><span>B：斜面内合力</span><b style="color:#7c3aed">mg sinθ</b><span>A进程</span><b id="pa">0%</b><span>B进程</span><b id="pb">0%</b></div><div class="box note"><b>斜面识别：</b>右侧粗深灰斜线就是斜面主边界；浅黄色区域表示整块斜面。</div><div class="box theory"><b>物理模型：</b>B受重力和斜面支持力，斜面光滑无摩擦。B在斜面内沿x方向匀速、沿下坡方向匀加速，因此轨迹是斜面内的抛物线。</div><div class="box answer"><b>结论：</b>同一竖直落差下A、B末速率相同；时间、x位移和速度方向不同，正确项D。</div></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const th=35*Math.PI/180,tA=Math.sin(th);function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){p=Math.max(0,Math.min(1,p));const ua=Math.min(1,p/tA),ub=p,ax=82+310*ua,ay=92+338*ua*ua,bx=545+235*ub,by=135+270*ub*ub;q('A').setAttribute('cx',ax);q('A').setAttribute('cy',ay);q('B').setAttribute('cx',bx);q('B').setAttribute('cy',by);line('mgA',ax,ay,ax,ay+52);q('mgAt').setAttribute('x',ax+7);q('mgAt').setAttribute('y',ay+46);line('mgB',bx,by,bx,by+52);q('mgBt').setAttribute('x',bx+7);q('mgBt').setAttribute('y',by+46);const nx=-Math.sin(th),ny=-Math.cos(th),L=52*Math.cos(th);line('NB',bx,by,bx+nx*L,by+ny*L);q('NBt').setAttribute('x',bx+nx*L-18);q('NBt').setAttribute('y',by+ny*L-7);q('pa').textContent=Math.round(ua*100)+'%';q('pb').textContent=Math.round(ub*100)+'%';q('t').value=p}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;draw()};q('prev').onclick=()=>{run=false;p-=.025;draw()};q('next').onclick=()=>{run=false;p+=.025;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.15;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
