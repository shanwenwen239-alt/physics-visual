<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第19题｜平抛与光滑斜面</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:#17324d}.w{max-width:1080px;margin:auto;padding:18px}.title{font-size:24px;font-weight:800;margin-bottom:10px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:12px;box-shadow:0 6px 20px #315f9610}.scene{width:100%;display:block}.bar{display:flex;justify-content:center;margin-top:12px}.btn{border:0;background:#315f96;color:#fff;border-radius:10px;padding:10px 24px;font-size:16px;font-weight:700}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}</style></head><body><main class="w"><div class="title">第19题｜平抛与光滑斜面内运动</div><section class="card"><svg class="scene" viewBox="0 0 920 560"><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d94a45"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#c78a24"/></marker></defs><rect width="920" height="560" rx="12" fill="#fbfdff"/><text x="55" y="38" font-weight="800">A：平抛</text><path d="M90 90 Q250 120 390 430" fill="none" stroke="#93b9ea" stroke-width="2.5" stroke-dasharray="7 6"/><circle id="A" r="15" fill="#c9e0ff" stroke="#245a91" stroke-width="2.5"/><line id="GA" stroke="#d94a45" stroke-width="3" marker-end="url(#red)"/><text id="GAt" class="badge" fill="#b93431">G</text><text x="500" y="38" font-weight="800">B：光滑斜面内运动</text><polygon points="520,110 850,110 795,430 465,430" fill="#fff3d9" stroke="#c7a574" stroke-width="2"/><line x1="520" y1="110" x2="465" y2="430" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/><text x="470" y="310" transform="rotate(-80 470 310)" fill="#334155" font-weight="800">光滑斜面</text><path d="M540 135 Q700 170 780 405" fill="none" stroke="#e7a84a" stroke-width="3" stroke-dasharray="7 6"/><circle id="B" r="15" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line id="GB" stroke="#d94a45" stroke-width="3" marker-end="url(#red)"/><line id="NB" stroke="#c78a24" stroke-width="3" marker-end="url(#gold)"/><text id="GBt" class="badge" fill="#b93431">G</text><text id="NBt" class="badge" fill="#9b6818">N</text><g transform="translate(700 455)"><line x1="0" y1="45" x2="145" y2="45" stroke="#64748b" stroke-width="2"/><line x1="0" y1="45" x2="110" y2="7" stroke="#4b5563" stroke-width="4"/><text x="40" y="38" fill="#7257a5">θ</text></g><g transform="translate(690 65)"><rect width="180" height="104" rx="12" fill="#fff" stroke="#dbe5ef"/><text x="16" y="28" font-weight="800">实时量</text><text id="pa" x="16" y="56">A进程 0%</text><text id="pb" x="16" y="80">B进程 0%</text></g></svg><div class="bar"><button id="toggle" class="btn">开始</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const th=35*Math.PI/180,tA=Math.sin(th),nx=-Math.sin(th),ny=-Math.cos(th);const ln=(id,x1,y1,x2,y2)=>{let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};function draw(){let ua=Math.min(1,p/tA),ub=p,ax=90+300*ua,ay=90+340*ua*ua,bx=540+240*ub,by=135+270*ub*ub;$('A').setAttribute('cx',ax);$('A').setAttribute('cy',ay);$('B').setAttribute('cx',bx);$('B').setAttribute('cy',by);ln('GA',ax,ay,ax,ay+54);$('GAt').setAttribute('x',ax+8);$('GAt').setAttribute('y',ay+47);ln('GB',bx,by,bx,by+54);$('GBt').setAttribute('x',bx+8);$('GBt').setAttribute('y',by+47);let L=54*Math.cos(th);ln('NB',bx,by,bx+nx*L,by+ny*L);$('NBt').setAttribute('x',bx+nx*L-20);$('NBt').setAttribute('y',by+ny*L-6);$('pa').textContent='A进程 '+Math.round(ua*100)+'%';$('pb').textContent='B进程 '+Math.round(ub*100)+'%'}$('toggle').onclick=()=>{if(p>=1)p=0;run=!run;$('toggle').textContent=run?'暂停':'开始'};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.15;if(p>=1){p=1;run=false;$('toggle').textContent='重新开始'}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
