<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第19题｜平抛与光滑斜面</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 345px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.range{width:100%}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.bar{height:12px;background:#eef2f7;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px}.collapsed{display:none}.toggleRow{display:flex;justify-content:space-between;align-items:center;gap:8px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:950px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第19题｜同一高点：平抛与光滑斜面运动</div><div class="desc">当前仓库缺少完整原题文字，因此只保留可核实模型：A以水平初速度 v₀ 平抛；B以相同初速率沿固定光滑斜面向下运动。两者从同一视觉高度出发。观察角只改变B斜面的横向透视，不改变真实高低、重力方向或速度方向。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1080 600"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1080" height="600" fill="#fbfdff"/><line x1="55" y1="105" x2="1020" y2="105" stroke="#94a3b8" stroke-dasharray="7 6"/><text x="430" y="88" fill="#64748b">共同初始高度</text><text x="40" y="42" font-size="18" font-weight="850">A：水平抛出</text><path id="pathA" fill="none" stroke="#9ec4ef" stroke-width="2.5" stroke-dasharray="7 6"/><circle id="A" r="15" fill="#b9d7ff" stroke="#245a91" stroke-width="2.5"/><line id="GA" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="vA" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><text x="560" y="42" font-size="18" font-weight="850">B：光滑斜面</text><g id="plane"></g><circle id="B" r="15" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line id="GB" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="NB" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="vB" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><g id="labels" font-size="13" font-weight="800"></g></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><label>观察角 <b id="viewV"></b><input id="view" type="range" min="15" max="70" step="1" value="45"></label></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"></div><div class="card" style="margin-top:10px"><b>同一时刻速度大小</b><div style="margin-top:8px">A：<b id="vaNum"></b><div class="bar"><div id="barA" class="fill" style="background:#2563eb"></div></div></div><div style="margin-top:8px">B：<b id="vbNum"></b><div class="bar"><div id="barB" class="fill" style="background:#d97706"></div></div></div></div><div class="card" style="margin-top:10px"><div class="toggleRow"><b>辅助：B受力与重力分解</b><button id="toggleForce" class="btn">展开</button></div><div id="forcePanel" class="collapsed"><svg viewBox="0 0 700 250" style="width:100%"><defs><marker id="pr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="pg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="pp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker></defs><line x1="80" y1="180" x2="300" y2="55" stroke="#475569" stroke-width="5"/><circle cx="190" cy="117" r="18" fill="#ffe0a3"/><line x1="190" y1="117" x2="190" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#pr)"/><text x="200" y="210" fill="#b91c1c">G</text><line x1="190" y1="117" x2="130" y2="12" stroke="#059669" stroke-width="3" marker-end="url(#pg)"/><text x="105" y="45" fill="#047857">N</text><line x1="430" y1="180" x2="650" y2="55" stroke="#475569" stroke-width="5"/><circle cx="540" cy="117" r="18" fill="#ffe0a3"/><line x1="540" y1="117" x2="540" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#pr)"/><line x1="540" y1="117" x2="625" y2="165" stroke="#7c3aed" stroke-width="3" marker-end="url(#pp)"/><text x="590" y="190" fill="#6d28d9">mg sinθ</text></svg></div></div></section><aside class="side"><div class="card"><h3>实时量</h3><div class="data"><span>t</span><b id="tv"></b><span>A竖直下落</span><b id="hA"></b><span>B竖直下落</span><b id="hB"></b><span>vA</span><b id="va"></b><span>vB</span><b id="vb"></b></div></div><div class="card"><div class="box">A：vA=√(v₀²+g²t²)。B：vB=v₀+g sinθ·t。对于任一物体，在仅重力做功且下降相同竖直高度 H 时，都满足 v²=v₀²+2gH；这条结论不依赖所走路径。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=1,v0=1,theta=35*Math.PI/180,T=2.2;let u=0,run=false,speed=1,last=performance.now();function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){const t=u*T,sn=Math.sin(theta),cs=Math.cos(theta),xA=v0*t,hA=.5*g*t*t,vyA=g*t,vA=Math.hypot(v0,vyA),sB=v0*t+.5*g*sn*t*t,hB=sB*sn,vB=v0+g*sn*t;const A0={x:90,y:105},AX=A0.x+xA*135,AY=A0.y+hA*115;let pa='';for(let i=0;i<=60;i++){const tt=t*i/60,x=A0.x+v0*tt*135,y=A0.y+.5*g*tt*tt*115;pa+=(i?' L':'M')+x+' '+y}$('pathA').setAttribute('d',pa);$('A').setAttribute('cx',AX);$('A').setAttribute('cy',AY);const view=+$('view').value*Math.PI/180,skew=85*Math.sin(view),B0={x:610,y:105},len=430,ex=B0.x+len*cs+skew,ey=B0.y+len*sn;$('plane').innerHTML=`<polygon points="${B0.x},${B0.y} ${ex},${ey} ${ex+80},${ey+42} ${B0.x+80},${B0.y+42}" fill="#fff1cf" stroke="#b98d45" stroke-width="2.5"/><line x1="${B0.x}" y1="${B0.y}" x2="${ex}" y2="${ey}" stroke="#475569" stroke-width="5"/>`;const travel=sB*105,BX=B0.x+travel*cs+skew*(travel/len),BY=B0.y+travel*sn;$('B').setAttribute('cx',BX);$('B').setAttribute('cy',BY);const k=58;ln('GA',AX,AY,AX,AY+k);ln('vA',AX,AY,AX+70*v0/vA,AY+70*vyA/vA);ln('GB',BX,BY,BX,BY+k);ln('NB',BX,BY,BX-k*sn,BY-k*cs);ln('vB',BX,BY,BX+75*cs,BY+75*sn);$('labels').innerHTML=`<text x="${AX+8}" y="${AY+k-5}" fill="#b91c1c">G</text><text x="${AX+45}" y="${AY-8}" fill="#1d4ed8">vA</text><text x="${BX+8}" y="${BY+k-5}" fill="#b91c1c">G</text><text x="${BX-k*sn-24}" y="${BY-k*cs-5}" fill="#047857">N</text><text x="${BX+48}" y="${BY+25}" fill="#1d4ed8">vB</text>`;$('viewV').textContent=(view*180/Math.PI).toFixed(0)+'°';$('tv').textContent=t.toFixed(2);$('hA').textContent=hA.toFixed(2);$('hB').textContent=hB.toFixed(2);$('va').textContent=vA.toFixed(3);$('vb').textContent=vB.toFixed(3);$('vaNum').textContent=vA.toFixed(3);$('vbNum').textContent=vB.toFixed(3);const vmax=3;$('barA').style.width=Math.min(100,vA/vmax*100)+'%';$('barB').style.width=Math.min(100,vB/vmax*100)+'%';$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('view').value=45;draw()};$('progress').oninput=e=>{run=false;u=+e.target.value;draw()};$('view').oninput=draw;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});$('toggleForce').onclick=()=>{const p=$('forcePanel'),hide=p.classList.toggle('collapsed');$('toggleForce').textContent=hide?'展开':'收起'};function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){u+=dt*speed/T;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
