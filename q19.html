<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第19题｜平抛与光滑斜面·透视修正版</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--p:#7c3aed;--g:#059669}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1450px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:#fff;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.desc{margin:9px 4px 12px;color:#526579;line-height:1.65}.layout{display:grid;grid-template-columns:1.7fr .9fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:10px 0}.panel-title{font-size:16px;font-weight:800;margin-bottom:8px}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.note{background:#fff8e8}.answer{background:#ecfdf5}.speedbar{height:14px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:4px}.fillA,.fillB{height:100%;border-radius:999px}.fillA{background:#2563eb}.fillB{background:#d97706}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}.viewbox{display:flex;align-items:center;gap:10px;min-width:310px}.viewbox input{width:180px}@media(max-width:980px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第19题｜同一高点出发：平抛 vs 光滑斜面内运动</div><div class="desc">修正重点：A、B从<strong>同一视觉高度</strong>开始，之后都由高处向低处运动。观察角度只改变斜面的横向透视，不允许把运动方向翻转。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1060 600"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1060" height="600" rx="12" fill="#fbfdff"/><line x1="55" y1="105" x2="1010" y2="105" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 7"/><text x="430" y="92" fill="#64748b" font-size="13">共同初始高度</text><text x="38" y="38" font-size="18" font-weight="800">A：竖直平面内平抛</text><path d="M85 105 Q250 135 400 445" fill="none" stroke="#93b9ea" stroke-width="2.4" stroke-dasharray="7 6"/><circle id="A" r="15" fill="#b9d7ff" stroke="#245a91" stroke-width="2.5"/><line id="GA" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><text id="GAt" class="badge" fill="#991b1b">G</text><line id="vA" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mb)"/><text id="vAt" class="badge" fill="#1d4ed8">速度 vA</text><text x="500" y="38" font-size="18" font-weight="800">B：光滑斜面内运动（透视）</text><g id="plane"><polygon id="face" fill="#fff1cf" stroke="#b98d45" stroke-width="2.5"/><polygon id="side" fill="#ead6aa" stroke="#b98d45" stroke-width="2"/><polygon id="bottom" fill="#e6c98f" stroke="#b98d45" stroke-width="2"/><g id="grid" stroke="#d9ba78" stroke-width="1.4" opacity=".9"></g><line id="frontEdge" stroke="#3f4f63" stroke-width="7"/><line id="farEdge" stroke="#6b7280" stroke-width="4"/><path id="pathB" fill="none" stroke="#e59b32" stroke-width="3" stroke-dasharray="7 6"/></g><circle id="Bshadow" r="17" fill="#000" opacity=".10"/><circle id="B" r="15" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line id="GB" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><text id="GBt" class="badge" fill="#991b1b">G</text><line id="NB" stroke="#d97706" stroke-width="3" marker-end="url(#mo)"/><text id="NBt" class="badge" fill="#9a6200">N</text><line id="vB" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mb)"/><text id="vBt" class="badge" fill="#1d4ed8">速度 vB</text><text x="690" y="555" fill="#64748b" font-size="13">两物体均从高处向低处运动；透视不改变物理上下关系</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="prev" class="btn">◀ 单步</button><button id="next" class="btn">单步 ▶</button><label class="viewbox">观察角度：<b id="viewV">45°</b><input id="view" type="range" min="15" max="70" step="1" value="45"></label></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section><section class="card" style="margin-top:10px"><div class="panel-title">速度大小对比（同一时刻）</div><div>A：<b id="vaNum">1.00 v₀</b><div class="speedbar"><div id="vaBar" class="fillA" style="width:28%"></div></div></div><div style="margin-top:10px">B：<b id="vbNum">1.00 v₀</b><div class="speedbar"><div id="vbBar" class="fillB" style="width:28%"></div></div></div><div id="speedNote" class="box note">开始时 vA=vB=v₀。</div></section></div><aside><section class="card"><div class="panel-title">B物体｜实际受力与重力分解</div><svg viewBox="0 0 420 360" style="width:100%"><defs><marker id="fr2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="fo2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="fv2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="fg2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker></defs><text x="16" y="28" font-weight="800">① 实际受力</text><line x1="35" y1="150" x2="190" y2="62" stroke="#4b5563" stroke-width="5"/><circle cx="120" cy="102" r="18" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line x1="120" y1="102" x2="120" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#fr2)"/><text x="130" y="197" fill="#991b1b" font-weight="700">G</text><line x1="120" y1="102" x2="61" y2="0" stroke="#d97706" stroke-width="3" marker-end="url(#fo2)"/><text x="24" y="54" fill="#9a6200" font-weight="700">N</text><text x="215" y="28" font-weight="800">② 分解重力 G</text><line x1="230" y1="150" x2="390" y2="60" stroke="#4b5563" stroke-width="5"/><circle cx="310" cy="105" r="18" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line x1="310" y1="105" x2="310" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#fr2)"/><text x="320" y="212" fill="#991b1b" font-weight="700">G</text><line x1="310" y1="105" x2="397" y2="154" stroke="#7c3aed" stroke-width="3" marker-end="url(#fv2)"/><text x="343" y="178" fill="#6d28d9" font-weight="700">G∥</text><line x1="310" y1="105" x2="252" y2="3" stroke="#059669" stroke-width="3" marker-end="url(#fg2)"/><text x="228" y="48" fill="#047857" font-weight="700">G⊥</text><line x1="310" y1="220" x2="397" y2="154" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="310" y1="220" x2="252" y2="3" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/><text x="16" y="285" fill="#d97706">N = mg cosθ</text><text x="16" y="312" fill="#64748b">N 与 G⊥ 等大反向</text><text x="218" y="285" fill="#7c3aed">G∥ = mg sinθ</text><text x="218" y="312" fill="#059669">G⊥ = mg cosθ</text></svg><div class="box theory">观察角度改变时，只允许改变横向透视。A、B的初始高度和“向下运动”这一物理事实不能改变。</div><div class="data"><span>N/mg</span><b id="nNum">—</b><span>G∥/mg</span><b id="paraNum">—</b><span>G⊥/mg</span><b id="normNum">—</b></div></section><section class="card" style="margin-top:10px"><div class="panel-title">物理结论</div><div class="box answer">同一时刻A速度增长更快；相同竖直落差H时，两者末速率相同：v²=v₀²+2gH。</div></section></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const th=35*Math.PI/180,s=Math.sin(th),c=Math.cos(th),tA=s,v0=1;function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function P(u,v){const a=+q('view').value*Math.PI/180,depth=165*Math.sin(a),O={x:510,y:470},eu={x:320,y:0},ev={x:depth,y:-365};return{x:O.x+u*eu.x+v*ev.x,y:O.y+u*eu.y+v*ev.y}}function plane(){const p00=P(0,0),p10=P(1,0),p01=P(0,1),p11=P(1,1),d={x:24,y:22};q('face').setAttribute('points',`${p00.x},${p00.y} ${p10.x},${p10.y} ${p11.x},${p11.y} ${p01.x},${p01.y}`);q('side').setAttribute('points',`${p10.x},${p10.y} ${p11.x},${p11.y} ${p11.x+d.x},${p11.y+d.y} ${p10.x+d.x},${p10.y+d.y}`);q('bottom').setAttribute('points',`${p00.x},${p00.y} ${p10.x},${p10.y} ${p10.x+d.x},${p10.y+d.y} ${p00.x+d.x},${p00.y+d.y}`);line('frontEdge',p00.x,p00.y,p01.x,p01.y);line('farEdge',p10.x,p10.y,p11.x,p11.y);let g='';for(let i=1;i<4;i++){let a=P(i/4,0),b=P(i/4,1);g+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}for(let j=1;j<4;j++){let a=P(0,j/4),b=P(1,j/4);g+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}q('grid').innerHTML=g;let dPath='';for(let i=0;i<=30;i++){let t=i/30,u=.08+.72*t,v=1-.86*t*t,z=P(u,v);dPath+=(i?' L':'M')+z.x+' '+z.y}q('pathB').setAttribute('d',dPath);q('viewV').textContent=q('view').value+'°'}function draw(){p=Math.max(0,Math.min(1,p));plane();const ua=Math.min(1,p/tA),ax=85+313*ua,ay=105+335*ua*ua;q('A').setAttribute('cx',ax);q('A').setAttribute('cy',ay);line('GA',ax,ay,ax,ay+54);q('GAt').setAttribute('x',ax+8);q('GAt').setAttribute('y',ay+47);const tt=2.2*p,vyA=tt,vDown=s*tt,vA=Math.sqrt(v0*v0+vyA*vyA),vB=Math.sqrt(v0*v0+vDown*vDown);line('vA',ax,ay,ax+42*v0,ay+42*vyA);q('vAt').setAttribute('x',ax+50);q('vAt').setAttribute('y',ay+42*vyA-8);const u=.08+.72*p,v=1-.86*p*p,b=P(u,v),bx=b.x,by=b.y;q('B').setAttribute('cx',bx);q('B').setAttribute('cy',by);q('Bshadow').setAttribute('cx',bx+9);q('Bshadow').setAttribute('cy',by+10);line('GB',bx,by,bx,by+54);q('GBt').setAttribute('x',bx+8);q('GBt').setAttribute('y',by+47);const nx=-s,ny=-c,nL=54*c;line('NB',bx,by,bx+nx*nL,by+ny*nL);q('NBt').setAttribute('x',bx+nx*nL-20);q('NBt').setAttribute('y',by+ny*nL-6);let pn=Math.min(1,p+.025),b2=P(.08+.72*pn,1-.86*pn*pn),dx=b2.x-bx,dy=b2.y-by,n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;line('vB',bx,by,bx+58*dx,by+58*dy);q('vBt').setAttribute('x',bx+64*dx+8);q('vBt').setAttribute('y',by+64*dy-8);q('vaNum').textContent=vA.toFixed(2)+' v₀';q('vbNum').textContent=vB.toFixed(2)+' v₀';q('vaBar').style.width=Math.min(100,24+28*vA)+'%';q('vbBar').style.width=Math.min(100,24+28*vB)+'%';q('speedNote').innerHTML=p<.01?'开始时：<b>A、B同高，vA=vB=v₀</b>。':'两者都在下降；同一时刻 <b>vA &gt; vB</b>。';q('nNum').textContent=c.toFixed(3);q('paraNum').textContent=s.toFixed(3);q('normNum').textContent=c.toFixed(3);q('t').value=p}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;q('view').value=45;draw()};q('prev').onclick=()=>{run=false;p-=.025;draw()};q('next').onclick=()=>{run=false;p+=.025;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};q('view').oninput=()=>draw();function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.16;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
