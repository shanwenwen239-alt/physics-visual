<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第19题｜平抛与斜面运动</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--g:#059669;--v:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:white;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.75fr .8fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第19题｜平抛与光滑斜面内运动</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 920 520"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker></defs><rect width="920" height="520" rx="12" fill="#fbfdff"/><text x="55" y="40" font-size="18" font-weight="800">A：平抛</text><path d="M80 90 Q250 120 390 430" fill="none" stroke="#93b9ea" stroke-width="2.4" stroke-dasharray="7 6"/><circle id="A" r="15" fill="#b9d7ff" stroke="#245a91" stroke-width="2.5"/><line id="mgA" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)" stroke-linecap="round"/><text id="mgAt" fill="#991b1b" font-size="15" font-weight="700">G</text><text x="510" y="40" font-size="18" font-weight="800">B：光滑斜面内运动</text><polygon points="500,80 860,80 795,435 500,435" fill="#fff7e8" stroke="#b08955" stroke-width="2"/><path d="M525 110 Q690 145 775 410" fill="none" stroke="#efb45d" stroke-width="2.4" stroke-dasharray="7 6"/><circle id="B" r="15" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line id="mgB" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)" stroke-linecap="round"/><line id="NB" stroke="#d97706" stroke-width="3" marker-end="url(#mo)" stroke-linecap="round"/><text id="mgBt" fill="#991b1b" font-size="15" font-weight="700">G</text><text id="NBt" fill="#9a6200" font-size="15" font-weight="700">N</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="prev" class="btn">◀ 单步</button><button id="next" class="btn">单步 ▶</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside class="card"><h3>实时物理核查</h3><div class="data"><span>A：重力 G</span><b style="color:#dc2626">mg，恒定</b><span>B：重力 G</span><b style="color:#dc2626">mg，恒定</b><span>B：支持力 N</span><b style="color:#d97706">mg cosθ，恒定</b><span>B：斜面内合力</span><b style="color:#7c3aed">mg sinθ</b><span>A进程</span><b id="pa">0%</b><span>B进程</span><b id="pb">0%</b></div><div class="box note"><b>矢量规则：</b>G从物体重心附近竖直向下；N从接触物体中心附近沿斜面法线方向。箭头采用细线、小箭头尖，不使用流程图式大箭头。</div><div class="box theory"><b>物理模型：</b>A只受重力。B受重力与支持力，斜面光滑无摩擦；支持力抵消重力垂直斜面的分量，斜面内加速度大小为g sinθ。</div><div class="box answer"><b>结论：</b>同一竖直落差下，A、B末速率相同；时间与末速度方向不同。原题正确项D。</div></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const th=35*Math.PI/180,tA=Math.sin(th);function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){p=Math.max(0,Math.min(1,p));const ua=Math.min(1,p/tA),ub=p,ax=80+310*ua,ay=90+340*ua*ua,bx=525+250*ub,by=110+300*ub*ub;q('A').setAttribute('cx',ax);q('A').setAttribute('cy',ay);q('B').setAttribute('cx',bx);q('B').setAttribute('cy',by);line('mgA',ax,ay,ax,ay+52);q('mgAt').setAttribute('x',ax+7);q('mgAt').setAttribute('y',ay+46);line('mgB',bx,by,bx,by+52);q('mgBt').setAttribute('x',bx+7);q('mgBt').setAttribute('y',by+46);const nx=-Math.sin(th),ny=-Math.cos(th),L=52*Math.cos(th);line('NB',bx,by,bx+nx*L,by+ny*L);q('NBt').setAttribute('x',bx+nx*L-18);q('NBt').setAttribute('y',by+ny*L-7);q('pa').textContent=Math.round(ua*100)+'%';q('pb').textContent=Math.round(ub*100)+'%';q('t').value=p}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;draw()};q('prev').onclick=()=>{run=false;p-=.025;draw()};q('next').onclick=()=>{run=false;p+=.025;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.15;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
