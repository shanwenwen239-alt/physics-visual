<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第19题｜平抛与斜面运动比较</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e3e8ef;--blue:#2563eb;--orange:#f59e0b;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.back{text-decoration:none;color:#64748b}.title{font-size:26px;font-weight:750;margin:6px 0 3px}.sub{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px rgba(15,23,42,.07)}.stage{padding:16px}.side{padding:18px}.scene{width:100%;display:block;border-radius:18px;background:linear-gradient(#fff,#f8fafc)}.timeline{width:100%;margin:14px 0 3px}.controls{display:flex;flex-wrap:wrap;gap:8px}.btn,.chip{border:1px solid #d8dee9;background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;cursor:pointer}.btn.primary{background:#111827;color:white;border-color:#111827}.chip.on{background:#111827;color:#fff;border-color:#111827}.section{padding:14px 0;border-top:1px solid #edf1f5}.section:first-child{border-top:0;padding-top:0}.label{font-size:12px;color:var(--muted)}.big{font-size:24px;font-weight:750}.hint{font-size:13px;line-height:1.7;color:#475569}.metric{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric div{background:#f8fafc;border:1px solid #edf1f5;border-radius:12px;padding:10px;font-size:13px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.status{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;font-size:12px}.note{font-size:12px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:9px 10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.wrap{padding:14px}}</style><link rel="stylesheet" href="theme.css"></head><body><main class="wrap"><div class="top"><div><a class="back" href="index.html">← 返回题库</a><div class="title">第19题｜平抛与斜面运动比较</div><div class="sub">同一点 O、相同水平初速度 v₀，A 做平抛，B 沿光滑斜面运动。</div></div><div class="status" id="status">已暂停 · t = 0.00</div></div><div class="grid"><section class="card stage"><svg id="scene" class="scene" viewBox="0 0 780 500"><defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><circle cx="110" cy="80" r="7" fill="#111827"/><text x="84" y="63" font-size="18">O</text><line x1="110" y1="80" x2="680" y2="80" stroke="#cbd5e1" stroke-width="2"/><line x1="110" y1="80" x2="560" y2="380" stroke="#334155" stroke-width="5"/><line x1="80" y1="380" x2="690" y2="380" stroke="#cbd5e1" stroke-width="2"/><path id="pathA" d="M110 80 Q300 105 445 380" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 6"/><path id="pathB" d="M110 80 L560 380" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6"/><circle id="A" cx="110" cy="80" r="13" fill="#2563eb"/><circle id="B" cx="110" cy="80" r="13" fill="#f59e0b"/><text id="labelA" x="125" y="75" fill="#2563eb" font-size="15">A</text><text id="labelB" x="125" y="100" fill="#f59e0b" font-size="15">B</text><g id="velA"><line id="vAx" x1="0" y1="0" x2="0" y2="0" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/><line id="vAy" x1="0" y1="0" x2="0" y2="0" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/></g><g id="velB"><line id="vB" x1="0" y1="0" x2="0" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrO)"/></g><text x="430" y="407" font-size="16">P₁</text><text x="560" y="407" font-size="16">P₂</text></svg><input id="timeline" class="timeline" type="range" min="0" max="1" step="0.001" value="0"><div class="controls"><button class="btn primary" id="play">播放</button><button class="btn" id="back">← 单步</button><button class="btn" id="next">单步 →</button><button class="btn" id="speed">速度 1×</button><button class="btn" id="reset">重置</button></div><div class="controls" style="margin-top:10px"><button class="chip on" data-p="0">出发</button><button class="chip" data-p="0.25">1/4</button><button class="chip" data-p="0.5">1/2</button><button class="chip" data-p="0.75">3/4</button><button class="chip" data-p="1">落地</button></div></section><aside class="card side"><div class="section"><div class="label">同步观察</div><div class="legend"><span><span class="dot" style="background:var(--blue)"></span>A：平抛</span><span><span class="dot" style="background:var(--orange)"></span>B：沿斜面</span></div></div><div class="section"><div class="label">当前进度</div><div class="big" id="progress">0%</div><p class="hint" id="hint">两物体同时从 O 点以相同水平初速度出发。</p></div><div class="section"><div class="label">可视化比较</div><div class="metric"><div>A 水平位移<br><b id="Ax">0</b></div><div>B 水平位移<br><b id="Bx">0</b></div><div>A 竖直下降<br><b id="Ay">0</b></div><div>B 竖直下降<br><b id="By">0</b></div></div></div><div class="section"><label><input id="showV" type="checkbox" checked> 显示速度分量/方向</label></div><div class="note">本页用于比较运动学特征。由于题目原图未给出斜面具体角度和数值参数，采用与原图一致的示意几何关系，重点展示“同初速度、不同约束条件下的运动差异”。</div></aside></div></main><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now(),speed=1;const speeds=[1,.5,.25];let si=0;function render(){p=Math.max(0,Math.min(1,p));const Ax=330*p,Ay=300*p*p,Bx=450*p,By=300*p;const ax=110+Ax,ay=80+Ay,bx=110+Bx,by=80+By;q('A').setAttribute('cx',ax);q('A').setAttribute('cy',ay);q('B').setAttribute('cx',bx);q('B').setAttribute('cy',by);q('labelA').setAttribute('x',ax+15);q('labelA').setAttribute('y',ay-6);q('labelB').setAttribute('x',bx+15);q('labelB').setAttribute('y',by+18);const vis=q('showV').checked?'':'none';q('velA').style.display=vis;q('velB').style.display=vis;q('vAx').setAttribute('x1',ax);q('vAx').setAttribute('y1',ay);q('vAx').setAttribute('x2',ax+55);q('vAx').setAttribute('y2',ay);q('vAy').setAttribute('x1',ax);q('vAy').setAttribute('y1',ay);q('vAy').setAttribute('x2',ax);q('vAy').setAttribute('y2',ay+20+65*p);q('vB').setAttribute('x1',bx);q('vB').setAttribute('y1',by);q('vB').setAttribute('x2',bx+48);q('vB').setAttribute('y2',by+32);q('timeline').value=p;q('progress').textContent=Math.round(p*100)+'%';q('Ax').textContent=Ax.toFixed(0);q('Bx').textContent=Bx.toFixed(0);q('Ay').textContent=Ay.toFixed(0);q('By').textContent=By.toFixed(0);q('status').textContent=(run?'播放中':'已暂停')+' · t = '+p.toFixed(2);q('play').textContent=run?'暂停':'播放';q('hint').textContent=p<.25?'刚出发：A 只有重力使竖直速度逐渐增大；B 受斜面约束沿直线。':p<.75?'中段：相同时间内，两物体的水平位移和下降规律已经明显不同。':'接近落地：暂停比较运动时间、末速度方向、动量和动能。';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',Math.abs(+c.dataset.p-p)<.01))}q('play').onclick=()=>{if(p>=1)p=0;run=!run;render()};q('reset').onclick=()=>{p=0;run=false;render()};q('back').onclick=()=>{p-=.02;run=false;render()};q('next').onclick=()=>{p+=.02;run=false;render()};q('speed').onclick=()=>{si=(si+1)%speeds.length;speed=speeds[si];q('speed').textContent='速度 '+speed+'×'};q('timeline').oninput=e=>{p=+e.target.value;run=false;render()};q('showV').onchange=render;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{p=+c.dataset.p;run=false;render()});function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.2*speed;if(p>=1){p=1;run=false}render()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
