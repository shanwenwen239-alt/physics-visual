<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第19题｜平抛与光滑斜面·透视版</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--v:#7c3aed;--g:#059669}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1420px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:#fff;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.desc{margin:9px 4px 12px;color:#526579}.layout{display:grid;grid-template-columns:1.65fr .95fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.panel-title{font-size:16px;font-weight:800;margin-bottom:8px}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.note{background:#fff8e8}.answer{background:#ecfdf5}.speedbar{height:14px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:4px}.fillA,.fillB{height:100%;border-radius:999px}.fillA{background:#2563eb}.fillB{background:#d97706}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}@media(max-width:980px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第19题｜平抛 vs 光滑斜面内运动（透视版）</div><div class="desc">B侧改成透视斜面：用前后边、网格和厚度表达“这是一个面”，同时保留主动画受力、右侧重力分解和下方速度对比。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1040 570"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1040" height="570" rx="12" fill="#fbfdff"/><text x="40" y="38" font-size="18" font-weight="800">A：竖直平面内平抛</text><line x1="70" y1="455" x2="425" y2="455" stroke="#c3ccd6" stroke-width="2"/><path d="M85 95 Q250 125 398 430" fill="none" stroke="#93b9ea" stroke-width="2.4" stroke-dasharray="7 6"/><circle id="A" r="15" fill="#b9d7ff" stroke="#245a91" stroke-width="2.5"/><line id="GA" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><text id="GAt" class="badge" fill="#991b1b">G</text><line id="vA" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mb)"/><text id="vAt" class="badge" fill="#1d4ed8">速度 vA</text><text x="500" y="38" font-size="18" font-weight="800">B：光滑斜面内运动（透视）</text><polygon points="560,130 890,90 820,430 490,470" fill="#fff1cf" stroke="#b98d45" stroke-width="2.5"/><polygon points="820,430 890,90 915,112 845,452" fill="#ead6aa" stroke="#b98d45" stroke-width="2"/><polygon points="490,470 820,430 845,452 515,492" fill="#e6c98f" stroke="#b98d45" stroke-width="2"/><line x1="560" y1="130" x2="490" y2="470" stroke="#3f4f63" stroke-width="7" stroke-linecap="round"/><line x1="890" y1="90" x2="820" y2="430" stroke="#6b7280" stroke-width="4"/><g stroke="#d9ba78" stroke-width="1.5" opacity=".9"><line x1="642" y1="120" x2="572" y2="460"/><line x1="724" y1="110" x2="654" y2="450"/><line x1="806" y1="100" x2="736" y2="440"/><line x1="542" y1="214" x2="872" y2="174"/><line x1="525" y1="298" x2="855" y2="258"/><line x1="507" y1="382" x2="837" y2="342"/></g><text x="505" y="320" transform="rotate(-78 505 320)" fill="#334155" font-size="16" font-weight="900">光滑斜面</text><path d="M575 150 Q740 180 810 410" fill="none" stroke="#e59b32" stroke-width="3" stroke-dasharray="7 6"/><circle id="Bshadow" r="17" fill="#000" opacity=".10"/><circle id="B" r="15" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line id="GB" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><text id="GBt" class="badge" fill="#991b1b">G</text><line id="NB" stroke="#d97706" stroke-width="3" marker-end="url(#mo)"/><text id="NBt" class="badge" fill="#9a6200">N</text><line id="vB" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mb)"/><text id="vBt" class="badge" fill="#1d4ed8">速度 vB</text><text x="730" y="515" fill="#64748b" font-size="13">网格与厚度只用于透视表达，不改变物理计算</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="prev" class="btn">◀ 单步</button><button id="next" class="btn">单步 ▶</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section><section class="card" style="margin-top:10px"><div class="panel-title">速度大小对比（同一时刻）</div><div>A：<b id="vaNum">1.00 v₀</b><div class="speedbar"><div id="vaBar" class="fillA" style="width:28%"></div></div></div><div style="margin-top:10px">B：<b id="vbNum">1.00 v₀</b><div class="speedbar"><div id="vbBar" class="fillB" style="width:28%"></div></div></div><div id="speedNote" class="box note">开始时 vA=vB=v₀。</div></section></div><aside><section class="card"><div class="panel-title">B物体｜实际受力与重力分解</div><svg viewBox="0 0 420 360" style="width:100%"><defs><marker id="fr2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="fo2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="fv2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="fg2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker></defs><text x="16" y="28" font-weight="800">① 实际受力</text><line x1="35" y1="150" x2="190" y2="62" stroke="#4b5563" stroke-width="5"/><circle cx="120" cy="102" r="18" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line x1="120" y1="102" x2="120" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#fr2)"/><text x="130" y="197" fill="#991b1b" font-weight="700">G</text><line x1="120" y1="102" x2="61" y2="0" stroke="#d97706" stroke-width="3" marker-end="url(#fo2)"/><text x="24" y="54" fill="#9a6200" font-weight="700">N</text><text x="215" y="28" font-weight="800">② 分解重力 G</text><line x1="230" y1="150" x2="390" y2="60" stroke="#4b5563" stroke-width="5"/><circle cx="310" cy="105" r="18" fill="#ffe0a3" stroke="#a86400" stroke-width="2.5"/><line x1="310" y1="105" x2="310" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#fr2)"/><text x="320" y="212" fill="#991b1b" font-weight="700">G</text><line x1="310" y1="105" x2="397" y2="154" stroke="#7c3aed" stroke-width="3" marker-end="url(#fv2)"/><text x="343" y="178" fill="#6d28d9" font-weight="700">G∥</text><line x1="310" y1="105" x2="252" y2="3" stroke="#059669" stroke-width="3" marker-end="url(#fg2)"/><text x="228" y="48" fill="#047857" font-weight="700">G⊥</text><line x1="310" y1="220" x2="397" y2="154" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="310" y1="220" x2="252" y2="3" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/><text x="16" y="285" fill="#d97706">N = mg cosθ</text><text x="16" y="312" fill="#64748b">N 与 G⊥ 等大反向</text><text x="218" y="285" fill="#7c3aed">G∥ = mg sinθ</text><text x="218" y="312" fill="#059669">G⊥ = mg cosθ</text></svg><div class="box theory">透视只改变“怎么看”，不改变物理：B仍在斜面内做二维运动；实际受力只有G和N，斜面内加速度来自G∥。</div><div class="data"><span>N/mg</span><b id="nNum">—</b><span>G∥/mg</span><b id="paraNum">—</b><span>G⊥/mg</span><b id="normNum">—</b></div></section><section class="card" style="margin-top:10px"><div class="panel-title">物理结论</div><div class="box answer">同一时刻A速度增长更快；相同竖直落差H时，两者末速率相同：v²=v₀²+2gH。</div></section></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const th=35*Math.PI/180,s=Math.sin(th),c=Math.cos(th),tA=s,v0=1;function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){p=Math.max(0,Math.min(1,p));const ua=Math.min(1,p/tA),ub=p,ax=85+313*ua,ay=95+335*ua*ua,bx=575+235*ub,by=150+260*ub*ub;q('A').setAttribute('cx',ax);q('A').setAttribute('cy',ay);q('B').setAttribute('cx',bx);q('B').setAttribute('cy',by);q('Bshadow').setAttribute('cx',bx+8);q('Bshadow').setAttribute('cy',by+10);line('GA',ax,ay,ax,ay+54);q('GAt').setAttribute('x',ax+8);q('GAt').setAttribute('y',ay+47);const nx=-s,ny=-c,nL=54*c;line('GB',bx,by,bx,by+54);q('GBt').setAttribute('x',bx+8);q('GBt').setAttribute('y',by+47);line('NB',bx,by,bx+nx*nL,by+ny*nL);q('NBt').setAttribute('x',bx+nx*nL-20);q('NBt').setAttribute('y',by+ny*nL-6);const tt=2.2*p,vyA=tt,vDown=s*tt,vA=Math.sqrt(v0*v0+vyA*vyA),vB=Math.sqrt(v0*v0+vDown*vDown);line('vA',ax,ay,ax+42*v0,ay+42*vyA);q('vAt').setAttribute('x',ax+50);q('vAt').setAttribute('y',ay+42*vyA-8);line('vB',bx,by,bx+42*v0,by+42*vDown);q('vBt').setAttribute('x',bx+50);q('vBt').setAttribute('y',by+42*vDown-8);q('vaNum').textContent=vA.toFixed(2)+' v₀';q('vbNum').textContent=vB.toFixed(2)+' v₀';q('vaBar').style.width=Math.min(100,24+28*vA)+'%';q('vbBar').style.width=Math.min(100,24+28*vB)+'%';q('speedNote').innerHTML=p<.01?'开始时 <b>vA=vB=v₀</b>。':'同一时刻：<b>vA &gt; vB</b>。';q('nNum').textContent=c.toFixed(3);q('paraNum').textContent=s.toFixed(3);q('normNum').textContent=c.toFixed(3);q('t').value=p}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;draw()};q('prev').onclick=()=>{run=false;p-=.025;draw()};q('next').onclick=()=>{run=false;p+=.025;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.16;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
