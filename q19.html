<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第19题 动态演示</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:#f4f7fb;color:#172033;margin:0}.w{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 10px 30px #0f172a0d}.grid{display:grid;grid-template-columns:1fr 260px;gap:16px}svg{width:100%;background:linear-gradient(#fff,#f1f5f9);border-radius:16px}.btn{padding:10px 14px;border:1px solid #d7dde7;border-radius:11px;background:#fff;margin:8px 6px 0 0}.primary{background:#111827;color:#fff}input[type=range]{width:100%}.muted{color:#64748b}.big{font-size:22px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><p><a href="index.html">← 返回题库</a></p><h1>第19题｜平抛与斜面运动比较</h1><p class="muted">两个质点从 O 点以相同水平初速度同时出发。</p><div class="grid"><section class="card"><svg viewBox="0 0 700 430"><circle cx="100" cy="70" r="6" fill="#111827"/><text x="80" y="55">O</text><line x1="100" y1="70" x2="630" y2="70" stroke="#94a3b8"/><line x1="100" y1="70" x2="520" y2="350" stroke="#334155" stroke-width="4"/><line x1="80" y1="350" x2="650" y2="350" stroke="#94a3b8"/><path d="M100 70 Q300 105 420 350" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="7 6"/><circle id="A" cx="100" cy="70" r="12" fill="#3b82f6"/><circle id="B" cx="100" cy="70" r="12" fill="#f59e0b"/><text x="405" y="375">P₁</text><text x="520" y="375">P₂</text></svg><input id="t" type="range" min="0" max="1000" value="0"><div><button class="btn primary" id="play">播放</button><button class="btn" id="reset">重置</button><button class="btn" id="mid">中间时刻</button></div></section><aside class="card"><div class="big">同步比较</div><p class="muted">蓝色 A：竖直平面内平抛</p><p class="muted">橙色 B：沿光滑斜面</p><hr><p id="hint">同时从 O 点出发。</p><p class="muted">可暂停比较运动时间、x 方向位移、落地动量和动能。</p></aside></div></main><script>let p=0,run=false,last=performance.now();const q=x=>document.getElementById(x);function draw(){let ax=100+320*p,ay=70+280*p*p,bx=100+420*p,by=70+280*p;q('A').setAttribute('cx',ax);q('A').setAttribute('cy',Math.min(350,ay));q('B').setAttribute('cx',bx);q('B').setAttribute('cy',Math.min(350,by));q('t').value=p*1000;q('play').textContent=run?'暂停':'播放';q('hint').textContent=p<.4?'初段：注意两种运动的加速度方向不同。':p<.85?'中段：比较相同时间内的水平位移与竖直下降量。':'接近落地：暂停比较末速度、动量与动能。'}q('play').onclick=()=>run=!run;q('reset').onclick=()=>{p=0;run=false;draw()};q('mid').onclick=()=>{p=.5;run=false;draw()};q('t').oninput=e=>{p=e.target.value/1000;run=false;draw()};function loop(n){let d=Math.min(.04,(n-last)/1000);last=n;if(run){p+=d*.16;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)</script></body></html>
