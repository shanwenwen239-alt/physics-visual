<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第7题｜弹簧耦合·连续视图</title><style>:root{--ink:#10233f;--muted:#65758a;--line:#d8e3ef;--blue:#1f6feb;--red:#e14c4c;--gold:#d28b16;--green:#16935f}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;font-family:system-ui,'PingFang SC','Microsoft YaHei';color:var(--ink)}.w{max-width:1450px;margin:auto;padding:18px}.title{font-size:30px;font-weight:900;color:#12376b;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.desc{padding:13px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:16px;align-items:start}.card{padding:12px}.main{padding:0;overflow:hidden}.visual{padding:10px 12px 4px}.chartWrap{padding:0 12px 10px;margin-top:-12px}.scene,.chart{width:100%;display:block}.side{position:sticky;top:12px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cbd8e7;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary,.active{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.params{display:grid;gap:14px}.params input,.progress{width:100%}.value{color:var(--blue)}.data{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}.box{margin-top:11px;border-radius:11px;padding:11px;line-height:1.65;font-size:13px}.theory{background:#eef6ff}.ok{background:#ecfdf5}.note{background:#fff8e8}.badge{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:0 20px 2px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static}}</style></head><body><main class="w"><div class="title">第7题｜两物块—轻质弹簧耦合运动</div><div class="desc">光滑水平面向左右无限延展。主运动画面与下方 v-t 图组成一个连续观察区，中间不插入按钮或独立卡片；播放与参数控制全部放到右侧。</div><div class="layout"><div><section class="card main"><div class="visual"><svg id="scene" class="scene" viewBox="0 0 1020 430"><defs><linearGradient id="ra"><stop offset="0" stop-color="#ffd4d4"/><stop offset="1" stop-color="#f47a7a"/></linearGradient><linearGradient id="bb"><stop offset="0" stop-color="#d7eaff"/><stop offset="1" stop-color="#69a7ef"/></linearGradient><marker id="mBlue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1f6feb"/></marker><marker id="mGold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d28b16"/></marker></defs><rect width="1020" height="430" fill="#fbfdff"/><text x="28" y="38" fill="#64748b" font-size="13">∞ 光滑水平面向左右无限延展 ∞</text><g id="groundTicks" stroke="#c5d0dc" stroke-width="2"></g><line x1="0" y1="350" x2="1020" y2="350" stroke="#334155" stroke-width="3"/><path id="spring" fill="none" stroke="#5d6b7d" stroke-width="5" stroke-linejoin="round"/><g id="A"><rect x="-48" y="-62" width="96" height="62" rx="10" fill="url(#ra)" stroke="#a53636" stroke-width="2.5"/><text x="-11" y="-23" font-size="26" font-weight="800">A</text></g><g id="B"><rect x="-58" y="-78" width="116" height="78" rx="10" fill="url(#bb)" stroke="#245a91" stroke-width="2.5"/><text x="-10" y="-31" font-size="26" font-weight="800">B</text></g><text id="speedA" class="badge" fill="#b83232"></text><text id="speedB" class="badge" fill="#245a91"></text><line id="vA" stroke="#1f6feb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#mBlue)"/><line id="vB" stroke="#1f6feb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#mBlue)"/><line id="FsA" stroke="#d28b16" stroke-width="3" marker-end="url(#mGold)"/><line id="FsB" stroke="#d28b16" stroke-width="3" marker-end="url(#mGold)"/><text id="FsAt" class="badge" fill="#9a6200">Fs</text><text id="FsBt" class="badge" fill="#9a6200">Fs</text><line id="cmLine" x1="510" x2="510" y1="80" y2="338" stroke="#16935f" stroke-width="1.7" stroke-dasharray="6 6"/><text x="460" y="72" fill="#117a4f" font-size="13" font-weight="800">质心参考线</text><text id="timeText" x="820" y="40" fill="#12376b" font-size="17" font-weight="800"></text></svg></div><div class="legend"><span><i class="dot" style="background:#e14c4c"></i>A速度</span><span><i class="dot" style="background:#1f6feb"></i>B速度</span><span><i class="dot" style="background:#16935f"></i>质心速度 0.4v₀</span></div><div class="chartWrap"><svg id="chart" class="chart" viewBox="0 0 760 285"><text x="60" y="22" font-size="15" font-weight="800" fill="#10233f">速度—时间图（与上方运动同步）</text><line x1="58" y1="238" x2="730" y2="238" stroke="#64748b"/><line x1="58" y1="32" x2="58" y2="252" stroke="#64748b"/><text x="735" y="244" font-size="12">t/T</text><text x="35" y="25" font-size="12">v/v₀</text><g stroke="#dce5ef"><line x1="58" y1="76" x2="730" y2="76"/><line x1="58" y1="130" x2="730" y2="130"/><line x1="58" y1="184" x2="730" y2="184"/><line x1="226" y1="32" x2="226" y2="238"/><line x1="394" y1="32" x2="394" y2="238"/><line x1="562" y1="32" x2="562" y2="238"/></g><text x="25" y="80" font-size="11">1.0</text><text x="25" y="134" font-size="11">0.5</text><text x="35" y="188" font-size="11">0</text><text x="220" y="256" font-size="11">t₁</text><text x="388" y="256" font-size="11">t₂</text><text x="556" y="256" font-size="11">t₃</text><text x="712" y="256" font-size="11">t₄</text><line id="vcmChart" x1="58" x2="730" stroke="#16935f" stroke-width="2" stroke-dasharray="6 5"/><path id="curveA" fill="none" stroke="#e14c4c" stroke-width="3"/><path id="curveB" fill="none" stroke="#1f6feb" stroke-width="3"/><line id="cursor" y1="32" y2="238" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/><circle id="dotA" r="5" fill="#e14c4c"/><circle id="dotB" r="5" fill="#1f6feb"/></svg></div></section></div><aside class="side"><section class="card"><h3 style="margin:0 0 10px">播放控制</h3><div class="controls"><button id="toggle" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button></div><div class="controls" style="margin-top:9px"><button class="btn speedBtn" data-speed="0.5">0.5×</button><button class="btn speedBtn active" data-speed="1">1×</button><button class="btn speedBtn" data-speed="2">2×</button></div><input id="progress" class="progress" type="range" min="0" max="1" step=".001" value="0" style="margin-top:10px"></section><section class="card" style="margin-top:10px"><h3>参数调整</h3><div class="params"><label>初速度 v₀：<span id="v0v" class="value">1.00</span><input id="v0" type="range" min="0.5" max="1.8" step="0.05" value="1"></label><label>弹簧劲度 k：<span id="kv" class="value">1.00</span><input id="k" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>整体质量比例：<span id="msv" class="value">1.00×</span><input id="ms" type="range" min="0.6" max="1.6" step="0.05" value="1"></label></div><div class="box note">一轮展示 = 1个周期T + 5秒；镜头跟随质心，A、B不会移出画面。</div></section><section class="card" style="margin-top:10px"><h3>实时物理量</h3><div class="data"><span>t</span><b id="tv">0.00 s</b><span>T</span><b id="Tv">—</b><span>vA/v₀</span><b id="va">1.000</b><span>vB/v₀</span><b id="vb">0</b><span>Vcm/v₀</span><b id="vcm">0.400</b><span>弹簧形变 ξ</span><b id="xi">0</b><span>Fs</span><b id="fs">0</b></div><div class="box theory">Vcm=2v₀/5；vA=2v₀/5+3v₀cosωt/5；vB=2v₀/5−2v₀cosωt/5。</div><div class="box ok">无限光滑面：总动量守恒；理想弹簧：总机械能守恒。</div></section></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let time=0,run=false,last=performance.now(),playSpeed=1;const ground=350,px=70;function P(){const s=+$('ms').value;return{v0:+$('v0').value,k:+$('k').value,m1:2*s,m2:3*s}}function fmt(v){return Math.abs(v)<.0005?'0':v.toFixed(3)}function line(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function springPath(x1,x2,y){const n=11,amp=13;let d=`M${x1} ${y}`;for(let i=1;i<n*2;i++){const x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-amp:amp);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function yChart(v){return 184-108*v}function buildChart(){let a='',b='';for(let i=0;i<=180;i++){const ph=2*Math.PI*i/180,c=Math.cos(ph),va=.4+.6*c,vb=.4-.4*c,x=58+672*i/180;a+=(i?' L':'M')+x+' '+yChart(va);b+=(i?' L':'M')+x+' '+yChart(vb)}$('curveA').setAttribute('d',a);$('curveB').setAttribute('d',b);line('vcmChart',58,yChart(.4),730,yChart(.4))}function drawGround(camera){const spacing=.55,offset=((camera%spacing)+spacing)%spacing,screen=510-offset*px;let s='';for(let x=screen-120;x<1140;x+=spacing*px)s+=`<line x1="${x}" y1="350" x2="${x-20}" y2="370"/>`;$('groundTicks').innerHTML=s}function button(){$('toggle').textContent=run?'Ⅱ 暂停':time>0?'▶ 继续':'▶ 开始'}function draw(){const p=P(),mu=p.m1*p.m2/(p.m1+p.m2),w=Math.sqrt(p.k/mu),T=2*Math.PI/w,total=T+5,ph=w*time,c=Math.cos(ph),sn=Math.sin(ph),vcm=p.m1*p.v0/(p.m1+p.m2),vA=vcm+(p.m2/(p.m1+p.m2))*p.v0*c,vB=vcm-(p.m1/(p.m1+p.m2))*p.v0*c,xi=(p.v0/w)*sn,cm=vcm*time,rel=5+xi,xAw=cm-(p.m2/(p.m1+p.m2))*rel,xBw=cm+(p.m1/(p.m1+p.m2))*rel,xA=510+(xAw-cm)*px,xB=510+(xBw-cm)*px;drawGround(cm);$('A').setAttribute('transform',`translate(${xA} ${ground})`);$('B').setAttribute('transform',`translate(${xB} ${ground})`);const aR=xA+48,bL=xB-58,y=308;$('spring').setAttribute('d',springPath(aR,bL,y));$('speedA').setAttribute('x',xA-48);$('speedA').setAttribute('y',245);$('speedB').setAttribute('x',xB-48);$('speedB').setAttribute('y',228);$('speedA').textContent=Math.abs(vA/p.v0)<.0005?'vA=0':'vA='+fmt(vA/p.v0)+'v₀';$('speedB').textContent=Math.abs(vB/p.v0)<.0005?'vB=0':'vB='+fmt(vB/p.v0)+'v₀';line('vA',xA,266,xA+60*vA/p.v0,266);line('vB',xB,249,xB+60*vB/p.v0,249);$('vA').style.opacity=Math.abs(vA/p.v0)<.015?0:1;$('vB').style.opacity=Math.abs(vB/p.v0)<.015?0:1;const fs=p.k*xi,L=Math.min(80,Math.abs(fs)*45),sg=Math.sign(fs)||1;line('FsA',aR,y,aR+sg*L,y);line('FsB',bL,y,bL-sg*L,y);['FsA','FsB','FsAt','FsBt'].forEach(id=>$(id).style.opacity=Math.abs(fs)<.001?0:1);$('FsAt').setAttribute('x',aR+sg*L*.5);$('FsAt').setAttribute('y',y-10);$('FsBt').setAttribute('x',bL-sg*L*.5);$('FsBt').setAttribute('y',y-10);$('tv').textContent=time.toFixed(2)+' s';$('Tv').textContent=T.toFixed(2)+' s';$('va').textContent=fmt(vA/p.v0);$('vb').textContent=fmt(vB/p.v0);$('vcm').textContent='0.400';$('xi').textContent=fmt(xi);$('fs').textContent=fmt(fs);$('timeText').textContent='t='+time.toFixed(2)+' s';$('v0v').textContent=p.v0.toFixed(2);$('kv').textContent=p.k.toFixed(2);$('msv').textContent=(+$('ms').value).toFixed(2)+'×';$('progress').value=Math.min(1,time/total);const f=((ph%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/(2*Math.PI),cx=58+672*f;line('cursor',cx,32,cx,238);$('dotA').setAttribute('cx',cx);$('dotA').setAttribute('cy',yChart(vA/p.v0));$('dotB').setAttribute('cx',cx);$('dotB').setAttribute('cy',yChart(vB/p.v0));return total} $('toggle').onclick=()=>{run=!run;button()};$('reset').onclick=()=>{run=false;time=0;button();draw()};document.querySelectorAll('.speedBtn').forEach(b=>b.onclick=()=>{playSpeed=+b.dataset.speed;document.querySelectorAll('.speedBtn').forEach(x=>x.classList.toggle('active',x===b))});['v0','k','ms'].forEach(id=>$(id).oninput=()=>{run=false;time=0;button();draw()});$('progress').oninput=e=>{run=false;const p=P(),mu=p.m1*p.m2/(p.m1+p.m2),T=2*Math.PI/Math.sqrt(p.k/mu);time=+e.target.value*(T+5);button();draw()};function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(run){time+=dt*playSpeed;const total=draw();if(time>=total){time=0;draw()}}requestAnimationFrame(loop)}buildChart();draw();button();requestAnimationFrame(loop)})();</script></body></html>
