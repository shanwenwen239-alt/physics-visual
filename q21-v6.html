<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第21题｜动滑轮·三状态可视对照</title><style>:root{--ink:#10233f;--muted:#64748b;--line:#d7e3f1;--blue:#2563eb;--gold:#b7791f;--red:#dc2626;--violet:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}.w{max-width:1440px;margin:auto;padding:18px}.hero{font-size:29px;font-weight:900;color:#12376b;margin-bottom:7px}.desc,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:15px;align-items:start}.card{padding:12px;box-shadow:0 7px 22px #183b6610}.scene{width:100%;height:min(76vh,760px);min-height:610px;display:block;touch-action:none}.side{display:grid;gap:11px;position:sticky;top:10px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:var(--blue);color:#fff;border-color:var(--blue)}.params{display:grid;gap:12px}.params input,.slider{width:100%}.value{color:var(--blue);font-weight:800}.data,.audit{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{margin-top:10px;padding:10px;border-radius:10px;line-height:1.65;font-size:13px}.theory{background:#eef6ff}.ok{background:#ecfdf5}.hint{background:#fff8e8}.pass{color:#047857;font-weight:800}.badge{font-size:14px;font-weight:800;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.sw{width:24px;height:3px;display:inline-block;vertical-align:middle;margin-right:5px}.gold{background:var(--gold)}.red{background:var(--red)}@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static}.scene{height:690px;min-height:600px}}</style></head><body><main class="w"><div class="hero">第21题｜动滑轮 B → C → D</div><div class="desc">本版把题目的三种状态直接画在主图中：<b>状态1：F₁、θ₁；状态2：F₂、θ₂；状态3：F₃、θ₃</b>。上半部分是可播放的当前状态，下半部分是三个固定对照小图，参数变化时三组数值一起更新。</div><div class="layout"><section class="card"><svg id="scene" class="scene" viewBox="0 0 900 760"><defs><marker id="goldArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b7791f"/></marker><marker id="redArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker></defs><rect width="900" height="760" fill="#fbfdff"/><text x="34" y="32" font-size="14" font-weight="800" fill="#64748b">动态主图</text><path d="M105 62V190H65 M500 62V190H760" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/><circle cx="105" cy="190" r="6" fill="#1f2937"/><text x="84" y="220" font-weight="800">A</text><path d="M500 72V190H710" fill="none" stroke="#d97777" stroke-width="2" stroke-dasharray="7 7" opacity=".55"/><g fill="#d94a45"><circle cx="500" cy="72" r="5"/><circle cx="500" cy="190" r="5"/><circle cx="710" cy="190" r="5"/></g><g fill="#ad3d3d" font-weight="800"><text x="513" y="77">B</text><text x="513" y="187">C</text><text x="719" y="187">D</text></g><circle id="halo" r="25" fill="#dc2626" opacity=".11"/><circle id="end" r="13" fill="#dc2626" stroke="#fff" stroke-width="4" style="cursor:grab"/><text id="drag" class="badge" fill="#b91c1c">拖动固定点</text><line id="rope1" stroke="#596979" stroke-width="5" stroke-linecap="round"/><line id="rope2" stroke="#596979" stroke-width="5" stroke-linecap="round"/><circle id="pulley" r="30" fill="#dcecff" stroke="#3977b7" stroke-width="3"/><circle id="hub" r="5" fill="#3977b7"/><line id="stem" stroke="#475569" stroke-width="3"/><rect id="mass" width="54" height="56" rx="8" fill="#f5dda0" stroke="#8f6b24" stroke-width="2.5"/><text id="mt" font-weight="800">m</text><line id="T1" stroke="#b7791f" stroke-width="3" marker-end="url(#goldArr)"/><line id="T2" stroke="#b7791f" stroke-width="3" marker-end="url(#goldArr)"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#redArr)"/><text id="T1t" class="badge" fill="#8a5a12">Ft</text><text id="T2t" class="badge" fill="#8a5a12">Ft</text><text id="Gt" class="badge" fill="#b91c1c">G</text><path id="arc" fill="none" stroke="#7c3aed" stroke-width="2.3"/><text id="theta" class="badge" fill="#6d4fa0">θ</text><line x1="25" y1="445" x2="875" y2="445" stroke="#d7e3f1"/><text x="34" y="473" font-size="16" font-weight="900" fill="#12376b">题目三状态固定对照</text><g id="mini1"></g><g id="mini2"></g><g id="mini3"></g></svg><div class="legend"><span><i class="sw gold"></i>Ft 张力</span><span><i class="sw red"></i>G 重力</span></div><div class="box hint">对照观察：<b>θ₁ = θ₂ &lt; θ₃</b>，<b>F₁ = F₂ &lt; F₃</b>。</div></section><aside class="side"><section class="card"><h3>播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div><input id="slider" class="slider" type="range" min="0" max="2" step=".001" value="0" style="margin-top:9px"><div class="controls" style="margin-top:8px"><button class="btn key" data-u="0">状态1 B</button><button class="btn key" data-u="1">状态2 C</button><button class="btn key" data-u="2">状态3 D</button></div></section><section class="card"><h3>参数调整</h3><div class="params"><label>悬挂质量 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>总绳长 L：<span id="Lv" class="value"></span><input id="L" type="range" min="630" max="780" step="5" value="650"></label></div></section><section class="card"><h3>实时数据</h3><div class="data"><span>当前状态</span><b id="state">A-B</b><span>当前角度</span><b id="ang">—</b><span>当前张力</span><b id="tv">—</b><span>G</span><b id="gv">—</b></div><div class="box ok"><b>结论：</b>θ₁=θ₂&lt;θ₃；F₁=F₂&lt;F₃，故 B、D 正确。</div></section><section class="card"><h3>自检状态</h3><div class="audit"><span>绳长恒定</span><b id="a1" class="pass">PASS</b><span>ΣFx=0</span><b id="a2" class="pass">PASS</b><span>ΣFy=0</span><b id="a3" class="pass">PASS</b><span>θ₁=θ₂</span><b id="a4" class="pass">PASS</b><span>F₁=F₂</span><b id="a5" class="pass">PASS</b></div></section></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),A={x:105,y:190},g=9.8,R=30,forceScale=4;let u=0,run=false,drag=false,last=performance.now(),speed=1;function P(){return{m:+$('m').value,L:+$('L').value}}function endpoint(s){return s<=1?{x:500,y:72+118*s}:{x:500+210*(s-1),y:190}}function stateAt(s){const p=P(),e=endpoint(s),D=e.x-A.x,b=Math.asin(Math.min(.999,D/p.L)),H=p.L*Math.cos(b),py=(H+A.y+e.y)/2,h=py-A.y,px=A.x+h*Math.tan(b),G=p.m*g,T=G/(2*Math.cos(b));return{...e,D,b,px,py,G,T,L:p.L}}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function tx(id,x,y){const e=$(id);e.setAttribute('x',x);e.setAttribute('y',y)}function unit(x,y){const d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}}function miniHTML(s,cx,title,i){const scale=.34,baseY=680,ax=cx-85,ay=535,ex=cx+75,ey=535+(s.y-190)*scale,px=cx+(s.px-305)*scale,py=baseY+(s.py-360)*scale;return `<rect x="${cx-125}" y="492" width="250" height="240" rx="12" fill="#fff" stroke="#d7e3f1"/><text x="${cx-108}" y="518" font-size="15" font-weight="900" fill="#234b7a">${title}</text><circle cx="${ax}" cy="${ay}" r="4" fill="#334155"/><circle cx="${ex}" cy="${ey}" r="4" fill="#dc2626"/><line x1="${ax}" y1="${ay}" x2="${px}" y2="${py}" stroke="#69798a" stroke-width="3"/><line x1="${px}" y1="${py}" x2="${ex}" y2="${ey}" stroke="#69798a" stroke-width="3"/><circle cx="${px}" cy="${py}" r="14" fill="#dcecff" stroke="#3977b7" stroke-width="2"/><line x1="${px}" y1="${py}" x2="${px}" y2="${py+45}" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr)"/><text x="${cx-105}" y="707" font-size="14" font-weight="900" fill="#6d4fa0">θ${i}=${(2*s.b*180/Math.PI).toFixed(1)}°</text><text x="${cx+5}" y="707" font-size="14" font-weight="900" fill="#9a6518">F${i}=${s.T.toFixed(2)}N</text>`}function draw(){u=Math.max(0,Math.min(2,u));const z=stateAt(u),s1=stateAt(0),s2=stateAt(1),s3=stateAt(2),v1=unit(A.x-z.px,A.y-z.py),v2=unit(z.x-z.px,z.y-z.py),d1=Math.hypot(A.x-z.px,A.y-z.py),d2=Math.hypot(z.x-z.px,z.y-z.py);$('end').setAttribute('cx',z.x);$('end').setAttribute('cy',z.y);$('halo').setAttribute('cx',z.x);$('halo').setAttribute('cy',z.y);tx('drag',z.x+18,z.y-12);ln('rope1',A.x,A.y,z.px+v1.x*R,z.py+v1.y*R);ln('rope2',z.px+v2.x*R,z.py+v2.y*R,z.x,z.y);$('pulley').setAttribute('cx',z.px);$('pulley').setAttribute('cy',z.py);$('hub').setAttribute('cx',z.px);$('hub').setAttribute('cy',z.py);ln('stem',z.px,z.py+R,z.px,z.py+R+20);$('mass').setAttribute('x',z.px-27);$('mass').setAttribute('y',z.py+R+20);tx('mt',z.px-7,z.py+R+54);const LT=z.T*forceScale,LG=z.G*forceScale;ln('T1',z.px,z.py,z.px+v1.x*LT,z.py+v1.y*LT);ln('T2',z.px,z.py,z.px+v2.x*LT,z.py+v2.y*LT);ln('G',z.px,z.py+R+48,z.px,z.py+R+48+LG);tx('T1t',z.px+v1.x*LT-22,z.py+v1.y*LT-10);tx('T2t',z.px+v2.x*LT+8,z.py+v2.y*LT-10);tx('Gt',z.px+10,z.py+R+48+LG-4);const rr=48,b=z.b;$('arc').setAttribute('d',`M${z.px-rr*Math.sin(b)} ${z.py-rr*Math.cos(b)} A${rr} ${rr} 0 0 1 ${z.px+rr*Math.sin(b)} ${z.py-rr*Math.cos(b)}`);tx('theta',z.px+8,z.py-55);const idx=u<.5?1:u<1.5?2:3;$('state').textContent=idx===1?'A-B':idx===2?'A-C':'A-D';$('ang').textContent='θ'+idx+'='+(2*b*180/Math.PI).toFixed(1)+'°';$('tv').textContent='F'+idx+'='+z.T.toFixed(2)+' N';$('gv').textContent=z.G.toFixed(2)+' N';$('mv').textContent=P().m.toFixed(1)+' kg';$('Lv').textContent=P().L.toFixed(0);$('slider').value=u;$('mini1').innerHTML=miniHTML(s1,160,'状态1｜A-B',1);$('mini2').innerHTML=miniHTML(s2,450,'状态2｜A-C',2);$('mini3').innerHTML=miniHTML(s3,740,'状态3｜A-D',3);const hx=z.T*(v1.x+v2.x),hy=z.T*(v1.y+v2.y)+z.G;$('a1').textContent=Math.abs(d1+d2-P().L)<1e-6?'PASS':'FAIL';$('a2').textContent=Math.abs(hx)<1e-6?'PASS':'FAIL';$('a3').textContent=Math.abs(hy)<1e-6?'PASS':'FAIL';$('a4').textContent=Math.abs(s1.b-s2.b)<1e-9?'PASS':'FAIL';$('a5').textContent=Math.abs(s1.T-s2.T)<1e-9?'PASS':'FAIL';$('play').textContent=run?'Ⅱ 暂停':u>=2?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}function setU(v){run=false;u=Math.max(0,Math.min(2,v));draw()}$('slider').oninput=e=>setU(+e.target.value);$('play').onclick=()=>{if(u>=2)u=0;run=!run;draw()};$('reset').onclick=()=>{$('m').value=1;$('L').value=650;run=false;u=0;draw()};document.querySelectorAll('.key').forEach(b=>b.onclick=()=>setU(+b.dataset.u));document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','L'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function pt(e){const r=$('scene').getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*760/r.height}}$('end').onpointerdown=e=>{drag=true;run=false;$('end').setPointerCapture(e.pointerId)};$('end').onpointermove=e=>{if(!drag)return;const p=pt(e);if(p.y<190&&Math.abs(p.x-500)<90)u=Math.max(0,Math.min(1,(p.y-72)/118));else u=Math.max(1,Math.min(2,1+(p.x-500)/210));draw()};$('end').onpointerup=()=>drag=false;function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run){u+=dt*.34*speed;if(u>=2){u=2;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
