<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第21题｜七球弹性碰撞增强版</title><style>:root{--ink:#10233f;--muted:#667085;--line:#cfdbea;--blue:#1f6feb;--red:#e54b4b;--panel:#fff;--green:#138a54}*{box-sizing:border-box}body{margin:0;background:#f3f7fb;font-family:system-ui,'PingFang SC','Microsoft YaHei';color:var(--ink)}.w{max-width:1480px;margin:auto;padding:16px}.title{font-size:30px;font-weight:900;color:#0d2b59;margin-bottom:10px}.problem,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.problem{padding:12px 16px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(0,2fr) 330px;gap:16px;margin-top:14px}.sceneWrap{padding:12px;background:linear-gradient(180deg,#edf6ff,#fff)}svg{width:100%;display:block}.controls{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #b9c9dc;background:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.btn.primary,.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.side{display:grid;gap:12px}.side .card{padding:12px}.lower{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px}.lower .card{padding:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #e5ecf4;padding:7px;text-align:center}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.ok{background:#edf9f2;border:1px solid #b9e5ca;border-radius:12px;padding:12px;line-height:1.7}.note{font-size:12.5px;color:var(--muted);line-height:1.65}.speedNum{font-size:13px;font-weight:800;fill:#173a68}.zero{fill:#64748b}@media(max-width:950px){.layout{grid-template-columns:1fr}.lower{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第21题｜弹性碰撞 · 七球连锁运动</div><div class="problem"><b>物理世界核查：</b>A、G质量均为m；B～F质量均为M，且m&lt;M。B～G初始静止，A以v₀向右，一维完全弹性碰撞。动画直接按碰撞公式计算，不使用预设结果。</div><div class="layout"><div><section class="card"><div class="sceneWrap"><svg id="scene" viewBox="0 0 1080 450"><defs><radialGradient id="redBall"><stop offset="0" stop-color="#fff"/><stop offset=".32" stop-color="#ffb0b0"/><stop offset="1" stop-color="#df4d4d"/></radialGradient><radialGradient id="blueBall"><stop offset="0" stop-color="#fff"/><stop offset=".32" stop-color="#a8d1ff"/><stop offset="1" stop-color="#397fcf"/></radialGradient><marker id="arrowB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1f6feb"/></marker></defs><line x1="25" y1="330" x2="1055" y2="330" stroke="#1f2937" stroke-width="3"/><g id="balls"></g><g id="vels"></g><g id="speedLabels"></g><text id="timeTxt" x="875" y="55" font-size="20" font-weight="800" fill="#173a68">t = 0.00 s</text><text id="stageTxt" x="875" y="82" font-size="13" fill="#667085">初始状态</text><text x="36" y="48" font-size="13" fill="#667085">蓝色虚线＝速度方向；每个球上方直接显示速度值</text></svg></div><div class="controls"><button id="toggle" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><span>播放：</span><button class="btn speedBtn" data-speed="0.5">慢速 0.5×</button><button class="btn speedBtn active" data-speed="1">正常 1×</button><button class="btn speedBtn" data-speed="2">快速 2×</button></div></section></div><aside class="side"><section class="card"><h3>参数设置</h3><label>A、G质量 m <input id="m" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><br><label>B～F质量 M <input id="M" type="range" min="1.2" max="4" step="0.1" value="2"></label><br><label>初速度 v₀ <input id="v0" type="range" min="0.5" max="2" step="0.1" value="1"></label><div class="note">保持M&gt;m。改变参数后自动重置并重新计算。</div></section><section class="card"><h3>实时数据</h3><div class="data"><span>阶段</span><b id="stage">初始</b><span>碰撞次数</span><b id="count">0</b><span>总动量</span><b id="mom">—</b><span>总动能</span><b id="ke">—</b><span>运动小球数</span><b id="moving">1</b></div></section></aside></div><section class="lower"><div class="card"><h3>每个球的实时速度</h3><table class="table"><thead><tr><th>球</th><th>质量</th><th>速度</th><th>方向</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="card"><h3>结论</h3><div class="ok">默认m=1、M=2时，最终A向左，F、G向右，B、C、D、E静止，因此<b>四个小球静止、三个小球运动，对应B</b>。</div></div></section></main><script>(()=>{const $=id=>document.getElementById(id);const names=['A','B','C','D','E','F','G'];const R=28,Y=300,pxPerV=95;let balls=[],running=false,finished=false,last=performance.now(),time=0,collisions=0,playSpeed=1;function P(){let m=+$('m').value,M=+$('M').value;if(M<=m){M=m+.1;$('M').value=M}return{m,M,v0:+$('v0').value}}function reset(){const p=P();balls=names.map((n,i)=>({name:n,m:(i===0||i===6)?p.m:p.M,x:[95,305,420,535,650,765,880][i],v:i===0?p.v0:0,red:i===0||i===6}));running=false;finished=false;time=0;collisions=0;button();draw()}function collide(i){const a=balls[i],b=balls[i+1],u=a.v,w=b.v,m1=a.m,m2=b.m;a.v=((m1-m2)*u+2*m2*w)/(m1+m2);b.v=(2*m1*u+(m2-m1)*w)/(m1+m2);collisions++}function advance(dt){const sub=12,h=dt/sub;for(let s=0;s<sub;s++){balls.forEach(b=>b.x+=b.v*pxPerV*h);for(let i=0;i<6;i++){const a=balls[i],b=balls[i+1];if(a.x+R>=b.x-R&&a.v>b.v){const mid=(a.x+b.x)/2;a.x=mid-R;b.x=mid+R;collide(i)}}}time+=dt;if(time>10||balls[0].x<25||balls[6].x>1050){running=false;finished=true;button()}}function fmt(v){return Math.abs(v)<0.0005?'0':v.toFixed(3)}function dir(v){return Math.abs(v)<0.0005?'静止':v>0?'向右':'向左'}function draw(){const p=P();$('balls').innerHTML='';$('vels').innerHTML='';$('speedLabels').innerHTML='';balls.forEach((b,i)=>{const grad=b.red?'redBall':'blueBall';$('balls').insertAdjacentHTML('beforeend',`<g><circle cx="${b.x}" cy="${Y}" r="${R}" fill="url(#${grad})" stroke="${b.red?'#9f1f1f':'#174f91'}" stroke-width="2.5"/><text x="${b.x}" y="${Y-42}" text-anchor="middle" font-size="20" font-weight="900">${b.name}</text><text x="${b.x}" y="${Y+54}" text-anchor="middle" font-size="12" fill="#475569">${i===0||i===6?'m':'M'}</text></g>`);const label=fmt(b.v);$('speedLabels').insertAdjacentHTML('beforeend',`<text x="${b.x}" y="${Y-68}" text-anchor="middle" class="speedNum ${label==='0'?'zero':''}">${label==='0'?'0':('v='+label)}</text>`);if(Math.abs(b.v)>0.0005){const len=Math.max(26,Math.min(92,52*Math.abs(b.v/p.v0))),sg=Math.sign(b.v);$('vels').insertAdjacentHTML('beforeend',`<line x1="${b.x}" y1="${Y-8}" x2="${b.x+sg*len}" y2="${Y-8}" stroke="#1f6feb" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowB)"/>`)}});let mom=0,ke=0,moving=0;balls.forEach(b=>{mom+=b.m*b.v;ke+=.5*b.m*b.v*b.v;if(Math.abs(b.v)>.0005)moving++});$('timeTxt').textContent='t = '+time.toFixed(2)+' s';$('stageTxt').textContent=collisions===0?'A接近B':collisions<6?`第${collisions}次碰撞后`:'最终分离';$('stage').textContent=$('stageTxt').textContent;$('count').textContent=collisions;$('mom').textContent=mom.toFixed(3);$('ke').textContent=ke.toFixed(3);$('moving').textContent=moving;$('tbody').innerHTML=balls.map(b=>`<tr><td><b>${b.name}</b></td><td>${b.m.toFixed(1)}</td><td>${fmt(b.v)}</td><td>${dir(b.v)}</td></tr>`).join('')}function button(){$('toggle').textContent=finished?'↻ 重新开始':running?'Ⅱ 暂停':time>0?'▶ 继续':'▶ 开始'}$('toggle').onclick=()=>{if(finished){reset();running=true}else running=!running;button()};$('reset').onclick=reset;document.querySelectorAll('.speedBtn').forEach(b=>b.onclick=()=>{playSpeed=+b.dataset.speed;document.querySelectorAll('.speedBtn').forEach(x=>x.classList.toggle('active',x===b))});['m','M','v0'].forEach(id=>$(id).oninput=reset);function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(running){advance(dt*playSpeed);draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
