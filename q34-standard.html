<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第34题｜电梯与功</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第34题｜电梯加速上升：支持力做功与钢索做功</div><div class="desc">电梯质量M，物体质量m。电梯由静止竖直向上加速，上升高度H时速度为v。模型同时显示物体受力、电梯受力和功—能量关系。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="500" y1="0" x2="500" y2="150" stroke="#334155" stroke-width="7"/><g id="elev"><rect x="370" y="150" width="260" height="250" fill="#e5edf7" stroke="#334155" stroke-width="4"/><line x1="370" y1="400" x2="630" y2="400" stroke="#334155" stroke-width="5"/><g id="block"><rect x="450" y="330" width="100" height="70" rx="9" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="490" y="373" font-size="28">m</text></g><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#g)"/><line id="T" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text id="Gt" class="badge" fill="#b91c1c">mg</text><text id="Nt" class="badge" fill="#047857">N</text><text id="Tt" class="badge" fill="#1d4ed8">T</text><text x="565" y="215" font-size="32">M</text></g><line id="vArr" x1="690" y1="330" x2="690" y2="250" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#b)"/><text x="705" y="265" fill="#1d4ed8" font-weight="700">v</text></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>物体质量 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="3" step="0.1" value="1"></label><label>电梯质量 M：<span id="Mv" class="value"></span><input id="M" type="range" min="2" max="10" step="0.5" value="5"></label><label>上升高度 H：<span id="Hv" class="value"></span><input id="H" type="range" min="1" max="10" step="0.5" value="4"></label><label>末速度 v：<span id="vv" class="value"></span><input id="v" type="range" min="1" max="8" step="0.2" value="4"></label></div></section><section class="card"><h3 class="title">实时物理量</h3><div class="data"><span>加速度 a</span><b id="av">—</b><span>支持力 N</span><b id="Nv">—</b><span>支持力做功 WN</span><b id="WN">—</b><span>钢索做功 WT</span><b id="WT">—</b></div><div class="box theory">若视为匀加速：v²=2aH。对物体：N−mg=ma，因此N=m(g+a)，所以WN=NH&gt;mgH，且WN=½mv²+mgH。对电梯+物体整体：WT=½(M+m)v²+(M+m)gH。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,p=0,last=performance.now(),g=9.8;function P(){return{m:+$('m').value,M:+$('M').value,H:+$('H').value,v:+$('v').value}}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){let q=P(),a=q.v*q.v/(2*q.H),N=q.m*(g+a),T=(q.M+q.m)*(g+a),dy=-120*p;$('elev').setAttribute('transform',`translate(0 ${dy})`);let cx=500,cy=365+dy;line('G',cx,cy,cx,cy+45*q.m);line('N',cx,cy,cx,cy-Math.min(95,N*4));line('T',500,150+dy,500,70+dy);[['Gt',510,cy+40],['Nt',510,cy-55],['Tt',515,100+dy]].forEach(a=>{$(a[0]).setAttribute('x',a[1]);$(a[0]).setAttribute('y',a[2])});$('mv').textContent=q.m.toFixed(1);$('Mv').textContent=q.M.toFixed(1);$('Hv').textContent=q.H.toFixed(1);$('vv').textContent=q.v.toFixed(1);$('av').textContent=a.toFixed(2);$('Nv').textContent=N.toFixed(2);$('WN').textContent=(N*q.H).toFixed(2);$('WT').textContent=((q.M+q.m)*(g*q.H+.5*q.v*q.v)).toFixed(2)}function label(){$('play').textContent=run?'Ⅱ 暂停':p>0?'▶ 继续':'▶ 开始'}function reset(){run=false;p=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','H','v'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){p+=dt*.15*speed;if(p>1)p=0;draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
