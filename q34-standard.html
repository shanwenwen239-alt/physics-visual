<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第34题｜加速电梯</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input,.range{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第34题｜电梯由静止匀加速上升</div><div class="desc">电梯由静止开始，以恒定加速度上升高度 H，末速度为 v。动画的高度、速度、支持力、钢索拉力和做功都由同一组方程计算；画布比例固定，极值参数下电梯也不会跑出画面。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 600"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#fbfdff"/><line x1="330" y1="25" x2="330" y2="575" stroke="#cbd5e1" stroke-width="3"/><line x1="670" y1="25" x2="670" y2="575" stroke="#cbd5e1" stroke-width="3"/><g id="elevator"><rect x="370" y="290" width="260" height="230" fill="#e5edf7" stroke="#334155" stroke-width="4"/><line x1="370" y1="520" x2="630" y2="520" stroke="#334155" stroke-width="5"/><rect x="450" y="440" width="100" height="80" rx="9" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="490" y="490" font-size="28">m</text><text x="570" y="360" font-size="32">M</text></g><line id="cable" stroke="#334155" stroke-width="7"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="T" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><line id="vArr" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><g id="labels" font-size="14" font-weight="800"></g></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>m：<span id="mv" class="value"></span><input id="m" type="range" min=".5" max="3" step=".1" value="1"></label><label>M：<span id="Mv" class="value"></span><input id="M" type="range" min="2" max="10" step=".5" value="5"></label><label>H：<span id="Hv" class="value"></span><input id="H" type="range" min="1" max="10" step=".5" value="4"></label><label>末速度 v：<span id="vfV" class="value"></span><input id="vf" type="range" min="1" max="8" step=".2" value="4"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>t</span><b id="tv"></b><span>当前高度 h</span><b id="hv"></b><span>当前速度</span><b id="vv"></b><span>加速度 a</span><b id="av"></b><span>支持力 N</span><b id="Nv"></b><span>钢索拉力 T</span><b id="Tv"></b><span>WN</span><b id="WN"></b><span>WT</span><b id="WT"></b></div></div><div class="card"><div class="box">v²=2aH；N=m(g+a)；T=(M+m)(g+a)。到达H时：WN=½mv²+mgH；WT=½(M+m)v²+(M+m)gH。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8;let u=0,run=false,speed=1,last=performance.now();function P(){return{m:+$('m').value,M:+$('M').value,H:+$('H').value,vf:+$('vf').value}}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){const p=P(),a=p.vf*p.vf/(2*p.H),tEnd=p.vf/a,t=u*tEnd,h=.5*a*t*t,v=a*t,dy=-180*h/p.H,floorY=520+dy,roofY=290+dy,blockCy=480+dy;$('elevator').setAttribute('transform',`translate(0 ${dy})`);ln('cable',500,0,500,roofY);const N=p.m*(g+a),T=(p.M+p.m)*(g+a);ln('G',500,blockCy,500,blockCy+Math.min(90,p.m*g*4.2));ln('N',500,blockCy,500,blockCy-Math.min(105,N*4.2));ln('T',500,roofY,500,roofY-Math.min(110,T*1.6));ln('vArr',700,floorY-20,700,floorY-20-Math.min(100,v*16));$('vArr').style.opacity=v<.01?0:1;$('labels').innerHTML=`<text x="510" y="${blockCy+55}" fill="#b91c1c">mg</text><text x="510" y="${blockCy-55}" fill="#047857">N</text><text x="512" y="${roofY-65}" fill="#1d4ed8">T</text>${v>.01?`<text x="712" y="${floorY-60}" fill="#1d4ed8">v</text>`:''}`;$('mv').textContent=p.m.toFixed(1);$('Mv').textContent=p.M.toFixed(1);$('Hv').textContent=p.H.toFixed(1);$('vfV').textContent=p.vf.toFixed(1);$('tv').textContent=t.toFixed(2)+' s';$('hv').textContent=h.toFixed(2);$('vv').textContent=v.toFixed(2);$('av').textContent=a.toFixed(2);$('Nv').textContent=N.toFixed(2);$('Tv').textContent=T.toFixed(2);$('WN').textContent=(N*h).toFixed(2);$('WT').textContent=(T*h).toFixed(2);$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('m').value=1;$('M').value=5;$('H').value=4;$('vf').value=4;draw()};$('progress').oninput=e=>{run=false;u=+e.target.value;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','H','vf'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){const p=P(),a=p.vf*p.vf/(2*p.H),tEnd=p.vf/a;u+=dt*speed/tEnd;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
