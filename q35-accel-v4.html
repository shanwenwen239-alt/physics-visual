<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第35题｜双木块与弹簧</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1420px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input,.range{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}.accel{margin-top:12px;display:none}.accel.show{display:block}.bars{display:grid;grid-template-columns:130px 1fr 70px;gap:9px 10px;align-items:center;margin-top:10px}.track{height:18px;background:#edf1f6;border-radius:9px;overflow:hidden;position:relative}.fillA,.fillB{height:100%;transition:width .08s linear}.fillA{background:#7c3aed}.fillB{background:#a855f7}.event{margin-top:10px;padding:10px;border-radius:10px;background:#fff8e8;border:1px solid #f0d38a;font-weight:800}.graphWrap{margin-top:12px}.graph{width:100%;display:block;background:#fbfdff;border:1px solid #d8e3ef;border-radius:10px}.small{font-size:12px;color:#64748b}@media(max-width:920px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第35题｜等质量 A、B 与轻弹簧</div><div class="desc">主动画只负责展示真实运动、弹簧伸长、受力与速度。加速度不强行藏在“看起来快慢”里，而通过可展开的“合力 → 加速度”视图和 a-x 图单独表达。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1040 560"><defs><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker></defs><rect width="1040" height="560" fill="#fbfdff"/><line x1="30" y1="430" x2="1010" y2="430" stroke="#94a3b8" stroke-width="3"/><g id="A"><rect width="110" height="76" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="44" y="48" font-size="30">A</text></g><g id="B"><rect width="110" height="76" rx="10" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><text x="44" y="48" font-size="30">B</text></g><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><g id="forces"></g><g id="vels"></g></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><button id="toggleA" class="btn">展开加速度分析</button><label><input id="vertical" type="checkbox"> 显示G/N</label></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"><div id="accel" class="accel card"><b>加速度分析｜不是靠“肉眼看快慢”判断</b><div class="bars"><span>A：|F合|=F−kx</span><div class="track"><div id="abar" class="fillA"></div></div><b id="aMag"></b><span>B：|F合|=kx</span><div class="track"><div id="bbar" class="fillB"></div></div><b id="bMag"></b></div><div id="event" class="event"></div><div class="graphWrap"><svg id="agraph" class="graph" viewBox="0 0 760 250"><line x1="70" y1="205" x2="720" y2="205" stroke="#64748b"/><line x1="70" y1="25" x2="70" y2="205" stroke="#64748b"/><text x="700" y="228" font-size="12">x</text><text x="38" y="34" font-size="12">|a|</text><line id="aline" x1="70" y1="45" x2="720" y2="205" stroke="#7c3aed" stroke-width="4"/><line id="bline" x1="70" y1="205" x2="720" y2="45" stroke="#a855f7" stroke-width="4"/><line id="cross" x1="395" y1="35" x2="395" y2="205" stroke="#f59e0b" stroke-dasharray="6 5"/><circle id="adot" r="7" fill="#7c3aed"/><circle id="bdot" r="7" fill="#a855f7"/><text id="x0lab" x="62" y="228" font-size="12">0</text><text id="xmidlab" x="368" y="228" font-size="12">F/2k</text><text id="xmaxlab" x="690" y="228" font-size="12">F/k</text></svg><div class="small">紫线：|aA|=(F−kx)/m；粉线：|aB|=kx/m。两线在 x=F/(2k) 相交。</div></div></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>质量 m：<span id="mv" class="value"></span><input id="m" type="range" min=".5" max="3" step=".1" value="1"></label><label>恒力 F：<span id="Fv" class="value"></span><input id="Fp" type="range" min=".5" max="4" step=".1" value="2"></label><label>劲度 k：<span id="kv" class="value"></span><input id="k" type="range" min="1" max="4" step=".1" value="1.5"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>阶段</span><b id="stage"></b><span>弹簧伸长 x</span><b id="xv"></b><span>弹簧力 kx</span><b id="Fsv"></b><span>vA</span><b id="vav"></b><span>vB</span><b id="vbv"></b><span>aA</span><b id="aav"></b><span>aB</span><b id="abv"></b></div></div><div class="card"><div class="box">ω=√(2k/m)，x=F/(2k)(1−cosωt)。关键状态：x=0；x=F/(2k) 时 |aA|=|aB|；x=F/k 时第一次最大伸长、aA=0 且 vA=vB。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let u=0,run=false,speed=1,last=performance.now();const L0=5,scale=58,g=9.8;function P(){return{m:+$('m').value,F:+$('Fp').value,k:+$('k').value}}function springPath(x1,x2,y){let d=`M${x1} ${y}`,n=10;for(let i=1;i<2*n;i++){const x=x1+(x2-x1)*i/(2*n),yy=y+(i%2?-12:12);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function model(p){const w=Math.sqrt(2*p.k/p.m),T=Math.PI/w,t=u*T,x=p.F/(2*p.k)*(1-Math.cos(w*t)),xd=p.F/(2*p.k)*w*Math.sin(w*t),vcm=-p.F*t/(2*p.m),vA=vcm-xd/2,vB=vcm+xd/2,aA=(-p.F+p.k*x)/p.m,aB=-p.k*x/p.m,xcm=-p.F*t*t/(4*p.m);return{T,t,x,vA,vB,aA,aB,xcm}}function arrow(x,y,fx,fy,col,label,dash=''){const mag=Math.hypot(fx,fy);if(mag<1e-5)return'';const L=Math.min(100,mag*20),ex=x+L*fx/mag,ey=y-L*fy/mag,stroke=col==='blue'?'#2563eb':col==='orange'?'#d97706':col==='red'?'#dc2626':'#059669';return `<line x1="${x}" y1="${y}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="3" ${dash?'stroke-dasharray="8 6"':''} marker-end="url(#${col})"/><text x="${ex+6}" y="${ey-6}" fill="${stroke}" font-size="13" font-weight="800">${label}</text>`}function draw(){const p=P(),q=model(p),center0=530,xcmPx=q.xcm*30,sep=(L0+q.x)*scale,xA=center0+xcmPx-sep/2-55,xB=center0+xcmPx+sep/2-55;$('A').setAttribute('transform',`translate(${xA} 350)`);$('B').setAttribute('transform',`translate(${xB} 350)`);$('spring').setAttribute('d',springPath(xA+110,xB,388));const cA=xA+55,cB=xB+55,cy=388,Fs=p.k*q.x;let f=arrow(cA,cy,-p.F,0,'blue','F')+arrow(cA,cy,Fs,0,'orange','Fs')+arrow(cB,cy,-Fs,0,'orange','Fs');if($('vertical').checked)f+=arrow(cA,cy,0,-p.m*g/4,'red','G')+arrow(cA,cy,0,p.m*g/4,'green','N')+arrow(cB,cy,0,-p.m*g/4,'red','G')+arrow(cB,cy,0,p.m*g/4,'green','N');$('forces').innerHTML=f;$('vels').innerHTML=arrow(cA,325,q.vA,0,'blue','vA',true)+arrow(cB,325,q.vB,0,'blue','vB',true);$('mv').textContent=p.m.toFixed(1);$('Fv').textContent=p.F.toFixed(1);$('kv').textContent=p.k.toFixed(1);const xmid=p.F/(2*p.k),xmax=p.F/p.k;let phase='弹簧正在伸长';if(Math.abs(q.x-xmid)<0.025*xmax)phase='关键：|aA|≈|aB|';if(u>=.995)phase='第一次最大伸长';$('stage').textContent=phase;$('xv').textContent=q.x.toFixed(3);$('Fsv').textContent=Fs.toFixed(3);$('vav').textContent=q.vA.toFixed(3);$('vbv').textContent=q.vB.toFixed(3);$('aav').textContent=q.aA.toFixed(3);$('abv').textContent=q.aB.toFixed(3);const aAm=Math.abs(q.aA),aBm=Math.abs(q.aB),amax=p.F/p.m;$('abar').style.width=(100*aAm/amax)+'%';$('bbar').style.width=(100*aBm/amax)+'%';$('aMag').textContent=aAm.toFixed(2);$('bMag').textContent=aBm.toFixed(2);if(q.x<0.03*xmax)$('event').textContent='初始：A 的加速度最大，B 的加速度为 0。';else if(Math.abs(q.x-xmid)<0.04*xmax)$('event').textContent='关键状态：x=F/(2k)，两物块加速度大小相等。';else if(u>.97)$('event').textContent='第一次最大伸长：x=F/k，aA=0，且 vA=vB。';else $('event').textContent='随着弹簧伸长：|aA|减小，|aB|增大。';const px=70+650*Math.min(1,q.x/xmax),pyA=205-160*(aAm/amax),pyB=205-160*(aBm/amax);$('adot').setAttribute('cx',px);$('adot').setAttribute('cy',pyA);$('bdot').setAttribute('cx',px);$('bdot').setAttribute('cy',pyB);$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('m').value=1;$('Fp').value=2;$('k').value=1.5;draw()};$('progress').oninput=e=>{run=false;u=+e.target.value;draw()};$('vertical').onchange=draw;$('toggleA').onclick=()=>{const a=$('accel'),show=!a.classList.contains('show');a.classList.toggle('show',show);$('toggleA').textContent=show?'收起加速度分析':'展开加速度分析'};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','Fp','k'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){const p=P(),T=Math.PI/Math.sqrt(2*p.k/p.m);u+=dt*speed/T;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
