<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第34题｜电梯能量流</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:27px;font-weight:900;color:#173b70}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:11px 15px;margin:8px 0 14px;line-height:1.65}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700}.primary,.active{background:#2563eb;color:#fff}.params{display:grid;gap:9px}.params input{width:100%}.flow{margin-top:12px;padding:14px;border-radius:14px;background:#f8fbff;border:1px solid #d9e7f5}.pipe{display:grid;grid-template-columns:1fr 90px 1.2fr;align-items:center;gap:10px}.source,.store{border-radius:13px;padding:12px;text-align:center;font-weight:800}.source{background:#fff2cc;border:2px solid #e0a928}.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.store.k{background:#eaf3ff;border:2px solid #5b91d9}.store.u{background:#f2eaff;border:2px solid #9670c9}.tube{height:34px;position:relative;background:#dfe9f4;border-radius:18px;overflow:hidden}.particle{position:absolute;width:9px;height:9px;border-radius:50%;background:#e2a51f;top:12px;animation:go 1.3s linear infinite}.particle:nth-child(2){animation-delay:-.43s}.particle:nth-child(3){animation-delay:-.86s}@keyframes go{from{left:-10px}to{left:100%}}.meter{height:8px;background:#e4ebf3;border-radius:5px;overflow:hidden;margin-top:7px}.fill{height:100%}.eq{padding:10px;background:#eef6ff;border-radius:10px;line-height:1.65;font-size:13px}.analysis{display:none;margin-top:10px}.analysis.open{display:block}.key{padding:9px 10px;background:#fff7e8;border-radius:10px;margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.pipe{grid-template-columns:1fr}.tube{width:55px;margin:auto}}</style></head><body><main class="w"><div class="hero">第34题｜电梯：主体看运动和能量流，加速度看受力关系</div><div class="desc">主场景展示电梯上升、速度增长、支持力与钢索拉力；下方展示钢索做功如何进入系统并分成动能与重力势能。加速度不作为主动画观察目标，放入可展开“合力→a”分析层。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 520"><defs><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="520" fill="#fbfdff"/><line x1="330" y1="15" x2="330" y2="505" stroke="#cbd5e1" stroke-width="3"/><line x1="670" y1="15" x2="670" y2="505" stroke="#cbd5e1" stroke-width="3"/><g id="e"><rect x="380" y="285" width="240" height="190" fill="#e6eef8" stroke="#334155" stroke-width="4"/><rect x="455" y="405" width="90" height="70" rx="8" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="487" y="447" font-size="25">m</text><text x="570" y="340" font-size="27">M</text></g><line id="cable" stroke="#334155" stroke-width="6"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#g)"/><line id="T" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><line id="v" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#b)"/><g id="lab" font-size="14" font-weight="800"></g><text id="event" x="700" y="55" fill="#173b70" font-size="18" font-weight="900"></text></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><button id="toggle" class="btn">展开加速度分析</button></div><input id="prog" type="range" min="0" max="1" step=".001" value="0" style="width:100%"><div class="flow"><div class="pipe"><div class="source">钢索 / 外界<div style="font-size:12px;color:#65758a">机械做功 W<sub>T</sub></div><div id="WT" style="font-size:22px"></div></div><div class="tube"><i class="particle"></i><i class="particle"></i><i class="particle"></i></div><div class="stores"><div class="store k">动能储存 ΔK<div id="K" style="font-size:21px"></div><div class="meter"><div id="Kbar" class="fill" style="background:#4b83cf"></div></div></div><div class="store u">重力势能储存 ΔU<sub>g</sub><div id="Ug" style="font-size:21px"></div><div class="meter"><div id="Ubar" class="fill" style="background:#8d65c1"></div></div></div></div></div><div class="eq" id="balance"></div></div><div id="analysis" class="analysis"><div class="eq"><b>合力 → 加速度</b><br>对物体 m：N−mg=ma。<br>对整体 M+m：T−(M+m)g=(M+m)a。<br>本题是匀加速，因此 a 在整个运动阶段恒定，不需要从运动外观“猜”出来。</div><div class="key" id="akey"></div></div></div></section><aside><div class="card"><b>参数</b><div class="params"><label>m=<span id="mv"></span> kg<input id="m" type="range" min=".5" max="3" step=".1" value="1"></label><label>M=<span id="Mv"></span> kg<input id="M" type="range" min="2" max="10" step=".5" value="5"></label><label>H=<span id="Hv"></span> m<input id="H" type="range" min="1" max="10" step=".5" value="4"></label><label>末速度=<span id="vfv"></span> m/s<input id="vf" type="range" min="1" max="8" step=".2" value="4"></label></div></div><div class="card"><b>主动画实时量</b><div class="eq" id="data"></div></div><div class="card"><div class="eq">系统视角：<b>W<sub>T</sub>=ΔK+ΔU<sub>g</sub></b>。主视觉表达“做功输入→能量分流”，不是把加速度当主要动画对象。</div></div></aside></div></main><script>(()=>{const $=x=>document.getElementById(x),g=9.8;let u=0,run=false,spd=1,last=performance.now();function P(){return{m:+$('m').value,M:+$('M').value,H:+$('H').value,vf:+$('vf').value}}function line(id,x1,y1,x2,y2){let e=$(id);['x1','y1','x2','y2'].forEach((a,i)=>e.setAttribute(a,[x1,y1,x2,y2][i]))}function draw(){let p=P(),a=p.vf*p.vf/(2*p.H),te=p.vf/a,t=u*te,h=.5*a*t*t,v=a*t,dy=-160*h/p.H,roof=285+dy,cy=440+dy,N=p.m*(g+a),T=(p.M+p.m)*(g+a),K=.5*(p.M+p.m)*v*v,Ug=(p.M+p.m)*g*h,WT=T*h,total=.5*(p.M+p.m)*p.vf*p.vf+(p.M+p.m)*g*p.H;$('e').setAttribute('transform',`translate(0 ${dy})`);line('cable',500,0,500,roof);line('G',500,cy,500,cy+58);line('N',500,cy,500,cy-72);line('T',500,roof,500,roof-90);line('v',700,450+dy,700,450+dy-Math.min(90,v*14));$('v').style.opacity=v>.01?1:0;$('lab').innerHTML=`<text x="510" y="${cy+50}" fill="#b91c1c">mg</text><text x="510" y="${cy-55}" fill="#047857">N</text><text x="510" y="${roof-60}" fill="#1d4ed8">T</text>`;$('event').textContent=u>=1?'到达 H，速度达到 v':'速度箭头持续增长';$('WT').textContent=WT.toFixed(1)+' J';$('K').textContent=K.toFixed(1)+' J';$('Ug').textContent=Ug.toFixed(1)+' J';$('Kbar').style.width=(100*K/Math.max(1,total))+'%';$('Ubar').style.width=(100*Ug/Math.max(1,total))+'%';$('balance').innerHTML=`能量账本：${WT.toFixed(1)} J = ${K.toFixed(1)} J + ${Ug.toFixed(1)} J`;$('data').innerHTML=`t=${t.toFixed(2)} s<br>h=${h.toFixed(2)} m<br>v=${v.toFixed(2)} m/s<br>N=${N.toFixed(1)} N　T=${T.toFixed(1)} N`;$('akey').innerHTML=`由 v²=2aH 得 a=${a.toFixed(2)} m/s²；因此 N=m(g+a)=${N.toFixed(2)} N，T=(M+m)(g+a)=${T.toFixed(2)} N。`;$('mv').textContent=p.m.toFixed(1);$('Mv').textContent=p.M.toFixed(1);$('Hv').textContent=p.H.toFixed(1);$('vfv').textContent=p.vf.toFixed(1);$('prog').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始';document.querySelectorAll('.particle').forEach(x=>x.style.animationPlayState=run?'running':'paused')}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('m').value=1;$('M').value=5;$('H').value=4;$('vf').value=4;draw()};$('prog').oninput=e=>{run=false;u=+e.target.value;draw()};$('toggle').onclick=()=>{$('analysis').classList.toggle('open');$('toggle').textContent=$('analysis').classList.contains('open')?'收起加速度分析':'展开加速度分析'};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{spd=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','H','vf'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){let p=P(),a=p.vf*p.vf/(2*p.H),te=p.vf/a;u+=dt*spd/te;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
