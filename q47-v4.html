<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第47题｜横波传播</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1500px;margin:auto;padding:18px}.title{font-size:29px;font-weight:900;margin:0 0 8px;color:#0e3267}.desc,.card{background:#fff;border:1px solid #d7e3ef;border-radius:15px}.desc{padding:13px 16px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:16px;margin-top:14px}.card{padding:12px}.main{padding:0;overflow:hidden}.sceneArea{padding:10px 12px 0}.chartArea{padding:6px 12px 12px;border-top:1px solid #e6edf5}.scene{width:100%}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#1769e8;color:#fff}.params{display:grid;gap:12px}.params input,.progress{width:100%}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;line-height:1.65;font-size:13px;background:#eef6ff}.analysis{display:none;margin-top:10px}.analysis.open{display:block}.key{padding:9px 10px;background:#fff7e8;border-radius:10px;margin-top:8px}@media(max-width:950px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><h1 class="title">第47题｜横波：主动画看波形和质点速度，加速度看相位关系</h1><section class="desc">主动画固定坐标比例，展示波形沿 +x 传播、关键质点上下运动、速度方向和 y–t 图。加速度不再混在实时数字列表里作为主信息，而改到可展开“位移→恢复加速度”分析层。</section><div class="layout"><section class="card main"><div class="sceneArea"><svg id="scene" class="scene" viewBox="0 0 1040 500"><defs><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1769e8"/></marker><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e53e3e"/></marker></defs><rect width="1040" height="500" fill="#fbfdff"/><line x1="75" y1="250" x2="985" y2="250" stroke="#334155" stroke-width="2"/><line x1="75" y1="60" x2="75" y2="440" stroke="#334155" stroke-width="2"/><text x="990" y="255">x/m</text><text x="42" y="52">y/cm</text><g id="grid"></g><path id="wave" fill="none" stroke="#1769e8" stroke-width="4"/><line x1="565" y1="82" x2="690" y2="82" stroke="#1769e8" stroke-width="3" marker-end="url(#ab)"/><text id="speedLabel" x="575" y="66" fill="#1769e8" font-size="18" font-weight="850"></text><g id="keyMarkers"></g><line id="vyArrow" stroke="#e53e3e" stroke-width="3" marker-end="url(#ar)"/><text id="vyLabel" fill="#e53e3e" font-size="13" font-weight="800">vᵧ</text><text id="timeLabel" x="810" y="42" font-size="18" font-weight="850"></text></svg></div><div class="chartArea"><h3 style="margin:5px 0 6px">当前选中质点的 y–t 图</h3><svg id="chart" viewBox="0 0 760 280" style="width:100%"><line x1="55" y1="140" x2="725" y2="140" stroke="#64748b"/><line x1="55" y1="25" x2="55" y2="245" stroke="#64748b"/><path id="osc" fill="none" stroke="#e53e3e" stroke-width="3"/><line id="cursor" y1="25" y2="245" stroke="#1769e8" stroke-dasharray="5 4"/><circle id="dot" r="5.5" fill="#1769e8"/></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><button id="toggleA" class="btn">展开加速度分析</button></div><input id="progress" class="progress" type="range" min="0" max="1" step=".001" value="0"><div id="analysis" class="analysis"><div class="box"><b>质点加速度不是“波往哪里传播”的加速度。</b><br>对单个质点：aᵧ=−ω²y。质点偏离平衡位置越远，恢复加速度越大，方向永远指向平衡位置。</div><div id="akey" class="key"></div></div></div></section><aside><section class="card"><h3>原题关键位置</h3><div class="controls"><button class="btn kp active" data-x="6">x=6 m</button><button class="btn kp" data-x="18">x=18 m</button><button class="btn kp" data-x="24">x=24 m</button></div></section><section class="card"><h3>参数</h3><div class="params"><label>波速 v：<span id="vv"></span><input id="v" type="range" min="20" max="100" step="5" value="60"></label><label>波长 λ：<span id="lv"></span><input id="lam" type="range" min="12" max="36" step="1" value="24"></label><label>振幅 A：<span id="av"></span><input id="amp" type="range" min="2" max="8" step=".5" value="5"></label></div></section><section class="card"><h3>当前质点</h3><div class="data"><span>x</span><b id="xv"></b><span>T</span><b id="T"></b><span>y</span><b id="y"></b><span>vᵧ</span><b id="vy"></b><span>运动方向</span><b id="dir"></b></div><div class="box">主动画负责“在哪里、向哪运动、速度多大”；加速度原因放在分析层。</div></section></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let t=0,run=false,speed=1,xSel=6,last=performance.now();const X0=75,X1=985,Y0=250,pxX=(X1-X0)/36,pxY=19;function pars(){return{v:+$('v').value,lam:+$('lam').value,A:+$('amp').value}}function yAt(x,t,p){return p.A*Math.cos(2*Math.PI*x/p.lam-2*Math.PI*p.v*t/p.lam)}function vyAt(x,t,p){const om=2*Math.PI*p.v/p.lam;return p.A*om*Math.sin(2*Math.PI*x/p.lam-om*t)}function ayAt(x,t,p){const om=2*Math.PI*p.v/p.lam;return-om*om*yAt(x,t,p)}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function grid(){let s='';for(let x=0;x<=36;x+=6){const sx=X0+x*pxX;s+=`<line x1="${sx}" y1="65" x2="${sx}" y2="435" stroke="#e2e8f0"/><text x="${sx}" y="270" text-anchor="middle" font-size="12" fill="#64748b">${x}</text>`}for(const y of[-9,-6,-3,0,3,6,9]){const sy=Y0-y*pxY;s+=`<line x1="${X0}" y1="${sy}" x2="${X1}" y2="${sy}" stroke="#edf2f7"/><text x="58" y="${sy+4}" text-anchor="end" font-size="12" fill="#64748b">${y}</text>`}$('grid').innerHTML=s}function buildOsc(p){const T=p.lam/p.v,maxT=2*T;let d='';for(let i=0;i<=220;i++){const tt=maxT*i/220,yy=yAt(xSel,tt,p),sx=55+670*i/220,sy=140-yy*11;d+=(i?' L':'M')+sx+' '+sy}$('osc').setAttribute('d',d);return maxT}function draw(){const p=pars(),T=p.lam/p.v,om=2*Math.PI/T;let d='';for(let i=0;i<=320;i++){const x=36*i/320,y=yAt(x,t,p);d+=(i?' L':'M')+(X0+x*pxX)+' '+(Y0-y*pxY)}$('wave').setAttribute('d',d);let m='';for(const x of[6,18,24]){const y=yAt(x,t,p),sx=X0+x*pxX,sy=Y0-y*pxY,sel=x===xSel;m+=`<line x1="${sx}" y1="65" x2="${sx}" y2="435" stroke="${sel?'#7c3aed':'#94a3b8'}" stroke-dasharray="6 5"/><circle cx="${sx}" cy="${sy}" r="${sel?8:6}" fill="#fff" stroke="${sel?'#7c3aed':'#334155'}" stroke-width="2.5"/>`}$('keyMarkers').innerHTML=m;const y=yAt(xSel,t,p),vy=vyAt(xSel,t,p),ay=ayAt(xSel,t,p),sx=X0+xSel*pxX,sy=Y0-y*pxY,frac=Math.abs(vy)/(p.A*om||1),L=55*frac,sg=Math.sign(vy);if(Math.abs(vy)<1e-7){$('vyArrow').style.opacity=0;$('vyLabel').style.opacity=0}else{$('vyArrow').style.opacity=1;$('vyLabel').style.opacity=1;ln('vyArrow',sx,sy,sx,sy-sg*L);$('vyLabel').setAttribute('x',sx+8);$('vyLabel').setAttribute('y',sy-sg*L-7)}$('speedLabel').textContent='v='+p.v.toFixed(0)+' m/s';$('timeLabel').textContent='t='+t.toFixed(3)+' s';$('vv').textContent=p.v.toFixed(0)+' m/s';$('lv').textContent=p.lam.toFixed(0)+' m';$('av').textContent=p.A.toFixed(1)+' cm';$('xv').textContent=xSel+' m';$('T').textContent=T.toFixed(3)+' s';$('y').textContent=(Math.abs(y)<1e-7?'0':y.toFixed(2))+' cm';$('vy').textContent=(Math.abs(vy)<1e-7?'0':vy.toFixed(2))+' cm/s';$('dir').textContent=vy>1e-7?'+y':vy<-1e-7?'−y':'瞬时静止';$('akey').innerHTML=Math.abs(y)<1e-7?`当前 y≈0，因此 aᵧ≈0。质点经过平衡位置时速度通常最大。`:`当前 y=${y.toFixed(2)} cm，所以 aᵧ=${ay.toFixed(2)} cm/s²，方向${ay>0?'向 +y':'向 −y'}，即指向平衡位置。`;const maxT=buildOsc(p),phase=((t%maxT)+maxT)%maxT/maxT,cx=55+670*phase,cy=140-y*11;ln('cursor',cx,25,cx,245);$('dot').setAttribute('cx',cx);$('dot').setAttribute('cy',cy);$('progress').value=phase;$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{run=!run;draw()};$('reset').onclick=()=>{run=false;t=0;xSel=6;$('v').value=60;$('lam').value=24;$('amp').value=5;document.querySelectorAll('.kp').forEach(b=>b.classList.toggle('active',+b.dataset.x===6));draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('.kp').forEach(b=>b.onclick=()=>{xSel=+b.dataset.x;run=false;document.querySelectorAll('.kp').forEach(x=>x.classList.toggle('active',x===b));draw()});['v','lam','amp'].forEach(id=>$(id).oninput=()=>{run=false;t=0;draw()});$('progress').oninput=e=>{run=false;const p=pars();t=+e.target.value*2*p.lam/p.v;draw()};$('toggleA').onclick=()=>{$('analysis').classList.toggle('open');$('toggleA').textContent=$('analysis').classList.contains('open')?'收起加速度分析':'展开加速度分析'};function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(run){t+=dt*speed;const p=pars(),maxT=2*p.lam/p.v;if(t>=maxT)t-=maxT;draw()}requestAnimationFrame(loop)}grid();draw();requestAnimationFrame(loop)})();</script></body></html>
