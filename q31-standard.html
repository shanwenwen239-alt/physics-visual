<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第31题｜高空走钢丝</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#fff7e8;line-height:1.65;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第31题｜长杆为什么能减小同一扰动力矩造成的转动响应</div><div class="desc">当前仓库没有完整原题图片，因此本页只保留已有、可核实的结论：长杆使系统转动惯量 I 增大，同一外界扰动力矩 τ 下角加速度 α=τ/I 变小。页面不再用人为余弦振荡冒充真实平衡过程。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="60" y1="440" x2="940" y2="440" stroke="#475569" stroke-width="5"/><text x="65" y="472" fill="#64748b">钢丝（固定参照）</text><g id="body"><circle cx="500" cy="220" r="28" fill="#ffd7b5" stroke="#263b55" stroke-width="3"/><line x1="500" y1="248" x2="500" y2="345" stroke="#263b55" stroke-width="13"/><line x1="500" y1="345" x2="470" y2="435" stroke="#263b55" stroke-width="10"/><line x1="500" y1="345" x2="530" y2="435" stroke="#263b55" stroke-width="10"/><line id="rod" y1="300" y2="300" stroke="#a66c32" stroke-width="12" stroke-linecap="round"/><circle cx="500" cy="315" r="8" fill="#059669"/></g><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="N" x1="500" y1="440" x2="500" y2="365" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><text id="Gt" fill="#b91c1c" font-weight="800">G</text><text x="510" y="382" fill="#047857" font-weight="800">N</text><path id="arc" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/><text id="thetaT" fill="#6d28d9" font-weight="800">θ</text></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>长杆长度 L：<span id="Lv" class="value"></span><input id="L" type="range" min="2" max="8" step=".2" value="6"></label><label>扰动力矩 τ：<span id="tv" class="value"></span><input id="tau" type="range" min=".2" max="2" step=".1" value="1"></label><label>初始偏角 θ₀：<span id="a0v" class="value"></span><input id="a0" type="range" min="0" max="8" step="1" value="2"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>时间</span><b id="time"></b><span>θ</span><b id="ang"></b><span>相对 I</span><b id="Iv"></b><span>α=τ/I</span><b id="alphav"></b><span>角速度 ω</span><b id="omegav"></b></div></div><div class="card"><div class="box">本页是“短时同扰动力矩比较模型”：在固定时间窗内令 τ 恒定，θ=θ₀+½(τ/I)t²。它只用于展示 I 增大如何降低角响应，不把真实走钢丝过程简化成虚假的周期振荡。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let t=0,run=false,speed=1,last=performance.now(),T=1.5;function P(){return{L:+$('L').value,tau:+$('tau').value,a0:+$('a0').value}}function draw(){const p=P(),I=1+p.L*p.L/12,alpha=p.tau/I,theta=p.a0+.5*alpha*t*t*8,omega=alpha*t;const rad=theta*Math.PI/180,cx=500+125*Math.sin(rad),cy=315-125*Math.cos(rad);$('body').setAttribute('transform',`rotate(${theta} 500 440)`);$('rod').setAttribute('x1',500-p.L*48);$('rod').setAttribute('x2',500+p.L*48);const gl=75;$('G').setAttribute('x1',cx);$('G').setAttribute('y1',cy);$('G').setAttribute('x2',cx);$('G').setAttribute('y2',cy+gl);$('Gt').setAttribute('x',cx+8);$('Gt').setAttribute('y',cy+gl-6);const rr=70;$('arc').setAttribute('d',`M500 370 A70 70 0 0 1 ${500+rr*Math.sin(rad)} ${440-rr*Math.cos(rad)}`);$('thetaT').setAttribute('x',545);$('thetaT').setAttribute('y',390);$('thetaT').textContent='θ '+theta.toFixed(1)+'°';$('Lv').textContent=p.L.toFixed(1);$('tv').textContent=p.tau.toFixed(1);$('a0v').textContent=p.a0.toFixed(0)+'°';$('time').textContent=t.toFixed(2)+' s';$('ang').textContent=theta.toFixed(2)+'°';$('Iv').textContent=I.toFixed(2);$('alphav').textContent=alpha.toFixed(3);$('omegav').textContent=omega.toFixed(3);$('play').textContent=run?'Ⅱ 暂停':t>=T?'↻ 重新开始':t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(t>=T)t=0;run=!run;draw()};$('reset').onclick=()=>{run=false;t=0;$('L').value=6;$('tau').value=1;$('a0').value=2;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['L','tau','a0'].forEach(id=>$(id).oninput=()=>{run=false;t=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;if(t>=T){t=T;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
