<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第31题｜高空走钢丝</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第31题｜高空走钢丝：重心、力矩与转动惯量</div><div class="desc">统一图示规则：力用实线矢量、运动状态用蓝色虚线；右侧集中放播放、参数与实时数据。可调长杆长度和扰动大小，观察长杆如何增大转动惯量、减小角加速度。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="60" y1="430" x2="940" y2="430" stroke="#475569" stroke-width="5"/><text x="65" y="462" fill="#64748b">钢丝</text><g id="body"><circle cx="500" cy="225" r="28" fill="#ffd7b5" stroke="#263b55" stroke-width="3"/><line x1="500" y1="253" x2="500" y2="345" stroke="#263b55" stroke-width="13"/><line x1="500" y1="345" x2="470" y2="425" stroke="#263b55" stroke-width="10"/><line x1="500" y1="345" x2="530" y2="425" stroke="#263b55" stroke-width="10"/><line id="rod" x1="220" y1="300" x2="780" y2="300" stroke="#a66c32" stroke-width="12" stroke-linecap="round"/><circle id="cg" cx="500" cy="315" r="9" fill="#059669"/></g><line id="G" x1="500" y1="315" x2="500" y2="390" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="N" x1="500" y1="430" x2="500" y2="355" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><text id="Gt" class="badge" x="510" y="385" fill="#b91c1c">G</text><text id="Nt" class="badge" x="510" y="370" fill="#047857">N</text><path id="arc" d="M500 430 A80 80 0 0 1 535 358" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/><text x="545" y="365" fill="#6d28d9">θ</text></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>长杆长度 L：<span id="Lv" class="value"></span><input id="L" type="range" min="2" max="8" step="0.2" value="6"></label><label>扰动力矩 τ：<span id="tv" class="value"></span><input id="tau" type="range" min="0.2" max="2" step="0.1" value="1"></label><label>初始偏角 θ₀：<span id="av" class="value"></span><input id="a0" type="range" min="2" max="12" step="1" value="6"></label></div></section><section class="card"><h3 class="title">实时物理量</h3><div class="data"><span>倾角 θ</span><b id="ang">0°</b><span>相对转动惯量 I</span><b id="Iv">—</b><span>角加速度 α=τ/I</span><b id="alphav">—</b></div><div class="box theory">长杆把质量分布到离支点更远的位置，使I增大；同样扰动力矩τ下，α=τ/I减小，因此倾倒更慢、纠偏时间更长。</div><div class="box note">长杆并不是通过“增大摩擦力”来稳定。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,last=performance.now(),t=0;function P(){return{L:+$('L').value,tau:+$('tau').value,a0:+$('a0').value}}function draw(){let p=P(),I=1+p.L*p.L/12,alpha=p.tau/I,ang=p.a0*Math.cos(t*alpha*2.5);$('body').setAttribute('transform',`rotate(${ang} 500 430)`);$('rod').setAttribute('x1',500-p.L*48);$('rod').setAttribute('x2',500+p.L*48);$('Lv').textContent=p.L.toFixed(1);$('tv').textContent=p.tau.toFixed(1);$('av').textContent=p.a0.toFixed(0)+'°';$('ang').textContent=ang.toFixed(1)+'°';$('Iv').textContent=I.toFixed(2);$('alphav').textContent=alpha.toFixed(2)}function label(){$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}function reset(){run=false;t=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['L','tau','a0'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
