<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第31题｜长杆与稳定性</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:27px;font-weight:900;color:#173b70}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:11px 15px;margin:8px 0 14px;line-height:1.65}.layout{display:grid;grid-template-columns:minmax(0,2fr) 345px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700}.primary,.active{background:#2563eb;color:#fff}.params{display:grid;gap:9px}.params input{width:100%}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.6;font-size:13px}.analysis{display:none;margin-top:12px}.analysis.open{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meter{height:18px;background:#e5edf6;border-radius:10px;overflow:hidden}.fill{height:100%;background:#7c3aed}.key{margin-top:8px;padding:9px 10px;background:#fff7e8;border-radius:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.analysis.open{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第31题｜长杆为什么让走钢丝更“慢一点倒”</div><div class="desc">主体动画只展示能直接感知的结果：在同样扰动力矩、同样时间内，杆越长，人的偏转角增长越慢。角加速度不要求学生从动画直接判断，而放入“τ→α”分析层。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#fbfdff"/><line x1="60" y1="440" x2="940" y2="440" stroke="#475569" stroke-width="5"/><text x="65" y="472" fill="#64748b">钢丝（固定参照）</text><g id="body"><circle cx="500" cy="220" r="28" fill="#ffd7b5" stroke="#263b55" stroke-width="3"/><line x1="500" y1="248" x2="500" y2="345" stroke="#263b55" stroke-width="13"/><line x1="500" y1="345" x2="470" y2="435" stroke="#263b55" stroke-width="10"/><line x1="500" y1="345" x2="530" y2="435" stroke="#263b55" stroke-width="10"/><line id="rod" y1="300" y2="300" stroke="#a66c32" stroke-width="12" stroke-linecap="round"/></g><path id="arc" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/><text id="thetaT" fill="#6d28d9" font-weight="900"></text><text id="event" x="670" y="70" fill="#173b70" font-size="18" font-weight="900"></text></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><button id="toggle" class="btn">展开转动响应分析</button></div><div id="analysis" class="analysis"><div><div class="box"><b>同一扰动力矩 τ 下：</b><br>I=I₀+cL²<br>α=τ/I<br>因此杆越长，I越大，角加速度越小。</div><div style="margin-top:10px">相对转动惯量 I</div><div class="meter"><div id="Ibar" class="fill" style="background:#2563eb"></div></div><div style="margin-top:10px">角加速度 α</div><div class="meter"><div id="abar" class="fill"></div></div><div id="akey" class="key"></div></div><div><svg viewBox="0 0 520 245" style="width:100%;border:1px solid #e2e8f0;border-radius:10px"><line x1="55" y1="190" x2="485" y2="190" stroke="#64748b"/><line x1="55" y1="35" x2="55" y2="205" stroke="#64748b"/><text x="470" y="215">L</text><text x="18" y="38">α</text><path id="curve" fill="none" stroke="#7c3aed" stroke-width="4"/><circle id="dot" r="6" fill="#2563eb"/><text x="80" y="58" fill="#475569">α 随 L 增大而减小</text></svg></div></div></div></section><aside><div class="card"><b>参数</b><div class="params"><label>长杆长度 L=<span id="Lv"></span> m<input id="L" type="range" min="2" max="8" step=".2" value="6"></label><label>扰动力矩 τ=<span id="tv"></span><input id="tau" type="range" min=".2" max="2" step=".1" value="1"></label><label>初始偏角 θ₀=<span id="a0v"></span>°<input id="a0" type="range" min="0" max="8" step="1" value="2"></label></div></div><div class="card"><b>主体动画实时量</b><div class="data"><span>时间</span><b id="time"></b><span>偏角 θ</span><b id="ang"></b><span>角速度 ω</span><b id="omegav"></b></div></div><div class="card"><div class="box">这是短时扰动比较模型，只表达“同扰动力矩下，长杆让转动响应更慢”。不模拟真实人体主动调节，也不伪造周期振荡。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let t=0,run=false,speed=1,last=performance.now(),T=1.5;function P(){return{L:+$('L').value,tau:+$('tau').value,a0:+$('a0').value}}function vals(p){const I=1+p.L*p.L/12,alpha=p.tau/I,theta=p.a0+.5*alpha*t*t*8,omega=alpha*t;return{I,alpha,theta,omega}}function curve(p){let d='';for(let i=0;i<=120;i++){const L=2+6*i/120,I=1+L*L/12,a=p.tau/I,x=55+430*i/120,y=190-125*a/2;d+=(i?' L':'M')+x+' '+y}$('curve').setAttribute('d',d);const x=55+430*(p.L-2)/6,y=190-125*(p.tau/(1+p.L*p.L/12))/2;$('dot').setAttribute('cx',x);$('dot').setAttribute('cy',y)}function draw(){const p=P(),q=vals(p),rad=q.theta*Math.PI/180;$('body').setAttribute('transform',`rotate(${q.theta} 500 440)`);$('rod').setAttribute('x1',500-p.L*48);$('rod').setAttribute('x2',500+p.L*48);const rr=70;$('arc').setAttribute('d',`M500 370 A70 70 0 0 1 ${500+rr*Math.sin(rad)} ${440-rr*Math.cos(rad)}`);$('thetaT').setAttribute('x',545);$('thetaT').setAttribute('y',390);$('thetaT').textContent='θ '+q.theta.toFixed(1)+'°';$('event').textContent='杆越长，同时间内偏转越少';$('Lv').textContent=p.L.toFixed(1);$('tv').textContent=p.tau.toFixed(1);$('a0v').textContent=p.a0.toFixed(0);$('time').textContent=t.toFixed(2)+' s';$('ang').textContent=q.theta.toFixed(2)+'°';$('omegav').textContent=q.omega.toFixed(3);$('Ibar').style.width=Math.min(100,100*q.I/(1+64/12))+'%';$('abar').style.width=Math.min(100,100*q.alpha/2)+'%';$('akey').innerHTML=`当前 I=${q.I.toFixed(2)}，α=${q.alpha.toFixed(3)}。改变 L 时，主动画只显示偏转结果；α 的原因在这里看。`;curve(p);$('play').textContent=run?'Ⅱ 暂停':t>=T?'↻ 重新开始':t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(t>=T)t=0;run=!run;draw()};$('reset').onclick=()=>{run=false;t=0;$('L').value=6;$('tau').value=1;$('a0').value=2;draw()};$('toggle').onclick=()=>{$('analysis').classList.toggle('open');$('toggle').textContent=$('analysis').classList.contains('open')?'收起转动响应分析':'展开转动响应分析';draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['L','tau','a0'].forEach(id=>$(id).oninput=()=>{run=false;t=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;if(t>=T){t=T;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
