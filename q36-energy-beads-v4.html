<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第36题｜能量珠接力</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:27px;font-weight:900;color:#173b70}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:11px 15px;margin:8px 0 14px;line-height:1.65}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700}.primary,.active{background:#2563eb;color:#fff}.ledger{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tank{min-height:145px;border-radius:14px;padding:10px;border:2px solid #d8e3ef;background:#fbfdff}.tank h4{margin:0 0 8px;text-align:center}.beads{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-end;min-height:78px}.bead{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 -2px 3px #0002}.springB{background:#e9a23b}.kinB{background:#4b8bd8}.gravB{background:#946bc7}.count{text-align:center;font-weight:900;margin-top:7px}.stage{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65}.params{display:grid;gap:10px}.params input{width:100%}.analysis{display:none;margin-top:10px}.analysis.open{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meter{height:17px;background:#e5edf6;border-radius:9px;overflow:hidden}.fill{height:100%;background:#7c3aed}.key{padding:9px 10px;background:#fff7e8;border-radius:10px;margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.ledger{grid-template-columns:1fr}.analysis.open{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第36题｜弹簧抛球：主动画看运动，能量看转移，加速度看合力</div><div class="desc">主体动画保留小球上升、弹簧恢复、脱离、速度箭头变化和能量珠转移。加速度不是主要视觉对象，改到可展开分析层，通过 Fₛ−mg 与关键时刻解释。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 520"><defs><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="520" fill="#fbfdff"/><line x1="90" y1="475" x2="910" y2="475" stroke="#94a3b8" stroke-width="3"/><line x1="330" y1="350" x2="670" y2="350" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="680" y="355" fill="#64748b">弹簧自然长顶端</text><path id="spring" fill="none" stroke="#56677a" stroke-width="5"/><circle id="ball" r="27" fill="#ffd8d8" stroke="#983535" stroke-width="3"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><line id="Fs" stroke="#059669" stroke-width="3" marker-end="url(#g)"/><line id="v" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#b)"/><g id="lab" font-size="14" font-weight="800"></g><text id="event" x="680" y="70" font-size="18" font-weight="900" fill="#173b70"></text></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><button id="toggle" class="btn">展开加速度分析</button></div><input id="prog" type="range" min="0" max="1" step=".001" value="0" style="width:100%"><div id="stage" class="stage"></div><div class="ledger"><div class="tank"><h4>弹簧储能 Uₛ</h4><div id="bs" class="beads"></div><div id="cs" class="count"></div></div><div class="tank"><h4>动能 K</h4><div id="bk" class="beads"></div><div id="ck" class="count"></div></div><div class="tank"><h4>重力势能 ΔU<sub>g</sub></h4><div id="bg" class="beads"></div><div id="cg" class="count"></div></div></div><div class="stage" style="margin-top:10px">总能量：<b id="Et"></b>　｜　48颗能量珠始终守恒</div><div id="analysis" class="analysis"><div><div class="stage"><b>接触阶段：</b>F合=Fₛ−mg，a=(Fₛ−mg)/m。<br><b>脱离后：</b>只有重力，a=−g。</div><div style="margin-top:8px">当前 |F合| / mg</div><div class="meter"><div id="fbar" class="fill"></div></div><div id="akey" class="key"></div></div><div><svg viewBox="0 0 520 245" style="width:100%;border:1px solid #e2e8f0;border-radius:10px"><line x1="55" y1="190" x2="485" y2="190" stroke="#64748b"/><line x1="55" y1="35" x2="55" y2="205" stroke="#64748b"/><text x="468" y="215">阶段</text><text x="18" y="38">a</text><line x1="70" y1="70" x2="250" y2="150" stroke="#7c3aed" stroke-width="4"/><line x1="250" y1="150" x2="470" y2="150" stroke="#7c3aed" stroke-width="4"/><circle id="adot" r="6" fill="#2563eb"/><text x="78" y="58" fill="#475569">接触：a 由 Fₛ−mg 决定</text><text x="290" y="138" fill="#475569">脱离后 a=−g</text></svg></div></div></div></section><aside><div class="card"><b>参数</b><div class="params"><label>m=<span id="mv"></span> kg<input id="m" type="range" min=".5" max="1.5" step=".1" value="1"></label><label>k=<span id="kv"></span> N/m<input id="k" type="range" min="80" max="180" step="5" value="120"></label><label>初始压缩 x₀=<span id="x0v"></span> m<input id="x0" type="range" min=".18" max=".6" step=".01" value=".3"></label></div></div><div class="card"><div id="data" class="stage"></div></div><div class="card"><div class="stage"><b>关键事件</b><br>① 初始：Uₛ最大。<br>② Fₛ=mg：合力为0，速度达到最大。<br>③ x=0：脱离弹簧。<br>④ 脱离后：K→ΔU<sub>g</sub>。<br>⑤ 最高点：v=0。</div></div></aside></div></main><script>(()=>{const $=x=>document.getElementById(x),g=9.8,NBEAD=48,yNat=350,baseY=475,scale=110;let u=0,run=false,spd=1,last=performance.now();function enforce(){let m=+$('m').value,k=+$('k').value,min=2.05*m*g/k;if(+$('x0').value<min)$('x0').value=Math.min(.6,min)}function P(){enforce();return{m:+$('m').value,k:+$('k').value,x0:+$('x0').value}}function model(p){let w=Math.sqrt(p.k/p.m),xe=p.m*g/p.k,A=p.x0-xe,phi=Math.acos(-xe/A),td=phi/w,vd=A*w*Math.sin(phi),tf=vd/g;return{w,xe,A,td,vd,tf,total:td+tf}}function S(p,M){let t=u*M.total;if(t<=M.td){let x=M.xe+M.A*Math.cos(M.w*t),v=M.A*M.w*Math.sin(M.w*t);return{phase:'接触阶段：弹簧恢复，小球上升',x,v,h:p.x0-x,Fs:p.k*x,t,contact:true}}let q=t-M.td,v=Math.max(0,M.vd-g*q),h=p.x0+M.vd*q-.5*g*q*q;return{phase:q>=M.tf?'最高点：v=0':'脱离后自由上升',x:0,v,h,Fs:0,t,contact:false}}function path(top){let d=`M500 ${baseY}`,n=10;for(let i=1;i<2*n;i++){let y=baseY+(top-baseY)*i/(2*n),x=500+(i%2?-17:17);d+=` L${x} ${y}`}return d+` L500 ${top}`}function line(id,x1,y1,x2,y2){let e=$(id);['x1','y1','x2','y2'].forEach((a,i)=>e.setAttribute(a,[x1,y1,x2,y2][i]))}function beads(id,n,cls){$(id).innerHTML=Array.from({length:n},()=>`<i class="bead ${cls}"></i>`).join('')}function draw(){let p=P(),M=model(p),s=S(p,M),top=s.x>0?yNat+s.x*scale:yNat,cy=s.x>0?top-27:yNat-27-(s.h-p.x0)*scale;$('spring').setAttribute('d',path(top));$('ball').setAttribute('cx',500);$('ball').setAttribute('cy',cy);line('G',500,cy,500,cy+55);line('Fs',500,cy,500,cy-Math.min(110,s.Fs*3));$('Fs').style.opacity=s.Fs>.01?1:0;line('v',545,cy,545,cy-Math.min(105,s.v*20));$('v').style.opacity=s.v>.01?1:0;$('lab').innerHTML=`<text x="510" y="${cy+48}" fill="#b91c1c">G</text>${s.Fs>.01?`<text x="510" y="${cy-65}" fill="#047857">Fₛ</text>`:''}${s.v>.01?`<text x="555" y="${cy-50}" fill="#1d4ed8">v</text>`:''}`;let Us=.5*p.k*s.x*s.x,K=.5*p.m*s.v*s.v,Ug=p.m*g*s.h,E0=.5*p.k*p.x0*p.x0,err=E0-(Us+K+Ug);Ug+=err;let ns=Math.max(0,Math.round(NBEAD*Us/E0)),nk=Math.max(0,Math.round(NBEAD*K/E0));if(ns+nk>NBEAD)nk=NBEAD-ns;let ng=NBEAD-ns-nk;beads('bs',ns,'springB');beads('bk',nk,'kinB');beads('bg',ng,'gravB');$('cs').textContent=`${ns}颗 · ${Us.toFixed(2)} J`;$('ck').textContent=`${nk}颗 · ${K.toFixed(2)} J`;$('cg').textContent=`${ng}颗 · ${Ug.toFixed(2)} J`;$('Et').textContent=`${(Us+K+Ug).toFixed(2)} J = 初始 ${E0.toFixed(2)} J`;$('stage').textContent=s.phase;$('data').innerHTML=`x=${s.x.toFixed(3)} m<br>v=${s.v.toFixed(2)} m/s<br>Fₛ=${s.Fs.toFixed(1)} N<br>Δh=${s.h.toFixed(3)} m`;$('mv').textContent=p.m.toFixed(1);$('kv').textContent=p.k.toFixed(0);$('x0v').textContent=p.x0.toFixed(2);let fnet=s.contact?s.Fs-p.m*g:-p.m*g,ratio=Math.min(2,Math.abs(fnet)/(p.m*g));$('fbar').style.width=(50*ratio)+'%';let key='';if(s.contact&&Math.abs(s.Fs-p.m*g)<.6)key='关键事件：Fₛ≈mg，合力≈0，因此速度达到最大。';else if(s.contact)key=`接触阶段：F合=${fnet.toFixed(2)} N，方向${fnet>=0?'向上':'向下'}。`;else key='脱离后只受重力：a=−g。';$('akey').textContent=key;$('event').textContent=s.contact?(Math.abs(s.Fs-p.m*g)<.6?'Fₛ≈mg：速度最大':'弹簧推动小球上升'):(s.v>0?'已脱离：自由上升':'最高点');let ax=s.contact?70+180*(1-s.x/p.x0):250+220*Math.min(1,(s.t-M.td)/M.tf),ay=s.contact?70+80*(1-s.x/p.x0):150;$('adot').setAttribute('cx',ax);$('adot').setAttribute('cy',ay);$('prog').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('m').value=1;$('k').value=120;$('x0').value=.3;draw()};$('prog').oninput=e=>{run=false;u=+e.target.value;draw()};$('toggle').onclick=()=>{$('analysis').classList.toggle('open');$('toggle').textContent=$('analysis').classList.contains('open')?'收起加速度分析':'展开加速度分析';draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{spd=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','k','x0'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){let p=P(),M=model(p);u+=dt*spd/M.total;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
