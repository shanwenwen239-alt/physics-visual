<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第34题｜电梯加速上升</title><style>body{margin:0;font-family:system-ui,'Microsoft YaHei';background:#f5f8fc;color:#10233f}.w{max-width:1350px;margin:auto;padding:18px}.hero{background:linear-gradient(90deg,#376eae,#24558f);color:#fff;padding:13px 22px;border-radius:12px;font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:2fr .8fr;gap:14px}.card{background:#fff;border:1px solid #d7e3f1;border-radius:15px;padding:14px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%}.btn{padding:9px 15px;border:1px solid #ccd9e8;border-radius:9px;background:#fff}.primary{background:#1672ee;color:#fff}.data{display:grid;grid-template-columns:1fr auto;gap:10px}.note{background:#fff8d9;padding:11px;border-radius:10px;line-height:1.7;margin-top:10px}.ok{background:#eafaf2;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第34题　电梯由静止加速上升</div><p>电梯质量 M，地板上物体质量 m。电梯从静止上升高度 H 时速度达到 v。用动画同步观察位移、速度、支持力做功和系统能量。</p><div class="grid"><div><section class="card"><svg class="scene" viewBox="0 0 900 430"><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1672ee"/></marker></defs><line x1="280" y1="30" x2="280" y2="410" stroke="#cbd5e1" stroke-width="4"/><line x1="620" y1="30" x2="620" y2="410" stroke="#cbd5e1" stroke-width="4"/><g id="lift"><rect x="335" y="210" width="230" height="170" rx="8" fill="#e7eef7" stroke="#263b55" stroke-width="5"/><rect x="415" y="310" width="70" height="55" rx="8" fill="#b9d7ff" stroke="#163f8c" stroke-width="3"/><text x="443" y="345" font-size="26">m</text></g><line id="v" x1="590" y1="290" x2="590" y2="205" stroke="#1672ee" stroke-width="6" marker-end="url(#b)"/><text id="vt" x="605" y="230" fill="#1672ee" font-size="22">v</text><line x1="450" y1="205" x2="450" y2="80" stroke="#f59e0b" stroke-width="5" marker-end="url(#b)"/><text x="465" y="100" fill="#b45309">钢索拉力</text></svg></section><section class="card" style="margin-top:10px"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><input id="t" type="range" min="0" max="1" step=".001" value="0" style="width:65%"></section></div><aside class="card"><h3>实时数据</h3><div class="data"><span>上升高度</span><b id="h" style="color:#12a85a">0 H</b><span>速度</span><b id="vv" style="color:#1672ee">0 v</b><span>物体支持力</span><b>N &gt; mg</b><span>支持力做功</span><b id="wn">0</b></div><div class="note"><b>物理基础核实</b><br>对物体 m：W<sub>N</sub>+W<sub>g</sub>=ΔK，因此 W<sub>N</sub>=½mv²+mgH ＞ ½mv²。对电梯整体，钢索拉力的功还要提供重力势能增长以及系统动能增长。</div><div class="ok"><b>结论：B、D。</b><br>支持力做功大于 ½mv²；钢索拉力做功大于只计电梯 M 的 ½Mv²+MgH。</div></aside></div><script>let p=0,run=false,last=0;const lift=document.getElementById('lift'),sl=document.getElementById('t');function draw(){lift.setAttribute('transform',`translate(0 ${-145*p})`);document.getElementById('v').setAttribute('y2',205-70*p);document.getElementById('h').textContent=p.toFixed(2)+' H';document.getElementById('vv').textContent=Math.sqrt(p).toFixed(2)+' v';document.getElementById('wn').textContent='½m('+p.toFixed(2)+'v²)+mg('+p.toFixed(2)+'H)';sl.value=p}document.getElementById('play').onclick=()=>run=true;document.getElementById('pause').onclick=()=>run=false;document.getElementById('reset').onclick=()=>{run=false;p=0;draw()};sl.oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){if(!last)last=n;if(run){p+=(n-last)/5000;if(p>=1){p=1;run=false}}last=n;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></main></body></html>
