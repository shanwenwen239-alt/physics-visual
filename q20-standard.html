<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第20题｜弹簧-木板-物块</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第20题｜弹簧—木板—物块：真实受力与相对运动</div><div class="desc">弹簧左端固定在木板竖直挡板上，右端连接物块。模型显示重力、支持力、摩擦力、弹簧力和外力，并允许调整 m、M、F、k、μ。物块始终保持在木板上表面，弹簧始终与挡板和物块相连。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="gold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="25" y1="470" x2="975" y2="470" stroke="#a9b7c6" stroke-width="3"/><g id="world"><g id="board"><rect x="120" y="350" width="760" height="95" rx="12" fill="#ffe59a" stroke="#6d5620" stroke-width="3"/><line id="wall" x1="300" y1="220" x2="300" y2="350" stroke="#334155" stroke-width="10"/><text x="720" y="408" font-size="38">M</text></g><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><g id="block"><rect x="0" y="0" width="110" height="76" rx="11" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="45" y="48" font-size="30">m</text></g></g><g id="forces"><line id="Gm" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Nm" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="fm" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="Fsm" stroke="#7c3aed" stroke-width="3" marker-end="url(#blue)"/><line id="GM" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Ng" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="fM" stroke="#d97706" stroke-width="3" marker-end="url(#gold)"/><line id="Fext" stroke="#2563eb" stroke-width="3.2" marker-end="url(#blue)"/><text id="Gmt" class="badge" fill="#b91c1c">Gₘ</text><text id="Nmt" class="badge" fill="#047857">N</text><text id="fmt" class="badge" fill="#a16207">f</text><text id="Fsmt" class="badge" fill="#6d28d9">Fₛ</text><text id="GMt" class="badge" fill="#b91c1c">Gᴹ</text><text id="Ngt" class="badge" fill="#047857">N地</text><text id="fMt" class="badge" fill="#a16207">f</text><text id="Fextt" class="badge" fill="#1d4ed8">F</text></g><line id="vm" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="vM" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><text id="vmt" class="badge" fill="#1d4ed8">vₘ</text><text id="vMt" class="badge" fill="#1d4ed8">vᴹ</text><text x="710" y="58" fill="#64748b" font-size="14">实线=力｜蓝色虚线=速度</text></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>物块 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>木板 M：<span id="Mv" class="value"></span><input id="M" type="range" min="1" max="4" step="0.1" value="2"></label><label>外力 F：<span id="Fv" class="value"></span><input id="F" type="range" min="0" max="8" step="0.2" value="3"></label><label>劲度系数 k：<span id="kv" class="value"></span><input id="k" type="range" min="0.5" max="4" step="0.1" value="1.5"></label><label>摩擦因数 μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max="0.5" step="0.02" value="0"></label></div></section><section class="card"><h3 class="title">实时数据</h3><div class="data"><span>相对位移 x</span><b id="xv">0</b><span>弹簧力 |Fₛ|</span><b id="fsv">0</b><span>摩擦力 |f|</span><b id="fv">0</b><span>vₘ−vᴹ</span><b id="rv">0</b></div><div class="box theory"><b>规则：</b>G始终竖直向下；N始终竖直向上；摩擦力与相对滑动方向相反；弹簧力沿弹簧；外力F作用在木板上。μ=0时，摩擦力显示为0。</div><div class="box note">参数改变后会从同一初始状态重新计算，不只是改显示数字。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,last=performance.now();let s;const g=9.8,L0=300;function P(){return{m:+$('m').value,M:+$('M').value,F:+$('F').value,k:+$('k').value,mu:+$('mu').value}}function init(){s={xM:0,vM:0,xm:L0,v:0,t:0};run=false;draw();label()}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function spring(x1,x2,y){let d=`M${x1} ${y}`,n=10;for(let i=1;i<2*n;i++){let x=x1+(x2-x1)*i/(2*n),yy=y+(i%2?-13:13);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function forces(){let p=P(),ext=(s.xm-s.xM)-L0,Fs=-p.k*ext,rel=s.v-s.vM,fr=Math.abs(rel)<.002?0:-Math.sign(rel)*p.mu*p.m*g;return{Fs,fr}}function step(dt){let p=P(),q=forces(),am=(q.Fs+q.fr)/p.m,aM=(-p.F-q.Fs-q.fr)/p.M;s.v+=am*dt;s.vM+=aM*dt;s.xm+=s.v*dt;s.xM+=s.vM*dt;s.t+=dt}function draw(){let p=P(),q=forces(),rel=(s.xm-s.xM)-L0,camera=s.xM,wall=300,blockX=600+(s.xm-s.xM-L0)*45;blockX=Math.max(370,Math.min(810,blockX));$('board').setAttribute('transform','translate(0 0)');$('block').setAttribute('transform',`translate(${blockX} 274)`);$('spring').setAttribute('d',spring(wall,blockX,312));let cx=blockX+55,cy=312,gm=50*p.m,Nm=gm;line('Gm',cx,cy,cx,cy+gm);line('Nm',cx,cy,cx,cy-Nm);line('fm',cx,cy+26,cx+Math.sign(q.fr||1)*Math.min(70,Math.abs(q.fr)*12),cy+26);line('Fsm',cx,cy,cx+Math.sign(q.Fs||1)*Math.min(90,Math.abs(q.Fs)*12),cy);$('fm').style.opacity=Math.abs(q.fr)<.01?0:1;$('fmt').style.opacity=Math.abs(q.fr)<.01?0:1;$('Fsm').style.opacity=Math.abs(q.Fs)<.01?0:1;$('Fsmt').style.opacity=Math.abs(q.Fs)<.01?0:1;line('GM',700,397,700,397+35*p.M);line('Ng',700,397,700,397-35*(p.M+p.m));line('fM',500,395,500-Math.sign(q.fr||1)*Math.min(70,Math.abs(q.fr)*12),395);$('fM').style.opacity=Math.abs(q.fr)<.01?0:1;$('fMt').style.opacity=Math.abs(q.fr)<.01?0:1;line('Fext',160,395,160-Math.min(100,p.F*12),395);line('vm',cx,245,cx+Math.max(-110,Math.min(110,s.v*20)),245);line('vM',220,325,220+Math.max(-110,Math.min(110,s.vM*20)),325);[['Gmt',cx+8,cy+gm-8],['Nmt',cx+8,cy-Nm+12],['fmt',cx+15,cy+18],['Fsmt',cx+15,cy-12],['GMt',708,430],['Ngt',708,360],['fMt',450,385],['Fextt',90,383],['vmt',cx+18,235],['vMt',230,315]].forEach(a=>{$(a[0]).setAttribute('x',a[1]);$(a[0]).setAttribute('y',a[2])});$('mv').textContent=p.m.toFixed(1);$('Mv').textContent=p.M.toFixed(1);$('Fv').textContent=p.F.toFixed(1);$('kv').textContent=p.k.toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('xv').textContent=rel.toFixed(2);$('fsv').textContent=Math.abs(q.Fs).toFixed(2);$('fv').textContent=Math.abs(q.fr).toFixed(2);$('rv').textContent=(s.v-s.vM).toFixed(2)}function label(){$('play').textContent=run?'Ⅱ 暂停':s.t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=init;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','F','k','mu'].forEach(i=>$(i).oninput=init);function loop(n){let dt=Math.min(.02,(n-last)/1000);last=n;if(run){for(let i=0;i<3;i++)step(dt*speed/3);draw()}requestAnimationFrame(loop)}init();requestAnimationFrame(loop)})();</script></body></html>
