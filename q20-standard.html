<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第20题｜弹簧-木板-物块</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:white;border-color:#2563eb}.params{display:grid;gap:11px}.params input{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:920px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第20题｜弹簧—木板—物块：同一参考系下的真实相对运动</div><div class="desc">木板 M 位于光滑水平地面，外力 F 向左作用于木板；弹簧一端固定在木板挡板，另一端连接物块 m。模型同时处理静摩擦与滑动摩擦：相对速度为0时先判断能否“粘住”，不能粘住才进入滑动。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1040 580"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><marker id="purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker></defs><rect width="1040" height="580" fill="#fbfdff"/><g id="groundTicks"></g><line x1="20" y1="505" x2="1020" y2="505" stroke="#94a3b8" stroke-width="3"/><g id="board"><rect x="100" y="355" width="820" height="110" rx="12" fill="#ffe59a" stroke="#6d5620" stroke-width="3"/><line x1="275" y1="225" x2="275" y2="355" stroke="#334155" stroke-width="10"/><text x="790" y="425" font-size="36">M</text></g><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><g id="block"><rect width="110" height="76" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="45" y="48" font-size="30">m</text></g><line id="Gm" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Nm" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="fm" stroke="#d97706" stroke-width="3" marker-end="url(#orange)"/><line id="Fs" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/><line id="GM" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Ng" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="fReact" stroke="#d97706" stroke-width="3" marker-end="url(#orange)"/><line id="Fext" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><line id="vm" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="vM" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><text id="labels" fill="#334155" font-size="13"></text><g id="texts" font-size="14" font-weight="800"></g></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step=".1" value="1"></label><label>M：<span id="Mv" class="value"></span><input id="M" type="range" min="1" max="4" step=".1" value="2"></label><label>外力 F：<span id="Fv" class="value"></span><input id="F" type="range" min="0" max="8" step=".2" value="3"></label><label>劲度 k：<span id="kv" class="value"></span><input id="k" type="range" min=".5" max="4" step=".1" value="1.5"></label><label>摩擦因数 μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max=".5" step=".02" value=".2"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>摩擦状态</span><b id="mode"></b><span>弹簧形变量 x</span><b id="xv"></b><span>弹簧力 Fs</span><b id="fsv"></b><span>摩擦力 f</span><b id="fv"></b><span>vₘ</span><b id="vmv"></b><span>vᴹ</span><b id="vMv"></b><span>vₘ−vᴹ</span><b id="relv"></b></div></div><div class="card"><div class="box">若相对静止，先计算维持共同加速度所需的静摩擦力；只有超过 μmg 才进入滑动。滑动时 f=μmg，方向始终反对相对运动。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8,L0=5;let run=false,speed=1,last=performance.now(),s;function P(){return{m:+$('m').value,M:+$('M').value,F:+$('F').value,k:+$('k').value,mu:+$('mu').value}}function init(){s={xM:0,vM:0,xm:L0,vm:0,t:0,mode:'stick'};run=false;draw()}function springPath(x1,x2,y){let d=`M${x1} ${y}`,n=11;for(let i=1;i<2*n;i++){let x=x1+(x2-x1)*i/(2*n),yy=y+(i%2?-12:12);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function calc(){const p=P(),ext=(s.xm-s.xM)-L0,Fs=-p.k*ext,rel=s.vm-s.vM,amax=p.mu*p.m*g;let fr,aM,am,mode;if(Math.abs(rel)<.008){const aCommon=-p.F/(p.M+p.m),frReq=p.m*aCommon-Fs;if(Math.abs(frReq)<=amax+1e-9){fr=frReq;am=aM=aCommon;mode='静摩擦：共同运动'}else{const a0m=Fs/p.m,a0M=(-p.F-Fs)/p.M,tend=a0m-a0M;fr=-Math.sign(tend||1)*amax;am=(Fs+fr)/p.m;aM=(-p.F-Fs-fr)/p.M;mode='滑动摩擦'}}else{fr=-Math.sign(rel)*amax;am=(Fs+fr)/p.m;aM=(-p.F-Fs-fr)/p.M;mode='滑动摩擦'}return{p,ext,Fs,fr,am,aM,rel,mode}}function step(dt){const q=calc();const oldRel=s.vm-s.vM;s.vm+=q.am*dt;s.vM+=q.aM*dt;s.xm+=s.vm*dt;s.xM+=s.vM*dt;s.t+=dt;const newRel=s.vm-s.vM;if(oldRel*newRel<0){s.vm=s.vM=(q.p.m*s.vm+q.p.M*s.vM)/(q.p.m+q.p.M)}s.mode=q.mode}function arr(id,cx,cy,fx,fy,scale,max=95){const mag=Math.hypot(fx,fy);if(mag<1e-6){$(id).style.opacity=0;return}$(id).style.opacity=1;const L=Math.min(max,mag*scale);ln(id,cx,cy,cx+L*fx/mag,cy-L*fy/mag)}function draw(){const q=calc(),p=q.p;const relPos=s.xm-s.xM,wall=275,blockX=wall+120+(relPos-(L0-3))*55;const bx=Math.max(360,Math.min(820,blockX));$('block').setAttribute('transform',`translate(${bx} 279)`);$('spring').setAttribute('d',springPath(wall,bx,317));const cx=bx+55,cy=317;arr('Gm',cx,cy,0,-p.m*g,4.2);arr('Nm',cx,cy,0,p.m*g,4.2);arr('fm',cx,cy+24,q.fr,0,10);arr('Fs',cx,cy,q.Fs,0,14);arr('GM',740,410,0,-p.M*g,2.6);arr('Ng',740,410,0,(p.M+p.m)*g,2.0);arr('fReact',560,410,-q.fr,0,10);arr('Fext',190,410,-p.F,0,16);arr('vm',cx,250,s.vm,0,22);arr('vM',220,335,s.vM,0,22);let tx='';const labels=[['G',cx+8,cy+50,'#b91c1c'],['N',cx+8,cy-48,'#047857'],['f',cx-5,cy+18,'#a16207'],['Fs',cx-5,cy-12,'#6d28d9'],['Mg',748,455,'#b91c1c'],['N地',748,360,'#047857'],['−f',560,395,'#a16207'],['F',140,397,'#1d4ed8'],['vₘ',cx+10,238,'#1d4ed8'],['vᴹ',230,323,'#1d4ed8']];labels.forEach(([t,x,y,c])=>tx+=`<text x="${x}" y="${y}" fill="${c}">${t}</text>`);$('texts').innerHTML=tx;let ticks='';const offset=((s.xM*55)%50+50)%50;for(let x=-50;x<1100;x+=50)ticks+=`<line x1="${x-offset}" y1="505" x2="${x-offset}" y2="515" stroke="#cbd5e1"/>`;$('groundTicks').innerHTML=ticks;$('mv').textContent=p.m.toFixed(1);$('Mv').textContent=p.M.toFixed(1);$('Fv').textContent=p.F.toFixed(1);$('kv').textContent=p.k.toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('mode').textContent=q.mode;$('xv').textContent=q.ext.toFixed(3);$('fsv').textContent=q.Fs.toFixed(3);$('fv').textContent=q.fr.toFixed(3);$('vmv').textContent=s.vm.toFixed(3);$('vMv').textContent=s.vM.toFixed(3);$('relv').textContent=(s.vm-s.vM).toFixed(3);$('play').textContent=run?'Ⅱ 暂停':s.t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{run=!run;draw()};$('reset').onclick=()=>{$('m').value=1;$('M').value=2;$('F').value=3;$('k').value=1.5;$('mu').value=.2;init()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','F','k','mu'].forEach(id=>$(id).oninput=init);function loop(n){const dt=Math.min(.018,(n-last)/1000);last=n;if(run){for(let i=0;i<4;i++)step(dt*speed/4);draw()}requestAnimationFrame(loop)}init();requestAnimationFrame(loop)})();</script></body></html>
