<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第20题｜弹簧-木板-物块</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}.badge{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}@media(max-width:920px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第20题｜弹簧—木板—物块</div><div class="desc">木板 M 在光滑水平地面上，外力 F 向左作用于木板；弹簧左端固定在木板挡板上，右端连接物块 m。播放时木板与物块按同一组动力学方程运动，弹簧会随两者相对距离连续伸长或压缩。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1040 580"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><marker id="purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker></defs><rect width="1040" height="580" fill="#fbfdff"/><line x1="20" y1="505" x2="1020" y2="505" stroke="#94a3b8" stroke-width="3"/><g id="ticks"></g><g id="boardWorld"><rect x="100" y="355" width="820" height="110" rx="12" fill="#ffe59a" stroke="#6d5620" stroke-width="3"/><line x1="275" y1="225" x2="275" y2="355" stroke="#334155" stroke-width="10"/><text x="790" y="425" font-size="36">M</text><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><g id="block"><rect width="110" height="76" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="45" y="48" font-size="30">m</text></g></g><g id="forces"><line id="Gm" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Nm" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="fm" stroke="#d97706" stroke-width="3" marker-end="url(#orange)"/><line id="Fs" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/><line id="Fext" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><line id="vm" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="vM" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><text id="Gt" class="badge" fill="#b91c1c">G</text><text id="Nt" class="badge" fill="#047857">N</text><text id="ft" class="badge" fill="#a16207">f</text><text id="Fst" class="badge" fill="#6d28d9">Fₛ</text><text id="Fextt" class="badge" fill="#1d4ed8">F</text><text id="vmt" class="badge" fill="#1d4ed8">vₘ</text><text id="vMt" class="badge" fill="#1d4ed8">vᴹ</text></g><text x="720" y="55" fill="#64748b" font-size="14">实线=力｜蓝色虚线=速度</text></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step=".1" value="1"></label><label>M：<span id="Mv" class="value"></span><input id="M" type="range" min="1" max="4" step=".1" value="2"></label><label>外力 F：<span id="Fv" class="value"></span><input id="F" type="range" min="0" max="8" step=".2" value="3"></label><label>劲度 k：<span id="kv" class="value"></span><input id="k" type="range" min="0.5" max="4" step=".1" value="1.5"></label><label>摩擦因数 μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max="0.5" step=".02" value=".2"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>阶段</span><b id="mode"></b><span>弹簧形变量 x</span><b id="xv"></b><span>弹簧力 Fₛ</span><b id="fsv"></b><span>摩擦力 f</span><b id="fv"></b><span>vₘ</span><b id="vmv"></b><span>vᴹ</span><b id="vMv"></b><span>相对速度</span><b id="relv"></b></div></div><div class="card"><div class="box">弹簧形变量由“物块与木板挡板的真实相对距离”决定；相对距离增大时弹簧伸长，减小时压缩。参数改变后从初始状态重新计算。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);const g=9.8,L0=5;let run=false,speed=1,last=performance.now(),s=null;function P(){return{m:+$('m').value,M:+$('M').value,F:+$('F').value,k:+$('k').value,mu:+$('mu').value}}function init(){s={xM:0,vM:0,xm:L0,vm:0,t:0};run=false;draw()}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function springPath(x1,x2,y){const lead=10,coils=12,a=x1+lead,b=x2-lead;if(x2<=x1+30)return `M${x1} ${y} L${x2} ${y}`;let d=`M${x1} ${y} L${a} ${y}`;for(let i=1;i<2*coils;i++){const x=a+(b-a)*i/(2*coils),yy=y+(i%2?-13:13);d+=` L${x} ${yy}`}return d+` L${b} ${y} L${x2} ${y}`}function physics(){const p=P(),x=(s.xm-s.xM)-L0,Fs=-p.k*x,rel=s.vm-s.vM,fmax=p.mu*p.m*g;let f,am,aM,mode;if(Math.abs(rel)<0.003){const ac=-p.F/(p.M+p.m);const fReq=p.m*ac-Fs;if(Math.abs(fReq)<=fmax){f=fReq;am=ac;aM=ac;mode='静摩擦：共同运动'}else{const freeRel=Fs/p.m-(-p.F-Fs)/p.M;f=-Math.sign(freeRel||1)*fmax;am=(Fs+f)/p.m;aM=(-p.F-Fs-f)/p.M;mode='滑动摩擦'}}else{f=-Math.sign(rel)*fmax;am=(Fs+f)/p.m;aM=(-p.F-Fs-f)/p.M;mode='滑动摩擦'}return{p,x,Fs,rel,f,am,aM,mode}}function step(dt){const q=physics();const oldRel=s.vm-s.vM;s.vm+=q.am*dt;s.vM+=q.aM*dt;s.xm+=s.vm*dt;s.xM+=s.vM*dt;s.t+=dt;const newRel=s.vm-s.vM;if(oldRel*newRel<0&&Math.abs(newRel)<0.03){const v=(q.p.m*s.vm+q.p.M*s.vM)/(q.p.m+q.p.M);s.vm=v;s.vM=v}}function arrow(id,cx,cy,fx,fy,scale,max=95){const mag=Math.hypot(fx,fy),e=$(id);if(mag<1e-7){e.style.opacity=0;return}e.style.opacity=1;const L=Math.min(max,mag*scale);ln(id,cx,cy,cx+L*fx/mag,cy-L*fy/mag)}function pos(id,x,y){$(id).setAttribute('x',x);$(id).setAttribute('y',y)}function draw(){if(!s)return;const q=physics(),p=q.p;const pxPerM=48;const boardShift=Math.max(-160,Math.min(160,s.xM*pxPerM));$('boardWorld').setAttribute('transform',`translate(${boardShift} 0)`);const wallX=275+boardShift;const relDist=s.xm-s.xM;const blockX=wallX+80+relDist*pxPerM;const bx=Math.max(wallX+40,Math.min(880+boardShift,blockX));$('block').setAttribute('transform',`translate(${bx} 279)`);$('spring').setAttribute('d',springPath(275,bx-boardShift,317));const cx=bx+55,cy=317;arrow('Gm',cx,cy,0,-p.m*g,4);arrow('Nm',cx,cy,0,p.m*g,4);arrow('fm',cx,cy+24,q.f,0,10);arrow('Fs',cx,cy,q.Fs,0,13);arrow('Fext',190+boardShift,410,-p.F,0,15);arrow('vm',cx,250,s.vm,0,22);arrow('vM',220+boardShift,335,s.vM,0,22);pos('Gt',cx+8,cy+48);pos('Nt',cx+8,cy-48);pos('ft',cx-10,cy+16);pos('Fst',cx-10,cy-12);pos('Fextt',130+boardShift,397);pos('vmt',cx+14,238);pos('vMt',230+boardShift,323);let ticks='',off=((s.xM*pxPerM)%50+50)%50;for(let x=-50;x<1100;x+=50)ticks+=`<line x1="${x-off}" y1="505" x2="${x-off}" y2="515" stroke="#cbd5e1"/>`;$('ticks').innerHTML=ticks;$('mv').textContent=p.m.toFixed(1);$('Mv').textContent=p.M.toFixed(1);$('Fv').textContent=p.F.toFixed(1);$('kv').textContent=p.k.toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('mode').textContent=q.mode;$('xv').textContent=(q.x>=0?'+':'')+q.x.toFixed(3)+' m';$('fsv').textContent=Math.abs(q.Fs).toFixed(3)+' N';$('fv').textContent=Math.abs(q.f).toFixed(3)+' N';$('vmv').textContent=s.vm.toFixed(3);$('vMv').textContent=s.vM.toFixed(3);$('relv').textContent=q.rel.toFixed(3);$('play').textContent=run?'Ⅱ 暂停':s.t>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{run=!run;draw()};$('reset').onclick=()=>{$('m').value=1;$('M').value=2;$('F').value=3;$('k').value=1.5;$('mu').value=.2;init()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','F','k','mu'].forEach(id=>$(id).oninput=init);function loop(now){const dt=Math.min(.02,(now-last)/1000);last=now;if(run){for(let i=0;i<5;i++)step(dt*speed/5);if(s.t>=6)run=false;draw()}requestAnimationFrame(loop)}init();requestAnimationFrame(loop)})();</script></body></html>
