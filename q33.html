<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第33题｜双波源干涉</title><style>body{margin:0;font-family:system-ui,'Microsoft YaHei';background:#f5f8fc;color:#10233f}.w{max-width:1350px;margin:auto;padding:18px}.hero{background:linear-gradient(90deg,#376eae,#24558f);color:#fff;padding:13px 22px;border-radius:12px;font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:2fr .8fr;gap:14px}.card{background:white;border:1px solid #d7e3f1;border-radius:15px;padding:14px;box-shadow:0 8px 24px #1f497d10}.btn{padding:9px 15px;border:1px solid #ccd9e8;border-radius:9px;background:#fff}.primary{background:#1672ee;color:#fff}.note{background:#fff8d9;padding:11px;border-radius:10px;line-height:1.7;margin-top:10px}.ok{background:#eafaf2;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第33题　双波源干涉：a、b、c 是加强还是减弱？</div><p>M、N 为振动情况完全相同的相干波源；a、b、c 位于 MN 的中垂线上。动画重点区分“某一瞬间的位移”与“干涉振幅”。</p><div class="grid"><div><section class="card"><canvas id="cv" width="900" height="470" style="width:100%;background:#fafdff;border-radius:12px"></canvas></section><section class="card" style="margin-top:10px"><button id="play" class="btn primary">▶ 播放波传播</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><label style="margin-left:15px"><input id="fronts" type="checkbox" checked> 显示波阵面</label></section></div><aside class="card"><h3>实时判断</h3><p>路径差 Δr(a)=<b style="color:#12a85a">0</b></p><p>路径差 Δr(b)=<b style="color:#12a85a">0</b></p><p>路径差 Δr(c)=<b style="color:#12a85a">0</b></p><div class="note"><b>关键观察</b><br>a、b、c 都在 MN 的中垂线上，因此到 M、N 的距离始终相等。两波源同相时，两列波到达三点的相位差始终为0，所以三点都是稳定的振动加强点。</div><div class="note"><b>物理基础核实</b><br>干涉加强判据：Δr=kλ（同相波源）。“此刻某点恰好在平衡位置”并不等于该点是振动减弱点；加强/减弱看的是振幅。</div><div class="ok"><b>结论：D。</b><br>a、b、c 三点都是振动加强点。</div></aside></div><script>const c=document.getElementById('cv'),x=c.getContext('2d');let t=0,run=false,last=0;const M=[300,150],N=[600,150],pts=[['a',450,250],['b',450,310],['c',450,370]];function draw(){x.clearRect(0,0,c.width,c.height);x.strokeStyle='#94a3b8';x.setLineDash([5,5]);x.beginPath();x.moveTo(M[0],M[1]);x.lineTo(N[0],N[1]);x.stroke();x.beginPath();x.moveTo(450,80);x.lineTo(450,420);x.stroke();x.setLineDash([]);for(const [name,sx,sy] of [['M',...M],['N',...N]]){x.fillStyle='#10233f';x.beginPath();x.arc(sx,sy,8,0,Math.PI*2);x.fill();x.font='bold 22px sans-serif';x.fillText(name,sx-30,sy-12);if(document.getElementById('fronts').checked){for(let k=0;k<8;k++){let r=(t*55+k*55)%440;x.strokeStyle=`rgba(22,114,238,${Math.max(.08,1-r/500)})`;x.lineWidth=2;x.beginPath();x.arc(sx,sy,r,0,Math.PI*2);x.stroke()}}}pts.forEach(([n,px,py])=>{const amp=Math.sin(t*3)*10;x.fillStyle='#7c3aed';x.beginPath();x.arc(px,py+amp,7,0,Math.PI*2);x.fill();x.fillStyle='#10233f';x.font='18px sans-serif';x.fillText(n,px+13,py+5)});x.fillStyle='#64748b';x.fillText('中垂线：到 M、N 距离相等',485,430)}document.getElementById('play').onclick=()=>run=true;document.getElementById('pause').onclick=()=>run=false;document.getElementById('reset').onclick=()=>{run=false;t=0;draw()};document.getElementById('fronts').onchange=draw;function loop(n){if(!last)last=n;if(run)t+=(n-last)/1000;last=n;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></main></body></html>
