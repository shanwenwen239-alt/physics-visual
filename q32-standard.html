<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第32题｜斜面受力</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第32题｜物块沿静止斜面匀速下滑</div><div class="desc">主动画直接显示F、G、N、f，所有力都从物块中心附近出发；右侧统一放播放、参数和实时数据。可调斜面角θ、质量m、拉力F与摩擦因数μ。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="60" y1="470" x2="940" y2="470" stroke="#a9b7c6" stroke-width="3"/><polygon id="wedge" points="180,470 820,470 820,180" fill="#ffe59a" stroke="#34495e" stroke-width="3"/><text x="700" y="430" font-size="38">M</text><g id="blk"><rect x="-55" y="-38" width="110" height="76" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="-10" y="10" font-size="28">m</text><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#g)"/><line id="f" stroke="#d97706" stroke-width="3" marker-end="url(#o)"/><line id="F" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text id="Gt" class="badge" fill="#b91c1c">G</text><text id="Nt" class="badge" fill="#047857">N</text><text id="ft" class="badge" fill="#a16207">f</text><text id="Ft" class="badge" fill="#1d4ed8">F</text></g></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>斜面角 θ：<span id="thv" class="value"></span><input id="th" type="range" min="15" max="45" step="1" value="26"></label><label>质量 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>拉力 F：<span id="Fv" class="value"></span><input id="Fp" type="range" min="0" max="10" step="0.2" value="2"></label><label>摩擦因数 μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max="0.6" step="0.02" value="0.2"></label></div></section><section class="card"><h3 class="title">实时数据</h3><div class="data"><span>沿斜面合力</span><b id="net">—</b><span>支持力 N</span><b id="Nv">—</b><span>摩擦力 f</span><b id="fv">—</b></div><div class="box theory">G竖直向下，N垂直斜面，f沿斜面且反向于相对运动，F沿斜面向上。若要保持匀速，应满足F+f=mg sinθ。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,t=0,last=performance.now();const g=9.8;function P(){return{th:+$('th').value*Math.PI/180,m:+$('m').value,F:+$('Fp').value,mu:+$('mu').value}}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){let p=P(),deg=p.th*180/Math.PI,s=(.15+.7*((t*.12)%1)),x=820-570*s*Math.cos(p.th),y=470-570*s*Math.sin(p.th);$('blk').setAttribute('transform',`translate(${x} ${y}) rotate(${-deg})`);let N=p.m*g*Math.cos(p.th),f=p.mu*N,net=p.m*g*Math.sin(p.th)-p.F-f;line('G',0,0,0,70*p.m);line('N',0,0,-65,0);line('f',0,0,70,0);line('F',0,0,-75,0);[['Gt',8,65],['Nt',-85,-8],['ft',55,-8],['Ft',-92,-8]].forEach(a=>{$(a[0]).setAttribute('x',a[1]);$(a[0]).setAttribute('y',a[2])});$('thv').textContent=deg.toFixed(0)+'°';$('mv').textContent=p.m.toFixed(1);$('Fv').textContent=p.F.toFixed(1);$('muv').textContent=p.mu.toFixed(2);$('Nv').textContent=N.toFixed(2);$('fv').textContent=f.toFixed(2);$('net').textContent=net.toFixed(2)}function label(){$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}function reset(){run=false;t=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['th','m','Fp','mu'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
