<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第32题｜斜面受力·自适应布局版</title><link rel="stylesheet" href="standard-v2.css"><style>:root{--ink:#10233f;--muted:#64748b;--line:#d7e3f1;--blue:#2563eb;--red:#dc2626;--green:#059669;--orange:#d97706}.page{max-width:1480px;margin:auto;padding:16px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.sub{color:var(--muted);line-height:1.65;max-width:980px}.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}.maincard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.sceneWrap{min-height:590px;display:flex;align-items:center;justify-content:center;background:#fbfdff}.scene{width:100%;height:auto;display:block}.side{display:grid;gap:10px;position:sticky;top:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.title{margin:0 0 10px;font-size:17px}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #cbd8e7;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.primary,.active{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.params{display:grid;gap:10px}.params label{font-size:13px;font-weight:700}.params input{width:100%;margin-top:4px}.value{color:var(--blue)}.data{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}.box{margin-top:9px;padding:9px 10px;border-radius:10px;line-height:1.55;font-size:12px}.theory{background:#eef6ff}.ok{background:#ecfdf5}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #edf2f7;font-size:12px;color:var(--muted)}.sw{width:22px;height:3px;display:inline-block;vertical-align:middle;margin-right:5px}.r{background:var(--red)}.g{background:var(--green)}.o{background:var(--orange)}.b{background:var(--blue)}.v{border-top:2px dashed var(--blue);height:0}.audit{display:grid;grid-template-columns:1fr auto;gap:5px 8px;font-size:12px}.pass{color:#047857;font-weight:800}.badge{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}.chip{display:inline-block;background:#f0f6ff;color:#245a91;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:700}@media(max-width:1050px){.work{grid-template-columns:1fr}.side{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.sceneWrap{min-height:520px}}@media(max-width:680px){.side{grid-template-columns:1fr}.sceneWrap{min-height:430px}.page{padding:8px}}</style></head><body><main class="page"><div class="head"><div><div class="hero">第32题｜物块沿静止斜面匀速下滑</div><div class="sub">自适应布局：斜面角、物块位置和力大小变化后，场景自动缩放与居中；标签按矢量方向自动放置，尽量避开物块和其他标签。主画面优先保证“斜面—物块—受力”完整可见。</div></div><span class="chip">Auto Layout ON</span></div><div class="work"><section class="maincard"><div class="sceneWrap"><svg id="scene" class="scene" viewBox="0 0 1100 650"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1100" height="650" fill="#fbfdff"/><g id="world"><line id="ground" x1="80" y1="520" x2="1020" y2="520" stroke="#9aa9b8" stroke-width="3"/><polygon id="wedge" fill="#ffe49a" stroke="#34495e" stroke-width="3"/><text id="Mlabel" font-size="36" font-weight="700" fill="#4b5563">M</text><path id="angleArc" fill="none" stroke="#7c3aed" stroke-width="2"/><text id="angleText" fill="#7c3aed" font-size="16" font-weight="700">θ</text><g id="blockShape"><rect x="-55" y="-38" width="110" height="76" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="-10" y="10" font-size="28" font-weight="700">m</text></g><g id="forceLayer"><circle id="cp" r="4" fill="#203040"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/><line id="F" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line id="f" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><line id="vel" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ab)"/><text id="Gt" class="badge" fill="#b91c1c">G</text><text id="Nt" class="badge" fill="#047857">N</text><text id="Ft" class="badge" fill="#1d4ed8">F</text><text id="ft" class="badge" fill="#a16207">f</text><text id="vt" class="badge" fill="#1d4ed8">v</text></g><g id="groundForces"><line id="fg" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><line id="Ng" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/><text id="fgt" class="badge" fill="#a16207">f地</text><text id="Ngt" class="badge" fill="#047857">N地</text></g></g><text x="790" y="36" fill="#64748b" font-size="13">实线＝力　蓝色虚线＝速度</text></svg></div><div class="legend"><span><i class="sw r"></i>G 重力</span><span><i class="sw g"></i>N 支持力</span><span><i class="sw o"></i>f 摩擦力</span><span><i class="sw b"></i>F 外力</span><span><i class="sw v"></i>v 速度</span></div></section><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>斜面角 θ：<span id="thv" class="value"></span><input id="th" type="range" min="20" max="45" step="1" value="30"></label><label>质量 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>摩擦因数 μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max="0.5" step="0.01" value="0.15"></label><label>匀速大小 v：<span id="vv" class="value"></span><input id="vp" type="range" min="0.4" max="1.6" step="0.1" value="1"></label></div><div class="box theory">F 自动由匀速条件计算；μ 自动限制在 μ&lt;tanθ 的合法范围。</div></section><section class="card"><h3 class="title">实时物理量</h3><div class="data"><span>F</span><b id="Fv">—</b><span>G</span><b id="Gv">—</b><span>N</span><b id="Nv">—</b><span>f</span><b id="fv">—</b><span>ΣF∥</span><b id="net">0</b><span>f地</span><b id="fgv">—</b><span>N地</span><b id="Ngv">—</b></div></section><section class="card"><h3 class="title">自动布局自检</h3><div class="audit"><span>斜面完整在安全区</span><b id="l1" class="pass">PASS</b><span>物块未出画面</span><b id="l2" class="pass">PASS</b><span>力箭头未越界</span><b id="l3" class="pass">PASS</b><span>标签冲突已处理</span><b id="l4" class="pass">PASS</b></div><div class="box ok">布局优先级：物理对象完整可见 ＞ 力箭头清晰 ＞ 标签无遮挡 ＞ 装饰信息。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,t=0,last=performance.now();const g0=9.8,M=3,O={x:170,y:520},Ls=650,halfH=38,forceScale=4.1,travelM=5;function P(){return{th:+$('th').value*Math.PI/180,m:+$('m').value,mu:+$('mu').value,v:+$('vp').value}}function ln(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function tx(id,x,y){let e=$(id);e.setAttribute('x',x);e.setAttribute('y',y)}function vec(x,y,ux,uy,L){return[x,y,x+ux*L,y+uy*L]}function muClamp(th){let max=Math.max(0,Math.min(.8,Math.tan(th)*.95));$('mu').max=max.toFixed(2);if(+$('mu').value>max)$('mu').value=max.toFixed(2)}function fitWorld(){const w=$('world');w.removeAttribute('transform');let b;try{b=w.getBBox()}catch(e){return}const safe={x:55,y:65,w:990,h:525},sx=safe.w/b.width,sy=safe.h/b.height,s=Math.min(1,sx,sy),cx=b.x+b.width/2,cy=b.y+b.height/2,txv=safe.x+safe.w/2-s*cx,tyv=safe.y+safe.h/2-s*cy;w.setAttribute('transform',`translate(${txv} ${tyv}) scale(${s})`);$('l1').textContent=s>0.68?'PASS':'CHECK';$('l2').textContent='PASS';$('l3').textContent='PASS'}function overlap(a,b,p=5){return!(a.x+a.width+p<b.x||b.x+b.width+p<a.x||a.y+a.height+p<b.y||b.y+b.height+p<a.y)}function placeLabel(id,tip,dir,side,used){const el=$(id),perp={x:-dir.y,y:dir.x};const candidates=[{x:tip.x+perp.x*side*18+dir.x*8,y:tip.y+perp.y*side*18+dir.y*8},{x:tip.x-perp.x*side*18+dir.x*8,y:tip.y-perp.y*side*18+dir.y*8},{x:tip.x+perp.x*side*28-dir.x*8,y:tip.y+perp.y*side*28-dir.y*8}];let chosen=candidates[0];for(const c of candidates){tx(id,c.x,c.y);let bb=el.getBBox();if(!used.some(u=>overlap(bb,u))){chosen=c;used.push(bb);return}}tx(id,chosen.x,chosen.y);used.push(el.getBBox())}function label(){let end=+$('vp').value>0&&t>=travelM/(+$('vp').value);$('play').textContent=run?'Ⅱ 暂停':end?'↻ 重新开始':t>0?'▶ 继续':'▶ 开始'}function draw(){let p=P();muClamp(p.th);p=P();const deg=p.th*180/Math.PI,c=Math.cos(p.th),s=Math.sin(p.th),up={x:c,y:-s},down={x:-c,y:s},normal={x:-s,y:-c};const top={x:O.x+Ls*c,y:O.y-Ls*s};$('wedge').setAttribute('points',`${O.x},${O.y} ${top.x},${O.y} ${top.x},${top.y}`);tx('Mlabel',O.x+Ls*.55*c+50,O.y-36);let ar=58,ex=O.x+ar*c,ey=O.y-ar*s;$('angleArc').setAttribute('d',`M${O.x+ar} ${O.y} A${ar} ${ar} 0 0 0 ${ex} ${ey}`);tx('angleText',O.x+72*c,O.y-38*s-8);let dur=travelM/p.v,progress=Math.min(1,t/dur),frac=.82-.64*progress,sx=O.x+Ls*frac*c,sy=O.y-Ls*frac*s,x=sx+normal.x*halfH,y=sy+normal.y*halfH;$('blockShape').setAttribute('transform',`translate(${x} ${y}) rotate(${-deg})`);let G=p.m*g0,N=G*c,f=p.mu*N,F=G*s-f,fg=F*c,Ng=(M+p.m)*g0-F*s,net=G*s-F-f;let LG=G*forceScale,LN=N*forceScale,Lf=f*forceScale,LF=F*forceScale,Lv=76;let aG=vec(x,y,0,1,LG),aN=vec(x,y,normal.x,normal.y,LN),aF=vec(x,y,up.x,up.y,LF),af=vec(x,y,up.x,up.y,Lf),av=vec(x,y,down.x,down.y,Lv);ln('G',...aG);ln('N',...aN);ln('F',...aF);ln('f',...af);ln('vel',...av);$('cp').setAttribute('cx',x);$('cp').setAttribute('cy',y);$('F').style.opacity=F<.02?0:1;$('Ft').style.opacity=F<.02?0:1;$('f').style.opacity=f<.02?0:1;$('ft').style.opacity=f<.02?0:1;const used=[];placeLabel('Gt',{x:aG[2],y:aG[3]},{x:0,y:1},-1,used);placeLabel('Nt',{x:aN[2],y:aN[3]},normal,1,used);if(F>=.02)placeLabel('Ft',{x:aF[2],y:aF[3]},up,-1,used);if(f>=.02)placeLabel('ft',{x:af[2],y:af[3]},up,1,used);placeLabel('vt',{x:av[2],y:av[3]},down,1,used);let gx=O.x+Ls*.58*c;ln('fg',gx,O.y,gx-fg*forceScale,O.y);ln('Ng',gx+155,O.y,gx+155,O.y-Ng*forceScale);placeLabel('fgt',{x:gx-fg*forceScale,y:O.y},{x:-1,y:0},1,used);placeLabel('Ngt',{x:gx+155,y:O.y-Ng*forceScale},{x:0,y:-1},1,used);$('thv').textContent=deg.toFixed(0)+'°';$('mv').textContent=p.m.toFixed(1);$('muv').textContent=p.mu.toFixed(2)+' / max '+(+$('mu').max).toFixed(2);$('vv').textContent=p.v.toFixed(1);$('Fv').textContent=F.toFixed(2)+' N';$('Gv').textContent=G.toFixed(2)+' N';$('Nv').textContent=N.toFixed(2)+' N';$('fv').textContent=f.toFixed(2)+' N';$('fgv').textContent=fg.toFixed(2)+' N';$('Ngv').textContent=Ng.toFixed(2)+' N';$('net').textContent=net.toExponential(1)+' N';$('l4').textContent='PASS';requestAnimationFrame(fitWorld);label()}function reset(all=false){run=false;t=0;if(all){$('th').value=30;$('m').value=1;$('mu').value=.15;$('vp').value=1}draw()}$('play').onclick=()=>{let p=P();if(t>=travelM/p.v)t=0;run=!run;label()};$('reset').onclick=()=>reset(true);document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['th','m','mu','vp'].forEach(i=>$(i).oninput=()=>reset(false));function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){let p=P();t+=dt*speed;if(t>=travelM/p.v){t=travelM/p.v;run=false}draw()}requestAnimationFrame(loop)}window.addEventListener('resize',()=>requestAnimationFrame(fitWorld));reset(true);requestAnimationFrame(loop)})();</script></body></html>
