<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第21题｜动滑轮受力交互</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'PingFang SC','Microsoft YaHei';color:#17324d}.w{max-width:1320px;margin:auto;padding:16px}.title{background:#315f96;color:white;padding:12px 20px;border-radius:12px;font-size:26px;font-weight:800}.desc{margin:10px 4px;color:#526579;line-height:1.7}.layout{display:grid;grid-template-columns:1.7fr .8fr;gap:14px}.card{background:white;border:1px solid #dbe5ef;border-radius:14px;padding:12px;box-shadow:0 5px 18px #315f9610}.scene{width:100%;display:block;touch-action:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #cad7e5;background:white;border-radius:9px;padding:8px 12px;cursor:pointer}.primary{background:#315f96;color:white}.data{display:grid;grid-template-columns:1fr auto;gap:9px}.box{padding:10px;border-radius:10px;margin-top:10px;line-height:1.65;font-size:13px}.theory{background:#eef6ff}.ok{background:#edf9f2}.hint{background:#fff7e8}.slider{width:100%}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第21题　动滑轮｜B→C→D平衡演示</div><div class="desc"><b>交互：</b>右端固定点可沿B→C→D路径移动。系统每一时刻自动计算新的平衡位置；两侧Ft始终沿绳、大小相等，G始终竖直向下。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 820 540"><defs><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#b87d20"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d94a45"/></marker></defs><rect width="820" height="540" rx="12" fill="#fbfdff"/><line x1="105" y1="55" x2="105" y2="190" stroke="#4b5968" stroke-width="7"/><line x1="500" y1="55" x2="500" y2="190" stroke="#4b5968" stroke-width="7"/><line x1="105" y1="190" x2="70" y2="190" stroke="#4b5968" stroke-width="7"/><line x1="500" y1="190" x2="735" y2="190" stroke="#4b5968" stroke-width="7"/><circle cx="105" cy="190" r="6" fill="#263646"/><text x="83" y="218" font-weight="700">A</text><path d="M500 72L500 190L710 190" fill="none" stroke="#d97070" stroke-width="2" stroke-dasharray="7 7" opacity=".55"/><circle cx="500" cy="72" r="5" fill="#d94a45"/><circle cx="500" cy="190" r="5" fill="#d94a45"/><circle cx="710" cy="190" r="5" fill="#d94a45"/><text x="514" y="75" fill="#b84b4b">B</text><text x="514" y="187" fill="#b84b4b">C</text><text x="718" y="187" fill="#b84b4b">D</text><circle id="halo" r="25" fill="#d94a45" opacity=".12"/><circle id="end" r="14" fill="#d94a45" stroke="white" stroke-width="4" style="cursor:grab"/><text id="drag" class="badge" fill="#b93431">拖动固定点</text><line id="r1" stroke="#596979" stroke-width="5" stroke-linecap="round"/><line id="r2" stroke="#596979" stroke-width="5" stroke-linecap="round"/><circle id="pulley" r="34" fill="#dcecff" stroke="#3977b7" stroke-width="3"/><circle id="hub" r="6" fill="#3977b7"/><line id="stem" stroke="#4b5968" stroke-width="3"/><rect id="mass" width="56" height="58" rx="8" fill="#f7dda0" stroke="#8f6b24" stroke-width="2.5"/><text id="mt" font-weight="700">m</text><line id="T1" stroke="#b87d20" marker-end="url(#gold)" stroke-linecap="round"/><line id="T2" stroke="#b87d20" marker-end="url(#gold)" stroke-linecap="round"/><line id="G" stroke="#d94a45" stroke-width="3.2" marker-end="url(#red)" stroke-linecap="round"/><text id="T1t" class="badge" fill="#936116">Ft</text><text id="T2t" class="badge" fill="#936116">Ft</text><text id="Gt" class="badge" fill="#b93431">G</text><path id="arc" fill="none" stroke="#7257a5" stroke-width="2.5"/><text id="theta" class="badge" fill="#7257a5">θ</text></svg><div class="box hint"><b>操作：</b>拖动红色固定点，或点击B/C/D。B→C时只改变右端高度，水平间距不变，因此θ、Ft不变；C→D时水平间距增大，因此θ、Ft增大。</div></section><section class="card" style="margin-top:10px"><div class="row"><button id="playToggle" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 回到B</button><button class="btn key" data-s="0">状态1：A-B</button><button class="btn key" data-s="1">状态2：A-C</button><button class="btn key" data-s="2">状态3：A-D</button></div><input id="slider" class="slider" type="range" min="0" max="2" step=".001" value="0"></section></div><aside class="card"><h3>实时物理量</h3><div class="data"><span>当前状态</span><b id="state">A-B</b><span>夹角</span><b id="ang">θ₁=—</b><span>张力</span><b id="tv">F₁=—</b><span>总绳长</span><b id="lv">—</b></div><div class="box theory"><b>物理模型</b><br>轻绳不可伸长、柔软、轻，滑轮光滑。两侧张力相等。若每段绳与竖直方向夹角为β，则 2Ft cosβ=G；又有 sinβ=D/L，因此右端水平间距D决定β、θ与Ft。</div><div class="box ok"><b>结论</b><br>θ₁=θ₂&lt;θ₃；F₁=F₂&lt;F₃。对应 <b>B、D正确</b>。</div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),A={x:105,y:190},L=650;let u=0,run=false,drag=false,last=performance.now();const ln=(id,x1,y1,x2,y2)=>{let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};function playLabel(){$('playToggle').textContent=run?'Ⅱ 暂停':(u>=2?'↻ 重新开始':(u>0?'▶ 继续':'▶ 开始'))}function endpoint(s){s=Math.max(0,Math.min(2,s));return s<=1?{x:500,y:72+118*s}:{x:500+210*(s-1),y:190}}function state(s){let e=endpoint(s),D=e.x-A.x,b=Math.asin(Math.min(.93,D/L)),H=L*Math.cos(b),py=(H+A.y+e.y)/2,h=py-A.y,px=A.x+h*Math.tan(b),T=1/(2*Math.cos(b));return{...e,px,py,b,T}}function draw(){u=Math.max(0,Math.min(2,u));let z=state(u),d1=Math.hypot(A.x-z.px,A.y-z.py),d2=Math.hypot(z.x-z.px,z.y-z.py),a1=[(A.x-z.px)/d1,(A.y-z.py)/d1],a2=[(z.x-z.px)/d2,(z.y-z.py)/d2];$('end').setAttribute('cx',z.x);$('end').setAttribute('cy',z.y);$('halo').setAttribute('cx',z.x);$('halo').setAttribute('cy',z.y);$('drag').setAttribute('x',Math.min(730,z.x+18));$('drag').setAttribute('y',Math.max(35,z.y-12));ln('r1',A.x,A.y,z.px,z.py);ln('r2',z.px,z.py,z.x,z.y);$('pulley').setAttribute('cx',z.px);$('pulley').setAttribute('cy',z.py);$('hub').setAttribute('cx',z.px);$('hub').setAttribute('cy',z.py);ln('stem',z.px,z.py+34,z.px,z.py+54);$('mass').setAttribute('x',z.px-28);$('mass').setAttribute('y',z.py+54);$('mt').setAttribute('x',z.px-7);$('mt').setAttribute('y',z.py+89);let al=Math.max(68,Math.min(145,72+125*(z.T-.62))),sw=Math.max(3,Math.min(4.1,3.1+1.0*(z.T-.62)));ln('T1',z.px,z.py,z.px+a1[0]*al,z.py+a1[1]*al);ln('T2',z.px,z.py,z.px+a2[0]*al,z.py+a2[1]*al);$('T1').setAttribute('stroke-width',sw);$('T2').setAttribute('stroke-width',sw);$('T1t').setAttribute('x',z.px+a1[0]*al*.72-24);$('T1t').setAttribute('y',z.py+a1[1]*al*.72-8);$('T2t').setAttribute('x',z.px+a2[0]*al*.72+8);$('T2t').setAttribute('y',z.py+a2[1]*al*.72-8);ln('G',z.px,z.py+83,z.px,z.py+155);$('Gt').setAttribute('x',z.px+8);$('Gt').setAttribute('y',z.py+145);let rr=48,bb=z.b;$('arc').setAttribute('d',`M${z.px-rr*Math.sin(bb)} ${z.py-rr*Math.cos(bb)} A${rr} ${rr} 0 0 1 ${z.px+rr*Math.sin(bb)} ${z.py-rr*Math.cos(bb)}`);$('theta').setAttribute('x',z.px+8);$('theta').setAttribute('y',z.py-55);let sname=u<.98?'A-B':u<1.02?'A-C':'A-D',idx=u<.98?'1':u<1.02?'2':'3';$('state').textContent=sname;$('ang').textContent='θ'+idx+'='+(2*bb*180/Math.PI).toFixed(1)+'°';$('tv').textContent='F'+idx+'='+z.T.toFixed(3)+'G';$('lv').textContent=(d1+d2).toFixed(1);$('slider').value=u;playLabel()}function setU(v){u=Math.max(0,Math.min(2,v));draw()}$('slider').oninput=e=>{run=false;setU(+e.target.value)};$('playToggle').onclick=()=>{if(u>=2)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;setU(0)};document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{run=false;setU(+b.dataset.s)});function pt(e){let r=$('scene').getBoundingClientRect();return{x:(e.clientX-r.left)*820/r.width,y:(e.clientY-r.top)*540/r.height}}$('end').onpointerdown=e=>{drag=true;run=false;$('end').setPointerCapture(e.pointerId);playLabel()};$('end').onpointermove=e=>{if(!drag)return;let p=pt(e);if(p.y<190&&Math.abs(p.x-500)<80)setU((p.y-72)/118);else setU(1+(p.x-500)/210)};$('end').onpointerup=()=>drag=false;function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){u+=dt*.35;if(u>=2){u=2;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
