<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第21题｜动滑轮平衡</title><style>body{margin:0;background:#f5f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.back{color:#64748b;text-decoration:none}.title{font-size:26px;font-weight:800;margin:6px 0}.sub{color:#64748b}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:20px;box-shadow:0 12px 32px rgba(15,23,42,.06)}.stage,.side{padding:16px}.scene{width:100%;display:block}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn,.chip{border:1px solid #d5deea;background:#fff;border-radius:11px;padding:9px 13px;cursor:pointer}.btn.primary,.chip.on{background:#111827;color:#fff}.slider{width:100%;margin-top:12px}.metric{display:grid;grid-template-columns:1fr auto;gap:10px 14px;font-size:14px}.hint{font-size:13px;line-height:1.7;color:#475569}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;font-size:12px;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><main class="w"><div class="top"><div><a class="back" href="index.html">← 返回题库</a><div class="title">第21题｜动滑轮与绳端位置变化</div><div class="sub">把绳端从 B 依次移到 C、D，观察动滑轮平衡位置、两段绳夹角和张力趋势。</div></div><div id="status">状态 B</div></div><div class="grid"><section class="card stage"><svg class="scene" viewBox="0 0 760 500"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><line x1="160" y1="80" x2="160" y2="210" stroke="#334155" stroke-width="5"/><line x1="540" y1="80" x2="540" y2="210" stroke="#334155" stroke-width="5"/><line x1="160" y1="210" x2="110" y2="210" stroke="#334155" stroke-width="5"/><line x1="540" y1="210" x2="650" y2="210" stroke="#334155" stroke-width="5"/><circle cx="160" cy="210" r="6" fill="#111827"/><text x="140" y="235">A</text><circle id="end" cx="540" cy="100" r="7" fill="#ef4444"/><text id="endLabel" x="552" y="104">B</text><line id="ropeL" x1="160" y1="210" x2="340" y2="330" stroke="#64748b" stroke-width="5"/><line id="ropeR" x1="340" y1="330" x2="540" y2="100" stroke="#64748b" stroke-width="5"/><circle id="pulley" cx="340" cy="330" r="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><line id="massLine" x1="340" y1="364" x2="340" y2="400" stroke="#334155" stroke-width="4"/><rect id="mass" x="315" y="400" width="50" height="55" rx="6" fill="#fde68a" stroke="#334155" stroke-width="3"/><path id="arc" d="" fill="none" stroke="#7c3aed" stroke-width="3"/><text id="theta" x="310" y="285" fill="#7c3aed" font-size="18">θ</text><line id="tL" x1="332" y1="322" x2="270" y2="280" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/><line id="tR" x1="348" y1="322" x2="405" y2="270" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/></svg><input id="timeline" class="slider" type="range" min="0" max="2" step="0.001" value="0"><div class="controls"><button id="play" class="btn primary">播放</button><button id="reset" class="btn">重置</button><button class="chip on" data-s="0">B</button><button class="chip" data-s="1">C</button><button class="chip" data-s="2">D</button></div></section><aside class="card side"><h3>实时比较</h3><div class="metric"><span>绳端位置</span><b id="pos">B</b><span>夹角 θ（示意）</span><b id="ang">—</b><span>张力 F（趋势）</span><b id="ten">—</b></div><hr><p id="hint" class="hint">先观察 B 状态。绳长不变，动滑轮会自行调整位置以满足平衡与几何约束。</p><div class="note">本页用于比较 B→C→D 的几何与受力趋势。原题没有给出具体尺寸，因此动画采用与原图一致的示意几何，不把像素值当作题目数值。</div></aside></div></main><script>(()=>{const q=id=>document.getElementById(id);let s=0,run=false,last=performance.now();const states=[{x:540,y:100,label:'B',px:340,py:330},{x:540,y:210,label:'C',px:350,py:345},{x:650,y:210,label:'D',px:405,py:360}];function lerp(a,b,t){return a+(b-a)*t}function render(){s=Math.max(0,Math.min(2,s));const i=Math.min(1,Math.floor(s)),t=s-i,a=states[i],b=states[i+1]||states[i],ex=lerp(a.x,b.x,t),ey=lerp(a.y,b.y,t),px=lerp(a.px,b.px,t),py=lerp(a.py,b.py,t);q('end').setAttribute('cx',ex);q('end').setAttribute('cy',ey);q('endLabel').setAttribute('x',ex+12);q('endLabel').setAttribute('y',ey+4);q('endLabel').textContent=t<.5?a.label:b.label;q('ropeL').setAttribute('x2',px);q('ropeL').setAttribute('y2',py);q('ropeR').setAttribute('x1',px);q('ropeR').setAttribute('y1',py);q('ropeR').setAttribute('x2',ex);q('ropeR').setAttribute('y2',ey);q('pulley').setAttribute('cx',px);q('pulley').setAttribute('cy',py);q('massLine').setAttribute('x1',px);q('massLine').setAttribute('x2',px);q('massLine').setAttribute('y1',py+34);q('massLine').setAttribute('y2',py+70);q('mass').setAttribute('x',px-25);q('mass').setAttribute('y',py+70);q('tL').setAttribute('x1',px-8);q('tL').setAttribute('y1',py-8);q('tL').setAttribute('x2',px-70);q('tL').setAttribute('y2',py-55);q('tR').setAttribute('x1',px+8);q('tR').setAttribute('y1',py-8);q('tR').setAttribute('x2',px+70);q('tR').setAttribute('y2',py-60);const u1=[160-px,210-py],u2=[ex-px,ey-py],dot=u1[0]*u2[0]+u1[1]*u2[1],n1=Math.hypot(...u1),n2=Math.hypot(...u2),theta=Math.acos(Math.max(-1,Math.min(1,dot/(n1*n2))))*180/Math.PI;const T=1/(2*Math.cos(theta*Math.PI/360));q('ang').textContent=theta.toFixed(1)+'°';q('ten').textContent=T.toFixed(2)+' mg';q('pos').textContent=s<.5?'B':s<1.5?'C':'D';q('status').textContent='状态 '+q('pos').textContent;q('hint').textContent='夹角越大，每段绳在竖直方向承担重力的分量比例越小，所需张力越大。比较 B、C、D 三个平衡状态即可判断趋势。';q('timeline').value=s;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',Math.abs(+c.dataset.s-s)<.02))}q('play').onclick=()=>run=!run;q('reset').onclick=()=>{run=false;s=0;render()};q('timeline').oninput=e=>{run=false;s=+e.target.value;render()};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{run=false;s=+c.dataset.s;render()});function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run){s+=dt*.45;if(s>=2){s=2;run=false}render()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
