<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第21题｜动滑轮</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:#17324d}.w{max-width:1080px;margin:auto;padding:18px}.title{font-size:24px;font-weight:800;margin-bottom:10px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:12px;box-shadow:0 6px 20px #315f9610}.scene{width:100%;display:block}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}.btn{border:0;background:#315f96;color:#fff;border-radius:10px;padding:10px 24px;font-size:16px;font-weight:700;cursor:pointer}.ctrl{display:flex;align-items:center;gap:8px;font-size:14px}.ctrl input[type=range]{width:160px}.data{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.datum{background:#f7f9fc;border-radius:9px;padding:7px 10px;font-size:13px}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}@media(max-width:700px){.ctrl{width:100%}.ctrl input[type=range]{flex:1}}</style></head><body><main class="w"><div class="title">第21题｜动滑轮 B→C→D</div><section class="card"><svg id="scene" class="scene" viewBox="0 0 920 560"><defs><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#b87d20"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d94a45"/></marker></defs><rect width="920" height="560" rx="12" fill="#fbfdff"/><line x1="115" y1="55" x2="115" y2="195" stroke="#4b5968" stroke-width="7"/><line x1="540" y1="55" x2="540" y2="195" stroke="#4b5968" stroke-width="7"/><line x1="115" y1="195" x2="78" y2="195" stroke="#4b5968" stroke-width="7"/><line x1="540" y1="195" x2="790" y2="195" stroke="#4b5968" stroke-width="7"/><text x="90" y="224" font-weight="700">A</text><path id="guide" d="M540 75L540 195L735 195" fill="none" stroke="#d97070" stroke-width="2" stroke-dasharray="7 7"/><text x="552" y="77" fill="#b84b4b">B</text><text x="552" y="191" fill="#b84b4b">C</text><text id="Dt" x="743" y="191" fill="#b84b4b">D</text><circle id="end" r="8" fill="#d94a45"/><line id="r1" stroke="#596979" stroke-width="5"/><line id="r2" stroke="#596979" stroke-width="5"/><circle id="pulley" r="34" fill="#dcecff" stroke="#3977b7" stroke-width="3"/><circle id="hub" r="6" fill="#3977b7"/><line id="stem" stroke="#4b5968" stroke-width="3"/><rect id="mass" width="56" height="58" rx="8" fill="#f7dda0" stroke="#8f6b24" stroke-width="2.5"/><text id="mt" font-weight="700">m</text><line id="T1" stroke="#b87d20" marker-end="url(#gold)"/><line id="T2" stroke="#b87d20" marker-end="url(#gold)"/><line id="G" stroke="#d94a45" stroke-width="3.2" marker-end="url(#red)"/><text id="T1t" class="badge" fill="#936116">Ft</text><text id="T2t" class="badge" fill="#936116">Ft</text><text id="Gt" class="badge" fill="#b93431">G</text></svg><div class="bar"><button id="toggle" class="btn">开始</button><label class="ctrl">重物质量 <input id="massScale" type="range" min="0.6" max="1.6" step="0.1" value="1"><b id="msv">1.0m</b></label><label class="ctrl">D点位置 <input id="dpos" type="range" min="680" max="780" step="10" value="735"><b id="dpv">735</b></label><label><input id="showData" type="checkbox" checked> 数字</label><label><input id="showForces" type="checkbox" checked> 受力</label></div><div id="data" class="data"><div class="datum">状态：<b id="stateV">A-B</b></div><div class="datum">θ：<b id="angV">—</b></div><div class="datum">Ft/G：<b id="tV">—</b></div></div></section></main><script>(()=>{const $=id=>document.getElementById(id),A={x:115,y:195},L=650;let u=0,run=false,last=performance.now();const ln=(id,x1,y1,x2,y2)=>{let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};function endpoint(s){const d=+$('dpos').value;return s<=1?{x:540,y:75+120*s}:{x:540+(d-540)*(s-1),y:195}}function state(s){let e=endpoint(s),D=e.x-A.x,b=Math.asin(Math.min(.93,D/L)),H=L*Math.cos(b),py=(H+A.y+e.y)/2,h=py-A.y,px=A.x+h*Math.tan(b),T=1/(2*Math.cos(b));return{...e,px,py,b,T}}function draw(){let z=state(u),d1=Math.hypot(A.x-z.px,A.y-z.py),d2=Math.hypot(z.x-z.px,z.y-z.py),a1=[(A.x-z.px)/d1,(A.y-z.py)/d1],a2=[(z.x-z.px)/d2,(z.y-z.py)/d2],ms=+$('massScale').value,T=z.T*ms;$('end').setAttribute('cx',z.x);$('end').setAttribute('cy',z.y);ln('r1',A.x,A.y,z.px,z.py);ln('r2',z.px,z.py,z.x,z.y);$('pulley').setAttribute('cx',z.px);$('pulley').setAttribute('cy',z.py);$('hub').setAttribute('cx',z.px);$('hub').setAttribute('cy',z.py);ln('stem',z.px,z.py+34,z.px,z.py+54);$('mass').setAttribute('x',z.px-28);$('mass').setAttribute('y',z.py+54);$('mt').setAttribute('x',z.px-7);$('mt').setAttribute('y',z.py+89);let al=Math.max(66,Math.min(150,80*T));ln('T1',z.px,z.py,z.px+a1[0]*al,z.py+a1[1]*al);ln('T2',z.px,z.py,z.px+a2[0]*al,z.py+a2[1]*al);$('T1t').setAttribute('x',z.px+a1[0]*al*.72-24);$('T1t').setAttribute('y',z.py+a1[1]*al*.72-8);$('T2t').setAttribute('x',z.px+a2[0]*al*.72+8);$('T2t').setAttribute('y',z.py+a2[1]*al*.72-8);let gL=72*ms;ln('G',z.px,z.py+83,z.px,z.py+83+gL);$('Gt').setAttribute('x',z.px+8);$('Gt').setAttribute('y',z.py+75+gL);$('stateV').textContent=u<.98?'A-B':u<1.02?'A-C':'A-D';$('angV').textContent=(2*z.b*180/Math.PI).toFixed(1)+'°';$('tV').textContent=z.T.toFixed(3);$('msv').textContent=ms.toFixed(1)+'m';$('dpv').textContent=$('dpos').value;$('Dt').setAttribute('x',+$('dpos').value+8);$('guide').setAttribute('d',`M540 75L540 195L${$('dpos').value} 195`);$('data').style.display=$('showData').checked?'flex':'none';const vis=$('showForces').checked?'':'none';['T1','T2','G','T1t','T2t','Gt'].forEach(id=>$(id).style.display=vis)}$('toggle').onclick=()=>{if(u>=2)u=0;run=!run;$('toggle').textContent=run?'暂停':'开始'};['massScale','dpos'].forEach(id=>$(id).oninput=draw);$('showData').onchange=draw;$('showForces').onchange=draw;function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){u+=dt*.35;if(u>=2){u=2;run=false;$('toggle').textContent='开始'}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
