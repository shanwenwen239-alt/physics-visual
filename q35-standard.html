<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第35题｜双木块弹簧</title><link rel="stylesheet" href="standard-v2.css"></head><body><main class="wrap"><div class="hero">第35题｜A、B等质量木块与轻弹簧</div><div class="desc">A、B质量相同，置于光滑水平面，轻弹簧初始自然长。对A施加水平恒力F，观察弹簧第一次由自然长拉到最长过程。模型直接显示F、弹簧力、速度与加速度。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><defs><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker></defs><rect width="1000" height="560" fill="#fbfdff"/><line x1="30" y1="420" x2="970" y2="420" stroke="#a9b7c6" stroke-width="3"/><g id="A"><rect width="110" height="76" rx="10" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="44" y="48" font-size="30">A</text></g><g id="B"><rect width="110" height="76" rx="10" fill="#ffd7d7" stroke="#983535" stroke-width="3"/><text x="44" y="48" font-size="30">B</text></g><path id="spring" fill="none" stroke="#526173" stroke-width="5"/><line id="F" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><line id="FsA" stroke="#d97706" stroke-width="3" marker-end="url(#o)"/><line id="FsB" stroke="#d97706" stroke-width="3" marker-end="url(#o)"/><line id="vA" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#v)"/><line id="vB" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#v)"/><text id="Ft" class="badge" fill="#1d4ed8">F</text><text id="FsAt" class="badge" fill="#a16207">Fₛ</text><text id="FsBt" class="badge" fill="#a16207">Fₛ</text><text id="vAt" class="badge" fill="#6d28d9">vA</text><text id="vBt" class="badge" fill="#6d28d9">vB</text></svg></section></div><aside class="side"><section class="card"><h3 class="title">播放控制</h3><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置全部</button></div><div class="controls" style="margin-top:8px"><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div></section><section class="card"><h3 class="title">参数调整</h3><div class="params"><label>质量 m：<span id="mv" class="value"></span><input id="m" type="range" min="0.5" max="3" step="0.1" value="1"></label><label>恒力 F：<span id="Fv" class="value"></span><input id="Fp" type="range" min="0.5" max="6" step="0.1" value="2"></label><label>劲度系数 k：<span id="kv" class="value"></span><input id="k" type="range" min="0.5" max="4" step="0.1" value="1.5"></label></div></section><section class="card"><h3 class="title">实时物理量</h3><div class="data"><span>弹簧伸长 x</span><b id="xv">0</b><span>vA</span><b id="vav">0</b><span>vB</span><b id="vbv">0</b><span>aA</span><b id="aav">0</b><span>aB</span><b id="abv">0</b></div><div class="box theory">A受力：F−kx；B受力：kx。两块速度相等时，相对速度为0，此时弹簧达到第一次最大伸长；但此刻两块加速度一般不相等。</div></section></aside></div></main><script>(()=>{const $=i=>document.getElementById(i);let run=false,speed=1,last=performance.now(),t=0;function P(){return{m:+$('m').value,F:+$('Fp').value,k:+$('k').value}}function spring(x1,x2,y){let d=`M${x1} ${y}`,n=9;for(let i=1;i<2*n;i++){let x=x1+(x2-x1)*i/(2*n),yy=y+(i%2?-13:13);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function model(){let p=P(),w=Math.sqrt(2*p.k/p.m),x=p.F/(2*p.k)*(1-Math.cos(w*t)),xd=p.F/(2*p.k)*w*Math.sin(w*t),vcm=p.F*t/(2*p.m),vA=vcm+xd/2,vB=vcm-xd/2,aA=(p.F-p.k*x)/p.m,aB=p.k*x/p.m;return{x,vA,vB,aA,aB}}function draw(){let p=P(),q=model(),dx=Math.min(180,q.x*90),xA=260-dx/2,xB=610+dx/2;$('A').setAttribute('transform',`translate(${xA} 344)`);$('B').setAttribute('transform',`translate(${xB} 344)`);$('spring').setAttribute('d',spring(xA+110,xB,382));line('F',xA,382,xA-75,382);line('FsA',xA+110,382,xA+110+Math.min(70,p.k*q.x*30),382);line('FsB',xB,382,xB-Math.min(70,p.k*q.x*30),382);line('vA',xA+55,320,xA+55+Math.max(-100,Math.min(100,q.vA*20)),320);line('vB',xB+55,320,xB+55+Math.max(-100,Math.min(100,q.vB*20)),320);[['Ft',xA-60,370],['FsAt',xA+120,370],['FsBt',xB-55,370],['vAt',xA+70,310],['vBt',xB+70,310]].forEach(a=>{$(a[0]).setAttribute('x',a[1]);$(a[0]).setAttribute('y',a[2])});$('mv').textContent=p.m.toFixed(1);$('Fv').textContent=p.F.toFixed(1);$('kv').textContent=p.k.toFixed(1);$('xv').textContent=q.x.toFixed(2);$('vav').textContent=q.vA.toFixed(2);$('vbv').textContent=q.vB.toFixed(2);$('aav').textContent=q.aA.toFixed(2);$('abv').textContent=q.aB.toFixed(2)}function label(){$('play').textContent=run?'Ⅱ 暂停':t>0?'▶ 继续':'▶ 开始'}function reset(){run=false;t=0;draw();label()}$('play').onclick=()=>{run=!run;label()};$('reset').onclick=reset;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','Fp','k'].forEach(i=>$(i).oninput=reset);function loop(n){let dt=Math.min(.03,(n-last)/1000);last=n;if(run){t+=dt*speed;let p=P(),T=Math.PI/Math.sqrt(2*p.k/p.m);if(t>T){t=T;run=false;label()}draw()}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
