<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第22题｜小车骤停</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--g:#059669;--v:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:white;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.75fr .8fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第22题｜小车骤停后的相对运动</div><div class="layout"><div><section class="card"><svg class="scene" viewBox="0 0 920 500"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="920" height="500" rx="12" fill="#fbfdff"/><line x1="30" y1="420" x2="890" y2="420" stroke="#aab7c5" stroke-width="2.5"/><g id="cart"><rect x="140" y="310" width="600" height="70" rx="12" fill="#ffe8a3" stroke="#6d5620" stroke-width="2.5"/><circle cx="260" cy="397" r="18" fill="#334155"/><circle cx="630" cy="397" r="18" fill="#334155"/></g><g id="m2"><rect x="245" y="242" width="90" height="68" rx="9" fill="#c9e0ff" stroke="#245a91" stroke-width="2.5"/><text x="274" y="284" font-size="23">m₂</text></g><g id="m1"><rect x="480" y="218" width="120" height="92" rx="9" fill="#ffd6d6" stroke="#983535" stroke-width="2.5"/><text x="522" y="273" font-size="25">m₁</text></g><line id="mg2" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="N2" stroke="#d97706" stroke-width="3" marker-end="url(#mo)"/><line id="f2" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="mg1" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="N1" stroke="#d97706" stroke-width="3" marker-end="url(#mo)"/><line id="f1" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="v2" stroke="#2563eb" stroke-width="2.8" marker-end="url(#mb)"/><line id="v1" stroke="#2563eb" stroke-width="2.8" marker-end="url(#mb)"/><text id="g2t" fill="#991b1b" font-size="14">G₂</text><text id="n2t" fill="#9a6200" font-size="14">N₂</text><text id="f2t" fill="#991b1b" font-size="14">f₂</text><text id="g1t" fill="#991b1b" font-size="14">G₁</text><text id="n1t" fill="#9a6200" font-size="14">N₁</text><text id="f1t" fill="#991b1b" font-size="14">f₁</text><line id="gap" x1="335" y1="160" x2="480" y2="160" stroke="#059669" stroke-width="2.5"/><text id="gapT" x="375" y="145" fill="#047857" font-weight="700">L恒定</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="mu" class="btn">μ≠0</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside class="card"><h3>实时物理核查</h3><div class="data"><span>阶段</span><b id="stage">共同匀速</b><span>f₁/(μm₂g)</span><b id="ff1" style="color:#dc2626">0</b><span>f₂/(μm₂g)</span><b id="ff2" style="color:#dc2626">0</b><span>a₁</span><b id="a1">0</b><span>a₂</span><b id="a2">0</b><span>v₁-v₂</span><b style="color:#059669">0</b></div><div class="box note"><b>矢量规则：</b>重力从各物块重心附近竖直向下，支持力竖直向上，摩擦力沿接触面反向。m₁=1.5m₂仅用于视觉比例，所以G₁、N₁、f₁箭头比对应m₂箭头长1.5倍。</div><div class="box theory"><b>物理模型：</b>Nᵢ=mᵢg，滑动时fᵢ=μmᵢg，因此aᵢ=fᵢ/mᵢ=μg。两块初速度相同，所以始终同速，间距不变。</div><div class="box answer"><b>结论：</b>μ=0或μ≠0都不会相碰，正确项B、D。</div></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,mu=true,last=performance.now();const stop=.28,rest=.86,r=1.5;function model(){if(p<stop){let d=120*p/stop;return{c:d,b:d,v:1,fr:0,st:'共同匀速'}}let u=(p-stop)/(1-stop);if(!mu)return{c:120,b:120+220*u,v:1,fr:0,st:'无摩擦匀速前冲'};let tau=Math.min(1,(p-stop)/(rest-stop));return{c:120,b:120+180*(2*tau-tau*tau),v:1-tau,fr:p<rest?1:0,st:p<rest?'滑动摩擦减速':'相对车面静止'}}function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function label(id,x,y){q(id).setAttribute('x',x);q(id).setAttribute('y',y)}function draw(){p=Math.max(0,Math.min(1,p));let z=model();q('cart').setAttribute('transform',`translate(${z.c} 0)`);['m1','m2'].forEach(id=>q(id).setAttribute('transform',`translate(${z.b} 0)`));let x2=290+z.b,x1=540+z.b;line('mg2',x2,276,x2,326);line('N2',x2,276,x2,226);line('mg1',x1,264,x1,339);line('N1',x1,264,x1,189);label('g2t',x2+7,322);label('n2t',x2+7,235);label('g1t',x1+7,334);label('n1t',x1+7,198);let f2=50*z.fr,f1=50*r*z.fr;line('f2',x2,333,x2-f2,333);line('f1',x1,343,x1-f1,343);label('f2t',x2-f2-22,326);label('f1t',x1-f1-22,336);q('f2').style.opacity=z.fr?1:0;q('f1').style.opacity=z.fr?1:0;q('f2t').style.opacity=z.fr?1:0;q('f1t').style.opacity=z.fr?1:0;line('v2',x2,205,x2+82*z.v,205);line('v1',x1,180,x1+82*z.v,180);q('gap').setAttribute('transform',`translate(${z.b} 0)`);q('gapT').setAttribute('transform',`translate(${z.b} 0)`);q('stage').textContent=z.st;q('ff1').textContent=z.fr?r.toFixed(1):'0';q('ff2').textContent=z.fr?'1.0':'0';q('a1').textContent=z.fr?'μg':'0';q('a2').textContent=z.fr?'μg':'0';q('t').value=p;q('mu').textContent=mu?'μ≠0':'μ=0'}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;draw()};q('mu').onclick=()=>{run=false;mu=!mu;p=0;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.15;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
