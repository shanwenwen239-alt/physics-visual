<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第22题｜小车突然停止</title><style>body{margin:0;background:#f5f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1180px;margin:auto;padding:20px}.back{color:#64748b;text-decoration:none}.title{font-size:26px;font-weight:800;margin:6px 0}.sub{color:#64748b}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:20px;box-shadow:0 12px 32px rgba(15,23,42,.06)}.stage,.side{padding:16px}.scene{width:100%}.btn{border:1px solid #d5deea;background:#fff;border-radius:11px;padding:9px 13px;cursor:pointer}.primary{background:#111827;color:#fff}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.slider{width:100%;margin-top:12px}.metric{display:grid;grid-template-columns:1fr auto;gap:10px 14px;font-size:14px}.good{color:#078347;font-weight:750}.note{background:#eef7ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px;font-size:12px;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="back" href="index.html">← 返回题库</a><div class="title">第22题｜小车突然停止后两滑块会不会相碰？</div><div class="sub">m₁ &gt; m₂，但两滑块与小车间动摩擦因数均为 μ。观察小车骤停后两滑块相对车面的运动。</div><div class="grid"><section class="card stage"><svg class="scene" viewBox="0 0 760 420"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><line x1="50" y1="350" x2="710" y2="350" stroke="#94a3b8" stroke-width="3"/><g id="cart"><rect x="120" y="250" width="500" height="55" rx="10" fill="#fde68a" stroke="#334155" stroke-width="3"/><circle cx="200" cy="325" r="18" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><circle cx="540" cy="325" r="18" fill="#cbd5e1" stroke="#334155" stroke-width="3"/></g><g id="b2"><rect x="215" y="180" width="90" height="70" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/><text x="245" y="223" font-size="22">m₂</text></g><g id="b1"><rect x="405" y="160" width="120" height="90" rx="8" fill="#fecaca" stroke="#991b1b" stroke-width="3"/><text x="445" y="213" font-size="22">m₁</text></g><line id="v2" x1="260" y1="165" x2="340" y2="165" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/><line id="v1" x1="465" y1="145" x2="545" y2="145" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/><text x="342" y="160" fill="#2563eb">v</text><text x="547" y="140" fill="#2563eb">v</text></svg><input id="timeline" class="slider" type="range" min="0" max="1" step="0.001" value="0"><div class="controls"><button id="play" class="btn primary">播放</button><button id="reset" class="btn">重置</button><button id="mu0" class="btn">μ = 0</button><button id="mupos" class="btn">μ ≠ 0</button></div></section><aside class="card side"><h3>核心比较</h3><div class="metric"><span>当前 μ</span><b id="mu">μ ≠ 0</b><span>m₁ 减速度</span><b id="a1">μg</b><span>m₂ 减速度</span><b id="a2">μg</b><span>两块间距</span><b id="gap" class="good">保持不变</b></div><p id="hint">虽然 m₁ 更重，但动摩擦产生的减速度 a=f/m=μmg/m=μg，与质量无关。</p><div class="note">μ=0 时，两块都保持原速度；μ≠0 时，两块都以相同 μg 减速。因此相对速度始终为 0，初始间距不变，不会因为 m₁&gt;m₂ 而相撞。</div></aside></div></main><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now(),mu=true;function render(){const s=mu?(165*p-80*p*p):165*p;const x2=s,x1=s;q('b2').setAttribute('transform',`translate(${x2} 0)`);q('b1').setAttribute('transform',`translate(${x1} 0)`);q('v2').setAttribute('transform',`translate(${x2} 0)`);q('v1').setAttribute('transform',`translate(${x1} 0)`);q('timeline').value=p;q('mu').textContent=mu?'μ ≠ 0':'μ = 0';q('a1').textContent=mu?'μg':'0';q('a2').textContent=mu?'μg':'0';q('gap').textContent='保持不变';q('hint').textContent=mu?'两滑块的摩擦力大小不同，但除以各自质量后，减速度都等于 μg。':'没有摩擦，两滑块均保持相同初速度，因此相对位置仍不改变。'}q('play').onclick=()=>run=!run;q('reset').onclick=()=>{run=false;p=0;render()};q('mu0').onclick=()=>{mu=false;run=false;p=0;render()};q('mupos').onclick=()=>{mu=true;run=false;p=0;render()};q('timeline').oninput=e=>{run=false;p=+e.target.value;render()};function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.22;if(p>=1){p=1;run=false}render()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
