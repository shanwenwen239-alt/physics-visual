<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第7题｜两物块弹簧增强版</title><style>:root{--ink:#10233f;--muted:#65758a;--line:#d8e3ef;--blue:#1f6feb;--red:#e14c4c;--gold:#d28b16;--green:#16935f}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;font-family:system-ui,'PingFang SC','Microsoft YaHei';color:var(--ink)}.w{max-width:1450px;margin:auto;padding:18px}.title{font-size:30px;font-weight:900;color:#12376b;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.desc{padding:13px 16px;line-height:1.75;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:16px;align-items:start}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cbd8e7;background:#fff;border-radius:10px;padding:10px 15px;font-weight:700}.primary,.active{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.side{position:sticky;top:12px}.params{display:grid;gap:14px}.params input{width:100%}.value{color:var(--blue)}.data{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}.box{margin-top:11px;border-radius:11px;padding:11px;line-height:1.7;font-size:13px}.theory{background:#eef6ff}.ok{background:#ecfdf5}.note{background:#fff8e8}.badge{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static}}</style></head><body><main class="w"><div class="title">第7题｜两物块—轻质弹簧耦合运动</div><div class="desc">m₁:m₂=2:3，光滑水平面，轻质弹簧初始自然长度。A获得向右初速度v₀。弹簧两端在任何时刻都严格连接A右侧面与B左侧面，不允许悬空或脱离。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 1020 500"><defs><linearGradient id="ra"><stop offset="0" stop-color="#ffd4d4"/><stop offset="1" stop-color="#f47a7a"/></linearGradient><linearGradient id="bb"><stop offset="0" stop-color="#d7eaff"/><stop offset="1" stop-color="#69a7ef"/></linearGradient><marker id="mBlue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1f6feb"/></marker><marker id="mGold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d28b16"/></marker></defs><line x1="35" y1="380" x2="985" y2="380" stroke="#334155" stroke-width="3"/><path id="spring" fill="none" stroke="#5d6b7d" stroke-width="5" stroke-linejoin="round"/><g id="A"><rect x="-48" y="-62" width="96" height="62" rx="10" fill="url(#ra)" stroke="#a53636" stroke-width="2.5"/><text x="-11" y="-23" font-size="26" font-weight="800">A</text></g><g id="B"><rect x="-58" y="-78" width="116" height="78" rx="10" fill="url(#bb)" stroke="#245a91" stroke-width="2.5"/><text x="-10" y="-31" font-size="26" font-weight="800">B</text></g><line id="vA" stroke="#1f6feb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#mBlue)"/><line id="vB" stroke="#1f6feb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#mBlue)"/><text id="vAt" class="badge" fill="#1f6feb">vA</text><text id="vBt" class="badge" fill="#1f6feb">vB</text><line id="FsA" stroke="#d28b16" stroke-width="3" marker-end="url(#mGold)"/><line id="FsB" stroke="#d28b16" stroke-width="3" marker-end="url(#mGold)"/><text id="FsAt" class="badge" fill="#9a6200">Fs</text><text id="FsBt" class="badge" fill="#9a6200">Fs</text><line id="cmLine" y1="105" y2="365" stroke="#16935f" stroke-width="1.8" stroke-dasharray="6 6"/><text id="cmT" y="95" fill="#117a4f" font-size="14" font-weight="800">质心</text><text x="660" y="48" fill="#64748b" font-size="13">弹簧端点始终锁定物块表面</text></svg></section><section class="card" style="margin-top:10px"><div class="controls"><button id="toggle" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><span>播放：</span><button class="btn speedBtn" data-speed="0.5">慢速 0.5×</button><button class="btn speedBtn active" data-speed="1">正常 1×</button><button class="btn speedBtn" data-speed="2">快速 2×</button></div><input id="progress" type="range" min="0" max="1" step=".001" value="0" style="width:100%;margin-top:10px"></section></div><aside class="side"><section class="card"><h3>参数调整</h3><div class="params"><label>初速度 v₀：<span id="v0v" class="value">1.00</span><input id="v0" type="range" min="0.5" max="1.8" step="0.05" value="1"></label><label>弹簧劲度 k：<span id="kv" class="value">1.00</span><input id="k" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>整体质量比例：<span id="msv" class="value">1.00×</span><input id="ms" type="range" min="0.6" max="1.6" step="0.05" value="1"></label></div></section><section class="card" style="margin-top:10px"><h3>实时物理量</h3><div class="data"><span>vA/v₀</span><b id="va">1.000</b><span>vB/v₀</span><b id="vb">0</b><span>Vcm/v₀</span><b id="vcm">0.400</b><span>弹簧形变 ξ</span><b id="xi">0</b><span>Fs</span><b id="fs">0</b></div><div class="box theory">Vcm=2v₀/5；vA=2v₀/5+3v₀cosωt/5；vB=2v₀/5−2v₀cosωt/5。</div><div class="box ok">系统总动量守恒，总机械能守恒。正确选项：B、C。</div></section></aside></div></main><script>(()=>{const $=id=>document.getElementById(id);let phase=0,run=false,last=performance.now(),playSpeed=1;const ground=380,baseA=260,baseB=610;function P(){const s=+$('ms').value;return{v0:+$('v0').value,k:+$('k').value,m1:2*s,m2:3*s}}function fmt(v){return Math.abs(v)<.0005?'0':v.toFixed(3)}function springPath(x1,x2,y){const n=11,amp=13;let d=`M${x1} ${y}`;for(let i=1;i<n*2;i++){const x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-amp:amp);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function line(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function button(){$('toggle').textContent=run?'Ⅱ 暂停':phase>0?'▶ 继续':'▶ 开始'}function draw(){const p=P(),mu=p.m1*p.m2/(p.m1+p.m2),w=Math.sqrt(p.k/mu),c=Math.cos(phase),s=Math.sin(phase);const vcm=p.m1*p.v0/(p.m1+p.m2),vA=vcm+(p.m2/(p.m1+p.m2))*p.v0*c,vB=vcm-(p.m1/(p.m1+p.m2))*p.v0*c;const xi=(p.v0/w)*Math.sin(phase),cmShift=phase/w*vcm*70;const rel=xi*70,xA=baseA+cmShift-(p.m2/(p.m1+p.m2))*rel,xB=baseB+cmShift+(p.m1/(p.m1+p.m2))*rel;const aRight=xA+48,bLeft=xB-58,springY=340;$('A').setAttribute('transform',`translate(${xA} ${ground})`);$('B').setAttribute('transform',`translate(${xB} ${ground})`);$('spring').setAttribute('d',springPath(aRight,bLeft,springY));const scale=60;line('vA',xA,300,xA+scale*vA/p.v0,300);line('vB',xB,285,xB+scale*vB/p.v0,285);$('vAt').setAttribute('x',xA+scale*vA/p.v0+7);$('vAt').setAttribute('y',290);$('vBt').setAttribute('x',xB+scale*vB/p.v0+7);$('vBt').setAttribute('y',275);const fs=p.k*xi,fLen=Math.min(85,Math.abs(fs)*45),sg=Math.sign(fs)||1;line('FsA',aRight,springY,aRight+sg*fLen,springY);line('FsB',bLeft,springY,bLeft-sg*fLen,springY);$('FsA').style.opacity=Math.abs(fs)<.001?0:1;$('FsB').style.opacity=Math.abs(fs)<.001?0:1;$('FsAt').style.opacity=Math.abs(fs)<.001?0:1;$('FsBt').style.opacity=Math.abs(fs)<.001?0:1;$('FsAt').setAttribute('x',aRight+sg*fLen*.5);$('FsAt').setAttribute('y',springY-10);$('FsBt').setAttribute('x',bLeft-sg*fLen*.5);$('FsBt').setAttribute('y',springY-10);const cm=(p.m1*xA+p.m2*xB)/(p.m1+p.m2);line('cmLine',cm,105,cm,365);$('cmT').setAttribute('x',cm-16);$('va').textContent=fmt(vA/p.v0);$('vb').textContent=fmt(vB/p.v0);$('vcm').textContent=(vcm/p.v0).toFixed(3);$('xi').textContent=fmt(xi);$('fs').textContent=fmt(fs);$('v0v').textContent=p.v0.toFixed(2);$('kv').textContent=p.k.toFixed(2);$('msv').textContent=+$('ms').value.toFixed?$('ms').value:$('ms').value;$('progress').value=(phase%(2*Math.PI))/(2*Math.PI)}$('toggle').onclick=()=>{run=!run;button()};$('reset').onclick=()=>{run=false;phase=0;button();draw()};document.querySelectorAll('.speedBtn').forEach(b=>b.onclick=()=>{playSpeed=+b.dataset.speed;document.querySelectorAll('.speedBtn').forEach(x=>x.classList.toggle('active',x===b))});['v0','k','ms'].forEach(id=>$(id).oninput=()=>{run=false;phase=0;button();draw()});$('progress').oninput=e=>{run=false;phase=+e.target.value*2*Math.PI;button();draw()};function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(run){const p=P(),mu=p.m1*p.m2/(p.m1+p.m2),w=Math.sqrt(p.k/mu);phase+=dt*w*playSpeed;draw()}requestAnimationFrame(loop)}draw();button();requestAnimationFrame(loop)})();</script></body></html>
