<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第31题｜长杆与稳定性 Gate版</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1380px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin:8px 0 14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input{width:100%}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.meter{height:16px;background:#e6edf5;border-radius:999px;overflow:hidden}.fill{height:100%}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}.note{background:#fff8e8}.ok{background:#ecfdf5}.badge{font-size:14px;font-weight:850}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}@media(max-width:900px){.layout{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="w"><div class="hero">第31题｜长杆为什么让转动响应更慢</div><div class="desc"><b>Gate版定位：</b>本页只做相对比较，不冒充真实人体精确动力学。固定钢丝、人体位置和镜头；改变杆长 L 时，只改变杆几何长度和对应的转动惯量。用于课堂展示“同样扰动下，杆越长，角响应越小”。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#fbfdff"/><line x1="70" y1="440" x2="930" y2="440" stroke="#475569" stroke-width="5"/><text x="72" y="473" fill="#64748b">钢丝（固定参照，不随参数移动）</text><line x1="500" y1="120" x2="500" y2="470" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/><g id="body"><circle cx="500" cy="215" r="28" fill="#ffd7b5" stroke="#263b55" stroke-width="3"/><line x1="500" y1="243" x2="500" y2="345" stroke="#263b55" stroke-width="13"/><line x1="500" y1="345" x2="470" y2="435" stroke="#263b55" stroke-width="10"/><line x1="500" y1="345" x2="530" y2="435" stroke="#263b55" stroke-width="10"/><line id="rod" y1="300" y2="300" stroke="#a66c32" stroke-width="12" stroke-linecap="round"/></g><g id="arrows"></g><text x="725" y="72" font-size="17" font-weight="900" fill="#173b70">固定参照：钢丝与人体中心不移动</text><text id="Llabel" x="500" y="278" text-anchor="middle" fill="#7c3aed" font-weight="900"></text></svg><div class="quick"><button class="btn q" data-L="2.5">短杆</button><button class="btn q" data-L="4">中杆</button><button class="btn q active" data-L="6">长杆</button><button class="btn q" data-L="8">更长</button></div></div><div class="card" style="margin-top:10px"><b>相对比较</b><div style="margin-top:10px">总转动惯量 I<sub>rel</sub></div><div class="meter"><div id="Ibar" class="fill" style="background:#2563eb"></div></div><div style="margin-top:10px">同扰动下角响应 α<sub>rel</sub></div><div class="meter"><div id="abar" class="fill" style="background:#7c3aed"></div></div></div></section><aside class="side"><div class="card"><h3>参数调整</h3><div class="params"><label>杆长 L：<b id="Lv"></b><input id="L" type="range" min="2" max="8" step=".1" value="6"></label><label>杆质量 mᵣ（相对单位）：<b id="mrv"></b><input id="mr" type="range" min=".5" max="2" step=".1" value="1"></label><label>扰动强度 τ<sub>rel</sub>：<b id="tv"></b><input id="tau" type="range" min=".4" max="1.6" step=".1" value="1"></label></div><div class="controls" style="margin-top:10px"><button id="reset" class="btn">↻ 重置</button></div><div class="box note">这里的 I<sub>rel</sub>、α<sub>rel</sub> 是相对比较量，不标注成真实人体的 kg·m²、rad/s²。</div></div><div class="card"><h3>实时结果</h3><div class="data"><span>杆贡献 Iᵣₒd</span><b id="Ir"></b><span>整体 I<sub>rel</sub></span><b id="It"></b><span>α<sub>rel</sub></span><b id="ar"></b></div><div class="box ok" style="margin-top:9px"><b>物理关系：</b><br>Iᵣₒd ∝ mᵣL²<br>I<sub>total</sub> = I<sub>body</sub> + Iᵣₒd<br>α<sub>rel</sub> = τ<sub>rel</sub>/I<sub>total</sub></div></div><div class="card"><div class="box"><b>自检：</b><br><span id="check1"></span><br><span id="check2"></span><br><span id="check3"></span></div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),IB=1;function P(){return{L:+$('L').value,mr:+$('mr').value,tau:+$('tau').value}}function calc(p){const Irod=p.mr*p.L*p.L/12,It=IB+Irod,a=p.tau/It;return{Irod,It,a}}function drawArrow(p,q){const maxA=1.6/(1+.5*4/12),len=Math.min(95,28+70*q.a/maxA),dir=1;return `<line x1="500" y1="175" x2="${500+dir*len}" y2="175" stroke="#7c3aed" stroke-width="4"/><polygon points="${500+len},175 ${490+len},169 ${490+len},181" fill="#7c3aed"/><text x="${510+len}" y="181" fill="#6d28d9" font-weight="900">扰动响应（相对）</text>`}function draw(){const p=P(),q=calc(p),px=48;$('rod').setAttribute('x1',500-p.L*px);$('rod').setAttribute('x2',500+p.L*px);$('Llabel').textContent='L = '+p.L.toFixed(1);$('arrows').innerHTML=drawArrow(p,q);$('Lv').textContent=p.L.toFixed(1);$('mrv').textContent=p.mr.toFixed(1);$('tv').textContent=p.tau.toFixed(1);$('Ir').textContent=q.Irod.toFixed(3);$('It').textContent=q.It.toFixed(3);$('ar').textContent=q.a.toFixed(3);const Imax=1+2*64/12,amax=1.6/(1+.5*4/12);$('Ibar').style.width=(100*q.It/Imax)+'%';$('abar').style.width=(100*q.a/amax)+'%';$('check1').textContent=(q.It>IB?'PASS':'FAIL')+'：I_total > I_body';const eps=.000001,qa=calc({...p,L:Math.min(8,p.L+.1)});$('check2').textContent=(qa.It+eps>=q.It?'PASS':'FAIL')+'：增大 L 不会减小 I';$('check3').textContent=(qa.a<=q.a+eps?'PASS':'FAIL')+'：同 τ 下增大 L 不会增大 α_rel';document.querySelectorAll('.q').forEach(b=>b.classList.toggle('active',Math.abs(+b.dataset.L-p.L)<.001))}['L','mr','tau'].forEach(id=>$(id).oninput=draw);document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{$('L').value=b.dataset.L;draw()});$('reset').onclick=()=>{$('L').value=6;$('mr').value=1;$('tau').value=1;draw()};draw()})();</script></body></html>
