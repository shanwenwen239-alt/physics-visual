<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第9题｜带电粒子电场偏转 v8</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.title{font-size:28px;font-weight:900;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d7e3ef;border-radius:14px}.desc{padding:12px 16px;margin-bottom:14px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;height:min(68vh,650px);min-height:520px}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.range,.params input{width:100%}.params{display:grid;gap:12px}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.value{color:#2563eb;font-weight:800}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}.collapsed{display:none}@media(max-width:920px){.layout{grid-template-columns:1fr}.scene{height:540px}}</style></head><body><main class="w"><div class="title">第9题｜正电粒子：加速 → 偏转 → 打到荧光屏</div><div class="desc">电场区域用不同浅色背景区分：左侧加速电场为浅橙色，中央偏转电场为浅蓝色，无电场区域保持白色。轨迹仍只显示已经实际走过的部分。</div><div class="layout"><section class="card"><svg id="scene" class="scene" viewBox="0 0 1040 600"><defs><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker></defs><rect width="1040" height="600" fill="#fbfdff"/><rect x="100" y="185" width="135" height="315" rx="10" fill="#fff4e8" stroke="#f1c58f" stroke-width="1.5"/><rect x="360" y="225" width="280" height="270" rx="10" fill="#edf6ff" stroke="#a9cbed" stroke-width="1.5"/><text x="116" y="210" fill="#b45309" font-size="13" font-weight="800">受加速电场力区域</text><text x="377" y="252" fill="#1d4ed8" font-size="13" font-weight="800">受偏转电场力区域</text><line x1="55" y1="360" x2="940" y2="360" stroke="#94a3b8" stroke-dasharray="7 7"/><text x="70" y="52" font-weight="850">① 加速电场</text><line x1="100" y1="190" x2="100" y2="500" stroke="#53657b" stroke-width="6"/><line x1="235" y1="190" x2="235" y2="500" stroke="#53657b" stroke-width="6"/><text x="88" y="174" fill="#991b1b" font-weight="900">+</text><text x="225" y="174" fill="#245a91" font-weight="900">−</text><line x1="125" y1="330" x2="205" y2="330" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/><text x="148" y="314" fill="#047857">Eₐ</text><text x="350" y="52" font-weight="850">② 偏转电场</text><line x1="360" y1="225" x2="640" y2="225" stroke="#53657b" stroke-width="7"/><line x1="360" y1="495" x2="640" y2="495" stroke="#53657b" stroke-width="7"/><text x="650" y="232" fill="#245a91" font-weight="900">−</text><text x="650" y="502" fill="#991b1b" font-weight="900">+</text><g stroke="#7fa99b" stroke-width="1.8" marker-end="url(#g)" opacity=".8"><line x1="405" y1="455" x2="405" y2="270"/><line x1="475" y1="455" x2="475" y2="270"/><line x1="545" y1="455" x2="545" y2="270"/><line x1="615" y1="455" x2="615" y2="270"/></g><text x="657" y="416" fill="#047857">E↑</text><line x1="360" y1="548" x2="640" y2="548" stroke="#94a3b8"/><text x="490" y="570" fill="#64748b">L</text><line x1="640" y1="548" x2="925" y2="548" stroke="#94a3b8"/><text x="775" y="570" fill="#64748b">L</text><text x="760" y="52" font-weight="850">③ 离开电场</text><line x1="925" y1="88" x2="925" y2="520" stroke="#334155" stroke-width="4"/><text x="937" y="108">荧光屏</text><path id="trail" fill="none" stroke="#86aee2" stroke-width="3"/><circle id="hit" r="6" fill="#7c3aed" style="display:none"/><text id="Ptxt" fill="#6d28d9" font-weight="800" style="display:none">P</text><circle id="particle" r="13" fill="#ffd6d6" stroke="#a43d3d" stroke-width="2.5"/><text id="plus" fill="#991b1b" font-weight="900">+</text><line id="vel" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#b)"/><text id="vtxt" fill="#1d4ed8" font-weight="800">v</text><line id="force" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><text id="ftxt" fill="#991b1b" font-weight="800">Fₑ</text><g id="measure" style="display:none"><line id="y1m" x1="665" x2="665" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/><text id="y1txt" fill="#6d28d9">y₁</text><line id="opm" x1="958" x2="958" stroke="#7c3aed" stroke-width="2"/><text id="optxt" fill="#6d28d9">OP</text></g></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><label><input id="showForce" type="checkbox" checked> 显示受力</label></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"></section><aside class="side"><section class="card"><h3>参数</h3><div class="params"><label>加速电压 Uₐ：<span id="uaV" class="value"></span><input id="ua" type="range" min="0.8" max="1.5" step=".05" value="1"></label><label>偏转电压 U_d：<span id="udV" class="value"></span><input id="ud" type="range" min="0" max="1.2" step=".05" value="1"></label><label>荷质比 q/m：<span id="qmV" class="value"></span><input id="qm" type="range" min="0.5" max="2" step=".05" value="1"></label></div></section><section class="card"><h3>实时量</h3><div class="data"><span>阶段</span><b id="stage"></b><span>t</span><b id="time"></b><span>v₀</span><b id="v0"></b><span>|Fₑ|</span><b id="fe"></b><span>y₁/L</span><b id="y1"></b><span>tanθ</span><b id="tan"></b><span>OP/L</span><b id="op"></b></div></section><section class="card"><button id="toggleTheory" class="btn">展开原题结论</button><div id="theory" class="collapsed box" style="margin-top:8px">原题 Uₐ=U_d=U：y₁=L/4，tanθ=1/2，OP=3L/4。</div></section></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),G={xA0:100,xA1:235,xD0:360,xD1:640,xS:925,y0:360};const dA=.48,m=1;let u=0,run=false,speed=1,last=performance.now();function pars(){return{Ua:+$('ua').value,Ud:+$('ud').value,qm:+$('qm').value}}function model(p){const q=p.qm*m,Ea=p.Ua/dA,aa=p.qm*Ea,v0=Math.sqrt(2*p.qm*p.Ua),ta=v0/aa,tgap=.45/v0,ay=p.qm*p.Ud,td=1/v0,y1=.5*ay*td*td,vy1=ay*td,tfree=1/v0;return{q,Ea,aa,v0,ta,tgap,ay,td,y1,vy1,tfree,total:ta+tgap+td+tfree}}function state(t,p,M){if(t<=M.ta)return{phase:'加速电场',xn:.5*M.aa*t*t,yn:0,vx:M.aa*t,vy:0,Fx:M.q*M.Ea,Fy:0};t-=M.ta;if(t<=M.tgap)return{phase:'区间匀速',xn:dA+.45*t/M.tgap,yn:0,vx:M.v0,vy:0,Fx:0,Fy:0};t-=M.tgap;if(t<=M.td)return{phase:'偏转电场',xn:dA+.45+M.v0*t,yn:.5*M.ay*t*t,vx:M.v0,vy:M.ay*t,Fx:0,Fy:M.q*p.Ud};t-=M.td;return{phase:'离场匀速',xn:dA+1.45+M.v0*t,yn:M.y1+M.vy1*t,vx:M.v0,vy:M.vy1,Fx:0,Fy:0}}function mapX(x){if(x<=dA)return G.xA0+(G.xA1-G.xA0)*x/dA;if(x<=dA+.45)return G.xA1+(G.xD0-G.xA1)*(x-dA)/.45;if(x<=dA+1.45)return G.xD0+(G.xD1-G.xD0)*(x-dA-.45);return G.xD1+(G.xS-G.xD1)*(x-dA-1.45)}function mapY(y){return G.y0-272*y}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){const p=pars(),M=model(p),t=u*M.total,S=state(t,p,M);let d='';if(u>0){const N=Math.max(2,Math.floor(180*u));for(let i=0;i<=N;i++){const ti=M.total*u*i/N,st=state(ti,p,M);d+=(i?' L':'M')+mapX(st.xn)+' '+mapY(st.yn)}}$('trail').setAttribute('d',d);const x=mapX(S.xn),y=mapY(S.yn);$('particle').setAttribute('cx',x);$('particle').setAttribute('cy',y);$('plus').setAttribute('x',x-5);$('plus').setAttribute('y',y+5);const vm=Math.hypot(S.vx,S.vy);if(vm>1e-8){const vl=74;ln('vel',x,y,x+vl*S.vx/vm,y-vl*S.vy/vm);$('vel').style.display='';$('vtxt').style.display='';$('vtxt').setAttribute('x',x+vl*S.vx/vm+6);$('vtxt').setAttribute('y',y-vl*S.vy/vm-6)}else{$('vel').style.display='none';$('vtxt').style.display='none'}const F=Math.hypot(S.Fx,S.Fy);if(F>1e-8&&$('showForce').checked){const fl=Math.min(82,18+40*F);ln('force',x,y,x+fl*S.Fx/F,y-fl*S.Fy/F);$('force').style.display='';$('ftxt').style.display='';$('ftxt').setAttribute('x',x+8+fl*S.Fx/F);$('ftxt').setAttribute('y',y-8-fl*S.Fy/F)}else{$('force').style.display='none';$('ftxt').style.display='none'}const yHit=M.y1+M.vy1*M.tfree;if(u>=1){$('hit').style.display='';$('Ptxt').style.display='';$('measure').style.display='';$('hit').setAttribute('cx',G.xS);$('hit').setAttribute('cy',mapY(yHit));$('Ptxt').setAttribute('x',G.xS+9);$('Ptxt').setAttribute('y',mapY(yHit)-8);ln('y1m',665,G.y0,665,mapY(M.y1));$('y1txt').setAttribute('x',672);$('y1txt').setAttribute('y',(G.y0+mapY(M.y1))/2);ln('opm',958,G.y0,958,mapY(yHit));$('optxt').setAttribute('x',965);$('optxt').setAttribute('y',(G.y0+mapY(yHit))/2)}else{$('hit').style.display='none';$('Ptxt').style.display='none';$('measure').style.display='none'}$('stage').textContent=S.phase;$('time').textContent=t.toFixed(3);$('v0').textContent=M.v0.toFixed(3);$('fe').textContent=F.toFixed(3);$('y1').textContent=(p.Ud/(4*p.Ua)).toFixed(3);$('tan').textContent=(p.Ud/(2*p.Ua)).toFixed(3);$('op').textContent=(3*p.Ud/(4*p.Ua)).toFixed(3);$('uaV').textContent=p.Ua.toFixed(2)+'U';$('udV').textContent=p.Ud.toFixed(2)+'U';$('qmV').textContent=p.qm.toFixed(2);$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('ua').value=1;$('ud').value=1;$('qm').value=1;$('showForce').checked=true;draw()};$('progress').oninput=e=>{run=false;u=+e.target.value;draw()};$('showForce').onchange=draw;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['ua','ud','qm'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});$('toggleTheory').onclick=()=>{$('theory').classList.toggle('collapsed')};function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(run){u+=dt*.16*speed;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
