<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第23题｜30°斜面上滑</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--g:#059669;--v:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:white;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.75fr .8fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1f497d10}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:12px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.answer{background:#ecfdf5}.note{background:#fff8e8}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第23题｜30°斜面上滑</div><div class="layout"><div><section class="card"><svg class="scene" viewBox="0 0 920 500"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="mv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="920" height="500" rx="12" fill="#fbfdff"/><polygon points="110,420 720,420 720,68" fill="#fff7e8" stroke="#b08955" stroke-width="2"/><line x1="110" y1="420" x2="720" y2="68" stroke="#42546b" stroke-width="4"/><text x="165" y="402" fill="#7c3aed" font-weight="700">30°</text><g id="block"><rect width="82" height="58" rx="9" fill="#c9e0ff" stroke="#245a91" stroke-width="2.5"/><text x="33" y="37" font-size="22">m</text></g><line id="vel" stroke="#2563eb" stroke-width="2.8" marker-end="url(#mb)" stroke-linecap="round"/><line id="mg" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)" stroke-linecap="round"/><line id="N" stroke="#d97706" stroke-width="3" marker-end="url(#mo)" stroke-linecap="round"/><line id="fr" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)" stroke-linecap="round"/><line id="net" stroke="#7c3aed" stroke-width="3" marker-end="url(#mv)" stroke-linecap="round"/><text id="mgt" fill="#991b1b" font-size="14" font-weight="700">G</text><text id="Nt" fill="#9a6200" font-size="14" font-weight="700">N</text><text id="frt" fill="#991b1b" font-size="14" font-weight="700">f</text><text id="nett" fill="#6d28d9" font-size="14" font-weight="700">F合</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><button id="prev" class="btn">◀ 单步</button><button id="next" class="btn">单步 ▶</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside class="card"><h3>实时物理核查</h3><div class="data"><span>速度</span><b id="vv" style="color:#2563eb">v₀</b><span>位移</span><b id="ss" style="color:#059669">0</b><span>G</span><b style="color:#dc2626">1.000mg</b><span>N</span><b style="color:#d97706">0.866mg</b><span>f</span><b style="color:#dc2626">0.250mg</b><span>F合</span><b style="color:#7c3aed">0.750mg向下</b></div><div class="box note"><b>矢量规则：</b>G始终竖直向下；N始终垂直斜面；上滑阶段f始终沿斜面向下；F合沿斜面向下。所有箭头从物体重心附近出发，标签与箭头保持间距。</div><div class="box theory"><b>物理模型：</b>mg sin30°+f=m·3g/4，所以f=¼mg；N=mg cos30°=√3/2·mg。上滑阶段这些力大小均不变，只有速度箭头逐渐缩短。</div><div class="box answer"><b>边界：</b>动画止于最高点前后临界，不擅自继续模拟下滑，因为后续摩擦状态需重新判断。</div></aside></div><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const A={x:155,y:370},B={x:640,y:90},ux=Math.cos(Math.PI/6),uy=-Math.sin(Math.PI/6),nx=-Math.sin(Math.PI/6),ny=-Math.cos(Math.PI/6);function line(id,x1,y1,x2,y2){let e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function pos(id,x,y){q(id).setAttribute('x',x);q(id).setAttribute('y',y)}function draw(){p=Math.max(0,Math.min(1,p));let s=1-(1-p)*(1-p),x=A.x+(B.x-A.x)*s,y=A.y+(B.y-A.y)*s,v=1-p;q('block').setAttribute('transform',`translate(${x-41} ${y-29}) rotate(-30 41 29)`);line('vel',x,y,x+90*v*ux,y+90*v*uy);line('mg',x,y,x,y+68);line('N',x,y,x+58*nx,y+58*ny);line('fr',x,y,x-28*ux,y-28*uy);line('net',x,y,x-52*ux,y-52*uy);pos('mgt',x+7,y+61);pos('Nt',x+58*nx-18,y+58*ny-6);pos('frt',x-45*ux,y-45*uy+20);pos('nett',x-72*ux,y-72*uy+22);q('vv').textContent=v.toFixed(2)+'v₀';q('ss').textContent=s.toFixed(2)+'smax';q('t').value=p}q('play').onclick=()=>{if(p>=1)p=0;run=true};q('pause').onclick=()=>run=false;q('reset').onclick=()=>{run=false;p=0;draw()};q('prev').onclick=()=>{run=false;p-=.025;draw()};q('next').onclick=()=>{run=false;p+=.025;draw()};q('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.16;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
