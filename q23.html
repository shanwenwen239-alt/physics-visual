<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第23题｜斜面上滑参数实验</title><style>:root{--ink:#10233f;--line:#d8e3ef;--b:#2563eb;--r:#dc2626;--o:#d97706;--v:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:var(--ink)}.w{max-width:1360px;margin:auto;padding:16px}.title{display:inline-block;background:linear-gradient(90deg,#356da9,#28598d);color:white;border-radius:12px;padding:11px 22px;font-size:27px;font-weight:800}.layout{display:grid;grid-template-columns:1.72fr .82fr;gap:14px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.scene{width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cad7e6;background:#fff;border-radius:9px;padding:8px 13px}.primary{background:var(--b);color:#fff}.slider{width:100%;margin:10px 0}.data{display:grid;grid-template-columns:1fr auto;gap:8px 14px}.box{margin-top:10px;border-radius:11px;padding:10px;font-size:13px;line-height:1.7}.theory{background:#eef6ff}.note{background:#fff8e8}.params{display:grid;grid-template-columns:1fr;gap:12px}.params label{font-size:13px;font-weight:700}.params input{width:100%;margin-top:5px}.value{color:#1d4ed8}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第23题｜斜面上滑参数实验</div><div class="layout"><div><section class="card"><svg class="scene" viewBox="0 0 920 500"><defs><marker id="mr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="mo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="mv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="920" height="500" rx="12" fill="#fbfdff"/><polygon id="wedge" fill="#fff7e8" stroke="#b08955" stroke-width="2"/><line id="slope" stroke="#42546b" stroke-width="4"/><text id="angleT" fill="#7c3aed" font-weight="700"></text><g id="block"><rect x="-41" y="-29" width="82" height="58" rx="9" fill="#c9e0ff" stroke="#245a91" stroke-width="2.5"/><text x="-8" y="8" font-size="22">m</text><circle r="4" fill="#334155"/></g><line id="vel" stroke="#2563eb" stroke-width="3.2" stroke-dasharray="8 6" marker-end="url(#mb)"/><line id="mg" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="N" stroke="#d97706" stroke-width="3" marker-end="url(#mo)"/><line id="fr" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/><line id="net" stroke="#7c3aed" stroke-width="3" marker-end="url(#mv)"/><text id="velt" fill="#1d4ed8" font-size="14" font-weight="700">速度 v</text><text id="mgt" fill="#991b1b" font-size="14" font-weight="700">G</text><text id="Nt" fill="#9a6200" font-size="14" font-weight="700">N</text><text id="frt" fill="#991b1b" font-size="14" font-weight="700">f</text><text id="nett" fill="#6d28d9" font-size="14" font-weight="700">F合</text><text x="620" y="52" fill="#64748b" font-size="13">物体在斜面上方｜受力从中心出发</text></svg></section><section class="card" style="margin-top:10px"><div class="row"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置全部</button></div><input id="t" class="slider" type="range" min="0" max="1" step=".001" value="0"></section></div><aside><section class="card"><h3>参数</h3><div class="params"><label>斜面角 θ：<span id="thv" class="value">30°</span><input id="theta" type="range" min="15" max="45" step="1" value="30"></label><label>动摩擦因数 μ：<span id="muv" class="value">0.289</span><input id="mu" type="range" min="0" max="0.5" step="0.01" value="0.289"></label><label>初速度 v₀：<span id="v0v" class="value">1.00</span><input id="v0" type="range" min="0.6" max="1.6" step="0.05" value="1"></label></div><div class="box note">参数固定在主图右侧。改变参数后，斜面、受力大小、减速度和运动过程同步重算。</div></section><section class="card" style="margin-top:10px"><h3>实时物理量</h3><div class="data"><span>速度 v/v₀</span><b id="vv">1.00</b><span>位移 s/smax</span><b id="ss">0.00</b><span>N/mg</span><b id="nV">—</b><span>f/mg</span><b id="fV">—</b><span>F合/mg</span><b id="netV">—</b><span>a/g</span><b id="aV">—</b></div><div class="box theory"><b>模型：</b>a=g(sinθ+μcosθ)，N=mgcosθ，f=μmgcosθ。所有受力矢量均从物体中心出发。</div></section></aside></div><script>(()=>{const $=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const O={x:125,y:420},LEN=610,BH=58;function line(id,x1,y1,x2,y2){let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function pos(id,x,y){$(id).setAttribute('x',x);$(id).setAttribute('y',y)}function pars(){let th=+$('theta').value*Math.PI/180,mu=+$('mu').value,v0=+$('v0').value;return{th,mu,v0,sn:Math.sin(th),cs:Math.cos(th)}}function resetMotion(){run=false;p=0;$('t').value=0;draw()}function resetAll(){$('theta').value=30;$('mu').value=0.289;$('v0').value=1;resetMotion()}function draw(){p=Math.max(0,Math.min(1,p));const P=pars(),ux=P.cs,uy=-P.sn,nx=-P.sn,ny=-P.cs,ex=O.x+LEN*ux,ey=O.y+LEN*uy;$('wedge').setAttribute('points',`${O.x},${O.y} ${ex},${ey} ${ex},${O.y}`);line('slope',O.x,O.y,ex,ey);pos('angleT',O.x+58,O.y-12);$('angleT').textContent=Math.round(P.th*180/Math.PI)+'°';const ag=P.sn+P.mu*P.cs,tStop=P.v0/ag,sMax=P.v0*P.v0/(2*ag),tNow=p*tStop,sNow=P.v0*tNow-.5*ag*tNow*tNow,frac=sMax>0?sNow/sMax:0,v=Math.max(0,P.v0-ag*tNow),travel=75+Math.min(430,430*frac),contactX=O.x+travel*ux,contactY=O.y+travel*uy,cx=contactX+nx*(BH/2),cy=contactY+ny*(BH/2);$('block').setAttribute('transform',`translate(${cx} ${cy}) rotate(${-P.th*180/Math.PI})`);let gL=68,nL=68*P.cs,fL=68*P.mu*P.cs,netL=68*ag;line('vel',cx,cy,cx+90*(v/P.v0)*ux,cy+90*(v/P.v0)*uy);line('mg',cx,cy,cx,cy+gL);line('N',cx,cy,cx+nL*nx,cy+nL*ny);line('fr',cx,cy,cx-fL*ux,cy-fL*uy);line('net',cx,cy,cx-netL*ux,cy-netL*uy);pos('velt',cx+45*(v/P.v0)*ux+8,cy+45*(v/P.v0)*uy-8);pos('mgt',cx+7,cy+61);pos('Nt',cx+nL*nx-18,cy+nL*ny-6);pos('frt',cx-fL*ux-20,cy-fL*uy+18);pos('nett',cx-netL*ux-26,cy-netL*uy+22);$('velt').style.opacity=v/P.v0<.05?0:1;$('vv').textContent=(v/P.v0).toFixed(2);$('ss').textContent=frac.toFixed(2);$('nV').textContent=P.cs.toFixed(3);$('fV').textContent=(P.mu*P.cs).toFixed(3);$('netV').textContent=ag.toFixed(3);$('aV').textContent=ag.toFixed(3);$('thv').textContent=Math.round(P.th*180/Math.PI)+'°';$('muv').textContent=P.mu.toFixed(3);$('v0v').textContent=P.v0.toFixed(2);$('t').value=p}$('play').onclick=()=>{if(p>=1)p=0;run=true};$('pause').onclick=()=>run=false;$('reset').onclick=resetAll;['theta','mu','v0'].forEach(id=>$(id).oninput=resetMotion);$('t').oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.18;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></main></body></html>
