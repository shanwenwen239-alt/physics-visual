<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第23题｜斜面上滑</title><style>body{margin:0;background:#f5f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1180px;margin:auto;padding:20px}.back{color:#64748b;text-decoration:none}.title{font-size:26px;font-weight:800;margin:6px 0}.sub{color:#64748b}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:20px;box-shadow:0 12px 32px rgba(15,23,42,.06)}.stage,.side{padding:16px}.scene{width:100%}.btn{border:1px solid #d5deea;background:#fff;border-radius:11px;padding:9px 13px;cursor:pointer}.primary{background:#111827;color:#fff}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.slider{width:100%;margin-top:12px}.metric{display:grid;grid-template-columns:1fr auto;gap:10px 14px;font-size:14px}.note{background:#fefce8;border:1px solid #fde68a;border-radius:12px;padding:10px;font-size:12px;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="back" href="index.html">← 返回题库</a><div class="title">第23题｜物体沿 30° 斜面上滑</div><div class="sub">物体从 A 点沿固定斜面向上运动，加速度大小为 3g/4，直到速度降为 0，达到最大竖直高度 h。</div><div class="grid"><section class="card stage"><svg class="scene" viewBox="0 0 760 430"><defs><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><polygon points="110,340 620,340 620,45" fill="#fff7ed" stroke="#9a6b35" stroke-width="3"/><line x1="110" y1="340" x2="620" y2="45" stroke="#334155" stroke-width="5"/><text x="90" y="365">A</text><text x="630" y="50">B</text><text x="628" y="355">C</text><path d="M170 340 A60 60 0 0 0 162 310" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="165" y="325" fill="#7c3aed">30°</text><g id="block"><rect x="0" y="0" width="70" height="52" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/><text x="27" y="33" font-size="20">m</text></g><line id="v" x1="0" y1="0" x2="0" y2="0" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/><text id="vt" x="0" y="0" fill="#2563eb">v</text><line id="a" x1="0" y1="0" x2="0" y2="0" stroke="#dc2626" stroke-width="4" marker-end="url(#arrR)"/><text id="at" x="0" y="0" fill="#dc2626">a = 3g/4</text><line id="hline" x1="620" y1="340" x2="620" y2="340" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 5"/><text id="ht" x="630" y="250" fill="#16a34a">h</text></svg><input id="timeline" class="slider" type="range" min="0" max="1" step="0.001" value="0"><div class="controls"><button id="play" class="btn primary">播放</button><button id="reset" class="btn">重置</button><button id="mid" class="btn">中间时刻</button><button id="top" class="btn">最高点</button></div></section><aside class="card side"><h3>运动量变化</h3><div class="metric"><span>沿斜面位移</span><b id="s">0</b><span>竖直高度</span><b id="hh">0</b><span>速度</span><b id="vv">v₀</b><span>加速度方向</span><b>沿斜面向下</b></div><p id="hint">物体上滑，但加速度始终沿斜面向下，因此速度逐渐减小。</p><div class="note">动画采用匀减速运动关系进行比例化展示。已知 a=3g/4、斜面角 30°，所以位移与竖直高度满足 h=s·sin30°=s/2。原图没有显示第23题的选项，因此这里先做运动过程与关键物理量可视化。</div></aside></div></main><script>(()=>{const q=id=>document.getElementById(id);let p=0,run=false,last=performance.now();const A={x:130,y:305},B={x:545,y:65},dx=B.x-A.x,dy=B.y-A.y;function render(){p=Math.max(0,Math.min(1,p));const u=1-Math.pow(1-p,2),x=A.x+dx*u,y=A.y+dy*u;q('block').setAttribute('transform',`translate(${x-35} ${y-26}) rotate(-30 35 26)`);const speed=1-p,len=90*speed,ux=Math.cos(Math.PI/6),uy=-Math.sin(Math.PI/6);q('v').setAttribute('x1',x);q('v').setAttribute('y1',y);q('v').setAttribute('x2',x+len*ux);q('v').setAttribute('y2',y+len*uy);q('vt').setAttribute('x',x+len*ux+5);q('vt').setAttribute('y',y+len*uy);q('a').setAttribute('x1',x);q('a').setAttribute('y1',y);q('a').setAttribute('x2',x-70*ux);q('a').setAttribute('y2',y-70*uy);q('at').setAttribute('x',x-125);q('at').setAttribute('y',y+55);q('hline').setAttribute('y2',y);q('ht').setAttribute('y',(340+y)/2);q('timeline').value=p;q('s').textContent=(u*1).toFixed(2)+' sₘₐₓ';q('hh').textContent=(u*.5).toFixed(2)+' hₘₐₓ';q('vv').textContent=p>=.999?'0':speed.toFixed(2)+' v₀';q('hint').textContent=p<.85?'上滑过程中速度箭头不断缩短，而加速度方向始终向下。':'到达最高点时瞬时速度为 0，但加速度仍不为 0。'}q('play').onclick=()=>run=!run;q('reset').onclick=()=>{run=false;p=0;render()};q('mid').onclick=()=>{run=false;p=.5;render()};q('top').onclick=()=>{run=false;p=1;render()};q('timeline').oninput=e=>{run=false;p=+e.target.value;render()};function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run){p+=dt*.18;if(p>=1){p=1;run=false}render()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
