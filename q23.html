<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第23题｜斜面上滑</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1400px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.params{display:grid;gap:11px}.params input,.range{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第23题｜物块沿粗糙斜面向上滑</div><div class="desc">本页只演示题目的“上滑阶段”，到速度降为0时停止，不擅自延伸为下滑。固定画布比例；G始终竖直向下，N垂直斜面，滑动摩擦力沿斜面向下，速度沿斜面向上。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 940 520"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker><marker id="purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="940" height="520" fill="#fbfdff"/><polygon id="wedge" fill="#fff7e8" stroke="#b08955" stroke-width="2"/><line id="slope" stroke="#42546b" stroke-width="4"/><text id="angleT" fill="#6d28d9" font-weight="800"></text><g id="block"><rect x="-41" y="-29" width="82" height="58" rx="9" fill="#c9e0ff" stroke="#245a91" stroke-width="2.5"/><text x="-8" y="8" font-size="22">m</text><circle r="4" fill="#334155"/></g><line id="vel" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="fr" stroke="#d97706" stroke-width="3" marker-end="url(#orange)"/><line id="net" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/><g id="labels" font-size="14" font-weight="800"></g></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><label><input id="showNet" type="checkbox"> 显示合力</label></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>θ：<span id="thv" class="value"></span><input id="theta" type="range" min="15" max="45" step="1" value="30"></label><label>μ：<span id="muv" class="value"></span><input id="mu" type="range" min="0" max=".5" step=".01" value=".289"></label><label>v₀：<span id="v0v" class="value"></span><input id="v0" type="range" min=".6" max="1.6" step=".05" value="1"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>阶段</span><b id="stage"></b><span>v/v₀</span><b id="vv"></b><span>s/smax</span><b id="ss"></b><span>N/mg</span><b id="nV"></b><span>f/mg</span><b id="fV"></b><span>|F合|/mg</span><b id="netV"></b><span>a/g</span><b id="aV"></b></div></div><div class="card"><div class="box">上滑阶段：a=g(sinθ+μcosθ)，方向沿斜面向下；N=mgcosθ；f=μmgcosθ。到 v=0 为本题演示终点。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),O={x:125,y:435},LEN=640,BH=58;let p=0,run=false,speed=1,last=performance.now();function P(){const th=+$('theta').value*Math.PI/180;return{th,mu:+$('mu').value,v0:+$('v0').value,sn:Math.sin(th),cs:Math.cos(th)}}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){const q=P(),ux=q.cs,uy=-q.sn,nx=-q.sn,ny=-q.cs,ex=O.x+LEN*ux,ey=O.y+LEN*uy;$('wedge').setAttribute('points',`${O.x},${O.y} ${ex},${ey} ${ex},${O.y}`);ln('slope',O.x,O.y,ex,ey);$('angleT').setAttribute('x',O.x+55);$('angleT').setAttribute('y',O.y-12);$('angleT').textContent=(q.th*180/Math.PI).toFixed(0)+'°';const ag=q.sn+q.mu*q.cs,tStop=q.v0/ag,sMax=q.v0*q.v0/(2*ag),t=p*tStop,s=q.v0*t-.5*ag*t*t,frac=s/sMax,v=Math.max(0,q.v0-ag*t),travel=80+Math.min(450,450*frac),px=O.x+travel*ux,py=O.y+travel*uy,cx=px+nx*BH/2,cy=py+ny*BH/2;$('block').setAttribute('transform',`translate(${cx} ${cy}) rotate(${-q.th*180/Math.PI})`);const k=70,gL=k,nL=k*q.cs,fL=k*q.mu*q.cs,netL=k*ag,vL=100*v/q.v0;ln('G',cx,cy,cx,cy+gL);ln('N',cx,cy,cx+nL*nx,cy+nL*ny);ln('fr',cx,cy,cx-fL*ux,cy-fL*uy);ln('net',cx,cy,cx-netL*ux,cy-netL*uy);ln('vel',cx,cy,cx+vL*ux,cy+vL*uy);$('net').style.display=$('showNet').checked?'':'none';$('vel').style.opacity=v<.001?0:1;let h=`<text x="${cx+8}" y="${cy+gL-5}" fill="#b91c1c">G</text><text x="${cx+nL*nx-18}" y="${cy+nL*ny-6}" fill="#047857">N</text><text x="${cx-fL*ux-22}" y="${cy-fL*uy+18}" fill="#a16207">f</text>`;if(v>.001)h+=`<text x="${cx+vL*ux+8}" y="${cy+vL*uy-8}" fill="#1d4ed8">v</text>`;if($('showNet').checked)h+=`<text x="${cx-netL*ux-30}" y="${cy-netL*uy+20}" fill="#6d28d9">F合</text>`;$('labels').innerHTML=h;$('thv').textContent=(q.th*180/Math.PI).toFixed(0)+'°';$('muv').textContent=q.mu.toFixed(3);$('v0v').textContent=q.v0.toFixed(2);$('stage').textContent=p>=1?'到达最高点：v=0':'沿斜面上滑';$('vv').textContent=(v/q.v0).toFixed(2);$('ss').textContent=frac.toFixed(2);$('nV').textContent=q.cs.toFixed(3);$('fV').textContent=(q.mu*q.cs).toFixed(3);$('netV').textContent=ag.toFixed(3);$('aV').textContent=ag.toFixed(3);$('progress').value=p;$('play').textContent=run?'Ⅱ 暂停':p>=1?'↻ 重新开始':p>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(p>=1)p=0;run=!run;draw()};$('reset').onclick=()=>{run=false;p=0;$('theta').value=30;$('mu').value=.289;$('v0').value=1;draw()};$('progress').oninput=e=>{run=false;p=+e.target.value;draw()};$('showNet').onchange=draw;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['theta','mu','v0'].forEach(id=>$(id).oninput=()=>{run=false;p=0;draw()});function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(run){p+=dt*.2*speed;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
