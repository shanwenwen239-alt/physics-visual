<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第34题｜电梯做功与能量流</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(360px,.9fr);gap:14px}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.side{display:grid;gap:10px;align-content:start}.params{display:grid;gap:10px}.params input,.range{width:100%}.value{color:#2563eb;font-weight:800}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.ledger{display:grid;gap:14px}.sys{border:1px solid #dbe7f4;border-radius:12px;padding:12px;background:#fbfdff}.sys h3{margin:0 0 8px}.eq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6}.flow{display:grid;grid-template-columns:110px 32px 1fr;gap:8px;align-items:center}.inputbar{height:90px;border-radius:10px;background:#16a34a;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;position:relative;overflow:hidden}.arrow{font-size:28px;text-align:center;color:#64748b}.stack{height:90px;border-radius:10px;background:#edf2f7;overflow:hidden;display:flex;position:relative}.seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;min-width:0;transition:width .1s linear}.k{background:#2563eb}.u{background:#7c3aed}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:7px}.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}.event{background:#ecfdf5;border-radius:10px;padding:10px;line-height:1.55}.subtle{color:#64748b;font-size:12px}.tabs{display:flex;gap:8px;margin-bottom:8px}.tab{flex:1}.hidden{display:none}@media(max-width:980px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第34题｜电梯做功：把“功”直接看成能量流</div><div class="desc">不只显示 W、K、U 的数字，而是把做功过程画成“输入能量 → 动能 + 重力势能”的实时分流。物体 m 与整个电梯系统要分开选系统分析，避免把支持力做功和钢索做功混在一起。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1000 610"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1000" height="610" fill="#fbfdff"/><line x1="330" y1="25" x2="330" y2="585" stroke="#cbd5e1" stroke-width="3"/><line x1="670" y1="25" x2="670" y2="585" stroke="#cbd5e1" stroke-width="3"/><line x1="710" y1="520" x2="920" y2="520" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="730" y="542" fill="#64748b" font-size="13">h=0</text><g id="elevator"><rect x="370" y="300" width="260" height="230" fill="#e5edf7" stroke="#334155" stroke-width="4"/><line x1="370" y1="530" x2="630" y2="530" stroke="#334155" stroke-width="5"/><rect x="450" y="450" width="100" height="80" rx="9" fill="#cbe2ff" stroke="#245a91" stroke-width="3"/><text x="490" y="500" font-size="28">m</text><text x="570" y="370" font-size="32">M</text></g><line id="cable" stroke="#334155" stroke-width="7"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="N" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="T" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><line id="vArr" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><g id="labels" font-size="14" font-weight="800"></g></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0"></div><div class="card" style="margin-top:10px"><div class="tabs"><button id="tabM" class="btn tab active">系统①：只看物体 m</button><button id="tabAll" class="btn tab">系统②：看电梯整体 M+m</button></div><div id="sysM" class="sys"><h3>支持力做功的去向</h3><div class="flow"><div id="WNbar" class="inputbar">W<sub>N</sub></div><div class="arrow">→</div><div class="stack"><div id="KmSeg" class="seg k">ΔK</div><div id="UmSeg" class="seg u">ΔU<sub>g</sub></div></div></div><div class="legend"><span><i class="dot" style="background:#16a34a"></i>支持力做功 WN</span><span><i class="dot" style="background:#2563eb"></i>物体动能增加</span><span><i class="dot" style="background:#7c3aed"></i>重力势能增加</span></div><div class="eq" id="eqM"></div></div><div id="sysAll" class="sys hidden"><h3>钢索做功的去向</h3><div class="flow"><div id="WTbar" class="inputbar">W<sub>T</sub></div><div class="arrow">→</div><div class="stack"><div id="KallSeg" class="seg k">ΔK</div><div id="UallSeg" class="seg u">ΔU<sub>g</sub></div></div></div><div class="legend"><span><i class="dot" style="background:#16a34a"></i>钢索做功 WT</span><span><i class="dot" style="background:#2563eb"></i>整体动能增加</span><span><i class="dot" style="background:#7c3aed"></i>整体重力势能增加</span></div><div class="eq" id="eqAll"></div></div></div></section><aside class="side"><div class="card"><h3>参数</h3><div class="params"><label>m：<span id="mv" class="value"></span><input id="m" type="range" min=".5" max="3" step=".1" value="1"></label><label>M：<span id="Mv" class="value"></span><input id="M" type="range" min="2" max="10" step=".5" value="5"></label><label>H：<span id="Hv" class="value"></span><input id="H" type="range" min="1" max="10" step=".5" value="4"></label><label>末速度 v：<span id="vfV" class="value"></span><input id="vf" type="range" min="1" max="8" step=".2" value="4"></label></div></div><div class="card"><h3>实时量</h3><div class="data"><span>h</span><b id="hv"></b><span>v</span><b id="vv"></b><span>a</span><b id="av"></b><span>N</span><b id="Nv"></b><span>T</span><b id="Tv"></b><span>WN</span><b id="WNv"></b><span>WT</span><b id="WTv"></b></div></div><div class="card"><div id="event" class="event"></div><p class="subtle">关键观察：输入条与右侧两个能量块的总宽度始终严格对应。</p></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8;let u=0,run=false,speed=1,last=performance.now();function P(){return{m:+$('m').value,M:+$('M').value,H:+$('H').value,vf:+$('vf').value}}function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(){const p=P(),a=p.vf*p.vf/(2*p.H),tEnd=p.vf/a,t=u*tEnd,h=.5*a*t*t,v=a*t,dy=-185*h/p.H,floorY=530+dy,roofY=300+dy,blockCy=490+dy,N=p.m*(g+a),T=(p.M+p.m)*(g+a);$('elevator').setAttribute('transform',`translate(0 ${dy})`);ln('cable',500,0,500,roofY);ln('G',500,blockCy,500,blockCy+Math.min(90,p.m*g*4.2));ln('N',500,blockCy,500,blockCy-Math.min(105,N*4.2));ln('T',500,roofY,500,roofY-Math.min(110,T*1.6));ln('vArr',710,floorY-20,710,floorY-20-Math.min(105,v*17));$('vArr').style.opacity=v<.01?0:1;$('labels').innerHTML=`<text x="510" y="${blockCy+52}" fill="#b91c1c">mg</text><text x="510" y="${blockCy-55}" fill="#047857">N</text><text x="512" y="${roofY-64}" fill="#1d4ed8">T</text>${v>.01?`<text x="722" y="${floorY-64}" fill="#1d4ed8">v</text>`:''}`;const Km=.5*p.m*v*v,Um=p.m*g*h,WN=N*h,Kall=.5*(p.M+p.m)*v*v,Uall=(p.M+p.m)*g*h,WT=T*h;const pctM=WN>1e-9?100*Km/WN:50,pctAll=WT>1e-9?100*Kall/WT:50;$('KmSeg').style.width=(WN>1e-9?pctM:0)+'%';$('UmSeg').style.width=(WN>1e-9?100-pctM:0)+'%';$('KallSeg').style.width=(WT>1e-9?pctAll:0)+'%';$('UallSeg').style.width=(WT>1e-9?100-pctAll:0)+'%';$('WNbar').style.opacity=WN>1e-9?1:.25;$('WTbar').style.opacity=WT>1e-9?1:.25;$('eqM').innerHTML=`WN = ${WN.toFixed(2)} J = ΔK ${Km.toFixed(2)} J + ΔUg ${Um.toFixed(2)} J`;$('eqAll').innerHTML=`WT = ${WT.toFixed(2)} J = ΔK ${Kall.toFixed(2)} J + ΔUg ${Uall.toFixed(2)} J`;$('event').innerHTML=`<b>当前物体 m：</b> WN = ΔK + ΔUg，所以 WN ${WN>Km+1e-6?'大于':'等于'} ΔK。<br><b>当前整体：</b> WT = ΔK整体 + ΔUg整体。`;['m','M','H','vf'].forEach(id=>$(id+'v')&&($(id+'v').textContent=p[id].toFixed(id==='vf'?1:1)));$('mv').textContent=p.m.toFixed(1);$('Mv').textContent=p.M.toFixed(1);$('Hv').textContent=p.H.toFixed(1);$('vfV').textContent=p.vf.toFixed(1);$('hv').textContent=h.toFixed(2)+' m';$('vv').textContent=v.toFixed(2)+' m/s';$('av').textContent=a.toFixed(2)+' m/s²';$('Nv').textContent=N.toFixed(2)+' N';$('Tv').textContent=T.toFixed(2)+' N';$('WNv').textContent=WN.toFixed(2)+' J';$('WTv').textContent=WT.toFixed(2)+' J';$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('tabM').onclick=()=>{$('sysM').classList.remove('hidden');$('sysAll').classList.add('hidden');$('tabM').classList.add('active');$('tabAll').classList.remove('active')};$('tabAll').onclick=()=>{$('sysAll').classList.remove('hidden');$('sysM').classList.add('hidden');$('tabAll').classList.add('active');$('tabM').classList.remove('active')};$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{u=0;run=false;$('m').value=1;$('M').value=5;$('H').value=4;$('vf').value=4;draw()};$('progress').oninput=e=>{u=+e.target.value;run=false;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['m','M','H','vf'].forEach(id=>$(id).oninput=()=>{u=0;run=false;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){const p=P(),a=p.vf*p.vf/(2*p.H),tEnd=p.vf/a;u+=dt*speed/tEnd;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
