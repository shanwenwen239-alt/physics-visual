<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第35题｜双物块弹簧耦合</title><style>body{margin:0;font-family:system-ui,'Microsoft YaHei';background:#f5f8fc;color:#10233f}.w{max-width:1350px;margin:auto;padding:18px}.hero{background:linear-gradient(90deg,#376eae,#24558f);color:#fff;padding:13px 22px;border-radius:12px;font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:2fr .8fr;gap:14px}.card{background:#fff;border:1px solid #d7e3f1;border-radius:15px;padding:14px;box-shadow:0 8px 24px #1f497d10}.btn{padding:9px 15px;border:1px solid #ccd9e8;border-radius:9px;background:#fff}.primary{background:#1672ee;color:#fff}.data{display:grid;grid-template-columns:1fr auto;gap:10px}.note{background:#fff8d9;padding:11px;border-radius:10px;line-height:1.7;margin-top:10px}.ok{background:#eafaf2;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第35题　恒力拉 A：弹簧第一次伸长到最长</div><p>A、B 质量相同，初始弹簧自然长。恒力 F 向左拉 A。重点同时观察 A、B 的速度、加速度以及弹簧伸长量。</p><div class="grid"><div><section class="card"><svg viewBox="0 0 900 430" style="width:100%"><defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef2b27"/></marker></defs><line x1="60" y1="340" x2="840" y2="340" stroke="#9fb0c3" stroke-width="4"/><g id="A"><rect width="100" height="80" rx="12" fill="#b9d7ff" stroke="#163f8c" stroke-width="4"/><text x="38" y="50" font-size="30">A</text></g><g id="B"><rect width="100" height="80" rx="12" fill="#d7f4e5" stroke="#16855a" stroke-width="4"/><text x="38" y="50" font-size="30">B</text></g><path id="spring" fill="none" stroke="#53657b" stroke-width="6"/><line id="F" x1="280" y1="270" x2="160" y2="270" stroke="#ef2b27" stroke-width="7" marker-end="url(#r)"/><text x="170" y="245" fill="#ef2b27" font-size="26">F</text></svg></section><section class="card" style="margin-top:10px"><button id="play" class="btn primary">▶ 播放</button><button id="pause" class="btn">Ⅱ 暂停</button><button id="reset" class="btn">↻ 重置</button><input id="t" type="range" min="0" max="1" step=".001" value="0" style="width:65%"></section></div><aside class="card"><h3>实时数据</h3><div class="data"><span>弹簧伸长量</span><b id="dx" style="color:#12a85a">0</b><span>vA−vB</span><b id="dv" style="color:#7c3aed">0</b><span>aA−aB</span><b id="da" style="color:#ef2b27">F/m</b></div><div class="note"><b>关键事件</b><br>开始时弹簧无弹力，A先获得更大的向左加速度；弹簧逐渐伸长，B被拉动。伸长量达到极大值时，伸长量变化率为0，所以 <b>vA=vB</b>，但这并不要求 aA=aB。</div><div class="note"><b>物理基础核实</b><br>取向左为正：maA=F−kx，maB=kx。两块加速度相等时 F−kx=kx，即 kx=F/2。此时相对速度尚未降为0，所以 A 仍比 B 快。</div><div class="ok"><b>结论：D。</b><br>当 aA=aB 时，vA&gt;vB。</div></aside></div><script>let p=0,run=false,last=0;const A=document.getElementById('A'),B=document.getElementById('B'),sp=document.getElementById('spring'),sl=document.getElementById('t');function spring(x1,x2,y){let d=`M${x1} ${y}`,n=10;for(let i=1;i<n*2;i++){let x=x1+(x2-x1)*i/(n*2),yy=y+(i%2?-18:18);d+=` L${x} ${yy}`}return d+` L${x2} ${y}`}function draw(){let xA=330-180*p,xB=560-70*p,ext=110*p;A.setAttribute('transform',`translate(${xA} 230)`);B.setAttribute('transform',`translate(${xB} 230)`);sp.setAttribute('d',spring(xA+100,xB,270));document.getElementById('F').setAttribute('transform',`translate(${-180*p} 0)`);document.getElementById('dx').textContent=(100*p).toFixed(0)+'% 最大伸长';document.getElementById('dv').textContent=p<.98?'＞0':'≈0';document.getElementById('da').textContent=p<.5?'＞0':p<.6?'≈0':'＜0';sl.value=p}document.getElementById('play').onclick=()=>run=true;document.getElementById('pause').onclick=()=>run=false;document.getElementById('reset').onclick=()=>{run=false;p=0;draw()};sl.oninput=e=>{run=false;p=+e.target.value;draw()};function loop(n){if(!last)last=n;if(run){p+=(n-last)/5500;if(p>=1){p=1;run=false}}last=n;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></main></body></html>
