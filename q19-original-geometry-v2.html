<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第19题｜原图空间结构动态演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:27px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:11px 15px;line-height:1.65;margin-bottom:12px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.range,.params input{width:100%}.params{display:grid;gap:11px}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}.note{background:#fff8e8}.badge{font-size:14px;font-weight:850;paint-order:stroke;stroke:#fff;stroke-width:4px}@media(max-width:950px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第19题｜按原图空间结构动态化</div><div class="desc"><b>固定几何母版：</b>保留原题的 O 点、水平 x 轴、左侧竖直平面、右侧光滑斜面、P₁/P₂ 同一水平面以及虚线空间参照。镜头和比例固定，只让 A、B 在原图对应的两个平面内运动。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 1060 650"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#26384f"/></marker><marker id="vmark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="1060" height="650" fill="#fff"/><g id="mother"><line x1="215" y1="105" x2="790" y2="105" stroke="#26384f" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="112" font-size="22" font-style="italic">x</text><circle cx="215" cy="105" r="6" fill="#111827"/><text x="190" y="88" font-size="23" font-weight="900" font-style="italic">O</text><polygon points="215,105 215,360 355,430 355,175" fill="#eef5fb" fill-opacity=".72" stroke="#536579" stroke-width="2.5"/><line x1="215" y1="360" x2="355" y2="430" stroke="#536579" stroke-width="2.5"/><line x1="355" y1="175" x2="355" y2="430" stroke="#536579" stroke-width="2.5"/><polygon points="215,105 790,105 900,430 355,430" fill="#fff2cf" fill-opacity=".8" stroke="#806b3c" stroke-width="2.5"/><line x1="790" y1="105" x2="900" y2="430" stroke="#806b3c" stroke-width="2.5"/><line x1="355" y1="430" x2="900" y2="430" stroke="#536579" stroke-width="2.5"/><line x1="355" y1="175" x2="790" y2="105" stroke="#8290a1" stroke-width="1.8" stroke-dasharray="7 6"/><line x1="355" y1="175" x2="790" y2="360" stroke="#8290a1" stroke-width="1.8" stroke-dasharray="7 6"/><line x1="215" y1="360" x2="790" y2="360" stroke="#8290a1" stroke-width="1.8" stroke-dasharray="7 6"/><line x1="790" y1="105" x2="790" y2="360" stroke="#8290a1" stroke-width="1.8" stroke-dasharray="7 6"/><text x="178" y="390" fill="#64748b" font-size="14">竖直平面</text><text x="735" y="455" fill="#806b3c" font-size="14">光滑斜面</text></g><path id="trajA" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 6"/><path id="trajB" fill="none" stroke="#d97706" stroke-width="3"/><circle id="A" r="13" fill="#cbe2ff" stroke="#245a91" stroke-width="2.5"/><circle id="B" r="13" fill="#ffe2a2" stroke="#a86400" stroke-width="2.5"/><line id="vA" stroke="#2563eb" stroke-width="3" marker-end="url(#vmark)"/><line id="vB" stroke="#2563eb" stroke-width="3" marker-end="url(#vmark)"/><circle id="P1" cx="355" cy="430" r="7" fill="#2563eb"/><text x="320" y="458" font-size="20" font-weight="900" fill="#1d4ed8">P₁</text><circle id="P2" cx="900" cy="430" r="7" fill="#d97706"/><text x="907" y="455" font-size="20" font-weight="900" fill="#a16207">P₂</text><g id="labels" class="badge"></g><text id="event" x="615" y="55" font-size="17" font-weight="900" fill="#173b70"></text></svg><div class="controls"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><label><input id="trail" type="checkbox" checked> 显示轨迹</label></div><input id="progress" class="range" type="range" min="0" max="1" step=".001" value="0" style="margin-top:9px"></div></section><aside><div class="card"><h3>演示参数</h3><div class="params"><label>共同初速度 v₀：<b id="v0v"></b><input id="v0" type="range" min="1" max="5" step=".2" value="3"></label><label>落差 H：<b id="Hv"></b><input id="H" type="range" min="1.5" max="4.5" step=".2" value="3"></label><label>斜面等效倾角 θ：<b id="thv"></b><input id="theta" type="range" min="30" max="60" step="1" value="40"></label></div><div class="box note">参数只改变运动学量；<b>原题的空间母版、x轴、P₁/P₂及观察视角不随参数缩放或移动。</b></div></div><div class="card" style="margin-top:10px"><h3>实时比较</h3><div class="data"><span>t</span><b id="tv"></b><span>A</span><b id="sa"></b><span>B</span><b id="sb"></b><span>xA</span><b id="xa"></b><span>xB</span><b id="xb"></b><span>|vA|</span><b id="va"></b><span>|vB|</span><b id="vb"></b></div></div><div class="card" style="margin-top:10px"><div class="box"><b>原题结论：</b><br>A、B 初速度相同，下降高度相同，因此落地速度大小相同，动能相同；B 在斜面上的竖直加速度分量小于 g，运动时间更长，沿 x 方向位移更大。正确选项：<b>D</b>。</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),g=9.8;let u=0,run=false,rate=1,last=performance.now();const O={x:215,y:105},P1={x:355,y:430},P2={x:900,y:430};function P(){const th=+$('theta').value*Math.PI/180;return{v0:+$('v0').value,H:+$('H').value,th,sn:Math.sin(th)}}function M(p){const tA=Math.sqrt(2*p.H/g),tB=tA/p.sn;return{tA,tB,T:tB,vf:Math.sqrt(p.v0*p.v0+2*g*p.H)}}function easeA(t,m){return Math.min(1,t/m.tA)}function easeB(t,m){return Math.min(1,t/m.tB)}function bez(p0,p1,p2,q){const a=(1-q)*(1-q),b=2*(1-q)*q,c=q*q;return{x:a*p0.x+b*p1.x+c*p2.x,y:a*p0.y+b*p1.y+c*p2.y}}function posA(q){return bez(O,{x:225,y:275},P1,q)}function posB(q){return bez(O,{x:660,y:145},P2,q)}function path(fn,q){let d='';for(let i=0;i<=70;i++){const p=fn(q*i/70);d+=(i?' L':'M')+p.x+' '+p.y}return d}function vel(id,fn,q){const p=fn(q),p2=fn(Math.min(1,q+.012)),dx=p2.x-p.x,dy=p2.y-p.y,L=Math.hypot(dx,dy);if(q>=.999||L<.01){$(id).style.opacity=0;return}$(id).style.opacity=1;const k=70/L;$(id).setAttribute('x1',p.x);$(id).setAttribute('y1',p.y);$(id).setAttribute('x2',p.x+dx*k);$(id).setAttribute('y2',p.y+dy*k)}function draw(){const p=P(),m=M(p),t=u*m.T,qa=easeA(t,m),qb=easeB(t,m),a=posA(qa),b=posB(qb);$('A').setAttribute('cx',a.x);$('A').setAttribute('cy',a.y);$('B').setAttribute('cx',b.x);$('B').setAttribute('cy',b.y);$('trajA').setAttribute('d',path(posA,qa));$('trajB').setAttribute('d',path(posB,qb));$('trajA').style.display=$('trail').checked?'':'none';$('trajB').style.display=$('trail').checked?'':'none';vel('vA',posA,qa);vel('vB',posB,qb);$('labels').innerHTML=`<text x="${a.x+15}" y="${a.y-12}" fill="#1d4ed8">A</text><text x="${b.x+15}" y="${b.y-12}" fill="#a16207">B</text>`;let ev='';if(t>=m.tA&&t<m.tB)ev='A 已到 P₁；B 仍在斜面运动';else if(t>=m.tB)ev='两者均到达同一水平面';$('event').textContent=ev;$('v0v').textContent=p.v0.toFixed(1)+' m/s';$('Hv').textContent=p.H.toFixed(1)+' m';$('thv').textContent=(p.th*180/Math.PI).toFixed(0)+'°';$('tv').textContent=t.toFixed(3)+' s';$('sa').textContent=t>=m.tA?'到达 P₁':'运动中';$('sb').textContent=t>=m.tB?'到达 P₂':'运动中';$('xa').textContent=(p.v0*Math.min(t,m.tA)).toFixed(2)+' m';$('xb').textContent=(p.v0*Math.min(t,m.tB)).toFixed(2)+' m';const va=t>=m.tA?m.vf:Math.sqrt(p.v0*p.v0+(g*Math.min(t,m.tA))**2),tb=Math.min(t,m.tB),vb=t>=m.tB?m.vf:Math.sqrt(p.v0*p.v0+2*g*(.5*g*p.sn*p.sn*tb*tb));$('va').textContent=va.toFixed(2)+' m/s';$('vb').textContent=vb.toFixed(2)+' m/s';$('progress').value=u;$('play').textContent=run?'Ⅱ 暂停':u>=1?'↻ 重新开始':u>0?'▶ 继续':'▶ 开始'}$('play').onclick=()=>{if(u>=1)u=0;run=!run;draw()};$('reset').onclick=()=>{run=false;u=0;$('v0').value=3;$('H').value=3;$('theta').value=40;draw()};$('progress').oninput=e=>{run=false;u=+e.target.value;draw()};$('trail').onchange=draw;document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{rate=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});['v0','H','theta'].forEach(id=>$(id).oninput=()=>{run=false;u=0;draw()});function loop(n){const dt=Math.min(.03,(n-last)/1000);last=n;if(run){const m=M(P());u+=dt*rate/m.T;if(u>=1){u=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
