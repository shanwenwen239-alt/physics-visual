<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18题 动态演示</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:#f4f7fb;color:#172033;margin:0}.w{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 10px 30px #0f172a0d}.grid{display:grid;grid-template-columns:1fr 260px;gap:16px}svg{width:100%;background:linear-gradient(#fff,#f1f5f9);border-radius:16px}.btn{padding:10px 14px;border:1px solid #d7dde7;border-radius:11px;background:#fff;margin:8px 6px 0 0}.primary{background:#111827;color:#fff}input[type=range]{width:100%}.muted{color:#64748b}.panel{padding:8px 4px}.big{font-size:22px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><p><a href="index.html">← 返回题库</a></p><h1>第18题｜夹球与转动薄板</h1><p class="muted">拖动进度或播放，观察 α 从较小角度逐渐增大到 90°。</p><div class="grid"><section class="card"><svg viewBox="0 0 700 430"><line x1="180" y1="50" x2="180" y2="370" stroke="#1f2937" stroke-width="6"/><circle cx="180" cy="350" r="7" fill="#111827"/><line id="board" x1="180" y1="350" x2="450" y2="170" stroke="#334155" stroke-width="8" stroke-linecap="round"/><circle id="ball" cx="220" cy="180" r="40" fill="#93c5fd" stroke="#1e3a8a" stroke-width="3"/><text id="alpha" x="198" y="325" font-size="18">α=30°</text><g id="forces" opacity="0"><line id="mg" x1="220" y1="180" x2="220" y2="270" stroke="#ef4444" stroke-width="4"/><text id="mgt" x="230" y="260" fill="#ef4444">mg</text></g></svg><input id="t" type="range" min="0" max="1000" value="0"><div><button class="btn primary" id="play">播放</button><button class="btn" id="reset">重置</button><button class="btn" id="mid">α=60°</button></div></section><aside class="card panel"><div class="big">课堂控制</div><p><label><input id="showF" type="checkbox"> 显示重力</label></p><hr><p class="muted">当前夹角</p><div class="big" id="read">30°</div><p class="muted">观察重点</p><p id="hint">小球同时受到墙和薄板的约束。</p><p class="muted">正式版将继续加入两个支持力、力矩箭头和选项逐项判断。</p></aside></div></main><script>let p=0,run=false,last=performance.now();const q=x=>document.getElementById(x);function draw(){let deg=30+60*p,a=deg*Math.PI/180,L=315,x2=180+L*Math.sin(a),y2=350-L*Math.cos(a);q('board').setAttribute('x2',x2);q('board').setAttribute('y2',y2);let r=40,bx=220,by=350-r/Math.sin(a);by=Math.max(80,by);q('ball').setAttribute('cx',bx);q('ball').setAttribute('cy',by);q('forces').setAttribute('transform',`translate(0 ${by-180})`);q('alpha').textContent='α='+deg.toFixed(0)+'°';q('read').textContent=deg.toFixed(0)+'°';q('t').value=p*1000;q('forces').style.opacity=q('showF').checked?1:0;q('hint').textContent=deg<55?'板逐渐张开：比较两个接触面的支持力。':deg<85?'继续增大 α：注意板对球压力及其对 O 点力矩的变化。':'接近 90°：检查极限状态，有助于判断各选项。'}q('play').textContent=run?'暂停':'播放'}q('play').onclick=()=>run=!run;q('reset').onclick=()=>{p=0;run=false;draw()};q('mid').onclick=()=>{p=.5;run=false;draw()};q('t').oninput=e=>{p=e.target.value/1000;run=false;draw()};q('showF').onchange=draw;function loop(n){let d=Math.min(.04,(n-last)/1000);last=n;if(run){p+=d*.16;if(p>=1){p=1;run=false}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)</script></body></html>
