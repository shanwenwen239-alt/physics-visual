<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18题｜夹球与转动薄板</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'Microsoft YaHei';color:#17324d}.w{max-width:1340px;margin:auto;padding:16px}.title{background:#315f96;color:#fff;padding:12px 20px;border-radius:12px;font-size:26px;font-weight:800}.desc{margin:10px 4px;color:#526579}.layout{display:grid;grid-template-columns:1.72fr .82fr;gap:14px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:12px}.scene{width:100%;touch-action:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #cad7e5;background:#fff;border-radius:9px;padding:8px 12px}.primary{background:#315f96;color:#fff}.data{display:grid;grid-template-columns:1fr auto;gap:9px}.box{padding:10px;border-radius:10px;margin-top:10px;font-size:13px;line-height:1.65}.theory{background:#eef6ff}.ok{background:#edf9f2}.hint{background:#fff7e8}.slider{width:100%}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px}.graphs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.graph svg{width:100%}@media(max-width:850px){.layout{grid-template-columns:1fr}.graphs{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="title">第18题　夹球与转动薄板｜物理交互模型</div><div class="desc">拖动蓝色A点或使用α滑块。薄板只绕O转动，小球始终同时与墙、板接触。</div><div class="layout"><div><section class="card"><svg id="scene" class="scene" viewBox="0 0 840 550"><defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d94a45"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#3977b7"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#c78a24"/></marker></defs><rect width="840" height="550" fill="#fbfdff"/><line x1="125" y1="40" x2="125" y2="485" stroke="#4b5968" stroke-width="8"/><text x="72" y="62">竖直墙</text><circle cx="125" cy="455" r="7"/><text x="99" y="490">O</text><line id="board" stroke="#5d6a78" stroke-width="13" stroke-linecap="round"/><path id="guide" fill="none" stroke="#9cb5cf" stroke-width="2" stroke-dasharray="6 7"/><circle id="halo" r="26" fill="#4b88c7" opacity=".13"/><circle id="A" r="14" fill="#3977b7" stroke="#fff" stroke-width="4" style="cursor:grab"/><text id="At" class="badge" fill="#315f96">A · 拖动</text><circle id="ball" r="43" fill="#dcecff" stroke="#3977b7" stroke-width="3"/><circle id="wc" r="5" fill="#2d9b68"/><circle id="bc" r="5" fill="#2d9b68"/><line id="G" stroke="#d94a45" stroke-width="3" marker-end="url(#r)"/><line id="Nw" stroke="#3977b7" stroke-width="3" marker-end="url(#b)"/><line id="Nb" stroke="#c78a24" stroke-width="3" marker-end="url(#o)"/><text id="Gt" class="badge" fill="#b93431">G</text><text id="Nwt" class="badge" fill="#2f659d">N墙</text><text id="Nbt" class="badge" fill="#9b6818">N板</text><path id="arc" fill="none" stroke="#7257a5" stroke-width="2.5"/><text id="ang" class="badge" fill="#7257a5">α</text></svg><div class="box hint">G竖直向下；N墙水平向右；N板垂直薄板。拖动时位置与受力连续更新。</div></section><section class="card" style="margin-top:10px"><div class="row"><button id="playToggle" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><label><input id="forces" type="checkbox" checked> 显示受力</label></div><label>α：<b id="slab">30.0°</b></label><input id="slider" class="slider" type="range" min="15" max="90" step="0.1" value="30"></section><div class="graphs"><section class="card graph"><b>N板/G</b><svg viewBox="0 0 300 110"><path d="M30 18 Q140 58 285 83" fill="none" stroke="#c78a24" stroke-width="3"/><circle id="g1" cx="80" cy="50" r="5" fill="#c78a24"/></svg></section><section class="card graph"><b>N墙/G</b><svg viewBox="0 0 300 110"><path d="M30 12 Q145 60 285 95" fill="none" stroke="#3977b7" stroke-width="3"/><circle id="g2" cx="80" cy="45" r="5" fill="#3977b7"/></svg></section><section class="card graph"><b>M₀/(GR)</b><svg viewBox="0 0 300 110"><path d="M30 10 Q145 56 285 92" fill="none" stroke="#7257a5" stroke-width="3"/><circle id="g3" cx="80" cy="40" r="5" fill="#7257a5"/></svg></section></div></div><aside class="card"><h3>实时物理量</h3><div class="data"><span>α</span><b id="av">30°</b><span>N板/G</span><b id="nbv">—</b><span>N墙/G</span><b id="nwv">—</b><span>M₀/(GR)</span><b id="mv">—</b><span>球心高度 y/R</span><b id="yv">—</b></div><div class="box theory">N板·sinα=G；N墙=N板·cosα；M₀=GR/(1−cosα)。</div><div class="box ok">α增大时N板、N墙、M₀都减小，且N板≥G。</div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),O={x:125,y:455},R=43,L=350;let a=30,run=false,drag=false,last=performance.now(),dir=1;const ln=(id,x1,y1,x2,y2)=>{let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};function playLabel(){ $('playToggle').textContent=run?'Ⅱ 暂停':(a===30?'▶ 开始':'▶ 继续') }function draw(){a=Math.max(15,Math.min(90,a));let t=a*Math.PI/180,s=Math.sin(t),c=Math.cos(t),ex=O.x+L*s,ey=O.y-L*c,bx=O.x+R,by=O.y-R*(1+c)/s,op=R*(1+c)/s,px=O.x+op*s,py=O.y-op*c,nb=1/s,nw=c/s,m=1/(1-c),k=64;ln('board',O.x,O.y,ex,ey);$('A').setAttribute('cx',ex);$('A').setAttribute('cy',ey);$('halo').setAttribute('cx',ex);$('halo').setAttribute('cy',ey);$('At').setAttribute('x',Math.min(740,ex+18));$('At').setAttribute('y',Math.max(35,ey-12));$('ball').setAttribute('cx',bx);$('ball').setAttribute('cy',by);$('wc').setAttribute('cx',O.x);$('wc').setAttribute('cy',by);$('bc').setAttribute('cx',px);$('bc').setAttribute('cy',py);ln('G',bx,by,bx,by+k);ln('Nw',bx,by,bx+k*nw,by);ln('Nb',bx,by,bx-k*nb*c,by-k*nb*s);$('Gt').setAttribute('x',bx+8);$('Gt').setAttribute('y',by+k-7);$('Nwt').setAttribute('x',bx+k*nw+8);$('Nwt').setAttribute('y',by-8);$('Nbt').setAttribute('x',bx-k*nb*c-34);$('Nbt').setAttribute('y',by-k*nb*s-8);let rr=55;$('arc').setAttribute('d',`M${O.x} ${O.y-rr} A${rr} ${rr} 0 0 1 ${O.x+rr*s} ${O.y-rr*c}`);$('ang').setAttribute('x',O.x+63);$('ang').setAttribute('y',O.y-30);$('ang').textContent='α '+a.toFixed(1)+'°';$('guide').setAttribute('d',`M${O.x+L*Math.sin(15*Math.PI/180)} ${O.y-L*Math.cos(15*Math.PI/180)} A${L} ${L} 0 0 1 ${O.x+L} ${O.y}`);$('av').textContent=a.toFixed(1)+'°';$('slab').textContent=a.toFixed(1)+'°';$('nbv').textContent=nb.toFixed(3);$('nwv').textContent=nw.toFixed(3);$('mv').textContent=m.toFixed(3);$('yv').textContent=((O.y-by)/R).toFixed(3);$('slider').value=a;let u=(a-15)/75,x=30+255*u;$('g1').setAttribute('cx',x);$('g1').setAttribute('cy',18+65*u);$('g2').setAttribute('cx',x);$('g2').setAttribute('cy',12+83*u);$('g3').setAttribute('cx',x);$('g3').setAttribute('cy',10+82*u);let vis=$('forces').checked?'':'none';['G','Nw','Nb','Gt','Nwt','Nbt'].forEach(id=>$(id).style.display=vis);playLabel()}$('slider').oninput=e=>{run=false;a=+e.target.value;draw()};$('forces').onchange=draw;$('playToggle').onclick=()=>{run=!run;playLabel()};$('reset').onclick=()=>{run=false;a=30;dir=1;draw()};function pt(e){let r=$('scene').getBoundingClientRect();return{x:(e.clientX-r.left)*840/r.width,y:(e.clientY-r.top)*550/r.height}}$('A').onpointerdown=e=>{drag=true;run=false;$('A').setPointerCapture(e.pointerId);playLabel()};$('A').onpointermove=e=>{if(!drag)return;let p=pt(e),dx=p.x-O.x,dy=O.y-p.y;a=Math.atan2(dx,dy)*180/Math.PI;draw()};$('A').onpointerup=()=>drag=false;function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){a+=dir*dt*11;if(a>=90){a=90;dir=-1}if(a<=15){a=15;dir=1}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
