<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18题｜夹球与转动薄板</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.back{color:#64748b;text-decoration:none;font-size:14px}.title{font-size:26px;font-weight:750;margin:6px 0 4px}.sub{color:#64748b;font-size:14px}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) 280px;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:22px;box-shadow:0 12px 36px rgba(15,23,42,.07)}.stage{padding:16px}.side{padding:17px}svg{width:100%;display:block;border-radius:16px;background:linear-gradient(#fff,#f8fafc)}.range{width:100%;margin:14px 0 5px}.controls{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid #d8dee8;background:#fff;border-radius:12px;padding:10px 13px;min-height:42px;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}.chip{border:1px solid #d8dee8;background:#f8fafc;border-radius:999px;padding:7px 10px;cursor:pointer}.chip.on{background:#111827;color:#fff;border-color:#111827}.section{padding:13px 0;border-top:1px solid #edf1f5}.section:first-child{border-top:0;padding-top:0}.label{font-size:12px;color:#738095}.big{font-size:24px;font-weight:760}.hint{font-size:13px;line-height:1.7;color:#475569}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}.formula{background:#f8fafc;border:1px solid #e7ecf2;border-radius:13px;padding:11px;font-size:13px;line-height:1.8}.status{font-size:12px;border:1px solid #dfe5ee;border-radius:999px;padding:7px 10px;background:#fff}.option{border:1px solid #e2e8f0;border-radius:11px;padding:9px 10px;font-size:13px;margin-top:7px}.good{background:#f0fdf4;border-color:#bbf7d0}.bad{background:#fff7f7;border-color:#fecaca}.note{font-size:12px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:9px;margin-top:10px}@media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.top{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="index.html">← 返回题库</a><div class="title">第18题｜夹球与转动薄板</div><div class="sub">稳定教学版：播放、暂停、拖动、关键角度、受力图层。</div></div><div class="status" id="status">已暂停 · α=30.0°</div></div><div class="grid"><section class="card stage"><svg viewBox="0 0 760 500" aria-label="小球夹在墙与薄板之间的动态演示"><defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><line x1="185" y1="50" x2="185" y2="430" stroke="#334155" stroke-width="10" stroke-linecap="round"/><circle cx="185" cy="405" r="8" fill="#111827"/><text x="160" y="438" font-size="18">O</text><line id="board" x1="185" y1="405" x2="355" y2="110" stroke="#475569" stroke-width="12" stroke-linecap="round"/><text id="A" x="365" y="110" font-size="18">A</text><path id="arc" d="" fill="none" stroke="#7c3aed" stroke-width="3"/><text id="alphaLabel" x="250" y="365" font-size="17" fill="#7c3aed">α=30°</text><circle id="ball" cx="231" cy="233" r="46" fill="#93c5fd" stroke="#1e3a8a" stroke-width="3"/><g id="forces"><line id="mg" x1="0" y1="0" x2="0" y2="0" stroke="#e5484d" stroke-width="4" marker-end="url(#r)"/><text id="mgt" x="0" y="0" fill="#e5484d" font-size="15">mg</text><line id="nw" x1="0" y1="0" x2="0" y2="0" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/><text id="nwt" x="0" y="0" fill="#2563eb" font-size="15">N墙</text><line id="nb" x1="0" y1="0" x2="0" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#o)"/><text id="nbt" x="0" y="0" fill="#f59e0b" font-size="15">N板</text></g></svg><input id="timeline" class="range" type="range" min="30" max="90" step="0.1" value="30"><div class="controls"><button id="play" class="btn primary">播放</button><button id="back" class="btn">← 单步</button><button id="next" class="btn">单步 →</button><button id="speed" class="btn">速度 1×</button><button id="reset" class="btn">重置</button></div><div class="controls" style="margin-top:10px"><button class="chip on" data-a="30">30°</button><button class="chip" data-a="45">45°</button><button class="chip" data-a="60">60°</button><button class="chip" data-a="75">75°</button><button class="chip" data-a="90">90°</button></div></section><aside class="card side"><div class="section"><div class="label">当前夹角</div><div id="read" class="big">30.0°</div><div id="hint" class="hint">观察小球始终同时与墙和薄板接触。</div></div><div class="section"><div class="label">讲解图层</div><div class="row"><span>重力 mg</span><input id="showMg" type="checkbox" checked></div><div class="row"><span>墙支持力 N墙</span><input id="showNw" type="checkbox" checked></div><div class="row"><span>板支持力 N板</span><input id="showNb" type="checkbox" checked></div></div><div class="section"><div class="label">准静态趋势</div><div class="formula">N板 = mg / sinα<br>N墙 = mg·cotα</div><div class="hint" style="margin-top:8px">N板：<b id="nbVal">2.000 mg</b><br>N墙：<b id="nwVal">1.732 mg</b></div></div><div class="section"><div class="label">选项趋势</div><div id="oa" class="option">A. 小球对板压力增大</div><div id="ob" class="option">B. 小球对墙压力减小</div><div id="oc" class="option">C. 压力对 O 的力矩增大</div><div id="od" class="option">D. 小球对板压力不可能小于重力</div><button id="reveal" class="btn" style="margin-top:10px">显示趋势结论</button><div class="note">本页按“薄板缓慢转动、每一时刻近似平衡”的准静态模型展示。</div></div></aside></div></main><script>(function(){var alpha=30,playing=false,last=performance.now(),speed=1,revealed=false;var speeds=[1,.5,.25],si=0;function q(id){return document.getElementById(id)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function render(){alpha=clamp(alpha,30,90);var a=alpha*Math.PI/180,s=Math.sin(a),c=Math.cos(a),Ox=185,Oy=405,r=46,L=340,bx=Ox+r,by=Oy-r*(1+c)/s,ex=Ox+L*s,ey=Oy-L*c;q('board').setAttribute('x2',ex);q('board').setAttribute('y2',ey);q('A').setAttribute('x',ex+8);q('A').setAttribute('y',ey-6);q('ball').setAttribute('cx',bx);q('ball').setAttribute('cy',by);var R=56,x0=Ox,y0=Oy-R,x1=Ox+R*s,y1=Oy-R*c;q('arc').setAttribute('d','M'+x0+' '+y0+' A'+R+' '+R+' 0 0 1 '+x1+' '+y1);q('alphaLabel').textContent='α='+alpha.toFixed(1)+'°';var scale=54,nwall=c/s,nboard=1/s,nwl=Math.max(8,Math.min(90,scale*nwall)),nbl=Math.max(34,Math.min(105,scale*nboard));q('mg').setAttribute('x1',bx);q('mg').setAttribute('y1',by);q('mg').setAttribute('x2',bx);q('mg').setAttribute('y2',by+scale);q('mgt').setAttribute('x',bx+8);q('mgt').setAttribute('y',by+scale-5);q('nw').setAttribute('x1',bx);q('nw').setAttribute('y1',by);q('nw').setAttribute('x2',bx+nwl);q('nw').setAttribute('y2',by);q('nwt').setAttribute('x',bx+nwl+5);q('nwt').setAttribute('y',by-7);q('nb').setAttribute('x1',bx);q('nb').setAttribute('y1',by);q('nb').setAttribute('x2',bx-nbl*c);q('nb').setAttribute('y2',by-nbl*s);q('nbt').setAttribute('x',bx-nbl*c-28);q('nbt').setAttribute('y',by-nbl*s-7);q('mg').style.display=q('showMg').checked?'':'none';q('mgt').style.display=q('showMg').checked?'':'none';q('nw').style.display=q('showNw').checked?'':'none';q('nwt').style.display=q('showNw').checked?'':'none';q('nb').style.display=q('showNb').checked?'':'none';q('nbt').style.display=q('showNb').checked?'':'none';q('timeline').value=alpha;q('read').textContent=alpha.toFixed(1)+'°';q('status').textContent=(playing?'播放中':'已暂停')+' · α='+alpha.toFixed(1)+'°';q('play').textContent=playing?'暂停':'播放';q('nbVal').textContent=nboard.toFixed(3)+' mg';q('nwVal').textContent=nwall.toFixed(3)+' mg';q('hint').textContent=alpha<45?'板较陡，小球位置较高；墙与板都提供明显支持力。':alpha<75?'α 增大时，小球沿墙下移，两个支持力均减小。':'接近 90° 时，N墙趋近 0，N板趋近 mg。';var cs=document.querySelectorAll('.chip');for(var i=0;i<cs.length;i++){cs[i].className='chip'+(Math.abs(Number(cs[i].getAttribute('data-a'))-alpha)<.15?' on':'')}if(revealed){q('oa').className='option bad';q('ob').className='option good';q('oc').className='option bad';q('od').className='option good'}}q('play').onclick=function(){if(alpha>=90)alpha=30;playing=!playing;render()};q('reset').onclick=function(){alpha=30;playing=false;revealed=false;q('oa').className=q('ob').className=q('oc').className=q('od').className='option';q('reveal').textContent='显示趋势结论';render()};q('back').onclick=function(){playing=false;alpha-=1;render()};q('next').onclick=function(){playing=false;alpha+=1;render()};q('speed').onclick=function(){si=(si+1)%speeds.length;speed=speeds[si];q('speed').textContent='速度 '+speed+'×'};q('timeline').oninput=function(){playing=false;alpha=Number(this.value);render()};var chips=document.querySelectorAll('.chip');for(var i=0;i<chips.length;i++){chips[i].onclick=function(){playing=false;alpha=Number(this.getAttribute('data-a'));render()}}q('showMg').onchange=render;q('showNw').onchange=render;q('showNb').onchange=render;q('reveal').onclick=function(){revealed=!revealed;q('reveal').textContent=revealed?'隐藏趋势结论':'显示趋势结论';q('oa').className=q('ob').className=q('oc').className=q('od').className='option';render()};function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(playing){alpha+=dt*12*speed;if(alpha>=90){alpha=90;playing=false}render()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
