<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18题｜夹球与转动薄板</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:1450px;margin:auto;padding:16px}.hero{font-size:28px;font-weight:900;color:#173b70;margin-bottom:8px}.desc,.card{background:#fff;border:1px solid #d8e3ef;border-radius:14px}.desc{padding:12px 16px;line-height:1.7;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:14px}.card{padding:12px}.scene{width:100%;display:block}.side{display:grid;gap:10px;align-content:start}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d6e6;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.active{background:#2563eb;color:#fff;border-color:#2563eb}.range{width:100%}.data{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}.box{padding:10px;border-radius:10px;background:#eef6ff;line-height:1.65;font-size:13px}.collapsed{display:none}.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.trend{height:250px}canvas{width:100%;height:100%;display:block}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero">第18题｜光滑球夹在竖直墙与转动薄板之间</div><div class="desc">固定参照系：墙和铰链 O 全程不移动、不缩放。拖动 A 点或 α 滑块，薄板只绕 O 转动，小球始终同时接触墙和薄板；G、N墙、N板由同一组平衡方程实时计算。</div><div class="layout"><section><div class="card"><svg id="scene" class="scene" viewBox="0 0 900 560"><defs><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker></defs><rect width="900" height="560" fill="#fbfdff"/><line x1="150" y1="45" x2="150" y2="500" stroke="#46576b" stroke-width="8"/><text x="70" y="65" fill="#64748b">竖直墙</text><circle cx="150" cy="475" r="7" fill="#111827"/><text x="125" y="515">O</text><line id="board" stroke="#5b6776" stroke-width="12" stroke-linecap="round"/><circle id="A" r="13" fill="#2563eb" stroke="#fff" stroke-width="4" style="cursor:grab"/><text id="At" fill="#1d4ed8" font-weight="800">A</text><circle id="ball" r="42" fill="#dcecff" stroke="#2563eb" stroke-width="3"/><circle id="wallContact" r="5" fill="#059669"/><circle id="boardContact" r="5" fill="#059669"/><line id="G" stroke="#dc2626" stroke-width="3" marker-end="url(#red)"/><line id="Nw" stroke="#059669" stroke-width="3" marker-end="url(#green)"/><line id="Nb" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text id="Gt" fill="#b91c1c" font-weight="800">G</text><text id="Nwt" fill="#047857" font-weight="800">N墙</text><text id="Nbt" fill="#1d4ed8" font-weight="800">N板</text><path id="arc" fill="none" stroke="#7c3aed" stroke-width="2.3"/><text id="ang" fill="#6d28d9" font-weight="800">α</text></svg><div class="controls" style="margin-top:10px"><button id="play" class="btn primary">▶ 开始</button><button id="reset" class="btn">↻ 重置</button><button class="btn sp" data-s=".5">0.5×</button><button class="btn sp active" data-s="1">1×</button><button class="btn sp" data-s="2">2×</button><label><input id="forces" type="checkbox" checked> 显示受力</label></div><label>α = <b id="alphaTxt">30.0°</b></label><input id="alpha" class="range" type="range" min="15" max="90" step="0.1" value="30"></div><div class="card" style="margin-top:10px"><div class="toggleRow"><b>辅助：趋势图</b><button id="toggleTrend" class="btn">展开</button></div><div id="trendPanel" class="collapsed"><div class="trend"><canvas id="trend"></canvas></div></div></div></section><aside class="side"><div class="card"><h3>实时物理量</h3><div class="data"><span>α</span><b id="av"></b><span>N板/G</span><b id="nbv"></b><span>N墙/G</span><b id="nwv"></b><span>M₀/(GR)</span><b id="mv"></b><span>球心高度/R</span><b id="yv"></b></div></div><div class="card"><div class="box">平衡关系：N板·sinα=G；N墙=N板·cosα。球对板的压力关于 O 的力矩满足 M₀/(GR)=1/(1−cosα)。α 增大时三者均减小，且 N板≥G。</div></div><div class="card"><h3>自检</h3><div class="data"><span>球-墙接触</span><b id="c1">PASS</b><span>球-板接触</span><b id="c2">PASS</b><span>ΣFx=0</span><b id="c3">PASS</b><span>ΣFy=0</span><b id="c4">PASS</b></div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),O={x:150,y:475},R=42,L=360;let a=30,run=false,speed=1,last=performance.now(),dir=1,drag=false;function ln(id,x1,y1,x2,y2){const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function model(deg){const t=deg*Math.PI/180,s=Math.sin(t),c=Math.cos(t),q=(1+c)/s;return{t,s,c,nb:1/s,nw:c/s,m:1/(1-c),cx:O.x+R,cy:O.y-R*q,contact: R*q}}function drawTrend(){const cv=$('trend'),d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);const w=r.width,h=r.height,Lp=42,Rp=16,Tp=18,Bp=28,X=x=>Lp+(x-15)/75*(w-Lp-Rp);c.clearRect(0,0,w,h);c.strokeStyle='#cbd5e1';c.beginPath();c.moveTo(Lp,Tp);c.lineTo(Lp,h-Bp);c.lineTo(w-Rp,h-Bp);c.stroke();const series=[['#2563eb',x=>1/Math.sin(x*Math.PI/180),4],['#059669',x=>Math.cos(x*Math.PI/180)/Math.sin(x*Math.PI/180),4],['#7c3aed',x=>1/(1-Math.cos(x*Math.PI/180)),30]];series.forEach(([col,fn,max])=>{c.strokeStyle=col;c.lineWidth=2;c.beginPath();for(let x=15;x<=90;x+=.5){const y=Math.min(max,fn(x)),sy=h-Bp-y/max*(h-Bp-Tp),sx=X(x);x===15?c.moveTo(sx,sy):c.lineTo(sx,sy)}c.stroke()});c.strokeStyle='#111827';const xx=X(a);c.beginPath();c.moveTo(xx,Tp);c.lineTo(xx,h-Bp);c.stroke();c.fillStyle='#475569';c.font='12px sans-serif';c.fillText('15°',Lp-8,h-8);c.fillText('90°',w-36,h-8);c.fillStyle='#2563eb';c.fillText('N板/G',55,18);c.fillStyle='#059669';c.fillText('N墙/G',125,18);c.fillStyle='#7c3aed';c.fillText('M₀/(GR)',200,18)}function draw(){a=Math.max(15,Math.min(90,a));const m=model(a),ex=O.x+L*m.s,ey=O.y-L*m.c;ln('board',O.x,O.y,ex,ey);$('A').setAttribute('cx',ex);$('A').setAttribute('cy',ey);$('At').setAttribute('x',ex+14);$('At').setAttribute('y',ey-10);$('ball').setAttribute('cx',m.cx);$('ball').setAttribute('cy',m.cy);$('wallContact').setAttribute('cx',O.x);$('wallContact').setAttribute('cy',m.cy);const pcx=O.x+m.contact*m.s,pcy=O.y-m.contact*m.c;$('boardContact').setAttribute('cx',pcx);$('boardContact').setAttribute('cy',pcy);const k=26;ln('G',m.cx,m.cy,m.cx,m.cy+k);ln('Nw',m.cx,m.cy,m.cx+k*m.nw,m.cy);ln('Nb',m.cx,m.cy,m.cx-k*m.nb*m.c,m.cy-k*m.nb*m.s);$('Gt').setAttribute('x',m.cx+7);$('Gt').setAttribute('y',m.cy+k-5);$('Nwt').setAttribute('x',m.cx+k*m.nw+6);$('Nwt').setAttribute('y',m.cy-6);$('Nbt').setAttribute('x',m.cx-k*m.nb*m.c-34);$('Nbt').setAttribute('y',m.cy-k*m.nb*m.s-7);const rr=60;$('arc').setAttribute('d',`M${O.x} ${O.y-rr} A${rr} ${rr} 0 0 1 ${O.x+rr*m.s} ${O.y-rr*m.c}`);$('ang').setAttribute('x',O.x+66);$('ang').setAttribute('y',O.y-30);$('ang').textContent='α '+a.toFixed(1)+'°';$('alpha').value=a;$('alphaTxt').textContent=a.toFixed(1)+'°';$('av').textContent=a.toFixed(1)+'°';$('nbv').textContent=m.nb.toFixed(3);$('nwv').textContent=m.nw.toFixed(3);$('mv').textContent=m.m.toFixed(3);$('yv').textContent=((O.y-m.cy)/R).toFixed(3);const vis=$('forces').checked?'':'none';['G','Nw','Nb','Gt','Nwt','Nbt'].forEach(id=>$(id).style.display=vis);$('Nw').style.opacity=m.nw<.01?0:1;$('Nwt').style.opacity=m.nw<.01?0:1;$('play').textContent=run?'Ⅱ 暂停':a!==30?'▶ 继续':'▶ 开始';if(!$('trendPanel').classList.contains('collapsed'))drawTrend()}$('alpha').oninput=e=>{run=false;a=+e.target.value;draw()};$('forces').onchange=draw;$('play').onclick=()=>{run=!run;draw()};$('reset').onclick=()=>{run=false;a=30;dir=1;draw()};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('active',x===b))});$('toggleTrend').onclick=()=>{const p=$('trendPanel'),hide=p.classList.toggle('collapsed');$('toggleTrend').textContent=hide?'展开':'收起';if(!hide)drawTrend()};function pt(e){const r=$('scene').getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*560/r.height}}$('A').onpointerdown=e=>{drag=true;run=false;$('A').setPointerCapture(e.pointerId)};$('A').onpointermove=e=>{if(!drag)return;const p=pt(e);a=Math.atan2(p.x-O.x,O.y-p.y)*180/Math.PI;draw()};$('A').onpointerup=()=>drag=false;function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(run){a+=dir*dt*12*speed;if(a>=90){a=90;dir=-1}if(a<=15){a=15;dir=1}draw()}requestAnimationFrame(loop)}addEventListener('resize',()=>{if(!$('trendPanel').classList.contains('collapsed'))drawTrend()});draw();requestAnimationFrame(loop)})();</script></body></html>
