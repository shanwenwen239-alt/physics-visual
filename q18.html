<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>第18题｜夹球与转动薄板</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,'PingFang SC','Microsoft YaHei';color:#17324d}.w{max-width:1080px;margin:auto;padding:18px}.title{font-size:24px;font-weight:800;margin-bottom:10px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:12px;box-shadow:0 6px 20px #315f9610}.scene{width:100%;display:block}.bar{display:flex;justify-content:center;margin-top:12px}.btn{border:0;background:#315f96;color:#fff;border-radius:10px;padding:10px 24px;font-size:16px;font-weight:700;cursor:pointer}.badge{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></head><body><main class="w"><div class="title">第18题｜夹球与转动薄板</div><section class="card"><svg id="scene" class="scene" viewBox="0 0 920 560"><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#d94a45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#3977b7"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#c78a24"/></marker></defs><rect width="920" height="560" rx="12" fill="#fbfdff"/><line x1="130" y1="40" x2="130" y2="500" stroke="#4b5968" stroke-width="9"/><text x="72" y="62" fill="#4b5968" font-weight="700">竖直墙</text><circle cx="130" cy="470" r="7" fill="#263646"/><text x="104" y="505" font-weight="700">O</text><line id="board" stroke="#5d6a78" stroke-width="14" stroke-linecap="round"/><text id="At" class="badge" fill="#315f96">A</text><circle id="ball" r="44" fill="#dcecff" stroke="#3977b7" stroke-width="3"/><line id="G" stroke="#d94a45" stroke-width="3" marker-end="url(#red)"/><line id="Nw" stroke="#3977b7" stroke-width="3" marker-end="url(#blue)"/><line id="Nb" stroke="#c78a24" stroke-width="3" marker-end="url(#gold)"/><text id="Gt" class="badge" fill="#b93431">G</text><text id="Nwt" class="badge" fill="#2f659d">N墙</text><text id="Nbt" class="badge" fill="#9b6818">N板</text><path id="arc" fill="none" stroke="#7257a5" stroke-width="2.5"/><text id="ang" class="badge" fill="#7257a5">α</text><g transform="translate(690 70)"><rect width="180" height="132" rx="12" fill="#fff" stroke="#dbe5ef"/><text x="16" y="30" font-weight="800">实时量</text><text id="aV" x="16" y="58">α = 30°</text><text id="nbV" x="16" y="82">N板/G = 2.000</text><text id="nwV" x="16" y="106">N墙/G = 1.732</text></g></svg><div class="bar"><button id="toggle" class="btn">开始</button></div></section></main><script>(()=>{const $=id=>document.getElementById(id),O={x:130,y:470},R=44,L=360;let a=30,run=false,last=performance.now();const ln=(id,x1,y1,x2,y2)=>{let e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};function draw(){const t=a*Math.PI/180,s=Math.sin(t),c=Math.cos(t),ex=O.x+L*s,ey=O.y-L*c,bx=O.x+R,by=O.y-R*(1+c)/s,nb=1/s,nw=c/s,k=68;ln('board',O.x,O.y,ex,ey);$('At').setAttribute('x',ex+12);$('At').setAttribute('y',ey-8);$('ball').setAttribute('cx',bx);$('ball').setAttribute('cy',by);ln('G',bx,by,bx,by+k);ln('Nw',bx,by,bx+k*nw,by);ln('Nb',bx,by,bx-k*nb*c,by-k*nb*s);$('Gt').setAttribute('x',bx+8);$('Gt').setAttribute('y',by+k-7);$('Nwt').setAttribute('x',bx+k*nw+8);$('Nwt').setAttribute('y',by-8);$('Nbt').setAttribute('x',bx-k*nb*c-36);$('Nbt').setAttribute('y',by-k*nb*s-8);let rr=58;$('arc').setAttribute('d',`M${O.x} ${O.y-rr} A${rr} ${rr} 0 0 1 ${O.x+rr*s} ${O.y-rr*c}`);$('ang').setAttribute('x',O.x+66);$('ang').setAttribute('y',O.y-30);$('ang').textContent='α '+a.toFixed(1)+'°';$('aV').textContent='α = '+a.toFixed(1)+'°';$('nbV').textContent='N板/G = '+nb.toFixed(3);$('nwV').textContent='N墙/G = '+nw.toFixed(3)}$('toggle').onclick=()=>{if(a>=89.9)a=30;run=!run;$('toggle').textContent=run?'暂停':'开始'};function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(run){a+=dt*10;if(a>=90){a=90;run=false;$('toggle').textContent='重新开始'}draw()}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();</script></body></html>
